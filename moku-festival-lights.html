// プレビュー(*.pages.dev)・localhost・ファイルを直接開いた時は、すぐ遊べる。
(function () {
  var OPENS_AT = Date.parse('2026-11-21T16:00:00+08:00');
  var dev = location.protocol === 'file:' || /\.pages\.dev$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (dev || Date.now() >= OPENS_AT) return;
  document.documentElement.className += ' moku-soon';
  document.write('<style>html.moku-soon body > *:not(#mokuSoon) { display: none !important; }' +

  document.addEventListener('DOMContentLoaded', function () {
    var when = new Date(OPENS_AT).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

})();

<!--
  Moku Festival Lights(v0.1.0、2026-11-19)— 棚「Live in ASIA」の第5弾。
  東南アジアのお祭り・伝統の飾りを、光る点を指でなぞって作り、色を選んで仕上げる。
  Live in ASIA の目標(CLAUDE.md §2)に合わせて: ①どの飾りにも国 ②「どの国の・いつの・何でできている」をくらべる
  ③作り終えたら「Tell a friend」の一文。
  - 🎨 Make: 12 の飾り(CRAFTS)から選ぶ → ①なぞる(点線の上を、光る点から順に指でなぞる。何本かある飾りもある)
    → ②色を選ぶ(伝統の色にはしるし)→ ③できあがりの演出と本当の話。なぞりのうまさで ⭐1〜3。
  - 🌙 Festival Night: 作った飾りが、夜のお祭りの景色に集まる(ランタンは吊るされ、クラトンは川に浮かぶ)。押すとその飾りの話。
  宗教の行事は「何のお祭りか」を一言だけ、中立に書く(どの宗教が正しい、のような話はしない)。
  Moint(SPEC.md §13): 作るたびに ⭐1つ +10(最大 30、1日 500 の上限の中)。1回きり = その飾りを初めて作った +30、6 つ全部 +200
  (progress.mointClaims の c:<id> と all)。記録は moku:moku-festival-lights:progress、音は moku:moku-festival-lights:settings。

<script>
(function () {
  'use strict';
  var GAME_ID = 'moku-festival-lights';
  var SAVE_KEY = 'moku:' + GAME_ID + ':progress', SET_KEY = 'moku:' + GAME_ID + ':settings';
  var $ = function (id) { return document.getElementById(id); };
  function readJSON(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- なぞる線(0〜100 の座標)を作る ----------
  function ellipse(cx, cy, rx, ry, rot, n, start) {
    var out = [], r = (rot || 0) * Math.PI / 180, s0 = start || -Math.PI / 2;
    for (var i = 0; i <= (n || 48); i++) {
      var a = s0 + i / (n || 48) * Math.PI * 2, x = rx * Math.cos(a), y = ry * Math.sin(a);
      out.push([cx + x * Math.cos(r) - y * Math.sin(r), cy + x * Math.sin(r) + y * Math.cos(r)]);
    }
    return out;
  }
  function star(cx, cy, R, r, n, k) {
    var out = [];
    for (var i = 0; i <= n * 2; i++) {
      var a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R;
      out.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
    }
    return densify(out, k || 3);
  }
  function rose(cx, cy, R, petals, n) {   // r = R cos(petals/2 · θ) の花(1本の線)
    var out = [], m = petals / 2;
    for (var i = 0; i <= n; i++) { var a = i / n * Math.PI * 2, rr = R * Math.cos(m * a); out.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
    return out;
  }
  function wavy(cx, cy, R, amp, waves, n) {
    var out = [];
    for (var i = 0; i <= n; i++) { var a = -Math.PI / 2 + i / n * Math.PI * 2, rr = R + amp * Math.cos(waves * a); out.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
    return out;
  }
  function densify(pts, step) {
    var out = [pts[0]];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / step));
      for (var k = 1; k <= n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
    }
    return out;
  }

  // =====================================================================
  // 飾りのデータ(本当の話)。strokes: なぞる線 / colors: 選べる色(trad = 伝統の色)
  // =====================================================================
  var CRAFTS = [
    { id: 'batik', name: 'Batik', where: 'ID', country: 'Indonesia', when: 'National Batik Day, October 2',
      intro: 'Draw the pattern with hot wax, like a real batik artist!',
      strokes: [ellipse(34, 34, 16, 9, 45, 40), ellipse(66, 34, 16, 9, -45, 40), ellipse(34, 66, 16, 9, -45, 40), ellipse(66, 66, 16, 9, 45, 40)],
      ask: 'Now dip the cloth in dye. Pick a color:',
      colors: [{ c: '#2E4A8A', n: 'Indigo', trad: true }, { c: '#8A5A2E', n: 'Soga brown', trad: true }, { c: '#C8443B', n: 'Red' }, { c: '#3E8C6A', n: 'Green' }],

  function tone(f, t0, dur, type, vol) {

    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0 || 0);

  // =====================================================================

  function path(ctx, pts, S) { ctx.beginPath(); pts.forEach(function (p, i) { if (i) ctx.lineTo(p[0] * S, p[1] * S); else ctx.moveTo(p[0] * S, p[1] * S); }); }
  function shade(hex, k) {

    function f(v) { return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); }
    return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
  }
  // 仕上がった飾りを描く。S = 1 単位のピクセル数(100 単位 = 絵の大きさ)
  function drawCraft(ctx, c, color, S, t, bgOn) {
    t = t || 0;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    var lw = 2.6 * S / 4;
    if (c.id === 'batik') {
      if (bgOn !== false) { ctx.fillStyle = color; ctx.fillRect(0, 0, 100 * S, 100 * S); }
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      for (var i = 0; i < 12; i++) { ctx.fillRect(0, i * 9 * S, 100 * S, 3 * S); }
      ctx.strokeStyle = '#FFF4DE'; ctx.lineWidth = lw * 1.3;

      ctx.fillStyle = '#FFF4DE'; ctx.beginPath(); ctx.arc(50 * S, 50 * S, 4 * S, 0, 7); ctx.fill();
      [[50, 12], [50, 88], [12, 50], [88, 50]].forEach(function (p) { ctx.beginPath(); ctx.arc(p[0] * S, p[1] * S, 3 * S, 0, 7); ctx.fill(); });
    } else if (c.id === 'kolam') {
      if (bgOn !== false) { ctx.fillStyle = '#7A5236'; ctx.fillRect(0, 0, 100 * S, 100 * S); }
      ctx.fillStyle = color; ctx.globalAlpha = 0.85; path(ctx, c.strokes[0], S); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = '#FFF8EC'; ctx.lineWidth = lw; path(ctx, c.strokes[0], S); ctx.stroke();
      ctx.fillStyle = '#FFF8EC'; c.dots.forEach(function (d) { ctx.beginPath(); ctx.arc(d[0] * S, d[1] * S, 2.2 * S, 0, 7); ctx.fill(); });
    } else if (c.id === 'lantern') {
      var sw = Math.sin(t / 700) * 3;
      ctx.translate(50 * S, 8 * S); ctx.rotate(sw * Math.PI / 180); ctx.translate(-50 * S, -8 * S);
      ctx.strokeStyle = '#4E2C17'; ctx.lineWidth = lw * 0.7; ctx.beginPath(); ctx.moveTo(50 * S, 4 * S); ctx.lineTo(50 * S, 22 * S); ctx.stroke();

        x.strokeStyle = ink; x.lineWidth = 2.6 * S / 4 * 1.3; path(x, s.slice(0, Math.max(1, work.idx)), S); x.stroke();
        var nx = s[Math.min(s.length - 1, work.idx)], pulse = 1 + 0.3 * Math.sin(t / 180);
        x.fillStyle = 'rgba(255,214,90,0.35)'; x.beginPath(); x.arc(nx[0] * S, nx[1] * S, 5 * S * pulse, 0, 7); x.fill();
        x.fillStyle = '#FFD65A'; x.beginPath(); x.arc(nx[0] * S, nx[1] * S, 2.4 * S, 0, 7); x.fill();
      }
    });
    // 指のあと
    x.strokeStyle = 'rgba(224,71,59,0.35)'; x.lineWidth = 1.2 * S / 4 * 1.3;
    work.trail.forEach(function (tr) { if (tr.length > 1) { path(x, tr, S); x.stroke(); } });
    if (work.phase === 'color' && work.color) { x.globalAlpha = 0.85; drawCraft(x, c, work.color, S, t, false); x.globalAlpha = 1; }
  }

  // =====================================================================
  // 🌙 Festival Night(作った飾りが集まる景色)
  // =====================================================================
  var SPOTS = { lantern: [0.1, 0.18, 0.15], parol: [0.3, 0.16, 0.16], skylantern: [0.5, 0.26, 0.12], wau: [0.88, 0.2, 0.16],
    batik: [0.1, 0.44, 0.14], tais: [0.27, 0.44, 0.14], ketupat: [0.5, 0.47, 0.13], padauk: [0.72, 0.44, 0.14],
    kolam: [0.15, 0.66, 0.15], mooncake: [0.86, 0.64, 0.15], krathong: [0.36, 0.87, 0.14], boat: [0.66, 0.88, 0.24] };
  function openNight(sel) {
    showPlay('🌙 Festival Night');
    $('topInfo').textContent = madeCount() + '/' + CRAFTS.length;
    var W = Math.min(640, $('main').getBoundingClientRect().width - 28), H = Math.round(W * 0.7);
    setInner('<div class="card"><div class="h">Festival Night</div><div class="sub">' + (madeCount() ? 'Everything you made, together under the moon. Tap a craft to read about it.' : 'Nothing here yet — go and make your first craft!') + '</div>' +
      '<div id="nightBox" style="margin-top:10px"><canvas id="ncv" style="height:' + H + 'px"></canvas></div><div id="nInfo"></div>' +
      '<div class="row"><button class="btn primary" id="goM">🎨 Make</button></div></div>');
    var cvs = $('ncv'), d = Math.min(2, window.devicePixelRatio || 1);
    cvs.width = W * d; cvs.height = H * d; var x = cvs.getContext('2d');
    cvs.addEventListener('click', function (e) {
      var r = cvs.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      CRAFTS.forEach(function (c) { var s = SPOTS[c.id]; if (progress.made[c.id] && Math.abs(px - s[0]) < s[2] * 0.6 && Math.abs(py - s[1]) < s[2] * 0.6 * W / H) { sfx.tap(); showInfo(c); } });
    });
    function showInfo(c) {
      $('nInfo').innerHTML = '<div class="say" style="margin-top:10px"><b>' + esc(c.name) + '</b> · ' + esc(c.country) + '<br>' + esc(c.facts[0]) + '</div>' +
        '<div class="tell"><span class="cn">🗣️ Tell a friend</span>A <b>' + esc(tellName(c)) + '</b> is ' + esc(c.tell) + ', made for ' + esc(c.when) + '.</div>';
    }
    $('goM').addEventListener('click', function () { sfx.tap(); openPicker(); });
    function loop(t) {
      raf = requestAnimationFrame(loop);
      x.setTransform(d, 0, 0, d, 0, 0);
      var g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1E1A3A'); g.addColorStop(0.7, '#3A2E5E'); g.addColorStop(1, '#5A3A4A');
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.fillStyle = '#FFF4C8'; x.beginPath(); x.arc(W * 0.66, H * 0.12, H * 0.07, 0, 7); x.fill();
      for (var i = 0; i < 30; i++) { x.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.3 * Math.sin(t / 500 + i)) + ')'; x.fillRect((i * 97 % W), (i * 53 % (H * 0.45)), 2, 2); }
      // ひも
      x.strokeStyle = 'rgba(30,20,10,0.8)'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, H * 0.06); x.quadraticCurveTo(W / 2, H * 0.14, W, H * 0.06); x.stroke();
      // 地面と川
      x.fillStyle = '#4A3A3A'; x.fillRect(0, H * 0.5, W, H * 0.5);
      x.fillStyle = '#2C4A6A'; x.beginPath(); x.moveTo(0, H * 0.74); x.quadraticCurveTo(W / 2, H * 0.7, W, H * 0.76); x.lineTo(W, H); x.lineTo(0, H); x.closePath(); x.fill();
      CRAFTS.forEach(function (c) {
        var s = SPOTS[c.id], sz = s[2] * W, cx = s[0] * W - sz / 2, cy = s[1] * H - sz / 2;
        x.save(); x.translate(cx, cy);
        if (progress.made[c.id]) drawCraft(x, c, progress.color[c.id] || c.colors[0].c, sz / 100, t);
        else { x.strokeStyle = 'rgba(255,244,222,0.25)'; x.setLineDash([3, 4]); x.lineWidth = 1.5; c.strokes.forEach(function (st) { path(x, st, sz / 100); x.stroke(); }); x.setLineDash([]); }
        x.restore();
      });
    }
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    if (sel) showInfo(BY[sel]);
  }

  // ---------- title ----------
  function showTitle() {
    document.body.classList.add('on-title'); cancelAnimationFrame(raf); work = null;
    $('nightCount').textContent = madeCount() + ' / ' + CRAFTS.length + ' made';
    $('titleBal').textContent = Math.round(balance()).toLocaleString('en-US');
    $('titleToday').textContent = '· Today ' + earnedToday() + ' / ' + dailyCap();
    try { if (window.MokuMoint) $('titleOutfit').innerHTML = MokuMoint.outfitSVG(MokuMoint.closet().equipped); } catch (e) {}
  }
  $('menuBtn').addEventListener('click', function () { sfx.tap(); showTitle(); });
  syncSoundBtn();
  $('goMake').addEventListener('click', function () { sfx.tap(); openPicker(); });
  $('goNight').addEventListener('click', function () { sfx.tap(); openNight(); });
  window.addEventListener('moku:moint', function () { if (document.body.classList.contains('on-title')) showTitle(); });
  showTitle();
  try {
    var q = new URLSearchParams(location.search), scr = q.get('screen');
    if (scr === 'make') { if (BY[q.get('craft')]) startCraft(q.get('craft')); else openPicker(); } else if (scr === 'night') openNight();
    if (location.protocol === 'file:') window.__mfl = { stroke: function () { return work && work.phase === 'trace' ? work.c.strokes[work.stroke] : null; }, phase: function () { return work && work.phase; } };
  } catch (e) {}
})();
</script>
</body>
</html>
