name: Gemini AI Maintenance Agent

on:
  schedule:
    # 毎週月曜日の朝9時(JST) / UTC 0:00 に自動実行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-gemini-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Code Modification
        env:
          GEMINI_API_KEY: ${{ secrets.Moku_ai }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="ai-auto-improve-$(date +%Y%m%d%H%M)"
          git checkout -b "$BRANCH_NAME"

          python -c "
          import os, glob
          from google import genai

          client = genai.Client(api_key=os.environ.get('GEMINI_API_KEY'))

          # GEMINI.mdの確認
          with open('GEMINI.md', 'r', encoding='utf-8') as f:
              gemini_md = f.read()

          prompt = f'''
          以下はプロジェクトのルールと概要（GEMINI.md）です：
          {gemini_md}

          【依頼】
          プロジェクト内の既存コードを確認し、ゲームをより面白くする機能追加、または見た目・UIの『垢抜け感』を高めるための具体的なコード変更・追加を行ってください。
          
          ※注意：
          - 抽象的なテキスト解説ファイルの作成は厳禁です。
          - 既存のゲームコード（JS/TS/HTML/CSS等）を直接編集・修正するか、新しい機能用ファイルを追加してください。
          '''

          response = client.models.generate_content(
              model='gemini-3.6-flash',
              contents=prompt
          )

          print('Gemini response executed.')
          "

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "feat(auto): [Moku Agent] ゲーム機能・UIの自律改善"
            git push origin "$BRANCH_NAME"
            gh pr create --title "🎮 [Moku Agent] ゲームの新機能・演出改善提案" --body "GEMINI.mdのビジョンに基づき、Geminiが自動生成した機能改善PRです。内容を確認してマージ/クローズを選択してください。" --head "$BRANCH_NAME" --base main
          fi
