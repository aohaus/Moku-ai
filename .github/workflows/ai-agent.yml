name: Gemini AI Maintenance Agent

on:
  schedule:
    # 毎週月曜日の朝9時(JST) / UTC 0:00 に自動実行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-gemini-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Code Modification
        env:
          GEMINI_API_KEY: ${{ secrets.Moku_ai }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="ai-auto-improve-$(date +%Y%m%d%H%M)"
          git checkout -b "$BRANCH_NAME"

          python -c "
          import os
          from google import genai

          client = genai.Client(api_key=os.environ.get('GEMINI_API_KEY'))
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents='GEMINI.mdのルールに従い、プロジェクトの品質を高める小さな改善やテストの追加をしてください。'
          )
          print(response.text)
          "

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "feat(auto): [Gemini Agent] 自律自動改修の実施"
            git push origin "$BRANCH_NAME"
            gh pr create --title "🤖 [AI Agent] 自動改修・改善提案" --body "GeminiがGEMINI.mdに基づいて自動生成したPRです。確認してMerge/Closeを選択してください。"
          fi
