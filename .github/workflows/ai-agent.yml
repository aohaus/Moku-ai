name: Gemini AI Maintenance Agent

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-gemini-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Code Modification
        env:
          GEMINI_API_KEY: ${{ secrets.Moku_ai }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="ai-auto-improve-$(date +%Y%m%d%H%M)"
          git checkout -b "$BRANCH_NAME"

          python scripts/generate_code.py

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "feat(auto): [Moku Agent] ゲーム機能・演出の自動改善"
            git push origin "$BRANCH_NAME"
            
            if [ -f pr_body.txt ]; then
              gh pr create --title "🎮 [Moku Agent] ゲームの新機能・演出改善提案" --body-file pr_body.txt --head "$BRANCH_NAME" --base main
            else
              gh pr create --title "🎮 [Moku Agent] ゲームの新機能・演出改善提案" --body "Geminiによる自動改善提案です。" --head "$BRANCH_NAME" --base main
            fi
          else
            echo "No changes detected."
          fi
