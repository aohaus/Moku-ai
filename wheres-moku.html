<title>Where's Moku?</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<!--
  Where's Moku?(v0.1.0、2026-11-18)— 新しい棚「Live in ASIA」の第1弾。
  旅に出た Moku から絵はがきが届き、手がかり(あいさつ・食べ物・名所・お金・国旗…)から
  東南アジア 11 か国(ASEAN。2025年に東ティモールが11番目に加わった)のどこにいるかを地図で当てる。

  ねらい(保護者と決めた目標): ①国を覚える ②外から見える情報(場所・大きさ・人の数・ことば・お金・
  車の走る側・島か大陸か・国旗・食べ物・名所)から、国どうしの「ちがい」と「似ているところ」をつかむ
  ③それを友達に説明できるようになる。モードはこの3つに対応している。
  - ✉️ Postcards(①): 1回の旅で5枚。手がかりが少ないほど切手(🔖)が多い(1枚目 3 / 2枚目 2 / 3〜4枚目 1)。
    まちがえると、押した国の名前とあいさつが出て、次の手がかりが開く。当てたら Passport のページ
    (国の情報+いちばん似ている国「Like …」+ちがい「Unlike …」+友達に話す一文「Tell a friend」)。
    地図の国名は、見つけた国だけ出る(覚えるほど地図がうまっていく)。
  - ⚖️ Twin or Not?(②): 2つの国を比べる8問(どっちが大きい・人が多い・同じ側を走る・同じあいさつ・
    となり同士・島の国・海がない・ドル・メコン川)。答えのあとに数字つきの説明。地図で2つの国を光らせる。
  - 🗣 Be the Guide(③、1台を回して遊ぶ 2〜4人): ガイドが秘密の国の手がかりカードから3枚を選んで、
    ほかの人に当ててもらう。カードには「その手がかりを持つ国がいくつあるか」(⭐ Only here / 👥 n countries)
    が出るので、「その国だけの特徴」で説明するほど早く当たる=説明がうまくなる。Moint はなし(Moku Wolf と同じ)。
  - 📕 Passport: 見つけた国のページをいつでも読める。

  事実のデータはこのファイルの COUNTRIES(数字は 2024〜2025 年ごろのおおよその値。画面にも「about」)。
  手がかりの文に、その国の名前を入れないこと(起動時に checkCards() がコンソールで知らせる)。
  南シナ海などの名前に争いがある海の名前は地図に書かない。宗教・政治の話は手がかりにしない。

  Moint(SPEC.md §13): 切手1枚 +5、5枚とも1枚目の手がかりで当てた旅 +25(毎回、1日 500 の上限の中)。
  Twin or Not? 1問正解 +5、8問全部 +20(同じ上限の中)。1回きり: その国を初めて見つけた +30、11か国そろった +300
  (受け取り済みは progress.mointClaims の c:<国> と all)。
  記録は moku:wheres-moku:progress(下の loadProgress)、音のオン/オフは moku:wheres-moku:settings。
-->
<style>
:root {
  --hi: #E85C9A; --lo: #7A2050;               /* ハイビスカスのピンク */
  --ink: #3B2A20; --ink-soft: #8B6E57;
  --paper: #FFF7E8; --paper2: #FBEBD0;
  --wood: #7A4A2C; --wood-dark: #4E2C17;
  --line: #5A3A22;
  --sea1: #BFE6EE; --sea2: #94D0E0;
  --ok: #3E9B5A; --bad: #D0533F;
  --round: "Fredoka", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #F6D7AE;
  color: var(--ink);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
input { font: inherit; -webkit-user-select: text; user-select: text; }

/* ---------- shared frame / hub link (Moku series design system) ---------- */
#title-frame {
  position: fixed; inset: 14px;
  border: 3px solid var(--hi);
  border-radius: 10px;
  pointer-events: none;
  z-index: 40;
}
#title-frame::after {
  content: '';
  position: absolute; inset: 5px;
  border: 1px solid var(--lo);
  border-radius: 8px;
}
#hub-link {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  z-index: 41;
  font-size: 14px;
  font-weight: 800;
  color: var(--lo);
  text-decoration: none;
  text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  animation: hubLinkPulse 2.2s ease-in-out infinite;
}
@keyframes hubLinkPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
#buildInfo {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 18px);
  z-index: 41;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: rgba(255,255,255,0.28);
  text-shadow: 0 0 1px rgba(90,58,34,0.5);
  pointer-events: none;
}
body:not(.on-title) #title-frame,
body:not(.on-title) #hub-link,
body:not(.on-title) #buildInfo,
body:not(.on-title) #titleScreen { display: none; }
body.on-title #playScreen { display: none; }

/* ---------- map (shared by title and play) ---------- */
.mapSvg { display: block; width: 100%; height: 100%; touch-action: manipulation; }
.sea { fill: url(#seaGrad); }
.wave { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 2; stroke-linecap: round; }
.ghost { fill: #EADFC8; stroke: #B9A27F; stroke-width: 1.6; stroke-linejoin: round; }
.ghostLab { font: 600 15px var(--round); fill: #A68E6A; letter-spacing: 0.08em; }
.seaLab { font: 600 16px var(--round); fill: rgba(35,95,120,0.55); letter-spacing: 0.12em; font-style: italic; }
.ctry > * { fill: var(--c); stroke: var(--line); stroke-width: 2.2; stroke-linejoin: round; transition: fill 0.25s, opacity 0.25s; }
.ctry.tap { cursor: pointer; }
.ctry.dim > * { opacity: 0.4; }
.ctry.hl, .ctry.good { filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 2px rgba(255,255,255,0.9)); }
.ctry.hl > *, .ctry.good > * { stroke: var(--hi); stroke-width: 5; }
.ctry.wrong > * { animation: wrongFlash 0.9s ease-out; }
@keyframes wrongFlash { 0%, 45% { fill: #CFC6B8; stroke: #8A2F20; } 100% { fill: var(--c); } }
.hit { fill: transparent; stroke: none; }
.lab {
  font: 600 var(--lf, 17px) var(--round); fill: var(--ink); text-anchor: middle;
  paint-order: stroke; stroke: rgba(255,250,240,0.92); stroke-width: var(--ls, 4.5px); stroke-linejoin: round;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
.lab.show { opacity: 1; }
.lab.q { fill: var(--ink-soft); }
.pin { pointer-events: none; transform-box: fill-box; transform-origin: 50% 100%; animation: pinPop 0.6s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pinPop { from { transform: scale(0) translateY(20px); } to { transform: scale(1) translateY(0); } }
.pinBob { animation: pinBob 2.4s ease-in-out 0.6s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes pinBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* ---------- title screen ---------- */
#titleScreen { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#FFE6BE, #F8C394 70%, #F2AE84); }
#titleMap { position: absolute; inset: -4%; opacity: 0.42; filter: saturate(0.85); }
#titleMap .lab { opacity: 0; }
#titleInner {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 44px) 28px calc(env(safe-area-inset-bottom, 0px) + 36px);
  overflow-y: auto;
  align-items: flex-start;
}
#titleInner > #titleCard { margin: auto; }
#titleCard {
  position: relative;
  width: min(420px, 100%);
  background: var(--paper);
  border-radius: 18px;
  border: 3px solid var(--line);
  box-shadow: 0 10px 0 rgba(90,58,34,0.25), 0 18px 40px rgba(90,58,34,0.25);
  padding: 18px 18px 16px;
  text-align: center;
  transform: rotate(-1.2deg);
}
#titleCard::before {   /* airmail stripes along the edge */
  content: ''; position: absolute; inset: 6px; border-radius: 12px; pointer-events: none;
  border: 5px solid transparent;
  border-image: repeating-linear-gradient(45deg, #E85C9A 0 10px, transparent 10px 20px, #5AA9E6 20px 30px, transparent 30px 40px) 8;
  opacity: 0.55;
}
#titleStamp {
  position: absolute; top: 14px; right: 16px; width: 62px; height: 72px;
  background: #fff; border: 2px dashed #C9A87D; border-radius: 4px; transform: rotate(6deg);
  display: flex; align-items: center; justify-content: center; font-size: 34px;
}
#titleHero { position: relative; width: 112px; height: 112px; margin: 2px auto 0; animation: heroFloat 3.2s ease-in-out infinite; }
#titleHero img, #titleHero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#titleHero img { object-fit: cover; object-position: center 30%; filter: drop-shadow(0 4px 8px rgba(122,32,80,0.35)); }
@keyframes heroFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
#titleLogo { font: 700 38px/1 var(--round); color: var(--lo); letter-spacing: 0.01em; margin-top: 6px; }
#titleLogo span { color: var(--hi); }
#titleSub { font: 600 13px var(--round); color: var(--ink-soft); letter-spacing: 0.14em; margin-top: 6px; text-transform: uppercase; }
#titleMenu { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; }
.titleMenuItem {
  width: 100%; max-width: 300px;
  font-size: 19px; font-weight: 800;
  padding: 8px 18px;
  border-radius: 14px;
  background: #fff; border: 2px solid rgba(90,58,34,0.25);
  color: var(--ink);
  display: flex; align-items: center; gap: 10px; text-align: left;
  transition: transform 0.12s;
}
.titleMenuItem .ic { font-size: 22px; width: 28px; text-align: center; }
.titleMenuItem small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-top: 1px; }
.titleMenuItem.primary { background: var(--hi); border-color: var(--lo); color: #fff; box-shadow: 0 4px 0 var(--lo); }
.titleMenuItem.primary small { color: rgba(255,255,255,0.85); }
.titleMenuItem:active { transform: translateY(2px) scale(0.98); }
#titleMoints { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 6px; }
.mcoin {
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFF2A8, #F2C230 55%, #C9901A);
  border: 1.5px solid #9A6A10; color: #7A4E00; font: 800 9.5px/1 var(--round);
}
#soundBtn {
  position: fixed; z-index: 41;
  top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 22px);
  width: 36px; height: 36px; border-radius: 50%; background: rgba(255,247,232,0.85); border: 2px solid rgba(90,58,34,0.3); font-size: 17px;
}
body:not(.on-title) #soundBtn { display: none; }

/* ---------- play screen ---------- */
#playScreen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper2); }
#topbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(env(safe-area-inset-right, 0px) + 12px) 6px calc(env(safe-area-inset-left, 0px) + 10px);
  background: linear-gradient(#8A5634, var(--wood));
  border-bottom: 3px solid var(--wood-dark);
  color: #FFF4E0;
}
#menuBtn { padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,0.14); font-weight: 800; font-size: 14px; }
#modeTitle { flex: 1; font: 700 17px var(--round); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topInfo { font-weight: 800; font-size: 14px; white-space: nowrap; }
#stage { flex: 1; min-height: 0; display: flex; flex-direction: row; }
#mapBox { position: relative; flex: 1; min-width: 0; background: var(--sea1); overflow: hidden; }
#mapBox .mapSvg { position: absolute; inset: 0; }
#mapHint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  background: rgba(255,247,232,0.92); border: 2px solid rgba(90,58,34,0.25); border-radius: 999px;
  padding: 5px 14px; font-weight: 800; font-size: 13px; color: var(--ink); white-space: nowrap; pointer-events: none;
  transition: opacity 0.3s;
}
#mapHint:empty { opacity: 0; }
#mapNote { position: absolute; right: 8px; top: 6px; font-size: 10px; color: rgba(35,95,120,0.6); pointer-events: none; }
#panel {
  flex: none; width: clamp(300px, 38vw, 430px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--paper2);
  border-left: 3px solid var(--wood-dark);
  padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-right: calc(env(safe-area-inset-right, 0px) + 12px);
}
@media (orientation: portrait) {
  #stage { flex-direction: column; }
  #mapBox { flex: none; height: 46%; }
  #panel { width: auto; flex: 1; border-left: 0; border-top: 3px solid var(--wood-dark); padding-left: calc(env(safe-area-inset-left, 0px) + 12px); }
}

/* ---------- panel pieces ---------- */
.postcard {
  position: relative;
  background: var(--paper);
  border: 2.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 14px 12px;
  box-shadow: 0 5px 0 rgba(90,58,34,0.18);
}
.enter { animation: cardIn 0.45s cubic-bezier(.2,1.3,.5,1) both; }
@keyframes cardIn { from { transform: translateY(18px) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
.pcHead { display: flex; align-items: center; gap: 10px; padding-right: 64px; min-height: 56px; }
.pcHead .av { position: relative; width: 48px; height: 48px; flex: none; }
.av img, .av svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.av img { object-fit: cover; object-position: center 30%; }
.pcHead h2 { font: 700 19px/1.15 var(--round); color: var(--lo); }
.pcHead p { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
.pcStamp {
  position: absolute; top: 10px; right: 12px; width: 56px; height: 64px;
  border: 2px dashed #C9A87D; border-radius: 4px; background: #fff;
  display: flex; align-items: center; justify-content: center; transform: rotate(5deg);
  font: 700 26px var(--round); color: #D8C3A2; overflow: hidden;
}
.pcStamp.got { border-style: solid; border-color: var(--hi); animation: stampIn 0.5s cubic-bezier(.2,1.6,.4,1) both; }
.pcStamp.got svg { width: 46px; height: auto; border-radius: 2px; }
@keyframes stampIn { from { transform: rotate(-20deg) scale(2.2); opacity: 0; } to { transform: rotate(5deg) scale(1); opacity: 1; } }
.clues { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
.clue {
  display: flex; gap: 9px; align-items: flex-start;
  background: #fff; border-radius: 10px; border: 1.5px solid rgba(90,58,34,0.18);
  padding: 8px 10px; font-size: 15px; line-height: 1.35; font-weight: 600;
}
.clue.new { animation: clueIn 0.4s ease-out both; }
.clue .ci { font-size: 19px; line-height: 1.1; flex: none; width: 24px; text-align: center; }
.clue .cn { font-size: 10.5px; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; display: block; }
.clue svg.flag { width: 54px; height: 36px; display: block; margin-top: 3px; }
.clue.locked { background: repeating-linear-gradient(-45deg, #F6EBD8 0 8px, #FBF3E5 8px 16px); color: var(--ink-soft); font-weight: 700; animation: none; }
@keyframes clueIn { from { transform: translateX(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
.row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 120px;
  padding: 11px 14px; border-radius: 12px;
  font-weight: 800; font-size: 15.5px;
  background: #fff; border: 2px solid rgba(90,58,34,0.3);
  box-shadow: 0 3px 0 rgba(90,58,34,0.2);
}
.btn.primary { background: var(--hi); color: #fff; border-color: var(--lo); box-shadow: 0 3px 0 var(--lo); }
.btn:disabled { opacity: 0.45; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.say {
  margin-top: 10px; padding: 9px 12px; border-radius: 12px; font-weight: 700; font-size: 14.5px; line-height: 1.4;
  background: #FFF0F6; border: 2px solid rgba(232,92,154,0.35); color: var(--lo);
  animation: clueIn 0.3s ease-out both;
}
.say.ok { background: #EAF7E6; border-color: rgba(62,155,90,0.4); color: #275E37; }
.say.bad { background: #FDEDEA; border-color: rgba(208,83,63,0.35); color: #8A2F20; }
.tip { margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; text-align: center; }

/* passport page */
.pp { background: #FFFDF7; border: 2.5px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
.ppHead { display: flex; align-items: center; gap: 12px; }
.ppHead svg.flag { width: 66px; height: 44px; flex: none; }
.ppHead h3 { font: 700 23px/1.1 var(--round); color: var(--ink); }
.ppHead p { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-top: 2px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin-top: 12px; font-size: 14px; line-height: 1.35; }
.facts dt { font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
.facts dd { font-weight: 600; }
.compare { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
.compare div { padding: 8px 10px; border-radius: 10px; font-size: 14px; line-height: 1.4; font-weight: 600; }
.compare .like { background: #EAF7E6; }
.compare .unlike { background: #EEF3FB; }
.compare b { font-weight: 800; }
.tell { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #FFF6DA; border: 2px dashed #E0B85A; font-size: 14.5px; line-height: 1.5; font-weight: 600; }
.tell .cn { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #9A7420; text-transform: uppercase; margin-bottom: 2px; }

/* twin */
.qText { font: 700 21px/1.25 var(--round); color: var(--ink); text-align: center; margin: 6px 4px 12px; }
.pair { display: flex; gap: 10px; }
.cc {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #fff; border-radius: 14px; border: 2.5px solid rgba(90,58,34,0.25); padding: 12px 8px;
  font: 700 17px var(--round); box-shadow: 0 4px 0 rgba(90,58,34,0.18);
}
.cc svg.flag { width: 72px; height: 48px; }
.cc.pick:active { transform: translateY(2px); box-shadow: none; }
.cc.right { border-color: var(--ok); background: #EAF7E6; }
.cc.miss { border-color: var(--bad); background: #FDEDEA; }
.dots { display: flex; justify-content: center; gap: 5px; margin-bottom: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #E3D3B8; }
.dots i.ok { background: var(--ok); } .dots i.no { background: var(--bad); } .dots i.now { background: var(--hi); }

/* guide */
.gcards { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.gcard { position: relative; text-align: left; width: 100%; padding-right: 92px; }
.gcard .tag { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #EEE3D0; color: var(--ink-soft); white-space: nowrap; }
.gcard .tag.only { background: #FFE48A; color: #7A5200; }
.gcard.sel { border-color: var(--hi); background: #FFF0F6; box-shadow: 0 0 0 2px rgba(232,92,154,0.3); }
.gcard .num { position: absolute; left: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--hi); color: #fff; font: 800 12px/22px var(--round); text-align: center; }
.players { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.players input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid rgba(90,58,34,0.25); background: #fff; font-weight: 700; font-size: 16px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 9px 0; border-radius: 10px; background: #fff; border: 2px solid rgba(90,58,34,0.25); font-weight: 800; font-size: 16px; }
.seg button.on { background: var(--hi); color: #fff; border-color: var(--lo); }
.score { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }

  function sameList(a, b) {

    A.islands.forEach(function (is) { if (B.islands.indexOf(is) >= 0) out.push({ w: 3, x: 'they share the island of ' + ISLAND_NAME[is] }); });

  var TRIP_LEN = 5;

  function chooseTrip() {
    // まだ見つけていない国 → 1枚目で当てていない国 → ほか、の順に出やすい
    var pool = ORDER.map(function (id) { return { id: id, w: !progress.found[id] ? 4 : !progress.master[id] ? 2 : 1 }; }), out = [];
    while (out.length < TRIP_LEN && pool.length) {
      var sum = pool.reduce(function (a, p) { return a + p.w; }, 0), r = Math.random() * sum, i = 0;
      for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r < 0) break; }

  function cluesFor(id) {

    if (!t1.length) t1 = all.filter(function (cd) { return /^(fun|nature|size|land)$/.test(cd.t); });

  function anyPair(filter) {

  var Q = {

      var A = COUNTRIES[p[0]], B = COUNTRIES[p[1]], big = A.area > B.area ? p[0] : p[1], sml = big === p[0] ? p[1] : p[0];

    hello: function () {
      var p = Math.random() < 0.45 ? shuffle(['MY', 'ID', 'BN']).slice(0, 2) : anyPair();
      var A = COUNTRIES[p[0]], B = COUNTRIES[p[1]], same = A.helloGroup === B.helloGroup;
      var ex = '<b>' + A.name + '</b>: “' + A.hello + '” · <b>' + B.name + '</b>: “' + B.hello + '”';
      if (same) ex += '<br>Their languages are very close, so people understand each other!';
      else if (A.helloFamily && A.helloFamily === B.helloFamily) ex += '<br>Not the same — but they sound a bit alike!';
      return { a: p[0], b: p[1], q: 'Do they say good morning / hello the same way?', kind: 'yn', ans: same, ex: ex };
    },
    border: function () {
      var p = Math.random() < 0.5 ? shuffle(pick(BORDERS)) : (Math.random() < 0.3 ? ['MY', 'SG'] : anyPair(function (a, b) { return !neighbors(a, b); }));
      var yes = neighbors(p[0], p[1]);
      var ex = yes ? 'Yes! You can walk from <b>' + COUNTRIES[p[0]].name + '</b> into <b>' + COUNTRIES[p[1]].name + '</b> on land.' : 'No land border between them.';
      if ((p[0] === 'MY' && p[1] === 'SG') || (p[0] === 'SG' && p[1] === 'MY')) ex = 'No land border — the sea is in between. But two bridges connect them!';
      return { a: p[0], b: p[1], q: 'Do they touch each other on land?', kind: 'yn', ans: yes, ex: ex };
    },
    islands: function () {
      var isl = pick(['ID', 'PH', 'SG']), main = pick(['MM', 'TH', 'LA', 'KH', 'VN']);
      var p = shuffle([isl, main]);
      var what = { ID: 'more than 17,000 islands', PH: '7,641 islands', SG: 'one main island and about 60 small ones' }[isl];
      return { a: p[0], b: p[1], q: 'Which country is made of islands?', kind: 'pick', ans: isl,
        ex: '<b>' + COUNTRIES[isl].name + '</b> has ' + what + '. <b>' + COUNTRIES[main].name + '</b> is on the mainland.' };
    },
    sea: function () {
      var o = pick(ORDER.filter(function (x) { return x !== 'LA'; })), p = shuffle(['LA', o]);
      return { a: p[0], b: p[1], q: 'Which country has no sea?', kind: 'pick', ans: 'LA',
        ex: '<b>Laos</b> is the only one of the 11 countries with no sea at all!' };
    },
    dollar: function () {
      var d = pick(['SG', 'BN', 'TL']), o = pick(ORDER.filter(function (x) { return COUNTRIES[x].moneyGroup !== 'dollar'; })), p = shuffle([d, o]);
      var ex = '<b>' + COUNTRIES[d].name + '</b> uses the ' + COUNTRIES[d].money + '. <b>' + COUNTRIES[o].name + '</b> uses the ' + COUNTRIES[o].money + '.';
      if (d !== 'TL') ex += '<br>Fun fact: Singapore and Brunei dollars are worth exactly the same!';
      return { a: p[0], b: p[1], q: 'Which country uses a dollar?', kind: 'pick', ans: d, ex: ex };
    },
    mekong: function () {
      var M = ['MM', 'TH', 'LA', 'KH', 'VN'].filter(function (x) { return COUNTRIES[x].mekong; });
      var p = Math.random() < 0.5 ? shuffle(M).slice(0, 2) : [pick(M), pick(ORDER.filter(function (x) { return !COUNTRIES[x].mekong; }))];
      p = shuffle(p);
      var yes = COUNTRIES[p[0]].mekong && COUNTRIES[p[1]].mekong;
      return { a: p[0], b: p[1], q: 'Does the Mekong River flow through both?', kind: 'yn', ans: yes,
        ex: 'The Mekong flows through or along <b>Thailand, Laos, Cambodia and Vietnam</b> (and starts far away in China).' };
    }
  };
  function startTwin() {
    progress.played++; save();
    var kinds = shuffle(Object.keys(Q)).slice(0, TWIN_LEN);
    while (kinds.length < TWIN_LEN) kinds.push(pick(Object.keys(Q)));
    var qs = [], seen = {};
    kinds.forEach(function (k) {
      for (var n = 0; n < 20; n++) {
        var q = Q[k](), key = k + [q.a, q.b].sort().join('');
        if (!seen[key]) { seen[key] = 1; qs.push(q); return; }
      }
    });
    twin = { qs: qs, i: 0, res: [], answered: false };
    showPlay('⚖️ Twin or Not?');
    setLabels([]);
    fresh = true;
    renderTwin();
  }
  function twinCard(id, extra) { return '<button class="cc' + (extra || '') + '" data-c="' + id + '">' + flagSVG(id) + '<span>' + esc(COUNTRIES[id].name) + '</span></button>'; }
  function renderTwin() {
    var q = twin.qs[twin.i];
    clearMap();
    forCtry(function (el, id) { el.classList.toggle('dim', id !== q.a && id !== q.b); });
    ctryEl(q.a).classList.add('hl'); ctryEl(q.b).classList.add('hl');
    setLabels([q.a, q.b]);
    $('topInfo').textContent = '⚖️ ' + (twin.i + 1) + '/' + twin.qs.length;
    var dots = '<div class="dots">' + twin.qs.map(function (x, i) { return '<i class="' + (i < twin.res.length ? (twin.res[i] ? 'ok' : 'no') : i === twin.i ? 'now' : '') + '"></i>'; }).join('') + '</div>';
    var h = '<div class="postcard">' + dots + '<div class="qText">' + esc(q.q) + '</div>';
    if (q.kind === 'pick') {
      var cls = function (id) { if (!twin.answered) return ' pick'; return id === q.ans ? ' right' : id === twin.chosen ? ' miss' : ''; };
      h += '<div class="pair">' + twinCard(q.a, cls(q.a)) + twinCard(q.b, cls(q.b)) + '</div>';
    } else {
      h += '<div class="pair">' + twinCard(q.a) + twinCard(q.b) + '</div>';
      if (!twin.answered) h += '<div class="row"><button class="btn" data-yn="1">👍 Yes</button><button class="btn" data-yn="0">👎 No</button></div>';
    }
    if (twin.answered) {
      var ok = twin.res[twin.i];
      h += '<div class="say ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '⭕ Right! ' : '❌ Not quite. ') + q.ex + '</div>' +
           '<div class="row"><button class="btn primary" id="twNext">' + (twin.i + 1 >= twin.qs.length ? 'See results ▶' : 'Next ▶') + '</button></div>';
    }
    h += '</div>';
    setPanel(h);
    if (!twin.answered) {
      if (q.kind === 'pick') panel.querySelectorAll('.cc.pick').forEach(function (b) { b.addEventListener('click', function () { answerTwin(b.getAttribute('data-c')); }); });
      panel.querySelectorAll('[data-yn]').forEach(function (b) { b.addEventListener('click', function () { answerTwin(b.getAttribute('data-yn') === '1'); }); });
      mapHandler = q.kind === 'pick' ? function (id) { if (id === q.a || id === q.b) answerTwin(id); } : null;
      setTappable(q.kind === 'pick');
      setHint(q.kind === 'pick' ? 'Tap a card — or the country on the map' : '');
    } else {
      mapHandler = null; setTappable(false);
      $('twNext').addEventListener('click', function () { sfx.tap(); twin.i++; twin.answered = false; fresh = true; if (twin.i >= twin.qs.length) endTwin(); else renderTwin(); });
    }
  }
  function answerTwin(v) {
    if (twin.answered) return;
    var q = twin.qs[twin.i], ok = v === q.ans;
    twin.answered = true; twin.chosen = v; twin.res.push(ok);
    if (ok) sfx.good(); else sfx.bad();
    renderTwin();
  }
  function endTwin() {
    var n = twin.res.filter(Boolean).length;
    progress.twinRounds++; progress.twinCorrect += n; progress.twinBest = Math.max(progress.twinBest, n);
    var lines = [['Right answers: ' + n + ' × 5', earn(n * 5)]];
    if (n === twin.qs.length) lines.push(['All ' + n + ' right! ⭐', earn(20)]);
    save();
    clearMap(); setLabels(knownIds());
    $('topInfo').textContent = '⚖️ ' + n + '/' + twin.qs.length;
    sfx.fanfare();
    fresh = true;
    setPanel('<div class="postcard"><div class="pcHead">' + avatar() + '<div><h2>' + (n === twin.qs.length ? 'Perfect twins expert!' : n >= 5 ? 'Great comparing!' : 'Good try!') + '</h2><p>Same or different — you can explain it now.</p></div></div>' +
      '<div class="big">' + n + ' / ' + twin.qs.length + '</div>' + mointBox(lines) +
      '<div class="row"><button class="btn primary" id="twAgain">⚖️ Play again</button><button class="btn" id="twMenu">Menu</button></div></div>');
    $('twAgain').addEventListener('click', function () { sfx.tap(); startTwin(); });
    $('twMenu').addEventListener('click', function () { sfx.tap(); showTitle(); });
  }

  // =====================================================================
  // 🗣️ Be the Guide(1台を回して 2〜4人)
  // =====================================================================
  var guide = null;
  var GUIDE_PICK = 3;
  function startGuideSetup() {
    progress.played++; save();
    showPlay('🗣️ Be the Guide');
    setLabels(ORDER);
    var saved = settings.players || ['Player 1', 'Player 2', 'Player 3', 'Player 4'];
    var count = settings.playerCount || 2;
    function draw() {
      var h = '<div class="postcard"><div class="pcHead">' + avatar() + '<div><h2>Be the Guide</h2><p>Explain a secret country. Can your friends find it?</p></div></div>' +
        '<div class="say">1. The <b>Guide</b> secretly gets a country.<br>2. The Guide picks <b>' + GUIDE_PICK + ' clue cards</b> to explain it.<br>3. The next player finds it on the map. Faster = more points for both!<br>💡 Clues that only one country has (⭐) work best.</div>' +
        '<div class="sec">Players</div><div class="seg" style="margin-top:8px">' + [2, 3, 4].map(function (n) { return '<button data-n="' + n + '" class="' + (n === count ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div>' +
        '<div class="players">';
      for (var i = 0; i < count; i++) h += '<input maxlength="12" data-p="' + i + '" value="' + esc(saved[i] || 'Player ' + (i + 1)) + '">';
      h += '</div><div class="row"><button class="btn primary" id="gStart">▶ Start</button></div><div class="tip">Each player is the Guide 2 times.</div></div>';
      setPanel(h);
      panel.querySelectorAll('[data-n]').forEach(function (b) { b.addEventListener('click', function () { collect(); count = +b.getAttribute('data-n'); sfx.tap(); draw(); }); });
      $('gStart').addEventListener('click', function () {
        collect();
        settings.players = saved; settings.playerCount = count; writeJSON(SET_KEY, settings);
        var names = saved.slice(0, count).map(function (s, i) { return (s || '').trim() || 'Player ' + (i + 1); });
        sfx.tap(); beginGuide(names);
      });
    }
    fresh = true;
    function collect() { panel.querySelectorAll('[data-p]').forEach(function (inp) { saved[+inp.getAttribute('data-p')] = inp.value.trim().slice(0, 12); }); }
    draw();
  }
  function beginGuide(names) {
    var turns = [];
    for (var r = 0; r < 2; r++) for (var i = 0; i < names.length; i++) turns.push(i);
    var deck = shuffle(ORDER);
    guide = { names: names, pts: names.map(function () { return 0; }), turns: turns, t: 0, deck: deck };
    nextGuideTurn();
  }
  function cover(emo, title, text, btn, fn) {
    var c = $('cover');
    c.innerHTML = '<div class="emo">' + emo + '</div><h2>' + esc(title) + '</h2><p>' + text + '</p><button class="btn primary" id="coverGo">' + esc(btn) + '</button>';
    c.classList.add('show');
    $('coverGo').addEventListener('click', function () { sfx.tap(); c.classList.remove('show'); fn(); });
  }
  function nextGuideTurn() {
    if (guide.t >= guide.turns.length) return endGuide();
    var g = guide.turns[guide.t], s = (g + 1) % guide.names.length;
    guide.cur = { id: guide.deck[guide.t % guide.deck.length], guide: g, seeker: s, picked: [], shown: 0, wrong: 0, done: false };
    $('topInfo').textContent = 'Turn ' + (guide.t + 1) + '/' + guide.turns.length;
    clearMap(); setLabels(ORDER);
    panel.innerHTML = '';
    cover('🤫', 'Pass to ' + guide.names[g], 'You are the <b>Guide</b>. Only you may look at the screen now!', 'I\'m ' + guide.names[g] + ' — show me', guidePick);
  }
  function guidePick() {
    var cur = guide.cur, c = COUNTRIES[cur.id];
    clearMap(); setLabels(ORDER); ctryEl(cur.id).classList.add('hl');
    forCtry(function (el, id) { el.classList.toggle('dim', id !== cur.id); });
    setHint('🤫 Secret: ' + c.name);
    fresh = true;
    var cards = CARDS[cur.id].map(function (cd, i) { return { cd: cd, i: i }; })
      .filter(function (o) { return o.cd.t !== 'city' && o.cd.t !== 'flag'; });   // 首都と国旗は答えそのものに近いので使わない
    cards = shuffle(cards);   // 並びはまぜる(⭐ のカードを自分で探して選ぶ)
    function draw() {
      var h = '<div class="postcard"><div class="ppHead">' + flagSVG(cur.id) + '<div><h3>' + esc(c.name) + '</h3><p>' + esc(guide.names[cur.guide]) + ', explain it to ' + esc(guide.names[cur.seeker]) + '!</p></div></div>' +
        '<div class="tip" style="text-align:left">Pick ' + GUIDE_PICK + ' cards in order. Card 1 is shown first. ⭐ = only this country has it.</div><div class="gcards">';
      cards.forEach(function (o) {
        var n = share(o.cd), idx = cur.picked.indexOf(o.i);
        h += '<button class="clue gcard' + (idx >= 0 ? ' sel' : '') + '" data-i="' + o.i + '">' + (idx >= 0 ? '<span class="num">' + (idx + 1) + '</span>' : '') +
          '<span class="ci">' + ICON[o.cd.t] + '</span><span><span class="cn">' + CARD_NAME[o.cd.t] + '</span>' + esc(o.cd.x) + '</span>' +
          '<span class="tag' + (n === 1 ? ' only' : '') + '">' + (n === 1 ? '⭐ Only here' : '👥 ' + n + ' countries') + '</span></button>';
      });
      h += '</div><div class="row"><button class="btn primary" id="gDone"' + (cur.picked.length === GUIDE_PICK ? '' : ' disabled') + '>Done — hide it! (' + cur.picked.length + '/' + GUIDE_PICK + ')</button></div></div>';
      var st = panel.scrollTop;
      setPanel(h); panel.scrollTop = st;
      panel.querySelectorAll('.gcard').forEach(function (b) {
        b.addEventListener('click', function () {
          var i = +b.getAttribute('data-i'), at = cur.picked.indexOf(i);
          if (at >= 0) cur.picked.splice(at, 1); else if (cur.picked.length < GUIDE_PICK) cur.picked.push(i);
          sfx.tap(); draw();
        });
      });
      $('gDone').addEventListener('click', function () {
        sfx.tap();
        clearMap(); setLabels(ORDER); panel.innerHTML = '';
        cover('🧭', 'Pass to ' + guide.names[cur.seeker], guide.names[cur.guide] + ' explained a secret country. Find it on the map!', 'I\'m ' + guide.names[cur.seeker] + ' — let\'s go', seekStart);
      });
    }
    draw();
  }
  function seekStart() { var cur = guide.cur; cur.shown = 1; clearMap(); setLabels(ORDER); setTappable(true); mapHandler = seekGuess; setHint('Tap the country!'); fresh = true; renderSeek(); }
  function renderSeek() {
    var cur = guide.cur, cds = cur.picked.map(function (i) { return CARDS[cur.id][i]; });
    var h = '<div class="postcard"><div class="pcHead"><div><h2>' + (cur.done ? (cur.ok ? 'Found it: ' : 'It was ') + esc(COUNTRIES[cur.id].name) + '!' : esc(guide.names[cur.guide]) + '\'s clues') + '</h2>' +
      '<p>' + esc(guide.names[cur.seeker]) + ' is finding the country</p></div></div><ul class="clues">' +
      cds.slice(0, cur.done ? cds.length : cur.shown).map(function (cd) { return clueHTML(cd, cur.id); }).join('');
    if (!cur.done) for (var k = cur.shown; k < cds.length; k++) h += '<li class="clue locked"><span class="ci">🔒</span><span>Clue ' + (k + 1) + '</span></li>';
    h += '</ul>';
    if (cur.say) h += '<div class="say ' + (cur.sayCls || '') + '">' + cur.say + '</div>';
    if (cur.done) {
      // 一番「その国だけ」の手がかり(Moku のコツ)
      var best = CARDS[cur.id].filter(function (cd) { return cd.t !== 'city' && cd.t !== 'flag'; }).sort(function (x, y) { return share(x) - share(y); })[0];
      var usedBest = cds.indexOf(best) >= 0;
      h += '<div class="tell"><span class="cn">🦉 Moku\'s guide tip</span>' + (usedBest ? 'Great pick! ' : 'A super clue for ' + esc(COUNTRIES[cur.id].name) + ': ') + '“' + esc(best.x) + '”' + (share(best) === 1 ? ' — only this country has it!' : '') + '</div>' +
        passportHTML(cur.id) +
        '<div class="score">' + guide.names.map(function (n, i) { return '<div><span>' + esc(n) + '</span><span>' + guide.pts[i] + ' pts</span></div>'; }).join('') + '</div>' +
        '<div class="row"><button class="btn primary" id="gNext">' + (guide.t + 1 >= guide.turns.length ? 'Final scores ▶' : 'Next turn ▶') + '</button></div>';
    }
    h += '</div>';
    setPanel(h); panel.scrollTop = 0;
    if ($('gNext')) $('gNext').addEventListener('click', function () { sfx.tap(); guide.t++; nextGuideTurn(); });
  }
  function seekGuess(id) {
    var cur = guide.cur;
    if (cur.done) return;
    if (id === cur.id) {
      var pts = Math.max(1, 4 - cur.shown);
      guide.pts[cur.guide] += pts; guide.pts[cur.seeker] += pts;
      cur.done = true; cur.ok = true; mapHandler = null; setTappable(false);
      cur.say = '🎉 With ' + cur.shown + ' clue' + (cur.shown > 1 ? 's' : '') + '! +' + pts + ' for ' + esc(guide.names[cur.guide]) + ' and ' + esc(guide.names[cur.seeker]) + '.'; cur.sayCls = 'ok';
      ctryEl(id).classList.add('good'); dropMoku(id); setHint(''); sfx.good();
    } else {
      cur.wrong++; flash(id, 'wrong'); sfx.bad();
      if (cur.shown < cur.picked.length) { cur.shown++; cur.say = 'Not ' + esc(COUNTRIES[id].name) + '. Next clue!'; cur.sayCls = 'bad'; }
      else if (cur.wrong >= cur.picked.length + 2) {
        cur.done = true; cur.ok = false; mapHandler = null; setTappable(false);
        cur.say = 'No points this time — what clue would make it easier?'; cur.sayCls = '';
        ctryEl(cur.id).classList.add('good'); dropMoku(cur.id); setHint('');
      } else { cur.say = 'Not ' + esc(COUNTRIES[id].name) + '. Think again!'; cur.sayCls = 'bad'; }
    }
    renderSeek();
  }
  function endGuide() {
    progress.guideGames++; save();
    clearMap(); setLabels(ORDER);
    var top = Math.max.apply(null, guide.pts);
    var winners = guide.names.filter(function (n, i) { return guide.pts[i] === top; });
    sfx.fanfare();
    fresh = true;
    setPanel('<div class="postcard"><div class="pcHead">' + avatar() + '<div><h2>' + (winners.length > 1 ? 'A tie! Great guides!' : esc(winners[0]) + ' wins!') + '</h2><p>Good guides tell what makes a country special.</p></div></div>' +
      '<div class="score">' + guide.names.map(function (n, i) { return { n: n, p: guide.pts[i] }; }).sort(function (a, b) { return b.p - a.p; })
        .map(function (o) { return '<div class="' + (o.p === top ? 'lead' : '') + '"><span>' + (o.p === top ? '👑 ' : '') + esc(o.n) + '</span><span>' + o.p + ' pts</span></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="btn primary" id="gAgain">🗣️ Play again</button><button class="btn" id="gMenu">Menu</button></div></div>');
    $('topInfo').textContent = '';
    $('gAgain').addEventListener('click', function () { sfx.tap(); beginGuide(guide.names); });
    $('gMenu').addEventListener('click', function () { sfx.tap(); showTitle(); });
  }

  // =====================================================================
  // 📕 Passport
  // =====================================================================
  function openPassport(sel) {
    showPlay('📕 My Passport');
    var known = knownIds();
    setLabels(known);
    $('topInfo').textContent = known.length + '/11';
    setTappable(true);
    mapHandler = function (id) { if (progress.found[id]) { sfx.tap(); draw(id); } };
    setHint(known.length ? 'Tap a country you found' : '');
    function draw(open) {
      clearMap(); setLabels(known); setTappable(true);
      forCtry(function (el, id) { el.classList.toggle('dim', !progress.found[id]); });
      if (open) { ctryEl(open).classList.add('hl'); dropMoku(open); }
      var h = '<div class="postcard"><div class="pcHead">' + avatar() + '<div><h2>My Passport</h2><p>' + known.length + ' / 11 countries · 🔖 ' + progress.totalStamps + ' stamps' + (progress.twinBest ? ' · ⚖️ best ' + progress.twinBest + '/8' : '') + '</p></div></div>' +
        '<div class="stampGrid">' + ORDER.map(function (id) {
          if (!progress.found[id]) return '<div class="sg"><div class="q">?</div><span>???</span><small>not found</small></div>';
          return '<button class="sg got" data-c="' + id + '">' + (progress.master[id] ? '<span class="star">⭐</span>' : '') + flagSVG(id) + '<span>' + esc(COUNTRIES[id].name) + '</span><small>🔖 ' + (progress.stamps[id] | 0) + '</small></button>';
        }).join('') + '</div>' +
        (known.length ? '' : '<div class="say">Your Passport is empty. Go to Postcards and find Moku!</div>') +
        '<div class="tip">⭐ = found with just one clue</div></div>' +
        (open ? passportHTML(open) : '');
      setPanel(h);
      panel.querySelectorAll('.sg[data-c]').forEach(function (b) { b.addEventListener('click', function () { sfx.tap(); draw(b.getAttribute('data-c')); var pp = panel.querySelector('.pp'); if (pp) pp.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
      if (!open) setHint(known.length ? 'Tap a country you found' : '');
    }
    fresh = true;
    draw(sel);
  }

  // ---------- start ----------
  buildMaps();
  syncSoundBtn();
  renderOutfit();
  $('goPost').addEventListener('click', function () { sfx.tap(); startTrip(); });
  $('goTwin').addEventListener('click', function () { sfx.tap(); startTwin(); });
  $('goGuide').addEventListener('click', function () { sfx.tap(); startGuideSetup(); });
  $('goPass').addEventListener('click', function () { sfx.tap(); openPassport(); });
  window.addEventListener('moku:moint', function () { if (!mode) showTitle(); });
  showTitle();
  // 開発用: ?screen=post|twin|guide|pass で直接開く(スクリーンショット用)
  try {
    var scr = new URLSearchParams(location.search).get('screen');
    if (scr === 'post') startTrip(); else if (scr === 'twin') startTwin(); else if (scr === 'guide') startGuideSetup(); else if (scr === 'pass') openPassport();
  } catch (e) {}
})();
</script>
</body>
</html>
