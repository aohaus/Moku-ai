<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MOKU BENTO - Cozy Kitchen Rush | Moku Series</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg-top: #1A1325;
  --bg-bottom: #0D0A14;
  --container-border: rgba(255, 184, 108, 0.28);
  --accent-orange: #FF9F43;
  --accent-gold: #FFC94A;
  --accent-mint: #6EE7A8;
  --accent-pink: #FF6B97;
  --bento-wood: #D29054;
  --bento-dark: #382216;
  --text-main: #EDEEF6;
  --text-muted: rgba(237, 238, 246, 0.65);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: radial-gradient(circle at 50% 25%, #251B35 0%, var(--bg-top) 50%, var(--bg-bottom) 100%);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

#bento-wrapper {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100vh;
  height: 100dvh;
  max-height: 880px;
  display: flex;
  flex-direction: column;
  padding: 10px 14px 16px;
  z-index: 2;
  justify-content: space-between;
  transition: max-width 0.2s ease;
}

.bento-main-layout {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-height: 0;
  justify-content: space-between;
}

.bento-left-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bento-right-col {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Header Bar */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 10;
}

.hub-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  backdrop-filter: blur(8px);
  transition: all 0.15s ease;
}
.hub-link:active {
  transform: scale(0.96);
  background: rgba(255, 255, 255, 0.16);
}

.stats-pill {
  background: rgba(255, 159, 67, 0.12);
  border: 1px solid rgba(255, 159, 67, 0.35);
  border-radius: 14px;
  padding: 4px 14px;
  text-align: center;
}
.stats-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 800;
}
.stats-value {
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #FFF;
  line-height: 1.1;
}

.header-actions {
  display: flex;
  gap: 6px;
}
.action-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--text-main);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}
.action-btn:active {
  transform: scale(0.92);
}

/* Customer Ticket Bar */
.order-area {
  background: rgba(255, 255, 255, 0.06);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  padding: 12px 14px;
  position: relative;
  backdrop-filter: blur(12px);
  margin-top: 6px;
}

.customer-info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.customer-avatar {
  font-size: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.customer-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--accent-gold);
}

.timer-bar-container {
  width: 100%;
  height: 7px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 12px;
}
.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6EE7A8, #FFC94A, #FF6B97);
  border-radius: 999px;
  transition: width 0.1s linear, background-color 0.3s ease;
}

.target-bento-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(18, 14, 28, 0.85);
  border: 2px dashed rgba(255, 201, 74, 0.5);
  border-radius: 16px;
  padding: 10px 14px;
  min-height: 64px;
}
.target-item-badge {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 24px;
  min-width: 48px;
  position: relative;
  animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.target-item-name {
  font-size: 9px;
  font-weight: 800;
  color: var(--text-muted);
  margin-top: 2px;
}
.target-item-badge.matched {
  border-color: #6EE7A8;
  background: rgba(110, 231, 168, 0.18);
  filter: drop-shadow(0 0 8px rgba(110, 231, 168, 0.4));
}
.target-item-badge.matched::after {
  content: '✓';
  position: absolute;
  top: -6px;
  right: -6px;
  background: #6EE7A8;
  color: #0F0C20;
  font-size: 10px;
  font-weight: 900;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* User's Bento Box Table */
.bento-tray-section {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

.bento-box {
  width: 100%;
  max-width: 380px;
  background: linear-gradient(135deg, #4A2B18 0%, #2A170C 100%);
  border: 4px solid var(--bento-wood);
  border-radius: 24px;
  padding: 12px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.15);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  min-height: 90px;
}
.bento-slot {
  background: rgba(20, 12, 6, 0.7);
  border: 1.5px dashed rgba(210, 144, 84, 0.35);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  height: 72px;
  position: relative;
  transition: all 0.15s ease;
}
.bento-slot.filled {
  border-style: solid;
  border-color: rgba(255, 201, 74, 0.6);
  background: rgba(255, 201, 74, 0.12);
  animation: bouncePop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.bento-actions-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  width: 100%;
  max-width: 380px;
}
.btn-serve {
  flex: 2;
  background: linear-gradient(135deg, #6EE7A8, #34D399);
  color: #0A1C12;
  border: none;
  padding: 12px 18px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(110, 231, 168, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.12s ease;
}
.btn-serve:active { transform: scale(0.96); }
.btn-clear {
  flex: 1;
  background: rgba(255, 255, 255, 0.08);
  border: 1.5px solid rgba(255, 255, 255, 0.16);
  color: var(--text-main);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.btn-clear:active { transform: scale(0.96); }

/* Kitchen Pantry / Ingredient Buttons */
.pantry-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
}
.ingredient-btn {
  background: rgba(255, 255, 255, 0.07);
  border: 1.5px solid rgba(255, 255, 255, 0.16);
  border-radius: 16px;
  padding: 10px 4px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.12s ease;
  backdrop-filter: blur(8px);
}
.ingredient-btn:active {
  transform: scale(0.92);
  background: rgba(255, 201, 74, 0.25);
  border-color: #FFC94A;
}
.ingredient-emoji {
  font-size: 26px;
  line-height: 1;
  margin-bottom: 4px;
}
.ingredient-name {
  font-size: 10px;
  font-weight: 800;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Modals */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(13, 10, 20, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
  border-radius: 20px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-title {
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 32px;
  font-weight: 800;
  color: #FFF;
  margin-bottom: 6px;
}
.modal-title .accent { color: var(--accent-orange); }

.modal-sub {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 20px;
  max-width: 280px;
  line-height: 1.5;
}

.modal-score-card {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 16px;
  padding: 14px 24px;
  width: 100%;
  max-width: 260px;
  margin-bottom: 20px;
}
.modal-score-val {
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 36px;
  font-weight: 800;
  color: var(--accent-mint);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(135deg, #FF9F43, #FF6B97);
  border: none;
  color: #FFF;
  font-size: 16px;
  font-weight: 800;
  padding: 14px 32px;
  border-radius: 999px;
  box-shadow: 0 6px 20px rgba(255, 159, 67, 0.45);
  cursor: pointer;
  width: 100%;
  max-width: 240px;
}
.btn-primary:active { transform: scale(0.96); }

/* Confetti & Floating Floating Points */
.floating-score {
  position: absolute;
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: #6EE7A8;
  pointer-events: none;
  animation: floatUp 0.8s ease-out forwards;
  z-index: 50;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes bouncePop {
  0% { transform: scale(0.8); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
}

/* Tablet & iPad Pro / Landscape mode */
@media (min-width: 768px), (orientation: landscape) and (min-width: 560px) {
  #bento-wrapper {
    max-width: 1040px;
    width: 95%;
    max-height: 92vh;
    padding: 12px 24px;
    gap: 10px;
  }
  .bento-main-layout {
    flex-direction: row;
    align-items: stretch;
    gap: 20px;
    margin-top: 4px;
  }
  .bento-left-col {
    flex: 1.15;
    justify-content: space-between;
    gap: 12px;
  }
  .bento-right-col {
    flex: 1;
    justify-content: center;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .pantry-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .ingredient-btn {
    padding: 14px 6px 12px;
    border-radius: 18px;
    min-height: 80px;
  }
  .ingredient-emoji {
    font-size: 32px;
    margin-bottom: 6px;
  }
  .ingredient-name {
    font-size: 11.5px;
  }
  .bento-box {
    max-width: 100%;
    min-height: 96px;
    gap: 10px;
    padding: 12px;
  }
  .bento-slot {
    height: 76px;
    font-size: 34px;
  }
  .bento-actions-row {
    max-width: 100%;
    margin-top: 8px;
  }
  .btn-serve {
    font-size: 16px;
    padding: 12px 20px;
  }
}

/* Compact Landscape on iPhones (e.g. height <= 500px) */
@media (max-height: 500px) and (orientation: landscape) {
  #bento-wrapper {
    max-height: 98vh;
    padding: 4px 14px;
    gap: 2px;
  }
  .game-header {
    padding: 0;
    gap: 4px;
  }
  .stats-pill {
    padding: 2px 8px;
    border-radius: 10px;
  }
  .stats-value {
    font-size: 15px;
  }
  .order-area {
    padding: 6px 10px;
    margin-top: 0;
    border-radius: 14px;
  }
  .customer-info-row {
    margin-bottom: 4px;
  }
  .customer-avatar {
    font-size: 18px;
    gap: 4px;
  }
  .customer-name {
    font-size: 11px;
  }
  .timer-bar-container {
    height: 5px;
    margin-bottom: 6px;
  }
  .target-bento-display {
    min-height: 42px;
    padding: 4px 8px;
    border-radius: 12px;
    gap: 6px;
  }
  .target-item-badge {
    padding: 2px 6px;
    font-size: 18px;
    min-width: 36px;
    border-radius: 8px;
  }
  .target-item-name {
    font-size: 8px;
  }
  .bento-tray-section {
    padding: 4px 0 0;
  }
  .bento-box {
    min-height: 56px;
    padding: 6px;
    gap: 6px;
    border-radius: 16px;
  }
  .bento-slot {
    height: 48px;
    font-size: 22px;
    border-radius: 10px;
  }
  .bento-actions-row {
    margin-top: 4px;
    gap: 6px;
  }
  .btn-serve {
    padding: 8px 10px;
    font-size: 12px;
    border-radius: 10px;
  }
  .btn-clear {
    padding: 8px 8px;
    font-size: 11px;
    border-radius: 10px;
  }
  .bento-right-col {
    padding: 6px;
    border-radius: 14px;
  }
  .pantry-grid {
    gap: 4px;
  }
  .ingredient-btn {
    padding: 4px 2px 3px;
    border-radius: 10px;
    min-height: 52px;
  }
  .ingredient-emoji {
    font-size: 20px;
    margin-bottom: 2px;
  }
  .ingredient-name {
    font-size: 8.5px;
  }
}
</style>
</head>
<body>

<div id="bento-wrapper">
  <!-- Top Bar -->
  <div class="game-header">
    <a href="hub.html" class="hub-link" id="backToHubBtn" aria-label="Return to Moku Series Hub">
      <span>◀ Hub</span>
    </a>
    
    <div class="stats-pill">
      <div class="stats-label">Score</div>
      <div class="stats-value" id="currentScore">0</div>
    </div>

    <div class="stats-pill">
      <div class="stats-label">Streak</div>
      <div class="stats-value" id="comboStreak" style="color: var(--accent-gold);">0🔥</div>
    </div>

    <div class="header-actions">
      <button class="action-btn" id="soundToggleBtn" aria-label="Toggle Sound">🔊</button>
      <button class="action-btn" id="restartBtn" aria-label="Restart Game">🔄</button>
    </div>
  </div>

  <div class="bento-main-layout">
    <!-- Left Column: Order Area & Preparation Board -->
    <div class="bento-left-col">
      <!-- Customer Order Area -->
      <div class="order-area">
        <div class="customer-info-row">
          <div class="customer-avatar">
            <span id="custEmoji">🦉</span>
            <span class="customer-name" id="custName">Owl Chef Order</span>
          </div>
          <span style="font-size: 11px; font-weight: 800; color: var(--accent-mint);" id="roundBadge">Order #1</span>
        </div>

        <!-- Timer Countdown Bar -->
        <div class="timer-bar-container">
          <div class="timer-bar-fill" id="timerBar"></div>
        </div>

        <!-- Target Bento Preview -->
        <div class="target-bento-display" id="targetDisplay"></div>
      </div>

      <!-- User's Bento Box (Preparation Board) -->
      <div class="bento-tray-section">
        <div class="bento-box" id="userBentoBox">
          <div class="bento-slot" data-index="0"></div>
          <div class="bento-slot" data-index="1"></div>
          <div class="bento-slot" data-index="2"></div>
          <div class="bento-slot" data-index="3"></div>
        </div>

        <div class="bento-actions-row">
          <button class="btn-serve" id="serveBtn">
            <span>🍱</span>
            <span>SERVE BENTO!</span>
          </button>
          <button class="btn-clear" id="clearBtn">Clear</button>
        </div>
      </div>
    </div>

    <!-- Right Column: Ingredients Pantry Grid -->
    <div class="bento-right-col">
      <div class="pantry-grid" id="pantryGrid">
        <button class="ingredient-btn" data-item="onigiri">
          <span class="ingredient-emoji">🍙</span>
          <span class="ingredient-name">Onigiri</span>
        </button>
        <button class="ingredient-btn" data-item="tamago">
          <span class="ingredient-emoji">🍳</span>
          <span class="ingredient-name">Tamago</span>
        </button>
        <button class="ingredient-btn" data-item="shrimp">
          <span class="ingredient-emoji">🍤</span>
          <span class="ingredient-name">Tempura</span>
        </button>
        <button class="ingredient-btn" data-item="salmon">
          <span class="ingredient-emoji">🍣</span>
          <span class="ingredient-name">Salmon</span>
        </button>
        <button class="ingredient-btn" data-item="dumpling">
          <span class="ingredient-emoji">🥟</span>
          <span class="ingredient-name">Gyoza</span>
        </button>
        <button class="ingredient-btn" data-item="matcha">
          <span class="ingredient-emoji">🍡</span>
          <span class="ingredient-name">Dango</span>
        </button>
        <button class="ingredient-btn" data-item="salad">
          <span class="ingredient-emoji">🥗</span>
          <span class="ingredient-name">Edamame</span>
        </button>
        <button class="ingredient-btn" data-item="star">
          <span class="ingredient-emoji">⭐</span>
          <span class="ingredient-name">Star Moku</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameOverModal" class="modal-overlay">
    <div class="modal-title">KITCHEN <span class="accent">CLOSED!</span></div>
    <div class="modal-sub">Time ran out on the order! Wonderful bento service today.</div>
    <div class="modal-score-card">
      <div class="stats-label">Final Score</div>
      <div class="modal-score-val" id="finalScoreVal">0</div>
      <div class="stats-label" id="newBestLabel" style="color: var(--accent-gold); margin-top: 4px; display: none;">★ NEW HIGH SCORE! ★</div>
    </div>
    <button class="btn-primary" id="playAgainBtn">▶ Play Again</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // --- AUDIO SYNTHESIZER ---
  var audioCtx = null;
  var soundEnabled = true;

  function getAudioContext() {
    if (!audioCtx) {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      var ctx = getAudioContext();
      if (!ctx) return;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      var now = ctx.currentTime;

      if (type === 'tap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(783, now + 0.16);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    } catch(e) {}
  }

  // --- INGREDIENTS DICTIONARY ---
  var INGREDIENTS = {
    onigiri: { emoji: '🍙', name: 'Onigiri' },
    tamago: { emoji: '🍳', name: 'Tamago' },
    shrimp: { emoji: '🍤', name: 'Tempura' },
    salmon: { emoji: '🍣', name: 'Salmon' },
    dumpling: { emoji: '🥟', name: 'Gyoza' },
    matcha: { emoji: '🍡', name: 'Dango' },
    salad: { emoji: '🥗', name: 'Edamame' },
    star: { emoji: '⭐', name: 'Star Moku' }
  };
  var INGREDIENT_KEYS = Object.keys(INGREDIENTS);

  var CUSTOMERS = [
    { emoji: '🦉', name: 'Owl Moku' },
    { emoji: '🦊', name: 'Forest Kitsune' },
    { emoji: '🐼', name: 'Panda Sensei' },
    { emoji: '🐰', name: 'Usagi Bunny' },
    { emoji: '🐻', name: 'Kuma Bear' },
    { emoji: '🐱', name: 'Neko Cat' },
    { emoji: '👑', name: 'King Moku' }
  ];

  // --- STATE ---
  var currentScore = 0;
  var bestScore = parseInt(localStorage.getItem('moku_bento_best') || '0', 10);
  var streak = 0;
  var orderCount = 0;
  var isGameOver = false;

  var currentTargetOrder = [];
  var currentUserBento = [];
  var maxSlots = 3; // Starts at 3, expands to 4 as level rises

  var orderTimeLimit = 9.0; // seconds
  var orderTimeLeft = 9.0;
  var timerInterval = null;

  // DOM Elements
  var targetDisplay = document.getElementById('targetDisplay');
  var userSlots = document.querySelectorAll('.bento-slot');
  var timerBar = document.getElementById('timerBar');
  var scoreEl = document.getElementById('currentScore');
  var streakEl = document.getElementById('comboStreak');
  var custEmoji = document.getElementById('custEmoji');
  var custName = document.getElementById('custName');
  var roundBadge = document.getElementById('roundBadge');

  // --- GENERATE NEW ORDER ---
  function nextOrder() {
    if (isGameOver) return;
    orderCount++;
    if (roundBadge) roundBadge.textContent = 'Order #' + orderCount;

    var cust = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
    if (custEmoji) custEmoji.textContent = cust.emoji;
    if (custName) custName.textContent = cust.name;

    // Difficulty scaling: order length & speed
    maxSlots = (orderCount >= 6) ? 4 : 3;
    var timeBase = (orderCount >= 10) ? 6.5 : (orderCount >= 5 ? 7.5 : 9.0);
    orderTimeLimit = Math.max(4.5, timeBase);
    orderTimeLeft = orderTimeLimit;

    // Pick random items
    currentTargetOrder = [];
    for (var i = 0; i < maxSlots; i++) {
      var k = INGREDIENT_KEYS[Math.floor(Math.random() * INGREDIENT_KEYS.length)];
      currentTargetOrder.push(k);
    }

    renderTargetOrder();
    clearUserBento();
    startTimer();
  }

  function renderTargetOrder() {
    targetDisplay.innerHTML = '';
    currentTargetOrder.forEach(function(itemKey, idx) {
      var info = INGREDIENTS[itemKey];
      var badge = document.createElement('div');
      badge.className = 'target-item-badge';
      badge.id = 'targetItem_' + idx;
      badge.innerHTML = '<span>' + info.emoji + '</span><span class="target-item-name">' + info.name + '</span>';
      targetDisplay.appendChild(badge);
    });
  }

  function updateMatchHighlights() {
    currentTargetOrder.forEach(function(itemKey, idx) {
      var badge = document.getElementById('targetItem_' + idx);
      if (badge) {
        if (currentUserBento[idx] === itemKey) {
          badge.classList.add('matched');
        } else {
          badge.classList.remove('matched');
        }
      }
    });
  }

  // --- USER BENTO ACTIONS ---
  function addIngredient(key) {
    if (currentUserBento.length >= maxSlots || isGameOver) return;
    currentUserBento.push(key);
    playSound('tap');
    renderUserBento();
    updateMatchHighlights();

    // Auto-serve if full and matches completely
    if (currentUserBento.length === maxSlots && isExactMatch()) {
      setTimeout(serveBento, 120);
    }
  }

  function clearUserBento() {
    currentUserBento = [];
    renderUserBento();
    updateMatchHighlights();
  }

  function renderUserBento() {
    userSlots.forEach(function(slot, idx) {
      if (idx < maxSlots) {
        slot.style.display = 'flex';
        var itemKey = currentUserBento[idx];
        if (itemKey) {
          slot.textContent = INGREDIENTS[itemKey].emoji;
          slot.classList.add('filled');
        } else {
          slot.textContent = '';
          slot.classList.remove('filled');
        }
      } else {
        slot.style.display = 'none';
      }
    });
  }

  function isExactMatch() {
    if (currentUserBento.length !== currentTargetOrder.length) return false;
    for (var i = 0; i < currentTargetOrder.length; i++) {
      if (currentUserBento[i] !== currentTargetOrder[i]) return false;
    }
    return true;
  }

  function showFloatingScore(text, x, y) {
    var floatEl = document.createElement('div');
    floatEl.className = 'floating-score';
    floatEl.textContent = text;
    floatEl.style.left = (x || window.innerWidth / 2 - 40) + 'px';
    floatEl.style.top = (y || 200) + 'px';
    document.body.appendChild(floatEl);
    setTimeout(function() {
      if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
    }, 850);
  }

  function serveBento() {
    if (isGameOver) return;

    if (isExactMatch()) {
      // Perfect match!
      streak++;
      var bonus = Math.round(orderTimeLeft * 10);
      var pts = (100 * maxSlots + bonus) * (streak > 1 ? 1 + streak * 0.2 : 1);
      pts = Math.round(pts);
      currentScore += pts;
      scoreEl.textContent = currentScore;
      streakEl.textContent = streak + '🔥';

      if (currentScore > bestScore) {
        bestScore = currentScore;
        localStorage.setItem('moku_bento_best', bestScore);
      }

      playSound('success');
      showFloatingScore('+' + pts + ' PERFECT!', window.innerWidth / 2 - 50, 180);
      clearInterval(timerInterval);
      setTimeout(nextOrder, 350);
    } else {
      // Mistake!
      streak = 0;
      streakEl.textContent = '0🔥';
      playSound('fail');
      showFloatingScore('OOPS!', window.innerWidth / 2 - 30, 180);
      clearUserBento();
    }
  }

  // --- TIMER LOOP ---
  function startTimer() {
    clearInterval(timerInterval);
    var startTime = Date.now();

    timerInterval = setInterval(function() {
      var elapsed = (Date.now() - startTime) / 1000;
      orderTimeLeft = Math.max(0, orderTimeLimit - elapsed);
      var pct = (orderTimeLeft / orderTimeLimit) * 100;
      if (timerBar) timerBar.style.width = pct + '%';

      if (orderTimeLeft <= 0) {
        clearInterval(timerInterval);
        triggerGameOver();
      }
    }, 50);
  }

  // --- GAME OVER ---
  function triggerGameOver() {
    isGameOver = true;
    playSound('fail');

    var modal = document.getElementById('gameOverModal');
    var finalVal = document.getElementById('finalScoreVal');
    var newBest = document.getElementById('newBestLabel');

    if (finalVal) finalVal.textContent = currentScore;
    if (newBest) newBest.style.display = (currentScore >= bestScore && currentScore > 0) ? 'block' : 'none';
    if (modal) modal.classList.add('active');

    try {
      var total = parseInt(localStorage.getItem('moku_total_played') || '0', 10) + 1;
      localStorage.setItem('moku_total_played', total);
    } catch(e) {}
  }

  function resetGame() {
    currentScore = 0;
    streak = 0;
    orderCount = 0;
    isGameOver = false;

    if (scoreEl) scoreEl.textContent = '0';
    if (streakEl) streakEl.textContent = '0🔥';

    var modal = document.getElementById('gameOverModal');
    if (modal) modal.classList.remove('active');

    nextOrder();
  }

  // Event Listeners
  document.querySelectorAll('.ingredient-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.getAttribute('data-item');
      addIngredient(key);
    });
  });

  var serveBtn = document.getElementById('serveBtn');
  if (serveBtn) serveBtn.addEventListener('click', serveBento);

  var clearBtn = document.getElementById('clearBtn');
  if (clearBtn) clearBtn.addEventListener('click', clearUserBento);

  var restartBtn = document.getElementById('restartBtn');
  if (restartBtn) restartBtn.addEventListener('click', resetGame);

  var playAgainBtn = document.getElementById('playAgainBtn');
  if (playAgainBtn) playAgainBtn.addEventListener('click', resetGame);

  var soundBtn = document.getElementById('soundToggleBtn');
  if (soundBtn) {
    soundBtn.addEventListener('click', function() {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    });
  }

  // Start game
  nextOrder();

})();
</script>
</body>
</html>
