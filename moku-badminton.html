<!--
  Moku Badminton(2026-11-26〜、MVP を作っている途中。ハブにはまだ出していない)
  ダブルスのバドミントン。遊んでいる子ども自身が「YOU」としてシリーズで初めてキャラとして出てきて、
  Moku(CPU)とペアを組み、Moku Fight のライバル Kon & Ponta と戦う。
  子どもたちと決めたこと(2026-11-26):
  - 主人公は遊んでいる子ども(YOU)。味方は Moku。
  - 操作: 走るのは自動、打つのはショットのボタン(Smash / Clear / Drop / Net)。ボタンが光った時に押す。
    押したタイミングで Perfect / Good / Late。スティックで自分で走る「Pro」はあとで足す。
  - 画面: まずは 2D(横から少し見下ろす)。シャトルと選手は 3D の座標(x = コートの長さ方向・y = 高さ・z = 幅)で
    計算し、絵を描くところだけが 2D。3D にする時は描くところだけを Three.js に差しかえる。
  - 会場は The Hollow の森の体育館。
  2026-11-27 に v0.1.0 を遊んだ保護者の声で変えたこと(v0.2.0):
  - YOU と Moku は後ろ姿(顔を無理に見せない。横からの顔は少し違和感があった)。Moku は横幅そのままで高さを約 7 割に。
  - 難易度は選ばない。Moku Fight 風に、勝つと次のもっと強いペアが開く(STAGES):
    ① Kon & Ponta → ② Chef Rat & Ninja Rat → ③ Moyo & Nox → ④ Goro & Koro(Final)。
  - ルールは新しい 15 点制の1ゲームだけ(14-14 からは2点差、21 点で終わり)。サーブのコートは本物どおり。
  作る順番: ①コートとシャトル ②自動で走る・ボタン ③ルール ④CPU ⑤キャラを作る画面・タイトル・結果 ⑥ハブ・SPEC。
  v0.1.0 は ①〜④ と仮のタイトル・結果(子どもたちにスマホで手ざわりを試してもらう版)。
  セーブ: moku:moku-badminton:progress / moku:moku-badminton:settings
-->
<style>
:root { --hi:#4FA3E0; --lo:#1E4A75; --ink:#4A2E1A; --paper:#FFF6E6;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#E8B97A; }
body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
canvas { display:block; position:fixed; inset:0; width:100vw; height:100vh; touch-action:none; }
button { font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

/* ── Moku Series 共通(SPEC.md §4・§5): タイトル画面だけの枠・ハブへのリンク・バージョン ── */
#title-frame { position:fixed; inset:14px; border:3px solid var(--hi); border-radius:10px; pointer-events:none; z-index:710; }
#title-frame::after { content:''; position:absolute; inset:5px; border:1px solid var(--lo); border-radius:8px; }
#hub-link { position:fixed; top:calc(22px + var(--sat)); right:calc(26px + var(--sar)); z-index:720; color:var(--hi);
  font-weight:800; font-size:13px; text-decoration:none; letter-spacing:.02em; animation:hubPulse 2.2s ease-in-out infinite;
  text-shadow:0 1px 2px rgba(74,46,26,.5); }
@keyframes hubPulse { 0%,100%{opacity:.75} 50%{opacity:1} }
#buildInfo { position:fixed; left:calc(24px + var(--sal)); bottom:calc(20px + var(--sab)); z-index:720;
  color:rgba(255,255,255,.28); font-size:10.5px; pointer-events:none; }
body:not(.on-title) #title-frame, body:not(.on-title) #hub-link, body:not(.on-title) #buildInfo { display:none; }

/* ── 紙のカード(タイトル・一時停止・結果) ── */
.overlay { position:fixed; inset:0; z-index:600; display:none; align-items:center; justify-content:center;
  padding:calc(var(--sat) + 30px) calc(var(--sar) + 30px) calc(var(--sab) + 30px) calc(var(--sal) + 30px); }
.overlay.show { display:flex; }
.overlay.dim { background:rgba(74,46,26,.35); }
.card { background:var(--paper); border:3px solid var(--ink); border-radius:18px; padding:16px 26px 14px;
  box-shadow:0 6px 0 rgba(74,46,26,.35), 0 14px 30px rgba(0,0,0,.25); text-align:center; max-height:100%; overflow-y:auto; }
.logo { font-size:30px; font-weight:800; letter-spacing:.02em; line-height:1.05; }
.logo span { color:var(--hi); -webkit-text-stroke:1px var(--ink); }
.sub { font-size:13px; font-weight:700; opacity:.75; margin:4px 0 10px; }
.opt { display:flex; align-items:center; justify-content:center; gap:6px; margin:5px 0; }
.opt > span { font-size:12px; font-weight:800; width:58px; text-align:right; opacity:.75; }
.opt button { border:2px solid var(--ink); background:#fff; color:var(--ink); font-weight:800; font-size:13px;
  border-radius:999px; padding:4px 12px; }
.opt button.on { background:var(--hi); color:#fff; }
.titleMenu { display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:10px; }
.titleMenuItem { font-size:19px; font-weight:800; padding:8px 18px; border:3px solid var(--ink); border-radius:14px;
  background:linear-gradient(#6FBDF0,#3E8FCC); color:#fff; min-width:190px; box-shadow:0 4px 0 var(--ink);
  text-shadow:0 1px 0 rgba(0,0,0,.25); }
.titleMenuItem:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.titleMenuItem.plain { background:#fff; color:var(--ink); text-shadow:none; }
.how { font-size:11.5px; font-weight:700; opacity:.7; margin-top:9px; line-height:1.35; }
#ladder { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:2px 0 6px; }
.rival { border:2px solid var(--ink); background:#fff; border-radius:12px; padding:5px 8px; text-align:left; color:var(--ink);
  display:flex; align-items:center; gap:7px; min-width:0; }
.rival .n { flex:none; width:22px; height:22px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center; }
.rival .t { min-width:0; } .rival .nm { font-size:12.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rival .st { font-size:10.5px; font-weight:700; opacity:.7; }
.rival.on { background:var(--hi); color:#fff; } .rival.on .n { color:var(--ink); } .rival.on .st { opacity:.9; }
.rival.locked { border-style:dashed; opacity:.55; cursor:default; }
#resultSub b { color:var(--lo); }
#resultTitle { font-size:28px; font-weight:800; }
#resultScore { font-size:40px; font-weight:800; margin:2px 0; letter-spacing:.04em; }
#resultSub { font-size:13px; font-weight:700; opacity:.75; }

/* ── HUD ── */
#hud { position:fixed; top:calc(8px + var(--sat)); left:0; right:0; z-index:300; pointer-events:none; display:none; }
body.playing #hud { display:block; }
#board { margin:0 auto; width:max-content; display:flex; align-items:center; gap:10px; background:var(--paper);
  border:3px solid var(--ink); border-radius:999px; padding:3px 14px; font-weight:800; font-size:13px;
  box-shadow:0 3px 0 rgba(74,46,26,.35); }
#board .num { font-size:22px; min-width:28px; text-align:center; }
#board .team { opacity:.8; letter-spacing:.02em; }
#board .srv { width:14px; text-align:center; font-size:12px; }
#rally { text-align:center; margin-top:4px; font-size:12px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(74,46,26,.8);
  height:16px; }
#pauseBtn { position:fixed; top:calc(10px + var(--sat)); left:calc(12px + var(--sal)); z-index:310; display:none;
  width:40px; height:40px; border-radius:12px; border:3px solid var(--ink); background:var(--paper); font-size:15px; font-weight:800; color:var(--ink); }
body.playing #pauseBtn { display:block; }

/* ── ショットのボタン(右の列) ── */
#shots, #serves { position:fixed; right:calc(10px + var(--sar)); top:50%; transform:translateY(-50%); z-index:320;
  display:none; flex-direction:column; gap:9px; }
body.playing #shots { display:flex; }
body.playing.serving #shots { display:none; }
body.playing.serving.you-serve #serves { display:flex; }
.shot { position:relative; width:68px; height:62px; border-radius:16px; border:3px solid var(--ink); background:rgba(255,246,230,.92);
  color:var(--ink); font-size:11px; font-weight:800; letter-spacing:.03em; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:1px; box-shadow:0 3px 0 rgba(74,46,26,.45); transition:transform .08s, background .12s, opacity .12s;
  touch-action:manipulation; }
.shot svg { width:40px; height:26px; }
.shot .key { position:absolute; top:2px; right:5px; font-size:9px; opacity:.45; display:none; }
@media (hover:hover) and (pointer:fine) { .shot .key { display:block; } }
.shot.dim { opacity:.32; }
.shot.soon { border-color:#E0A21B; animation:soon .5s ease-in-out infinite alternate; }
@keyframes soon { from { box-shadow:0 3px 0 rgba(74,46,26,.45), 0 0 0 0 rgba(255,205,70,.0); } to { box-shadow:0 3px 0 rgba(74,46,26,.45), 0 0 0 5px rgba(255,205,70,.55); } }
.shot.ready { background:linear-gradient(#FFE58A,#FFC23D); transform:scale(1.07); animation:none;
  box-shadow:0 3px 0 rgba(74,46,26,.45), 0 0 14px 4px rgba(255,215,90,.9); }
.shot:active, .shot.hit { transform:scale(.94) translateY(2px); }
.serve { width:96px; height:70px; font-size:13px; }
#hint { position:fixed; left:50%; bottom:calc(14px + var(--sab)); transform:translateX(-50%); z-index:310;
  background:rgba(255,246,230,.92); border:2px solid var(--ink); border-radius:999px; padding:4px 14px; font-size:12.5px; font-weight:800;
  display:none; white-space:nowrap; }
#hint.show { display:block; }
#banner { position:fixed; left:0; right:0; top:34%; z-index:330; text-align:center; pointer-events:none; display:none; }
#banner.show { display:block; animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
#banner .big { display:inline-block; font-size:40px; font-weight:800; color:#fff; -webkit-text-stroke:2px var(--ink);
  text-shadow:0 4px 0 var(--ink); letter-spacing:.04em; }
#banner .small { font-size:15px; font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(74,46,26,.9); margin-top:4px; }
@keyframes pop { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }

@media (min-height:600px) {
  .shot { width:82px; height:74px; font-size:12.5px; } .shot svg { width:48px; height:30px; }
  .serve { width:110px; height:82px; font-size:14px; }
  #board { font-size:15px; } #board .num { font-size:26px; }
}
@media (max-height:360px) { .shot { width:60px; height:54px; } .shot svg { height:22px; } #shots, #serves { gap:6px; } }

/* 横向き専用(SPEC.md §4): 縦持ちのスマホ・タブレットでは回転をお願いする */
#rotate-hint { display:none; position:fixed; inset:0; z-index:2000; background:#F3D9A8; color:var(--ink);
  flex-direction:column; align-items:center; justify-content:center; gap:16px; font-size:18px; font-weight:800; text-align:center; padding:24px; }
#rotate-hint span { font-size:56px; animation:rotSpin 1.5s ease-in-out infinite alternate; }
@keyframes rotSpin { from{transform:rotate(-30deg)} to{transform:rotate(60deg)} }
@media (max-width:900px) and (orientation:portrait) {
  #rotate-hint { display:flex; }
  #title-frame, #hub-link, #buildInfo { display:none !important; }
}
</style>

<body class="on-title">
<div id="rotate-hint"><span>📱</span><p>Turn your device sideways to play!</p></div>
<div id="title-frame"></div>
<a id="hub-link" href="hub.html">🦉 Moku Series ▶</a>
<div id="buildInfo">v0.2.1 · Updated Nov 27, 2026</div>

<canvas id="cv"></canvas>

<div id="hud"><div id="board">
  <span class="srv" id="srv0"></span><span class="team">YOU &amp; MOKU</span><span class="num" id="sc0">0</span>
  <span>–</span><span class="num" id="sc1">0</span><span class="team" id="team1">KON &amp; PONTA</span><span class="srv" id="srv1"></span>
</div><div id="rally"></div></div>
<button id="pauseBtn" aria-label="Pause">❚❚</button>

<div id="shots">
  <button class="shot" data-shot="smash"><span class="key">I</span>
    <svg viewBox="0 0 40 26"><path d="M4 4 L34 21" stroke="#E2573C" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M27 21 L35 22 L31 14" stroke="#E2573C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>SMASH</button>
  <button class="shot" data-shot="clear"><span class="key">K</span>
    <svg viewBox="0 0 40 26"><path d="M4 22 Q18 -8 36 20" stroke="#3E8FCC" stroke-width="4" stroke-linecap="round" fill="none"/></svg>CLEAR</button>
  <button class="shot" data-shot="drop"><span class="key">J</span>
    <svg viewBox="0 0 40 26"><path d="M4 8 Q16 2 22 22" stroke="#4E9A4A" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M20 3 L20 23" stroke="#4A2E1A" stroke-width="1.5" stroke-dasharray="2 2"/></svg>DROP</button>
  <button class="shot" data-shot="net"><span class="key">L</span>
    <svg viewBox="0 0 40 26"><path d="M10 20 Q20 6 28 21" stroke="#D99A1E" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M20 9 L20 25" stroke="#4A2E1A" stroke-width="2"/></svg>NET</button>

  <button class="shot serve" data-serve="long"><span class="key">K</span>
    <svg viewBox="0 0 40 26"><path d="M4 22 Q18 -8 36 20" stroke="#3E8FCC" stroke-width="4" stroke-linecap="round" fill="none"/></svg>LONG</button>
</div>
<div id="hint"></div>
<div id="banner"><div class="big" id="bannerBig"></div><div class="small" id="bannerSmall"></div></div>

<div class="overlay show" id="title"><div class="card">

  <div id="ladder"></div>

</div></div>

<div class="overlay dim" id="pause"><div class="card">
  <div class="logo">Paused</div>
  <div class="titleMenu"><button class="titleMenuItem" id="resumeBtn">▶ Resume</button>

</div></div>

<div class="overlay dim" id="result"><div class="card">
  <div id="resultTitle"></div>
  <div id="resultScore"></div>
  <div id="resultSub"></div>
  <div class="titleMenu"><button class="titleMenuItem" id="againBtn">▶ Play Again</button>
  <button class="titleMenuItem plain" id="menuBtn">Menu</button></div>
</div></div>

<script>
(function () {
  'use strict';
  var SAVE_KEY = 'moku:moku-badminton:progress', SET_KEY = 'moku:moku-badminton:settings';
  var TAU = Math.PI * 2, D2R = Math.PI / 180, INK = '#4A2E1A';

  // ── コート(メートル)。x = 長さ方向(ネットが 0、自分たちは x < 0)・y = 高さ・z = 幅(画面の手前が +)──
  var HL = 6.7, HW = 3.05, SW = 2.59, SSL = 1.98, LSL = 5.94, NET_H = 1.55, NET_LOW = 0.79;
  // シャトル: 重力+速さの2乗に比例する空気の抵抗(終端速度 約 6.8 m/s。打った直後は速く、急にブレーキがかかる)
  var GRAV = 9.8, DRAG = 9.8 / (6.8 * 6.8), DT = 1 / 120;
  // 2D の描き方: 横から少し見下ろし、少しななめ(ネットが線にならないように)
  var SHEAR = 0.3, TILT = 0.34, CHAR_SCALE = 1.45;

  // ── 試合のルール(2026-11-27、保護者と決定): 新しい 15 点制の1ゲームだけ。14-14 からは2点差、21 点で終わり ──
  var GAME_TO = 15, GAME_CAP = 21;

  // ── 相手(Moku Fight 風: 勝つと次のもっと強いペアが開く。難易度は選ばない)──
  // 選手ごとの得意(pref)・足の速さの差(spd)・Smash の強さ(sm)
  var RIVALS = {
    kon:   { name: 'KON',       pref: { smash: 0.5, drop: 1.5, clear: 0.9, net: 1.4 }, spd: 0,    sm: 1,    racket: '#7C5CD6' },
    ponta: { name: 'PONTA',     pref: { smash: 1.7, drop: 0.5, clear: 1,   net: 0.6 }, spd: -0.4, sm: 1.12, racket: '#E8862A' },
    chef:  { name: 'CHEF RAT',  pref: { smash: 0.8, drop: 1.2, clear: 1.4, net: 0.6 }, spd: -0.2, sm: 1,    racket: '#D23A3A' },
    ninja: { name: 'NINJA RAT', pref: { smash: 0.8, drop: 1.6, clear: 0.8, net: 1.6 }, spd: 0.2,  sm: 1,    racket: '#262A42' },
    moyo:  { name: 'MOYO',      pref: { smash: 0.6, drop: 0.9, clear: 1.5, net: 1.1 }, spd: -0.1, sm: 0.95, racket: '#3DA890' },
    nox:   { name: 'NOX',       pref: { smash: 1.3, drop: 1.3, clear: 0.8, net: 1   }, spd: 0.35, sm: 1.05, racket: '#FFD54A' },
    goro:  { name: 'GORO',      pref: { smash: 2.2, drop: 0.6, clear: 1,   net: 0.6 }, spd: 0,    sm: 1.2,  racket: '#FFAE00' },
    koro:  { name: 'KORO',      pref: { smash: 0.9, drop: 1.2, clear: 0.9, net: 1.4 }, spd: 0.45, sm: 1,    racket: '#8FD16A' }
  };
  var STAGES = [
    { pair: ['kon', 'ponta'],  speed: 3.4, react: 0.34, q: [0.18, 0.52, 0.30], fault: 0.16, smashMul: 0.78, leave: 0.15 },
    { pair: ['chef', 'ninja'], speed: 3.9, react: 0.28, q: [0.26, 0.54, 0.20], fault: 0.14, smashMul: 0.86, leave: 0.4 },
    { pair: ['moyo', 'nox'],   speed: 4.4, react: 0.22, q: [0.36, 0.52, 0.12], fault: 0.11, smashMul: 0.95, leave: 0.6 },
    { pair: ['goro', 'koro'],  speed: 5.0, react: 0.15, q: [0.50, 0.44, 0.06], fault: 0.09, smashMul: 1.05, leave: 0.85, boss: true }
  ];
  function pairName(i) { return RIVALS[STAGES[i].pair[0]].name + ' & ' + RIVALS[STAGES[i].pair[1]].name; }
  var SPEEDS = { slow: 0.72, normal: 0.9 };
  var settings = { stage: 0, speed: 'slow' };
  try { var st = JSON.parse(localStorage.getItem(SET_KEY) || 'null'); if (st) { if (STAGES[st.stage]) settings.stage = st.stage; if (SPEEDS[st.speed]) settings.speed = st.speed; } } catch (e) {}
  function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) {} }

  // unlocked = 開いている相手の数(1〜4)、beaten = 相手ごとの勝った回数
  var progress = { version: 1, gameId: 'moku-badminton', played: 0, wins: 0, losses: 0, pointsWon: 0, bestRally: 0, unlocked: 1, beaten: {}, updatedAt: null };
  try { var pr = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (pr && pr.version === 1) for (var k in pr) progress[k] = pr[k]; } catch (e) {}
  function saveProgress() { progress.updatedAt = new Date().toISOString(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function sign(v) { return v < 0 ? -1 : 1; }
  function pickW(ws) { var t = 0, i; for (i = 0; i < ws.length; i++) t += ws[i]; var r = Math.random() * t; for (i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; } return ws.length - 1; }

  // ── 音(Web Audio で合成。最初のタップで resume)──
  var actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f0, f1, dur, vol, type, delay) {

      if (shuttle.live) { trailT += rdt; if (trailT > 0.025) { trailT = 0; shuttle.trail.push(shuttle.p.slice()); if (shuttle.trail.length > 9) shuttle.trail.shift(); } }
      else shuttle.trail = [];
      if (hintTimer > 0) { hintTimer -= rdt; if (hintTimer <= 0) hideHint(); }
      var r = document.getElementById('rally'); r.textContent = phase === 'rally' && rally >= 3 ? 'Rally ' + rally : '';
    }
    updateButtons();
    draw(paused ? 0 : rdt);
  }

  syncOpts(); resize();
  window.addEventListener('resize', resize);
  resetMatch(); setupServe();
  requestAnimationFrame(frame);
  // 開発・確認用(ブラウザのコンソールから): 試合の状態を見る
  window.MOKU_BADMINTON = { state: function () { return { phase: phase, score: score.slice(), rally: rally, shuttle: shuttle.p.slice(), assigned: assigned && assigned.id }; }, hit: playerShot };
})();
</script>
