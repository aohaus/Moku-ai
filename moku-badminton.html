<!--
  Moku Badminton(2026-11-26〜、MVP を作っている途中。ハブにはまだ出していない)
  ダブルスのバドミントン。遊んでいる子ども自身が「YOU」としてシリーズで初めてキャラとして出てきて、
  Moku(CPU)とペアを組み、Moku Fight のライバル Kon & Ponta と戦う。
  子どもたちと決めたこと(2026-11-26):
  - 主人公は遊んでいる子ども(YOU)。味方は Moku。
  - 操作: 走るのは自動、打つのはショットのボタン(Smash / Clear / Drop / Net)。ボタンが光った時に押す。
    押したタイミングで Perfect / Good / Late。スティックで自分で走る「Pro」はあとで足す。
  - 画面: まずは 2D(横から少し見下ろす)。シャトルと選手は 3D の座標(x = コートの長さ方向・y = 高さ・z = 幅)で
    計算し、絵を描くところだけが 2D。3D にする時は描くところだけを Three.js に差しかえる。
  - 会場は The Hollow の森の体育館。
  2026-11-27 に v0.1.0 を遊んだ保護者の声で変えたこと(v0.2.0):
  - YOU と Moku は後ろ姿(顔を無理に見せない。横からの顔は少し違和感があった)。Moku は横幅そのままで高さを約 7 割に。
  - 難易度は選ばない。Moku Fight 風に、勝つと次のもっと強いペアが開く(STAGES):
    ① Kon & Ponta → ② Chef Rat & Ninja Rat → ③ Moyo & Nox → ④ Goro & Koro(Final)。
  2026-11-27 の2回目の声で変えたこと(v0.3.0):
  - 画面は動かさない(以前はシャトルが高い時に上へずれた)。高い球を少し低くし、画面の上に出たシャトルは上のはしに印。
    Android の Chrome で下が切れていたのは canvas の 100vh のせい(見えている枠に合わせた)。
  - 速さは選ばない: Match 1〜3 は Slow、4 からは Normal(STAGES の fast)。
  - 試合は東南アジアの大会(Moku Malaysia / Singapore / Thailand / Indonesia Masters)。窓からその街の目じるし
    (ペトロナスツインタワーと KL タワー / マリーナベイ・サンズとフライヤー / ワット・アルン / モナス)がのぞく。
  - ジャンプスマッシュ(v0.4.0、保護者の案): Smash を長押しして離すとジャンプして打つ。金色の輪で離すと最強の一打。
    Smash は押した時ではなく離した時に打つ(短く押すとふつうの Smash)。
  - スタッツ(v0.5.0、おすすめの組み合わせに決定): 最長ラリー・スマッシュの速さ(km/h)・PERFECT の連続・YOU と Moku が決めた点、
    バッジ Shutout(15-0)と Comeback(5 点差から逆転)。結果の画面に NEW RECORD!、タイトルの「📊 Records」で今までの記録。
  - 主審とギャラリー(v0.6.0、保護者の案): ネットの向こうの高いいすにカメの主審。「Love all, play!」・点数(サーブ側が先、0 は love、
    同点は all)・Service over・game point・Game! を英語で読み上げ、点を取った側へ腕をのばす。
    観客の森の仲間は、自分たちの点でバンザイ(ジャンプスマッシュ・エース・10 本以上のラリーは紙ふぶき)、相手の点はやさしく「Ohh…」、
    12 本以上のラリーは拍手。歓声と拍手は Web Audio で合成。
    v0.6.1: 観客はグレー(目立たせない)。大よろこびの声を 8 種類に、動きを2通り(紙ふぶき / ウェーブ)に。
  - 戦術の振り返り(v0.7.0、保護者と決定。ゲームでありつつ戦術眼を鍛える): 結果の画面の「🧠 Review」で最大 5 枚のカード。
    YOU が打つたびに場面を覚え、試合のあとに選べたショットを全部ゲームの物理でためして、相手の余裕がいちばん少ないものを
    ベストとする(タイミングとは分けて、種類の判断だけ)。理由は 5 つのレッスン(Attack the high ball / Not from the back /
    Stay low at the net / Use the space / Serve smart)+ Make them hurry。失点の場面を先に・同じレッスンは1回・1枚はほめる。
    Tactics score(良い判断の割合)を Records に、いちばん多かったミスを次の試合の前に Moku がひとこと。
    v0.7.1: 5 つのレッスンごとにも Tactics score(その場面で良い判断をした割合。クセが分かる)。Review の1枚目と Records に
    バーで出し、いちばん低いレッスン(80% 未満)に「Your habit!」。
  - Tactics Book(v0.8.0): タイトルの「📖 Book」。Review のカードに出たレッスン(6つ)が図鑑のようにたまる(Review に「📖 NEW」)。
    ページごとに、お手本の図(緑 = 正しいショット、赤の点線 = よくあるまちがい)・やり方・合言葉・自分の成績と ⭐
    (⭐ 覚えた / ⭐⭐ 良い判断 10 回以上で 60% 以上 / ⭐⭐⭐ 30 回以上で 80% 以上 = Master)。
    Try it(その場面をもう一度打つ練習)は保留(2026-11-27、保護者)。
  - v0.8.5: NET を HAIRPIN(ネットのすぐ向こうにふわっと。内部の種類は 'net' のまま)と PUSH(ネット前から速く低く相手の横へ
    押し込む。高さ 0.9m 以上の球だけ)に分けた(保護者の依頼)。ボタンは 5 つ。キーは L / O。
  - v0.10.0: ホーム画面を「Moku World Tour」に(保護者の案)。東南アジアの絵本の地図に4つの大会の道すじ(勝った所までは金の実線)、
    勝った所に 🏆、次の所が光り、いまいる所に「🏸 YOU & MOKU」。大会を押すと右に国旗・大会・相手の絵・状態と Play。
    Home のボタンは地図のカードの右上(固定の位置ではなくカードの中)。
  - v0.9.0: ボタンを 4 つに戻した。NET は短く押すと PUSH、長押しで HAIRPIN(PUSH できない低い球は HAIRPIN)。
    Lesson 6〜10 を追加(子どもたちが候補 8 つからおすすめの 5 つに決定): 🔥 Keep attacking / ↕️ Front and back / 🧱 Block the smash /
    ⬇️ No lifts at the front / 🔀 Mix it up。ラリーの流れ(rallyShots)をルールで判定し、Review のカードは物理でもミスだった時だけ出す。
    候補から外したもの: Jump smash wisely(Not from the back に近い)・Attack the serve(出番が少ない)・Reset when late(物理の調整が先)。
  - v0.8.7: 相手のレシーバーは 45% で後ろ(3.8m)、ほかは前(2.4m)で待つ。前なら LONG、後ろなら SHORT が正解(Serve smart は
    物理ではなくこの決まりで判定)。逆をつかれたレシーバーは苦しい返球(Late が多い)。
  - v0.8.6: レッスンの % は達成度(Mastery)。半分は最近 20 回の場面で正しく選べた割合(80% で満点、場面 10 回で満額)、
    半分は良い判断の回数(30 回で満点)。100% = Master(Book の ⭐⭐⭐、⭐⭐ は 50%)。Review では試合での伸び(+5 など)。
  - v0.8.4: レッスンは文字のバーではなくカードのグリッドに(Lesson 6〜10 が増えても並ぶ)。カードはアイコンと名前・動くお手本
    (ミニコートで相手から球が来て、YOU が緑の正しいショットを打つ。赤の点線と ✗ はよくあるまちがい)・小さいバーと %。
    タップ / マウスで下にくわしい説明。
  - v0.8.1: レッスンのバー(Review と Records)の各行に「Next time: …」の短いヒント。行にマウスを乗せる / タップすると、
    くわしい説明(Tactics Book と同じ文)が出る。
  - ルールは新しい 15 点制の1ゲームだけ(14-14 からは2点差、21 点で終わり)。サーブのコートは本物どおり。
  作る順番: ①コートとシャトル ②自動で走る・ボタン ③ルール ④CPU ⑤キャラを作る画面・タイトル・結果 ⑥ハブ・SPEC。
  v0.1.0 は ①〜④ と仮のタイトル・結果(子どもたちにスマホで手ざわりを試してもらう版)。
  セーブ: moku:moku-badminton:progress / moku:moku-badminton:settings
-->
<style>
:root { --hi:#4FA3E0; --lo:#1E4A75; --ink:#4A2E1A; --paper:#FFF6E6;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#E8B97A; }
body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
/* 100vh だと Android の Chrome でツールバーの分だけ下が切れるので、見えている枠(inset:0)に合わせる */
canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
button { font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

/* ── Moku Series 共通(SPEC.md §4・§5): タイトル画面だけの枠・ハブへのリンク・バージョン ── */
/* 外枠(#title-frame)はこのゲームでは出さない。右上は「Home」(2026-11-27、保護者。SPEC.md §4 の例外) */
#hub-link { flex:none; align-self:flex-start; color:var(--ink);
  font-weight:800; font-size:14px; text-decoration:none; letter-spacing:.02em; background:var(--paper); border:3px solid var(--ink);
  border-radius:999px; padding:5px 14px; box-shadow:0 3px 0 rgba(74,46,26,.35); }
#buildInfo { position:fixed; left:calc(24px + var(--sal)); bottom:calc(20px + var(--sab)); z-index:720;
  color:rgba(255,255,255,.28); font-size:10.5px; pointer-events:none; }
body.ov #hub-link, body.ov #buildInfo, body:not(.on-title) #title-frame, body:not(.on-title) #hub-link, body:not(.on-title) #buildInfo { display:none; }

/* ── 紙のカード(タイトル・一時停止・結果) ── */
.overlay { position:fixed; inset:0; z-index:600; display:none; align-items:center; justify-content:center;
  padding:calc(var(--sat) + 30px) calc(var(--sar) + 30px) calc(var(--sab) + 30px) calc(var(--sal) + 30px); }
.overlay.show { display:flex; }
.overlay.dim { background:rgba(74,46,26,.35); }
.card { background:var(--paper); border:3px solid var(--ink); border-radius:18px; padding:16px 26px 14px;
  box-shadow:0 6px 0 rgba(74,46,26,.35), 0 14px 30px rgba(0,0,0,.25); text-align:center; max-height:100%; overflow-y:auto; }
.logo { font-size:30px; font-weight:800; letter-spacing:.02em; line-height:1.05; }
.logo span { color:var(--hi); -webkit-text-stroke:1px var(--ink); }
.sub { font-size:13px; font-weight:700; opacity:.75; margin:4px 0 10px; }
.opt { display:flex; align-items:center; justify-content:center; gap:6px; margin:5px 0; }
.opt > span { font-size:12px; font-weight:800; width:58px; text-align:right; opacity:.75; }
.opt button { border:2px solid var(--ink); background:#fff; color:var(--ink); font-weight:800; font-size:13px;
  border-radius:999px; padding:4px 12px; }
.opt button.on { background:var(--hi); color:#fff; }
.titleMenu { display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:10px; }
.titleMenuItem { font-size:19px; font-weight:800; padding:8px 18px; border:3px solid var(--ink); border-radius:14px;
  background:linear-gradient(#6FBDF0,#3E8FCC); color:#fff; min-width:190px; box-shadow:0 4px 0 var(--ink);
  text-shadow:0 1px 0 rgba(0,0,0,.25); }
.titleMenuItem:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.titleMenuItem.plain { background:#fff; color:var(--ink); text-shadow:none; }
.how { font-size:11.5px; font-weight:700; opacity:.7; margin-top:9px; line-height:1.35; }
/* ── ホーム画面: Moku World Tour ── */
#title.overlay { padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px); }
.tour { display:grid; grid-template-columns:minmax(0, 1.65fr) minmax(220px, 1fr); gap:12px; width:min(1200px, 100%); height:min(100%, 720px); }
.tourMap { display:flex; flex-direction:column; padding:10px 14px 8px; min-height:0; text-align:left; }
.tourHead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.tourHead .logo { font-size:26px; } .tourHead .sub { margin:2px 0 0; }
#tourSvg { flex:1; width:100%; min-height:0; margin-top:4px; }
#tourSvg .stop { cursor:pointer; }
#tourSvg .pulse { animation:stopPulse 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes stopPulse { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.25); opacity:.35; } }
#tourSvg .token { animation:tokenBob 1.2s ease-in-out infinite; }
@keyframes tokenBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
.tourSide { display:flex; flex-direction:column; justify-content:space-between; padding:12px 14px; min-height:0; overflow-y:auto; }
.stopFlag { font-size:34px; line-height:1; }
.stopCup { font-size:19px; font-weight:800; margin-top:2px; } .stopCity { font-size:12px; font-weight:800; opacity:.65; }
.stopVs { display:flex; justify-content:center; align-items:flex-end; gap:2px; margin:6px 0 0; }
.stopVs canvas { position:static; inset:auto; width:76px; height:auto; }
.stopVs b { font-size:13px; font-weight:800; padding-bottom:28px; opacity:.6; }
.stopNames { font-size:13.5px; font-weight:800; }
.stopState { display:inline-block; margin-top:6px; font-size:12px; font-weight:800; padding:2px 10px; border-radius:999px; border:2px solid var(--ink); background:#fff; }
.stopState.won { background:#FFF3C4; border-color:#E0A21B; } .stopState.next { background:#E4F2FC; border-color:var(--hi); } .stopState.lock { opacity:.7; border-style:dashed; }
#playBtn[disabled] { opacity:.45; filter:grayscale(1); }
@media (max-height:400px) {
  .tour { gap:8px; } .tourMap { padding:6px 10px 4px; } .tourHead .logo { font-size:19px; } .tourHead .sub { font-size:10.5px; }
  .tourSide { padding:6px 10px; } .stopFlag { font-size:24px; } .stopCup { font-size:15px; } .stopVs canvas { width:52px; } .stopVs b { padding-bottom:18px; }
  .stopNames { font-size:12px; } .stopState { margin-top:3px; font-size:10.5px; }
  .tourSide .titleMenu { margin-top:4px; gap:4px; } .tourSide .titleMenuItem { min-width:0 !important; padding:4px 10px; } .tourSide .titleMenu.row .titleMenuItem { font-size:13px; padding:3px 8px; }
  .tourSide .titleMenu.row { flex-wrap:nowrap; }
  #hub-link { font-size:12px; padding:3px 10px; border-width:2px; }
}
#ladder { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:2px 0 6px; }
.rival { border:2px solid var(--ink); background:#fff; border-radius:12px; padding:5px 8px; text-align:left; color:var(--ink);
  display:flex; align-items:center; gap:7px; min-width:0; }
.rival .n { flex:none; width:22px; height:22px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center; }
.rival .t { min-width:0; } .rival .nm { font-size:12.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rival .cup { font-size:10px; font-weight:800; color:var(--lo); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rival.on .cup { color:#fff; opacity:.85; }
.rival .st { font-size:10.5px; font-weight:700; opacity:.7; }
.rival.on { background:var(--hi); color:#fff; } .rival.on .n { color:var(--ink); } .rival.on .st { opacity:.9; }
.rival.locked { border-style:dashed; opacity:.55; cursor:default; }
#resultSub b { color:var(--lo); }
#resultTitle { font-size:28px; font-weight:800; }
#resultScore { font-size:40px; font-weight:800; margin:2px 0; letter-spacing:.04em; }
.titleMenu.row { flex-direction:row; justify-content:center; flex-wrap:wrap; }
.titleMenu.row .titleMenuItem { min-width:150px; }
.titleMenuItem.small { min-width:0 !important; font-size:15px; }
.stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin:8px 0 2px; }
.stat { position:relative; background:#fff; border:2px solid var(--ink); border-radius:12px; padding:5px 6px 4px; min-width:0; }
.stat span { display:block; font-size:10.5px; font-weight:800; opacity:.65; white-space:nowrap; }
.stat b { display:block; font-size:19px; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat b em { font-size:11px; font-style:normal; }
.stat small { display:block; font-size:10px; font-weight:700; opacity:.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat.new { background:#FFF3C4; border-color:#E0A21B; }
.stat i { position:absolute; top:-9px; left:50%; transform:translateX(-50%); background:#E2573C; color:#fff; font-style:normal; font-size:9px;
  font-weight:800; padding:1px 6px; border-radius:999px; white-space:nowrap; border:1.5px solid var(--ink); animation:pop .4s; }
#resultBadges, #recordsBadges { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:4px; }
.badge { background:var(--paper); border:2px solid #E0A21B; border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:700; }
.badge b { color:#C2410C; }
@media (max-width:560px) { .stats { grid-template-columns:repeat(2, minmax(0,1fr)); } }
/* 背の低い横画面(Android の横持ちなど): カードを小さくして、ボタンまで画面に収める */
@media (max-height:400px) {
  .overlay { padding:calc(var(--sat) + 8px) calc(var(--sar) + 24px) calc(var(--sab) + 8px) calc(var(--sal) + 24px); }
  .card { padding:8px 18px 9px; border-radius:14px; }
  .logo { font-size:22px; } .sub { font-size:11px; margin:1px 0 5px; }
  #ladder { gap:4px; margin:0 0 3px; } .rival { padding:2px 8px; } .rival .n { width:19px; height:19px; font-size:11px; }
  .rival .nm { font-size:11.5px; } .rival .st, .rival .cup { font-size:9.5px; }
  .titleMenu { margin-top:5px; gap:5px; } .titleMenuItem { font-size:16px; padding:5px 14px; box-shadow:0 3px 0 var(--ink); }
  .titleMenu.row .titleMenuItem { min-width:130px; }

    else if (!d.praise && d.best !== d.type) arrow(d.res[d.best].land, '#2F9E44', true);

    d.pos.forEach(function (q, i) {

    });
    g.fillStyle = '#fff'; g.strokeStyle = '#4A2E1A'; g.lineWidth = 2; g.beginPath(); g.arc(X(d.p[0]), Z(d.p[2]), 6, 0, TAU); g.fill(); g.stroke();
  }
  function rvShow(i) {

  // ── Tactics Book: Review で出会ったレッスンが図鑑のようにたまる。お手本の図・やり方・自分の成績と ⭐ ──
  var BOOK_ORDER = ['attack', 'back', 'net', 'space', 'serve', 'keepattack', 'frontback', 'block', 'frontlow', 'mix', 'hurry'];
  var BOOK = { // お手本の場面(上から見た図)。緑 = 正しいショット、赤 = よくあるまちがい
    attack: { how: 'When the shuttle is high and you are in the middle or near the net, hit it DOWN with a SMASH. They have to defend, and you take control.',
      remember: 'High ball? Smash it!', ex: { p: [-3.0, 2.4, 0.6], pos: [[-3.2, 0.8], [-5.2, -1], [3.8, -1.5], [3.6, 1.5]], type: 'clear', best: 'smash', land: { clear: [6.2, 0.5], smash: [3.0, -2.4] } } },

    net: { how: 'If the shuttle is low near the net, play a HAIRPIN that drops just over. Your rival must hit it UP — then you can attack. If it is a bit higher, PUSH it fast to the side.', remember: 'Low at the net? Keep it low!',
      ex: { p: [-1.0, 0.8, 1.0], pos: [[-1.4, 1.0], [-4.5, -0.8], [2.2, -0.5], [4.8, 1.2]], type: 'clear', best: 'net', land: { clear: [6.1, 1.0], net: [0.8, 1.2] } } },
    space: { how: 'Look where the rivals are standing. If they are close to the net, a CLEAR to the back makes them run. Hit where nobody is!', remember: 'Find the empty space.',
      ex: { p: [-4.3, 2.2, 0], pos: [[-4.5, 0], [-1.8, 0.5], [1.6, -1.0], [2.0, 1.2]], type: 'drop', best: 'clear', land: { drop: [1.5, 0.2], clear: [6.1, -2.0] } } },
    serve: { how: 'Watch the receiver before you serve. Standing close to the net? Serve LONG to the back. Standing far back? Serve SHORT.', remember: 'Serve to where they are not ready.',

  var last = 0, acc = 0, trailT = 0;
