<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Moku Money Market</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  Moku Money Market(v0.1.0、2026-11-19)— 棚「Live in ASIA」の第2弾。
  東南アジア 8 か国の屋台で(v0.2.0 でブルネイとカンボジアを足した)、その国のお金で買い物をする。ねらい(Live in ASIA の目標、CLAUDE.md §2 に合わせて):
  ①国とお金の名前・記号・書き方を覚える(RM5 / S$5 / ฿60 / 50.000₫ / Rp20.000 / ₱100)
  ②同じ物でも国によって数字がまるで違う(フォー1杯 50.000₫ ≈ RM8)ことを、自分のお金に直してくらべる
  ③「10.000₫ ≈ RM1.6 だから…」という目安を自分のことばで説明できる。
  - 🛒 Market Trip(①): 国を選んで屋台へ。5人分の注文。2品以上は合計を選ぶ → お札・硬貨を台に出して払う
    (よけいなお札を出さなければ ⭐)→ おつりを選ぶ。1注文 ⭐3、1回 ⭐15。
  - 💱 Price Check(②③): 8問。「この値段は My money でだいたいいくら?」と「どっちが高い?」。答えのあとに目安の式。
  - 📒 Money Book: 国ごとのお金のページ(記号・書き方・お札と硬貨・目安・本当の話)。その国の市場に行くと開く。
  - My money: RM / ¥ / US$ をタイトル画面で選ぶ(家族はマレーシア住まいなので RM が初期値)。
  - 値段切り(Haggle)は文化の説明がむずかしいので、v0.1 では入れない(次の候補)。

  事実のデータは下の MARKETS。値段は 2025 年ごろの屋台・ホーカーのだいたいの値段、為替は 2025 年ごろの
  だいたいの値(1 US$ あたり)。画面にも「about」と「本当のレートは毎日かわる」を出す。お札の絵は本物をまねず、
  色の系統と数字だけ(本物そっくりのお札は描かない)。宗教・政治・王室の話は入れない。

  Moint(SPEC.md §13): 毎回(1日 500 まで)= ⭐1つ +5(1回で最大 75)、⭐15 そろえた +25、Price Check 1問 +5・8問全部 +20。
  1回きり = その国の市場に初めて行った +30、8 か国全部 +200(受け取り済みは progress.mointClaims の m:<国> と all)。
  記録は moku:moku-money-market:progress、音と My money は moku:moku-money-market:settings。
-->
<style>
:root {
  --hi: #E8A23A; --lo: #6E4510;               /* 金貨の金色 */
  --ink: #3B2A20; --ink-soft: #8B6E57;
  --paper: #FFF7E8; --paper2: #FBEBD0;
  --wood: #7A4A2C; --wood-dark: #4E2C17;
  --line: #5A3A22;
  --ok: #3E9B5A; --bad: #D0533F;
  --round: "Fredoka", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #F6D7AE; color: var(--ink);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

/* ---------- shared frame / hub link ---------- */
#title-frame { position: fixed; inset: 14px; border: 3px solid var(--hi); border-radius: 10px; pointer-events: none; z-index: 40; }
#title-frame::after { content: ''; position: absolute; inset: 5px; border: 1px solid var(--lo); border-radius: 8px; }
#hub-link {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px);
  z-index: 41; font-size: 14px; font-weight: 800; color: var(--lo); text-decoration: none;
  text-shadow: 0 1px 0 rgba(255,255,255,0.6); animation: hubLinkPulse 2.2s ease-in-out infinite;
}
@keyframes hubLinkPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
#buildInfo {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 18px);
  z-index: 41; font-size: 10.5px; letter-spacing: 0.02em; color: rgba(255,255,255,0.28);
  text-shadow: 0 0 1px rgba(90,58,34,0.5); pointer-events: none;
}
body:not(.on-title) #title-frame, body:not(.on-title) #hub-link, body:not(.on-title) #buildInfo,
body:not(.on-title) #titleScreen, body:not(.on-title) #soundBtn { display: none; }
body.on-title #playScreen { display: none; }
#soundBtn {
  position: fixed; z-index: 41; top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 22px);
  width: 36px; height: 36px; border-radius: 50%; background: rgba(255,247,232,0.85); border: 2px solid rgba(90,58,34,0.3); font-size: 17px;
}

/* ---------- title ---------- */
#titleScreen { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#FFE3B5, #F7B98A 70%, #EFA27C); }
#titleScreen::before {   /* 屋台のひさし */
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 64px;
  background: repeating-linear-gradient(90deg, #E8A23A 0 40px, #FFF4DE 40px 80px);
  border-bottom: 4px solid var(--wood-dark);
  -webkit-mask: radial-gradient(circle at 20px 64px, transparent 18px, #000 19px) 0 0 / 40px 100%;
          mask: radial-gradient(circle at 20px 64px, transparent 18px, #000 19px) 0 0 / 40px 100%;
  opacity: 0.85;
}
#titleInner {
  position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 54px) 28px calc(env(safe-area-inset-bottom, 0px) + 36px);
}
#titleCard {
  margin: auto; position: relative; width: min(420px, 100%);
  background: var(--paper); border-radius: 18px; border: 3px solid var(--line);
  box-shadow: 0 10px 0 rgba(90,58,34,0.25), 0 18px 40px rgba(90,58,34,0.25);
  padding: 16px 18px 16px; text-align: center;
}
#titleHead { position: relative; }
#titleHero { position: relative; width: 104px; height: 104px; margin: 0 auto; animation: heroFloat 3.2s ease-in-out infinite; }
#titleHero img, #titleHero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#titleHero img { object-fit: cover; object-position: center 30%; filter: drop-shadow(0 4px 8px rgba(110,69,16,0.35)); }
@keyframes heroFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
.floatCoin { position: absolute; font: 800 13px var(--round); color: #7A4E00; width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; border: 2px solid #9A6A10;
  background: radial-gradient(circle at 35% 30%, #FFF2A8, #F2C230 55%, #C9901A); animation: coinBob 2.6s ease-in-out infinite; }
@keyframes coinBob { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-8px) rotate(8deg); } }
#titleLogo { font: 700 34px/1.02 var(--round); color: var(--lo); margin-top: 6px; }
#titleLogo span { color: var(--hi); display: block; }
#titleSub { font: 600 12.5px var(--round); color: var(--ink-soft); letter-spacing: 0.14em; margin-top: 6px; text-transform: uppercase; }
#titleMenu { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; }
.titleMenuItem {
  width: 100%; max-width: 300px; font-size: 19px; font-weight: 800; padding: 8px 18px; border-radius: 14px;
  background: #fff; border: 2px solid rgba(90,58,34,0.25); color: var(--ink);
  display: flex; align-items: center; gap: 10px; text-align: left; transition: transform 0.12s;
}
.titleMenuItem .ic { font-size: 22px; width: 28px; text-align: center; }
.titleMenuItem small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-top: 1px; }
.titleMenuItem.primary { background: var(--hi); border-color: var(--lo); color: #fff; box-shadow: 0 4px 0 var(--lo); }
.titleMenuItem.primary small { color: rgba(255,255,255,0.88); }
.titleMenuItem:active { transform: translateY(2px) scale(0.98); }
#homeRow { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); }
.seg { display: inline-flex; gap: 4px; }
.seg button { padding: 4px 10px; border-radius: 999px; background: #fff; border: 2px solid rgba(90,58,34,0.25); font-weight: 800; font-size: 13px; }
.seg button.on { background: var(--hi); color: #fff; border-color: var(--lo); }
#titleMoints { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 6px; }
.mcoin {
  display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFF2A8, #F2C230 55%, #C9901A);
  border: 1.5px solid #9A6A10; color: #7A4E00; font: 800 9.5px/1 var(--round);
}
@media (orientation: landscape) and (max-height: 560px) {
  #titleInner { padding-top: calc(env(safe-area-inset-top, 0px) + 40px); padding-bottom: 20px; }
  #titleCard { width: min(660px, 100%); display: grid; grid-template-columns: 200px 1fr; column-gap: 14px; align-items: center; padding: 12px 14px; }
  #titleHead { grid-row: 1 / 4; }
  #titleHero { width: 90px; height: 90px; }
  #titleLogo { font-size: 28px; }
  #titleMenu, #homeRow, #titleMoints { grid-column: 2; }
  #titleMenu { margin-top: 0; }
}

/* ---------- play ---------- */
#playScreen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper2); }
#topbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(env(safe-area-inset-right, 0px) + 12px) 6px calc(env(safe-area-inset-left, 0px) + 10px);
  background: linear-gradient(#8A5634, var(--wood)); border-bottom: 3px solid var(--wood-dark); color: #FFF4E0;
}
#menuBtn { padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,0.14); font-weight: 800; font-size: 14px; }
#modeTitle { flex: 1; font: 700 17px var(--round); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topInfo { font-weight: 800; font-size: 14px; white-space: nowrap; }
#stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#scene { flex: none; position: relative; overflow: hidden; height: 42%; min-height: 200px; background: linear-gradient(#FFE6BC, #F9C99A); }
#panel {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-top: 3px solid var(--wood-dark);
  padding: 12px calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 14px) calc(env(safe-area-inset-left, 0px) + 12px);
}
#panelInner { max-width: 560px; margin: 0 auto; }
@media (orientation: landscape) {
  #stage { flex-direction: row; }
  #scene { height: auto; flex: 1; min-height: 0; }
  #panel { flex: none; width: clamp(320px, 44vw, 480px); border-top: 0; border-left: 3px solid var(--wood-dark); }
}

/* scene: the stall */
.canopy { position: absolute; left: 0; right: 0; top: 0; height: 22%; min-height: 44px; border-bottom: 4px solid var(--wood-dark); }
.canopy::after { content: ''; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px;
  background: radial-gradient(circle at 14px 0, var(--c1) 13px, transparent 14px) 0 0 / 28px 14px repeat-x; }
.signBoard { position: absolute; left: 50%; top: calc(22% - 6px); transform: translate(-50%, 0); z-index: 2;
  background: #FFF4DE; border: 3px solid var(--wood-dark); border-radius: 10px; padding: 3px 12px;
  font: 700 15px var(--round); white-space: nowrap; display: flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 rgba(78,44,23,0.3); }
.signBoard svg.flag { width: 24px; height: 16px; }
.vendor { position: absolute; right: 9%; bottom: 30%; display: flex; flex-direction: column; align-items: center; }
.vendor .face { font-size: clamp(44px, 9vh, 72px); line-height: 1; animation: bob 2.4s ease-in-out infinite; }
.vendor .tag { font: 700 11px var(--round); background: rgba(255,255,255,0.85); border-radius: 999px; padding: 1px 8px; margin-top: 2px; color: var(--ink-soft); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.customer { position: absolute; left: 6%; bottom: 26%; width: clamp(64px, 14vh, 96px); height: clamp(64px, 14vh, 96px); }
.customer img, .customer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.customer img { object-fit: cover; object-position: center 30%; }
.bubble { position: absolute; left: calc(6% + clamp(64px, 14vh, 96px) - 6px); bottom: calc(26% + clamp(48px, 11vh, 76px));
  max-width: 46%; background: #fff; border: 2.5px solid var(--line); border-radius: 14px; padding: 6px 10px;
  font: 600 13.5px/1.3 var(--round); animation: pop 0.35s cubic-bezier(.2,1.5,.5,1) both; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
.counter { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(#B07A4C, #8A5634); border-top: 5px solid var(--wood-dark);
  display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 12px; }
.counter::before { content: ''; position: absolute; inset: 6px 0 auto 0; height: 2px; background: rgba(255,255,255,0.15); }
.food { position: relative; display: flex; flex-direction: column; align-items: center; animation: pop 0.4s both; }
.food .em { font-size: clamp(28px, 6vh, 44px); line-height: 1; filter: drop-shadow(0 3px 0 rgba(0,0,0,0.2)); }
.food .qty { position: absolute; top: -6px; right: -12px; background: var(--hi); color: #fff; font: 800 12px var(--round); border-radius: 999px; padding: 1px 6px; border: 2px solid #fff; }
.pricetag { margin-top: 3px; background: #FFF9EC; border: 2px solid var(--line); border-radius: 6px; padding: 0 6px; font: 700 13px var(--round); white-space: nowrap; transform: rotate(-3deg); }

/* panel pieces */
.card { background: var(--paper); border: 2.5px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: 0 5px 0 rgba(90,58,34,0.18); }
.enter { animation: cardIn 0.4s cubic-bezier(.2,1.3,.5,1) both; }
@keyframes cardIn { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.h { font: 700 19px/1.2 var(--round); color: var(--lo); }
.sub { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; margin-top: 2px; }
.list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 7px 10px; font-weight: 700; font-size: 15px; border: 1.5px solid rgba(90,58,34,0.15); }
.li .m { font-family: var(--round); font-weight: 700; white-space: nowrap; }
.li.tot { background: #FFF6DA; border-color: #E0B85A; }
.q { font: 700 18px/1.3 var(--round); margin: 12px 2px 8px; text-align: center; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ch { padding: 12px 8px; border-radius: 12px; background: #fff; border: 2.5px solid rgba(90,58,34,0.25); font: 700 17px var(--round); box-shadow: 0 3px 0 rgba(90,58,34,0.18); }
.ch:active { transform: translateY(2px); box-shadow: none; }
.ch.right { border-color: var(--ok); background: #EAF7E6; }
.ch.miss { border-color: var(--bad); background: #FDEDEA; }
.ch:disabled { opacity: 1; }
.row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 120px; padding: 11px 14px; border-radius: 12px; font-weight: 800; font-size: 15.5px;
  background: #fff; border: 2px solid rgba(90,58,34,0.3); box-shadow: 0 3px 0 rgba(90,58,34,0.2); }
.btn.primary { background: var(--hi); color: #fff; border-color: var(--lo); box-shadow: 0 3px 0 var(--lo); }
.btn:disabled { opacity: 0.45; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.say { margin-top: 10px; padding: 9px 12px; border-radius: 12px; font-weight: 700; font-size: 14.5px; line-height: 1.45;
  background: #FFF6DA; border: 2px solid rgba(224,184,90,0.6); color: #6A4A10; animation: cardIn 0.3s ease-out both; }
.say.ok { background: #EAF7E6; border-color: rgba(62,155,90,0.4); color: #275E37; }
.say.bad { background: #FDEDEA; border-color: rgba(208,83,63,0.35); color: #8A2F20; }
.tip { margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; text-align: center; }
.stars { font-size: 20px; letter-spacing: 2px; text-align: center; margin-top: 4px; }

/* money: notes and coins */
.tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.money { position: relative; display: inline-flex; align-items: center; justify-content: center; font-family: var(--round); font-weight: 700; color: #fff;
  text-shadow: 0 1px 0 rgba(0,0,0,0.35); transition: transform 0.12s; }
.money:active { transform: scale(0.94); }
.note { width: 78px; height: 42px; border-radius: 6px; background: var(--nc); border: 2px solid rgba(0,0,0,0.25);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35), 0 2px 0 rgba(0,0,0,0.2); font-size: 15px; overflow: hidden; }
.note::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 22px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.45), rgba(255,255,255,0.1)); }
.note::after { content: ''; position: absolute; right: -6px; bottom: -10px; width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.22); }
.note span { position: relative; z-index: 1; padding-left: 16px; }
.coin { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, transparent 55%), var(--nc);
  border: 2px solid rgba(0,0,0,0.3); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.3), 0 2px 0 rgba(0,0,0,0.2); font-size: 12.5px; }
.paid { min-height: 56px; margin-top: 8px; padding: 8px; border-radius: 12px; border: 2.5px dashed #C9A87D; background: #FFFDF6;
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.paid:empty::before { content: 'Tap money to put it here'; color: #C5AE88; font-weight: 700; font-size: 13px; }
.paid .money { transform: scale(0.85); animation: pop 0.25s both; }
.payline { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 800; font-size: 15px; }
.payline .m { font-family: var(--round); }
.payline .short { color: var(--bad); }
.payline .over { color: var(--ok); }

/* country picker */
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.pick { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px; border-radius: 12px; background: #fff;
  border: 2.5px solid rgba(90,58,34,0.2); box-shadow: 0 3px 0 rgba(90,58,34,0.15); text-align: left; }
.pick:active { transform: translateY(2px); box-shadow: none; }
.pick .top { display: flex; align-items: center; gap: 8px; font: 700 16px var(--round); }
.pick svg.flag { width: 30px; height: 20px; }
.pick small { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.pick .best { font-size: 12px; font-weight: 800; color: #9A6A10; }
svg.flag { display: block; border-radius: 2px; }

/* money book */
.bookHead { display: flex; align-items: center; gap: 10px; }
.bookHead svg.flag { width: 54px; height: 36px; }
.bookHead .sym { margin-left: auto; font: 700 30px var(--round); color: var(--lo); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin-top: 10px; font-size: 14px; line-height: 1.4; }
.facts dt { font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
.facts dd { font-weight: 600; }
.fun { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.fun div { background: #EEF3FB; border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.4; font-weight: 600; }
.tell { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #FFF6DA; border: 2px dashed #E0B85A; font-size: 14.5px; line-height: 1.5; font-weight: 600; }
.tell .cn { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #9A7420; text-transform: uppercase; margin-bottom: 2px; }
.sec { font: 700 13px var(--round); color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; margin: 12px 2px 0; }
.locked { opacity: 0.55; }
.moints { margin-top: 10px; background: #FFF6DA; border: 2px solid #E0B85A; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.moints div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }

  function niceNum(v) {
    if (v <= 0) return 0;
    if (v < 1) return Math.max(0.1, Math.round(v * 10) / 10);
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    if (Math.round(v / mag) === 1 || v / mag < 2) mag /= 10;

  var actx = null, gestured = false;

  function tone(f, t0, dur, type, vol) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0 || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }

  // =====================================================================
  // 🛒 Market Trip
  // =====================================================================
  var ORDER_SIZES = [1, 1, 2, 2, 3];
  var trip = null;
  function openTripPicker() {
    showPlay('🛒 Market Trip');
    drawScene(null, [], 'Where shall we go shopping today?');
    setPanel('<div class="card"><div class="h">Choose a market</div><div class="sub">Pay with that country’s real money. 5 customers, up to ⭐ 15.</div>' + countryPicker(null, 'best') + '</div>');
    panel.querySelectorAll('.pick').forEach(function (b) { b.addEventListener('click', function () { sfx.tap(); startTrip(b.getAttribute('data-c')); }); });
  }
  function makeOrder(id, size) {
    var m = MARKETS[id], picks = shuffle(m.items).slice(0, size);
    return picks.map(function (it) { return { name: it.name, em: it.em, p: it.p, q: size === 1 && Math.random() < 0.35 ? 2 : 1 }; });
  }
  function startTrip(id) {
    progress.played++; save();
    trip = { id: id, i: 0, stars: 0, res: [] };
    showPlay('🛒 Market Trip');
    nextOrder();
  }
  function orderTotal(o) { return o.reduce(function (a, it) { return a + it.p * it.q; }, 0); }
  function nextOrder() {
    if (trip.i >= ORDER_SIZES.length) return endTrip();
    var o = makeOrder(trip.id, ORDER_SIZES[trip.i]);
    trip.cur = { items: o, total: orderTotal(o), step: o.length > 1 || o[0].q > 1 ? 'add' : 'pay', paid: [], stars: 0, tries: 0, say: '' };
    if (trip.cur.step === 'pay') trip.cur.stars++;   // 合計を出すステップがない注文は ⭐ 1つ付き
    else trip.cur.choices = totalChoices(trip.cur.total, o.map(function (it) { return it.p * it.q; }), trip.id);
    $('topInfo').textContent = '🧺 ' + (trip.i + 1) + '/5 · ⭐ ' + trip.stars;
    var m = MARKETS[trip.id];
    drawScene(trip.id, o, 'I’d like ' + o.map(function (it) { return (it.q > 1 ? it.q + ' × ' : '') + esc(it.name); }).join(', ') + ', please!');
    fresh = true;
    renderOrder();
  }
  function totalChoices(total, prices, mk) {
    var step = Math.min.apply(null, prices);
    var set = [total, total + step, Math.max(step, total - step), total * 10];
    if (mk === 'VN' || mk === 'ID') set[3] = total / 10;
    var out = []; set.forEach(function (v) { if (out.indexOf(v) < 0 && v > 0) out.push(v); });
    while (out.length < 4) out.push(total + step * (out.length + 1));
    return shuffle(out.slice(0, 4));
  }
  function changeChoices(change, mk) {
    var denoms = MARKETS[mk].money.map(function (x) { return x.v; });
    var small = denoms[0];
    var set = [change, change + small, Math.max(0, change - small), change + denoms[Math.min(2, denoms.length - 1)]];
    var out = []; set.forEach(function (v) { if (out.indexOf(v) < 0) out.push(v); });
    while (out.length < 4) out.push(change + small * (out.length + 2));
    return shuffle(out.slice(0, 4));
  }
  function paidSum() { return trip.cur.paid.reduce(function (a, v) { return a + v; }, 0); }
  // よけいなお札がない = どれを1枚引いても足りなくなる
  function noExtra() {
    var s = paidSum(), t = trip.cur.total;
    return trip.cur.paid.every(function (v) { return s - v < t; });
  }
  function renderOrder() {
    var cur = trip.cur, m = MARKETS[trip.id];
    var dots = '<div class="dots">' + ORDER_SIZES.map(function (x, i) { return '<i class="' + (i < trip.i ? (trip.res[i] >= 2 ? 'ok' : 'no') : i === trip.i ? 'now' : '') + '"></i>'; }).join('') + '</div>';
    var h = '<div class="card">' + dots + '<div class="h">Customer ' + (trip.i + 1) + ' of 5</div>' +
      '<div class="list">' + cur.items.map(function (it) {
        return '<div class="li"><span>' + it.em + ' ' + (it.q > 1 ? it.q + ' × ' : '') + esc(it.name) + '</span><span class="m">' + esc(m.fmt(it.p * it.q)) + '</span></div>';
      }).join('') +
      '<div class="li tot"><span>Total</span><span class="m">' + (cur.step === 'add' ? '?' : esc(m.fmt(cur.total))) + '</span></div></div>';

        '<div class="paid" id="paidBox">' + cur.paid.map(function (v, i) { var x = m.money.filter(function (y) { return y.v === v; })[0]; return moneyHTML(x, trip.id, 'data-rm="' + i + '"'); }).join('') + '</div>' +
        '<div class="payline"><span>You put down</span><span class="m">' + esc(m.fmt(sum)) + '</span></div>' +
        '<div class="payline"><span></span><span class="' + (diff < 0 ? 'short' : 'over') + '">' + (diff < 0 ? 'Need ' + esc(m.fmt(-diff)) + ' more' : diff === 0 ? 'Exact! 👌' : 'Enough ✓') + '</span></div>' +
        '<div class="row"><button class="btn primary" id="payBtn"' + (diff < 0 ? ' disabled' : '') + '>💵 Pay</button></div>' +
        '<div class="tip">⭐ Don’t give extra notes you don’t need. Tap money on the counter to take it back.</div>';
    } else if (cur.step === 'change') {
      h += '<div class="q">You paid ' + esc(m.fmt(paidSum())) + '. How much change?</div><div class="choices">' + cur.choices.map(function (v) {
        return '<button class="ch" data-v="' + v + '">' + esc(m.fmt(v)) + '</button>'; }).join('') + '</div>';
    } else if (cur.step === 'done') {
      h += '<div class="stars">' + '⭐'.repeat(cur.stars) + '<span style="opacity:.25">' + '⭐'.repeat(3 - cur.stars) + '</span></div>' +
        '<div class="row"><button class="btn primary" id="nextBtn">' + (trip.i + 1 >= ORDER_SIZES.length ? 'Close the market ▶' : 'Next customer ▶') + '</button></div>';
    }
    if (cur.say) h += '<div class="say ' + (cur.sayCls || '') + '">' + cur.say + '</div>';
    h += '</div>';
    var st = $('panel').scrollTop;
    setPanel(h);
    if (cur.step === 'pay') $('panel').scrollTop = st;
    // events
    if (cur.step === 'add' || cur.step === 'change') {
      panel.querySelectorAll('.ch').forEach(function (b) { b.addEventListener('click', function () { answer(+b.getAttribute('data-v'), b); }); });
    }
    panel.querySelectorAll('[data-add]').forEach(function (b) { b.addEventListener('click', function () {
      var x = m.money[+b.getAttribute('data-add')];
      if (cur.paid.length >= 12) return;
      cur.paid.push(x.v); cur.paid.sort(function (a, c) { return c - a; });
      if (x.coin) sfx.coin(); else sfx.note();
      renderOrder();
    }); });
    panel.querySelectorAll('[data-rm]').forEach(function (b) { b.addEventListener('click', function () { cur.paid.splice(+b.getAttribute('data-rm'), 1); sfx.tap(); renderOrder(); }); });
    if ($('payBtn')) $('payBtn').addEventListener('click', pay);
    if ($('nextBtn')) $('nextBtn').addEventListener('click', function () { sfx.tap(); trip.i++; nextOrder(); });
  }
  function answer(v, btn) {
    var cur = trip.cur, m = MARKETS[trip.id];
    if (cur.step === 'add') {
      if (v === cur.total) {
        if (cur.tries === 0) cur.stars++;
        cur.say = 'Yes! ' + cur.items.map(function (it) { return m.fmt(it.p * it.q); }).join(' + ') + ' = <b>' + esc(m.fmt(cur.total)) + '</b>';
        cur.sayCls = 'ok'; sfx.good();
        cur.step = 'pay'; cur.tries = 0;

        cur.tries++; cur.say = 'Not quite — add the prices on the list again.'; cur.sayCls = 'bad'; sfx.bad();
        btn.classList.add('miss'); btn.disabled = true;
        return;
      }
    } else if (cur.step === 'change') {
      var change = paidSum() - cur.total;
      if (v === change) {
        if (cur.tries === 0) cur.stars++;
        cur.say = '✓ ' + esc(m.fmt(paidSum())) + ' − ' + esc(m.fmt(cur.total)) + ' = <b>' + esc(m.fmt(change)) + '</b> change. ' + THANKS[trip.id];
        cur.sayCls = 'ok'; sfx.till();
        finishOrder();

        cur.tries++; cur.say = 'Hmm, count again: what you paid − the total.'; cur.sayCls = 'bad'; sfx.bad();

  var THANKS = { MY: 'Terima kasih!', SG: 'Thank you!', BN: 'Terima kasih!', TH: 'Khop khun!', KH: 'Orkun!', VN: 'Cảm ơn!', ID: 'Terima kasih!', PH: 'Salamat!' };
  function pay() {
    var cur = trip.cur, m = MARKETS[trip.id];

  function endTrip() {

  // =====================================================================
  // 💱 Price Check
  // =====================================================================
  var CHECK_LEN = 8;
  var check = null;
  function startCheck() {
    progress.played++; save();
    var qs = [];
    for (var i = 0; i < CHECK_LEN; i++) qs.push(i % 3 === 2 ? qCompare() : qEstimate());
    check = { qs: shuffle(qs), i: 0, res: [], answered: false };
    showPlay('💱 Price Check');
    renderCheck();
  }
  // My money が RM の時、マレーシアの値段を RM に直す問題は出さない(そのままなので)
  function abroad() { return ORDER.filter(function (id) { return !(settings.home === 'RM' && id === 'MY'); }); }
  function qEstimate() {
    var id = pick(abroad()), m = MARKETS[id], it = pick(m.items);
    var v = toHome(id, it.p), r = niceNum(v);
    var opts = [r, niceNum(v * 10), niceNum(v / 10), niceNum(v * 3)];
    var out = []; opts.forEach(function (x) { if (x > 0 && out.indexOf(x) < 0) out.push(x); });
    while (out.length < 4) out.push(niceNum(v * (out.length + 2)));
    return { kind: 'est', id: id, it: it, ans: r, opts: shuffle(out.slice(0, 4)) };
  }
  function qCompare() {
    var a = pick(ORDER), b = pick(ORDER.filter(function (x) { return x !== a; }));
    for (var n = 0; n < 30; n++) {
      var ia = pick(MARKETS[a].items), ib = pick(MARKETS[b].items);
      var va = toHome(a, ia.p), vb = toHome(b, ib.p);
      if (Math.max(va, vb) / Math.min(va, vb) > 1.3) return { kind: 'cmp', A: { id: a, it: ia, v: va }, B: { id: b, it: ib, v: vb }, ans: va > vb ? 'A' : 'B' };
    }
    return qEstimate();
  }
  function renderCheck() {
    var q = check.qs[check.i];
    $('topInfo').textContent = '💱 ' + (check.i + 1) + '/' + check.qs.length;
    var dots = '<div class="dots">' + check.qs.map(function (x, i) { return '<i class="' + (i < check.res.length ? (check.res[i] ? 'ok' : 'no') : i === check.i ? 'now' : '') + '"></i>'; }).join('') + '</div>';
    var h = '<div class="card">' + dots;
    if (q.kind === 'est') {
      var m = MARKETS[q.id];
      drawScene(q.id, [{ em: q.it.em, p: q.it.p, q: 1 }], esc(q.it.name) + ' — ' + esc(q.it.what) + '.');
      h += '<div class="q">' + esc(q.it.name) + ' costs <b>' + esc(m.fmt(q.it.p)) + '</b>.<br>About how much is that in ' + (HOME[settings.home].label) + '?</div><div class="choices">' +
        q.opts.map(function (v) { return '<button class="ch' + (check.answered ? (v === q.ans ? ' right' : v === check.chosen ? ' miss' : '') : '') + '" data-v="' + v + '"' + (check.answered ? ' disabled' : '') + '>about ' + esc(homeFmt(v)) + '</button>'; }).join('') + '</div>';
      if (check.answered) h += '<div class="say ' + (check.res[check.i] ? 'ok' : 'bad') + '">' + (check.res[check.i] ? '⭕ Right! ' : '❌ Not quite. ') +
        'Rule of thumb: <b>' + esc(rule(q.id)) + '</b>, so ' + esc(m.fmt(q.it.p)) + ' ≈ <b>' + esc(homeFmt(toHome(q.id, q.it.p))) + '</b>.</div>';
    } else {
      drawScene(null, [], 'Which one costs more?');
      var card = function (side) {
        var s = q[side], mm = MARKETS[s.id];
        var cls = check.answered ? (q.ans === side ? ' right' : check.chosen === side ? ' miss' : '') : '';
        return '<button class="ch' + cls + '" data-s="' + side + '"' + (check.answered ? ' disabled' : '') + '><span class="em">' + s.it.em + '</span><span>' + esc(s.it.name) + '</span><span class="m">' + esc(mm.fmt(s.it.p)) + '</span><small>' + flagSVG(s.id) + esc(mm.country) + '</small>' +
          (check.answered ? '<small>≈ ' + esc(homeFmt(s.v)) + '</small>' : '') + '</button>';
      };
      h += '<div class="q">Which one costs more?</div><div class="vs">' + card('A') + card('B') + '</div>';
      if (check.answered) h += '<div class="say ' + (check.res[check.i] ? 'ok' : 'bad') + '">' + (check.res[check.i] ? '⭕ Right! ' : '❌ Not quite. ') +
        'Bigger numbers don’t always mean more money! <b>' + esc(rule(q.A.id)) + '</b> and <b>' + esc(rule(q.B.id)) + '</b>.</div>';
    }
    if (check.answered) h += '<div class="row"><button class="btn primary" id="cNext">' + (check.i + 1 >= check.qs.length ? 'See results ▶' : 'Next ▶') + '</button></div>';
    h += '<div class="tip">Rates are about right for 2025. Real rates change every day.</div></div>';
    setPanel(h);
    if (!check.answered) {
      panel.querySelectorAll('[data-v]').forEach(function (b) { b.addEventListener('click', function () { answerCheck(+b.getAttribute('data-v')); }); });
      panel.querySelectorAll('[data-s]').forEach(function (b) { b.addEventListener('click', function () { answerCheck(b.getAttribute('data-s')); }); });
    } else {
      $('cNext').addEventListener('click', function () { sfx.tap(); check.i++; check.answered = false; fresh = true; if (check.i >= check.qs.length) endCheck(); else renderCheck(); });
    }
  }
  function answerCheck(v) {
    var q = check.qs[check.i], ok = v === q.ans;
    check.answered = true; check.chosen = v; check.res.push(ok);
    if (ok) sfx.good(); else sfx.bad();
    renderCheck();
  }
  function endCheck() {
    var n = check.res.filter(Boolean).length;
    progress.checkRounds++; progress.checkCorrect += n; progress.checkBest = Math.max(progress.checkBest, n);
    var lines = [['Right answers: ' + n + ' × 5', earn(n * 5)]];
    if (n === check.qs.length) lines.push(['All ' + n + ' right! ⭐', earn(20)]);
    save();
    sfx.fanfare();
    drawScene(null, [], n >= 6 ? 'You’re a money expert!' : 'Good try! Let’s go again!');
    $('topInfo').textContent = '💱 ' + n + '/' + check.qs.length;
    fresh = true;
    setPanel('<div class="card"><div class="h">' + (n === check.qs.length ? 'Perfect!' : n >= 6 ? 'Great job!' : 'Good try!') + '</div>' +
      '<div class="big">' + n + ' / ' + check.qs.length + '</div>' + mointBox(lines) +
      '<div class="tell"><span class="cn">🗣️ Tell a friend</span>To guess a price in ' + esc(HOME[settings.home].label) + ', remember one easy rule for each country — like <b>' + esc(rule('VN')) + '</b> or <b>' + esc(rule('TH')) + '</b>.</div>' +
      '<div class="row"><button class="btn primary" id="cAgain">💱 Play again</button><button class="btn" id="cMenu">Menu</button></div></div>');
    $('cAgain').addEventListener('click', function () { sfx.tap(); startCheck(); });
    $('cMenu').addEventListener('click', function () { sfx.tap(); showTitle(); });
  }

  // =====================================================================
  // 📒 Money Book
  // =====================================================================
  function openBook(sel) {
    showPlay('📒 Money Book');
    $('topInfo').textContent = ORDER.filter(visited).length + '/' + ORDER.length;
    function draw(open) {
      drawScene(open || null, [], open ? 'This is the ' + esc(MARKETS[open].cur) + '!' : 'Visit a market to fill your Money Book.');
      var h = '<div class="card"><div class="h">Money Book</div><div class="sub">A page opens when you visit that market.</div><div class="picks">' +
        ORDER.map(function (id) {
          var m = MARKETS[id], ok = visited(id);
          return '<button class="pick' + (ok ? '' : ' locked') + '" data-c="' + id + '"' + (ok ? '' : ' disabled') + '><span class="top">' + flagSVG(id) + esc(m.country) + '</span><small>' + (ok ? esc(m.cur) : '🔒 not visited yet') + '</small></button>';
        }).join('') + '</div></div>';
      if (open) {
        var m = MARKETS[open];
        h += '<div class="card" style="margin-top:12px"><div class="bookHead">' + flagSVG(open) + '<div><div class="h">' + esc(m.cur.charAt(0).toUpperCase() + m.cur.slice(1)) + '</div><div class="sub">' + esc(m.country) + '</div></div><span class="sym">' + esc(m.fmt(0).replace(/[0.,]/g, '')) + '</span></div>' +
          '<dl class="facts"><dt>✏️ Written</dt><dd>' + esc(m.write) + '</dd><dt>💱 About</dt><dd>' + esc(rule(open)) + '</dd><dt>🍜 Street food</dt><dd>' +
          m.items.slice(0, 3).map(function (it) { return esc(it.name) + ' ' + esc(m.fmt(it.p)); }).join(' · ') + '</dd></dl>' +
          '<div class="sec">Notes & coins</div><div class="tray">' + m.money.map(function (x) { return moneyHTML(x, open, 'tabindex="-1"'); }).join('') + '</div>' +
          '<div class="fun">' + m.facts.map(function (f) { return '<div>✨ ' + esc(f) + '</div>'; }).join('') + '</div>' +
          '<div class="tell"><span class="cn">🗣️ Tell a friend</span>In ' + esc(m.country) + ', money is the <b>' + esc(m.cur) + '</b>. ' + esc(m.items[0].name) + ' costs about ' + esc(m.fmt(m.items[0].p)) + ', and ' + esc(rule(open)) + '.</div>' +
          '<div class="tip">Colors only — real notes look different. Rates change every day.</div></div>';
      }
      setPanel(h);
      panel.querySelectorAll('.pick[data-c]:not([disabled])').forEach(function (b) { b.addEventListener('click', function () { sfx.tap(); draw(b.getAttribute('data-c')); var c = panel.querySelectorAll('.card')[1]; if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
    }
    draw(sel && visited(sel) ? sel : null);
  }

  // ---------- start ----------
  syncSoundBtn();
  $('goTrip').addEventListener('click', function () { sfx.tap(); openTripPicker(); });
  $('goCheck').addEventListener('click', function () { sfx.tap(); startCheck(); });
  $('goBook').addEventListener('click', function () { sfx.tap(); openBook(); });
  window.addEventListener('moku:moint', function () { if (document.body.classList.contains('on-title')) showTitle(); });
  showTitle();
  // 開発用: ?screen=trip|check|book、?market=VN で直接
  try {
    var qp = new URLSearchParams(location.search), scr = qp.get('screen'), mk = qp.get('market');
    if (scr === 'trip') { if (MARKETS[mk]) startTrip(mk); else openTripPicker(); }
    else if (scr === 'check') startCheck(); else if (scr === 'book') openBook(mk);
  } catch (e) {}
})();
</script>
</body>
</html>
