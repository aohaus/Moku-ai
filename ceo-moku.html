<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Sir CEO Moku</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  Sir CEO Moku(MVP、2026-11-08)
  Moku-ai games のオーナー「Sir CEO Moku」の社長室で、会話して遊ぶページ。ハブの Cozy & Create の棚に出している。
  - 会話はスクリプト(AI は使わない。外部への通信もしない)。選択肢を押して進む。
  - 記憶: moku:ceo-moku:memory に、訪れた日・会話の記録(最新 40 行)・ゲームのアイデア・クイズ・寄付を残す。
    クラウドセーブ・引き継ぎコードの対象(moku: 接頭辞)。次に来た時のあいさつが変わる。
  - CEO's Pick: ハブの上の Today's Pick と同じゲーム(hub.html の FEATURED と同じ並び・同じ日付の式。片方を変えたらもう片方も)。
    ボーナスは**ゲームの外**で、社長室に戻ってきた時に払う(ceo-moku の Moint、上限の外)。ゲームと shared/moku-moint.js は変えない。
    ・Moint を配るゲーム(Moku Fight): 発表を聞いた時の今日の「毎回もらえる分」(MokuMoint.earnedToday)を覚えておき、増えた分の 20%。
    ・Moint のないゲーム(Moku Kart Dash / Angry Mokumoku / Moku City): そのゲームのセーブが発表の後に変わっていたら Play Bonus 30(1日1回)。
    記録は memory の pick = { day, gameId, base, fp, paid }。
    ハブの Today's Pick(スクリーンショットのある4本から)とは別物なので、名前を「CEO's Pick」にした。
  - Pop Quiz: おしゃべり(Let's chat)の途中で突然出る(メニューには出さない)。Moku Word Riddles の問題(data/riddles-db.md、
    shared/moku-riddles.js)から1日1問、元のゲームと同じ自由記述。3回まで答えられ、まちがえるとヒント → 頭文字。正解で 100 Moint(上限の外)。
  - Game idea: 子どもが書いたアイデアに、キーワードでコメントを返し、考えを深める質問をする。記憶に残る(最新 10 件)。
  - Donation: ときどき 10 Moint の「寄付」をおねだりする(ゲーム内の Moint だけ。1日1回、残高 50 以上の時だけ。断っても何も起きない)。
  - 日本語モード(v0.3.0〜、保護者と決めた CLAUDE.md §4 の例外。このページだけ): 上の 🌐 ボタンで英語 ⇄ 日本語。
    日本語の社長は一人称「ワタシ」・語尾「〜モク」。セリフは tr(英語, 日本語) / L([英語, 日本語]) で両方を持つ。
    Riddle の問題・ヒント・用例と、答えの入力は英語のまま(英語の練習のため)。選んだことばは moku:ceo-moku:settings の lang。
  - 表情: Moku Closet の Moods(表情)と、CEO の服(Top Hat / Monocle / Moint Medallion)を MokuMoint.outfitSVG() で重ねる。
    大事なセリフでは Moku に寄る(#stage.close)。
-->
<style>
:root {
  --hi: #D9925A; --lo: #6A3A1C;               /* マホガニー(CEO の机の色) */
  --ink: #3B2A20; --ink-soft: #8B6E57;
  --paper: #FFF7E8; --paper-line: rgba(139,90,43,0.10);
  --wood: #7A4A2C; --wood-dark: #4E2C17;
  --round: "Fredoka", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #2E1A0E;
  color: var(--ink);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

/* ---------- 社長室 ---------- */
#stage { position: relative; flex: 1 1 auto; min-height: 170px; overflow: hidden; cursor: pointer; }
#room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ceo {
  position: absolute; left: 50%;
  bottom: calc(var(--dk, 80px) * 0.42);
  width: var(--mk, 240px); aspect-ratio: 1 / 1;
  transform: translateX(-50%);
  transform-origin: 50% 45%;
  transition: transform .45s cubic-bezier(.3,1.4,.5,1);
}
#ceo .bob { position: absolute; inset: 0; animation: bob 3s ease-in-out infinite; }
#ceo img, #ceo .mm-outfit { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; }
#ceo .face { position: absolute; inset: 0; }
#ceo .face.pop { animation: facePop .32s ease-out; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5%); } }
@keyframes facePop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
#stage.close #ceo { transform: translateX(-50%) translateY(6%) scale(1.32); }
#stage.hop #ceo .bob { animation: hop .45s ease-out; }
@keyframes hop { 0% { transform: translateY(0); } 35% { transform: translateY(-9%); } 100% { transform: translateY(0); } }
#desk {
  position: absolute; left: 50%; bottom: 0;
  width: min(100%, calc(var(--mk, 240px) * 2.3)); height: var(--dk, 80px);
  transform: translateX(-50%);
  transition: transform .45s ease;
}
#stage.close #desk { transform: translateX(-50%) translateY(18%); }
#desk svg { width: 100%; height: 100%; display: block; }

/* ひとりごと */
#thought {
  position: absolute; z-index: 5;
  left: 50%; bottom: calc(var(--dk, 80px) * 0.42 + var(--mk, 240px) * 0.86);
  transform: translateX(8%);
  max-width: min(260px, 60vw);
  padding: 8px 12px; border-radius: 16px;
  background: rgba(255,247,232,0.92); color: var(--ink-soft);
  font: italic 600 13px/1.35 var(--round);
  box-shadow: 0 4px 12px rgba(40,20,8,0.25);
  opacity: 0; pointer-events: none; transition: opacity .35s ease;
}
#thought::after { content: ''; position: absolute; left: 14px; bottom: -10px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,247,232,0.92); }
#thought.on { opacity: 1; }

/* クイズのカード(Moku Word Riddles と同じ描き方) */
#quizCard {
  position: absolute; z-index: 6; left: 50%; top: 50%;
  width: min(86%, 440px, calc((100% - 24px) * 1.6)); aspect-ratio: 16 / 10;
  max-height: calc(100% - 24px);
  transform: translate(-50%, -50%) rotate(-1.5deg) scale(.6); opacity: 0;
  border-radius: 14px;
  background: repeating-linear-gradient(180deg, transparent 0 25px, var(--paper-line) 25px 26px), var(--paper);
  box-shadow: 0 6px 0 #E3CFA8, 0 14px 26px rgba(40,20,8,0.4);
  overflow: hidden; pointer-events: none;
  transition: transform .4s cubic-bezier(.3,1.4,.5,1), opacity .25s ease;
  --u: 4px;
}
#quizCard.on { opacity: 1; transform: translate(-50%, -50%) rotate(-1.5deg) scale(1); }
#quizCard .chip { position: absolute; left: 12px; bottom: 10px; font: 800 11px var(--round); letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; color: #fff; background: #D9534F; }
.pc { position: absolute; transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scaleX(var(--fx, 1)); font-family: var(--round); font-weight: 700; line-height: 1; white-space: pre; color: var(--ink); }
.pc.vert { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.6); }
.pc.line { height: calc(var(--u) * 0.9); border-radius: 4px; background: var(--ink); }
.pc.op { color: var(--ink-soft); font-weight: 600; }
.pc.box { border: calc(var(--u) * 0.9) solid var(--ink); border-radius: calc(var(--u) * 1.5); }

/* ---------- 会話ウィンドウ ---------- */
#panel {
  position: relative; flex: 0 0 auto;
  width: min(100% - 20px, 720px);
  margin: 0 auto 30px;
  padding: 22px 18px 14px;
  border-radius: 18px;
  background: repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px), var(--paper);
  border: 3px solid var(--wood);
  box-shadow: 0 5px 0 var(--wood-dark), 0 14px 30px rgba(0,0,0,0.35);
}
#nameTag {
  position: absolute; top: -15px; left: 16px;
  padding: 4px 14px 5px; border-radius: 10px;
  background: linear-gradient(180deg, #A9673C, #7A4A2C);
  color: #FFE9C7; font: 700 14px var(--round); letter-spacing: .02em;
  box-shadow: 0 2px 0 var(--wood-dark);
}
#nameTag .crown { margin-right: 4px; }
/* ことばの切りかえ(このページだけ。会話ウィンドウの右上) */
#langBtn {
  position: absolute; top: -14px; right: 16px;
  padding: 4px 11px 5px; border-radius: 10px; border: 2px solid #E3CFA8;
  background: #FFFDF7; color: var(--wood);
  font: 700 13px var(--round); cursor: pointer;
  box-shadow: 0 2px 0 #E3CFA8;
}
#langBtn:active { transform: translateY(2px); box-shadow: none; }
#line {
  min-height: 3.2em;
  font: 600 clamp(15px, 2.3vw + 8px, 19px)/1.45 var(--round);
  color: var(--ink);
  -webkit-user-select: text; user-select: text;
  overflow-wrap: anywhere;
}
#line b { color: #A0522D; }
#next { position: absolute; right: 16px; bottom: 10px; color: var(--hi); font-size: 14px; opacity: 0; animation: nudge 1s ease-in-out infinite; }
#next.on { opacity: 1; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
#choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#choices:empty { display: none; }
#choices button, #choices a, .sheet button {
  flex: 1 1 calc(50% - 8px); min-width: 130px; min-height: 44px;
  padding: 9px 12px; border-radius: 14px;
  border: 2px solid #E3CFA8; background: #FFFDF7; color: var(--ink);
  font: 700 15px/1.2 var(--round); text-align: center; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 3px 0 #E3CFA8; cursor: pointer;
  transition: transform .08s ease, box-shadow .08s ease;
  -webkit-appearance: none; appearance: none;
}
#choices button:active, #choices a:active, .sheet button:active { transform: translateY(3px); box-shadow: 0 0 0 #E3CFA8; }
#choices .main { background: linear-gradient(180deg, #E9A86C, #C97B43); border-color: #A8612F; color: #fff; box-shadow: 0 3px 0 #874A22; }
#choices .main:active { box-shadow: 0 0 0 #874A22; }
#choices .soft { color: var(--ink-soft); }
#choices .tag { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #FFE3A6; color: #8A5A10; }
#choices .main .tag { background: rgba(255,255,255,0.28); color: #fff; }
#choices button.right { background: #DDF2D4; border-color: #8CC77E; box-shadow: 0 3px 0 #8CC77E; }
#choices button.wrong { background: #F8DCD6; border-color: #E29C8E; box-shadow: 0 3px 0 #E29C8E; opacity: .8; }
#choices button:disabled { cursor: default; }
#ideaBox, #answerBox { flex: 1 1 100%; display: flex; gap: 8px; }
#answerBox input {
  flex: 1; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid #E3CFA8; background: #fff;
  font: 700 18px/1.2 var(--round); color: var(--ink); letter-spacing: .02em;
  -webkit-user-select: text; user-select: text;
}
#answerBox input:focus { outline: 3px solid rgba(217,146,90,0.45); border-color: var(--hi); }
#ideaBox textarea {
  flex: 1; min-height: 64px; resize: none;
  padding: 10px 12px; border-radius: 12px; border: 2px solid #E3CFA8; background: #fff;
  font: 600 16px/1.35 var(--round); color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
#ideaBox textarea:focus { outline: 3px solid rgba(217,146,90,0.45); border-color: var(--hi); }

/* ---------- 上のバー ---------- */
#topBar {
  position: fixed; z-index: 42;
  top: calc(env(safe-area-inset-top, 0px) + 22px);
  left: calc(env(safe-area-inset-left, 0px) + 24px);
  display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
  max-width: calc(100vw - 210px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
}
#pickPill { order: 3; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 999px; border: 0;
  background: rgba(46,26,14,0.72); color: #FFE9C7;
  font: 700 13px var(--round); cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.pill.coin b { color: #FFD56A; }
#pickPill { display: none; }
#pickPill.on { display: inline-flex; }

/* ---------- 共通フレーム(SPEC.md §4・§5)。メニューの時だけ出す ---------- */
#title-frame { position: fixed; inset: 14px; border: 3px solid var(--hi); border-radius: 10px; pointer-events: none; z-index: 40; }
#title-frame::after { content: ''; position: absolute; inset: 5px; border: 1px solid var(--lo); border-radius: 8px; }
#hub-link {
  position: fixed; z-index: 41;
  top: calc(env(safe-area-inset-top, 0px) + 22px); right: calc(env(safe-area-inset-right, 0px) + 24px);
  font-size: 14px; font-weight: 800; color: #FFD9A8; text-decoration: none;
  text-shadow: 0 1px 3px rgba(40,20,8,0.8);
  animation: hubLinkPulse 2.2s ease-in-out infinite;
}
@keyframes hubLinkPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
#buildInfo {
  position: fixed; z-index: 41;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 9px); left: calc(env(safe-area-inset-left, 0px) + 18px);
  font-size: 10.5px; letter-spacing: 0.02em; color: rgba(255,255,255,0.28); pointer-events: none;
}
body:not(.on-title) #title-frame, body:not(.on-title) #hub-link, body:not(.on-title) #buildInfo { display: none; }

/* ---------- 会話の記録 ---------- */
.sheetWrap {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 16px;
  background: rgba(30,18,10,0.55);
}
.sheetWrap.on { display: flex; }
.sheet {
  width: min(100%, 520px); max-height: min(80vh, 640px); display: flex; flex-direction: column;
  border-radius: 18px; background: var(--paper); border: 3px solid var(--wood);
  box-shadow: 0 14px 30px rgba(0,0,0,0.4); overflow: hidden;
}
.sheet h2 { font: 700 18px var(--round); padding: 14px 16px 8px; color: var(--wood); }
.sheet .body { overflow-y: auto; padding: 0 16px 10px; -webkit-overflow-scrolling: touch; }
.sheet .foot { padding: 10px 16px 14px; display: flex; }
.logRow { margin: 8px 0; font: 600 14px/1.4 var(--round); }
.logRow .who { display: block; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--ink-soft); }
.logRow.you { text-align: right; }
.logRow.you .txt { display: inline-block; background: #FFE9C7; border-radius: 12px 12px 2px 12px; padding: 6px 10px; }
.logRow.ceo .txt { display: inline-block; background: #fff; border-radius: 12px 12px 12px 2px; padding: 6px 10px; border: 1px solid #F0DDBE; }
.logDay { text-align: center; font: 800 11px var(--round); color: var(--ink-soft); margin: 14px 0 4px; letter-spacing: .05em; }
.empty { color: var(--ink-soft); font: 600 14px var(--round); padding: 10px 0; }

/* 紙吹雪 */
.confetti { position: fixed; z-index: 55; width: 9px; height: 13px; border-radius: 2px; pointer-events: none; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(70vh) rotate(540deg); opacity: 0; } }

/* 背の低い横長の画面(スマホの横持ち): 左に社長室、右に会話ウィンドウ */
@media (max-height: 500px) and (orientation: landscape) {
  #app { flex-direction: row; align-items: center; }
  #stage { align-self: stretch; }
  #panel { width: min(54%, 470px); margin: 0 14px 0 4px; padding: 38px 12px 10px; max-height: calc(100% - 64px); overflow-y: auto; }
  #nameTag { top: 8px; }
  #langBtn { top: 8px; right: 10px; }
  #line { min-height: 2.6em; font-size: 15px; }
  #choices button, #choices a { min-height: 38px; padding: 6px 10px; font-size: 14px; min-width: 120px; }
  #buildInfo { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); }
}
@media (prefers-reduced-motion: reduce) {
  #ceo .bob, #next, #hub-link { animation: none; }
}
</style>
</head>
<body class="on-title">
<div id="app">
  <div id="stage" aria-label="Sir CEO Moku's office">
    <svg id="room" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7A86B"/><stop offset=".55" stop-color="#FBC98A"/><stop offset="1" stop-color="#FFE4B0"/></linearGradient>
        <linearGradient id="panelWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A5F38"/><stop offset="1" stop-color="#6E3F22"/></linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E5532"/><stop offset="1" stop-color="#5E3319"/></linearGradient>

      </defs>
      <!-- 壁紙 -->

        <!-- カーテン -->
        <path d="M-30 -24 Q20 110 -6 262 L-44 262 L-44 -24Z" fill="#C8584A"/>
        <path d="M370 -24 Q320 110 346 262 L384 262 L384 -24Z" fill="#C8584A"/>
        <rect x="-50" y="-30" width="440" height="16" rx="8" fill="#5E3319"/>
      </g>
      <!-- 本棚(左) -->
      <g transform="translate(40 120)">
        <rect width="200" height="330" rx="10" fill="#7A4A2C"/>
        <rect x="12" y="12" width="176" height="306" rx="6" fill="#5E3319"/>
        <rect x="12" y="110" width="176" height="10" fill="#7A4A2C"/>
        <rect x="12" y="212" width="176" height="10" fill="#7A4A2C"/>
        <g>
          <rect x="22" y="40" width="18" height="70" rx="3" fill="#E98FC7"/><rect x="42" y="30" width="16" height="80" rx="3" fill="#6E7BFF"/>
          <rect x="60" y="46" width="20" height="64" rx="3" fill="#FFC94A"/><rect x="82" y="36" width="14" height="74" rx="3" fill="#2EC4B6"/>
          <!-- トロフィー -->
          <path d="M128 64 h36 v12 q0 22 -18 26 q-18 -4 -18 -26z" fill="#F2C14E"/><rect x="140" y="100" width="12" height="6" fill="#D9A23A"/><rect x="132" y="104" width="28" height="6" rx="2" fill="#B9842A"/>
        </g>
        <g>
          <!-- Moku のぬいぐるみ -->
          <ellipse cx="60" cy="192" rx="28" ry="22" fill="#C99A6B"/><circle cx="50" cy="186" r="7" fill="#fff"/><circle cx="70" cy="186" r="7" fill="#fff"/>

  var IDEA_RULES = [
    { re: /race|kart|car|drive|fast|speed|track|bike|レース|カート|車|くるま|はやい|速い|自転車/, say: ['Vroom! Speed is exciting, moku. What is the silliest thing on your track?', 'ブーン!スピードはワクワクするモク。コースにある、いちばんヘンなものはなにモク?'], mood: 'star' },
    { re: /puzzle|match|block|drop|brain|maze|riddle|パズル|なぞ|謎|めいろ|迷路|ブロック/, say: ['A puzzle! My brain loves puzzles. My brain also loves naps.', 'パズルモク!ワタシの脳みそはパズルが大好きモク。おひるねも大好きモク。'], mood: 'happy' },
    { re: /fight|battle|ninja|sword|robot|monster|boss|たたかい|戦|バトル|忍者|にんじゃ|ロボット|モンスター|ボス/, say: ['Action! Just remember: nobody gets really hurt. Only bonked. Gently, moku.', 'アクションモク!でも、だれも本当にケガしないようにモク。ポコッとやさしくモク。'], mood: 'showOff' },
    { re: /food|cook|cake|cookie|pizza|bento|candy|sweet|ice cream|donut|snack|食べ|たべ|料理|りょうり|ケーキ|クッキー|ピザ|弁当|べんとう|おかし|お菓子|アイス|ドーナツ|ごはん/, say: ['Food?! My stomach says YES. That is my best business advice, moku.', 'たべもの?!ワタシのおなかが「やるモク!」って言ってるモク。社長の一番のアドバイスモク。'], mood: 'cookie' },
    { re: /animal|cat|dog|fish|pet|bird|owl|bunny|rabbit|horse|dino|動物|どうぶつ|ねこ|猫|いぬ|犬|さかな|魚|ペット|鳥|とり|ふくろう|うさぎ|恐竜|きょうりゅう/, say: ['Animals! Cute things win. I am cute. Ask anyone. Ask my mom.', 'どうぶつモク!かわいいは最強モク。ワタシもかわいいモク。ワタシのママに聞くモク。'], mood: 'heart' },
    { re: /space|rocket|planet|star|alien|moon|宇宙|うちゅう|ロケット|星|ほし|月|つき/, say: ['To space! Big question: who pays for the rocket? …Not me, moku.', '宇宙へモク!大問題: ロケット代はだれが払うモク?…ワタシじゃないモク。'], mood: 'sweat' },
    { re: /music|song|dance|sing|rhythm|piano|drum|音楽|おんがく|歌|うた|ダンス|リズム|ピアノ|ドラム/, say: ['A beat! Can I sing in it? Please? I am very good. (I am not.)', '音楽モク!ワタシも歌っていいモク?すごく上手モク。(上手じゃないモク)'], mood: 'laugh' },
    { re: /city|build|house|tree|forest|garden|nature|farm|plant|街|まち|町|建|家|いえ|木|森|もり|庭|にわ|畑|はたけ|自然/, say: ['Building! Remember our rule: keep lots of green. Trees make everyone happy, moku.', 'ものづくりモク!会社のルールを忘れずに: 緑をたくさん残すモク。木があるとみんなうれしいモク。'], mood: 'happy' },
    { re: /money|shop|store|mall|sell|buy|coin|bank|business|お金|おかね|店|みせ|ショップ|モール|売|買|コイン|銀行/, say: ['MONEY?! Finally! Someone who speaks my language, moku!', 'お金?!やっと話の合う人が来たモク!'], mood: 'moint' },
    { re: /friend|team|together|party|multi|online|class|友|とも|みんな|チーム|パーティ|いっしょ|一緒|クラス/, say: ['With friends! Games are better together. Even I have friends. Two. Maybe three.', '友だちとモク!ゲームはみんなでやるともっと楽しいモク。ワタシにも友だちがいるモク。2人。いや3人モク。'], mood: 'wink' },
    { re: /school|study|learn|english|math|homework|quiz|学校|がっこう|勉強|べんきょう|英語|えいご|算数|さんすう|宿題|しゅくだい|クイズ/, say: ['A learning game! Smart. Like a tutor that tells jokes. I approve, moku.', '勉強のゲームモク!かしこいモク。ジョークを言う家庭教師みたいモク。社長が許可するモク。'], mood: 'star' }
  ];
  var IDEA_QUESTIONS = [
    ['Who is the hero? Is it me? It is me, right?', '主人公はだれモク?ワタシ?ワタシだよねモク?'],
    ['What makes it fun the 10th time you play?', '10回目に遊んでも楽しいのは、どうしてモク?'],
    ['What is the very first thing the player does?', 'プレイヤーがいちばん最初にすることはなにモク?'],
    ['How do you win? And what happens when you lose?', 'どうしたら勝ちモク?負けたらどうなるモク?'],
    ['Draw it on paper first. Then tell the team. Real game makers do that!', 'まず紙に絵をかいてみるモク。それからチームに話すモク。本物のゲーム作りの人もそうするモク!'],
    ['What would make your friends laugh out loud?', '友だちが大笑いするのは、どんなところモク?']
  ];
  function ideaTalk() {
    return talk([{ t: tr('A new game idea? Tell me everything, moku. I am ready. (I have my notebook. It is a cookie box.)',
                         '新しいゲームのアイデア?ぜんぶ聞かせるモク。準備OKモク。(メモ帳はあるモク。クッキーの箱だけどモク)'), mood: 'star', close: true }]).then(function () {
      pendingTap = false;
      return new Promise(function (resolve) {
        var box = $('choices');
        box.innerHTML = '<div id="ideaBox"><textarea id="ideaText" maxlength="160" aria-label="Your game idea"></textarea></div>';
        $('ideaText').placeholder = tr('My idea is a game where…', 'こんなゲーム: …');
        var send = document.createElement('button'); send.type = 'button'; send.className = 'main'; send.textContent = tr('📨 Tell Sir CEO', '📨 社長に話す');
        var back = document.createElement('button'); back.type = 'button'; back.className = 'soft'; back.textContent = tr('Never mind', 'やっぱりやめる');
        box.appendChild(send); box.appendChild(back);
        send.addEventListener('click', function () {
          var v = $('ideaText').value.replace(/\s+/g, ' ').trim();
          if (v.length < 2) { $('ideaText').focus(); return; }
          resolve(v);
        });
        back.addEventListener('click', function () { resolve(null); });
        setTimeout(function () { try { $('ideaText').focus(); } catch (e) {} }, 50);
      });
    }).then(function (text) {
      if (!text) return menu(tr('Okay! My door is always open. Well, mostly, moku.', 'わかったモク!社長室のドアはいつでも開いてるモク。…だいたいモク。'));
      remember('you', text);
      mem.ideas.push({ day: today, text: text.slice(0, 160) });
      if (mem.ideas.length > IDEAS_MAX) mem.ideas = mem.ideas.slice(-IDEAS_MAX);
      saveMem();
      var low = text.toLowerCase();
      var rule = null;
      for (var i = 0; i < IDEA_RULES.length; i++) if (IDEA_RULES[i].re.test(low)) { rule = IDEA_RULES[i]; break; }
      var stars = 4 + (text.length % 2);       // CEO の評価はいつも ★4 か ★5(子どもの案を下げない)
      var lines = [
        { t: rule ? L(rule.say) : tr('Hmm… interesting… VERY interesting. I have no idea what to say, so: GREAT, moku!', 'ふむ…おもしろい…すごーくおもしろいモク。なんて言えばいいか分からないから…最高モク!'),
          mood: rule ? rule.mood : 'sideEye', close: true, hop: true },
        { t: tr('Sir CEO\'s rating: ', '社長の評価: ') + '<b>' + '⭐'.repeat(stars) + '</b>. ' + L(rand(IDEA_QUESTIONS)), mood: 'showOff' }
      ];
      if (mem.ideas.length >= 3) lines.push({ t: tr('That is idea number ' + mem.ideas.length + '! I keep them all in my cookie box, moku.', 'これで ' + mem.ideas.length + ' こめのアイデアモク!ぜんぶクッキーの箱にしまってあるモク。'), mood: 'happy' });
      return talk(lines).then(function () { return menu(menuLine()); });
    });
  }

  // ---------- おしゃべり ----------
  var CHATS = [
    { q: ['Quick question. Do you like snacks?', 'ちょっと質問モク。おかしは好きモク?'], mood: 'cookie', a: [
      { label: ['Yes! 🍪', '好き!🍪'], r: ['Correct answer. You may stay, moku.', '正解モク。ここにいていいモク。'], mood: 'happy' },
      { label: ['Not really', 'そんなに'], r: ['…I will pretend I did not hear that. More for me, moku.', '…聞かなかったことにするモク。ワタシの分がふえるモク。'], mood: 'sweat' }] },
    { q: ['What is harder: being a CEO, or doing homework?', '社長と宿題、どっちがたいへんモク?'], mood: 'sideEye', a: [
      { label: ['Homework!', '宿題!'], r: ['Exactly! That is why I became a CEO. No homework. Only… paperwork. Oh no.', 'そのとおりモク!だから社長になったモク。宿題はないモク。書類はあるけど…。あれ?モク。'], mood: 'surprised' },
      { label: ['Being a CEO!', '社長!'], r: ['Thank you! Finally someone understands me, moku.', 'ありがとうモク!やっと分かってくれる人がいたモク。'], mood: 'cry' }] },
    { q: ['I want to buy something for the office. A jet, or a scooter?', '会社に何か買いたいモク。ジェット機とキックボード、どっちモク?'], mood: 'star', a: [
      { label: ['A jet! ✈️', 'ジェット機!✈️'], r: ['Great idea! …I checked my wallet. Scooter it is, moku.', 'いいねモク!…おさいふを見たモク。キックボードにするモク。'], mood: 'sweat' },
      { label: ['A scooter 🛴', 'キックボード 🛴'], r: ['Smart and cheap. You think like a CEO, moku.', 'かしこくてお安いモク。キミは社長の考え方をしてるモク。'], mood: 'wink' }] },
    { q: ['Guess how many Moints I have.', 'ワタシが Moint をいくつ持ってるか当ててモク。'], mood: 'showOff', a: [
      { label: ['A million!', '100万!'], r: ['Ho ho! Yes! …Maybe not a million. Maybe twelve.', 'ホッホッ!そうモク!…100万はないかもモク。12くらいモク。'], mood: 'laugh' },
      { label: ['Zero?', 'ゼロ?'], r: ['Zero?! …How did you know, moku.', 'ゼロ?!…なんで分かったモク。'], mood: 'sweat' }] },
    { q: ['Do owls need sleep? Asking for a friend. The friend is me.', 'ふくろうって寝なきゃダメモク?友だちのために聞いてるモク。友だちはワタシモク。'], mood: 'sleepy', a: [
      { label: ['Yes, sleep!', '寝なきゃ!'], r: ['Then this meeting is now a nap meeting. Zzz… just kidding, moku.', 'じゃあこの会議はおひるね会議モク。Zzz…うそモク。'], mood: 'sleepy' },
      { label: ['No, work!', '働いて!'], r: ['You sound like my calendar. Scary, moku.', 'ワタシの予定表みたいなこと言うモク。こわいモク。'], mood: 'surprised' }] },
    { q: ['Rain or sunshine?', '雨と晴れ、どっちが好きモク?'], mood: 'happy', a: [
      { label: ['Sunshine ☀️', '晴れ ☀️'], r: ['Me too. My office window has the best sunset. Look!', 'ワタシもモク。社長室の窓から見える夕日はさいこうモク。見て!'], mood: 'happy' },
      { label: ['Rain ☔', '雨 ☔'], r: ['Rain is cozy. Good for indoor games. Good for business, moku!', '雨もいいモク。おうちでゲーム日和モク。会社ももうかるモク!'], mood: 'moint' }] },
    { q: ['If you were the CEO for one day, what would you do first?', '1日だけ社長になったら、最初になにするモク?'], mood: 'sideEye', a: [
      { label: ['Free snacks!', 'おかし食べ放題!'], r: ['A snack-loving leader. I like you. Do not take my job, moku.', 'おかし好きの社長モク。気に入ったモク。でもワタシの席はゆずらないモク。'], mood: 'cookie' },
      { label: ['Make a new game', '新しいゲームを作る'], r: ['A builder! Tell me your idea anytime. Press “I have a game idea”, moku.', '作る人モク!アイデアはいつでも聞くモク。「ゲームのアイデアがある」を押すモク。'], mood: 'star' }] }
  ];
  // 最近遊んだゲームの話(この端末のセーブがあるか、だけを見る)
  function playedGames() {
    var out = [];
    TALK_GAMES.forEach(function (p) {
      try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('moku:' + p.id + ':') === 0) { out.push(p); break; } } } catch (e) {}
    });
    return out;
  }
  // 突発クイズはおしゃべりの途中だけで出る。その日のおしゃべりが増えるほど出やすく、3回目には必ず
  function quizChance() {
    if (mem.quiz.day === today) return 0;
    var n = mem.chat && mem.chat.day === today ? mem.chat.n : 0;
    return n >= 3 ? 1 : n === 2 ? 0.5 : 0.2;
  }
  function chat() {
    mem.talks += 1;
    if (!mem.chat || mem.chat.day !== today) mem.chat = { day: today, n: 0 };
    mem.chat.n += 1;
    saveMem();
    var played = playedGames();
    var useGame = played.length && Math.random() < 0.35;
    var c = useGame ? null : CHATS[(mem.talks + Math.floor(Math.random() * 3)) % CHATS.length];
    var p = useGame
      ? (function () {
          var g = rand(played);
          return talk([{ t: tr('I saw you played ' + gameTag(g) + '. Me too! Was it fun?', gameTag(g) + ' で遊んだの、見たモク。ワタシも遊んだモク!楽しかったモク?'), mood: 'happy', close: true }]).then(function () {
            return ask([{ label: tr('So fun!', 'すごく楽しい!'), value: 1 }, { label: tr('It was hard…', 'むずかしかった…'), value: 0 }]);
          }).then(function (v) {
            return talk([v ? { t: tr('Good! Fun is our #1 product, moku.', 'よかったモク!「楽しい」はワタシの会社の一番の商品モク。'), mood: 'showOff' }
                           : { t: tr('Hard is good. It means you are getting stronger. I lose all the time. ALL the time, moku.', 'むずかしいのはいいことモク。強くなってる証拠モク。ワタシはいつも負けてるモク。いつもモク。'), mood: 'wink' }]);
          });
        })()
      : talk([{ t: L(c.q), mood: c.mood, close: true }]).then(function () {
          return ask(c.a.map(function (a, i) { return { label: L(a.label), value: i }; }));
        }).then(function (i) { var a = c.a[i]; return talk([{ t: L(a.r), mood: a.mood, hop: true }]); });
    return p.then(function () {
      // ときどき突発クイズか、寄付のおねだり
      if (Math.random() < quizChance()) return quiz();
      if (canAskDonation() && Math.random() < 0.35) return donation();
      return menu(menuLine());
    });
  }

  // ---------- 寄付のおねだり(ゲーム内の Moint だけ。断っても何も起きない) ----------
  function canAskDonation() { return !!M && mem.donate.askedDay !== today && M.balance() >= DONATION_MIN_BALANCE; }
  function donation() {
    mem.donate.askedDay = today; saveMem();
    return talk([
      { t: tr('Psst. {name}. Come closer.', 'ねえねえ、{name}。ちょっとこっちに来るモク。'), mood: 'sideEye', close: true },
      { t: tr('The Moku Company is a little short on… snack money. Could you donate <b>' + DONATION + ' Moints</b>? It is totally fine to say no, moku.',
              'Moku の会社、ちょっと…おやつ代が足りないモク。<b>' + DONATION + ' Moint</b> 寄付してくれないモク?ことわっても全然いいモク。'), mood: 'moint' }
    ]).then(function () {
      return ask([{ label: tr('🪙 Donate ' + DONATION, '🪙 ' + DONATION + ' 寄付する'), value: 1, cls: 'main' }, { label: tr('Nope!', 'やだ!'), value: 0 }]);
    }).then(function (yes) {
      if (yes && M && M.balance() >= DONATION) {
        M.add(-DONATION);
        mem.donate.count += 1; mem.donate.total += DONATION; saveMem();
        coin();
        return talk([
          { t: tr('THANK YOU! I will spend it wisely. On cookies. …For the company, of course.', 'ありがとうモク!大事に使うモク。クッキーに。…もちろん会社のためモク。'), mood: 'cookie', hop: true },
          { t: tr('Your name is now on my Wall of Kind Birds. Donations so far: <b>' + mem.donate.total + ' Moints</b>.', 'キミの名前を「やさしい鳥のかべ」に書いておいたモク。今までの寄付: <b>' + mem.donate.total + ' Moint</b>。'), mood: 'heart' }
        ]);
      }
      return talk([{ t: tr('Fair! A smart businessbird keeps their Moints. I respect that, moku.', 'なるほどモク!かしこい鳥は Moint を大事にするモク。そんけいするモク。'), mood: 'showOff' }]);
    }).then(function () { return menu(menuLine()); });
  }

  // ---------- さよなら ----------
  function bye() {
    return talk([
      { t: L(rand([
        ['Bye, {name}! Go play. That is an order from the CEO, moku.', 'またね、{name}!遊んでくるモク。社長命令モク。'],
        ['See you! Play my pick, then come back for your bonus, moku!', 'またモク!おすすめで遊んだら、ボーナスをもらいにもどってくるモク!'],
        ['Off you go! I will just… sit here. Being important.', 'いってらっしゃいモク!ワタシはここで…すわってるモク。エラそうに。']
      ])), mood: 'wink', hop: true }
    ]).then(function () {
      return ask([
        { label: pick.icon + tr(' Play ', ' ') + pick.name + tr('', ' で遊ぶ'), href: pick.file, cls: 'main', tag: pick.moint ? '+20%' : '+' + PLAY_BONUS },
        { label: tr('🎮 All games', '🎮 ゲーム一覧'), href: 'hub.html' },
        { label: tr('↩ Wait, one more thing', '↩ ちょっと待って'), value: 'back', cls: 'soft' }
      ]);
    }).then(function () { return menu(menuLine()); });
  }

  // ---------- 会話の記録 ----------
  function openLog() {
    var body = $('logBody'), html = '', lastDay = '';
    if (!mem.log.length) html = '<p class="empty">' + tr('No talks yet.', 'まだ話していないモク。') + '</p>';
    mem.log.forEach(function (row) {
      var d = new Date(row.at);
      var label = isNaN(d) ? '' : d.toLocaleDateString(ja() ? 'ja-JP' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      if (label !== lastDay) { html += '<div class="logDay">' + esc(label) + '</div>'; lastDay = label; }
      html += '<div class="logRow ' + (row.who === 'you' ? 'you' : 'ceo') + '"><span class="who">' + (row.who === 'you' ? tr('YOU', 'キミ') : tr('SIR CEO MOKU', 'モク社長')) + '</span><span class="txt">' + esc(row.text) + '</span></div>';
    });
    body.innerHTML = html;
    $('logSheet').classList.add('on');
    body.scrollTop = body.scrollHeight;
  }
  $('logClose').addEventListener('click', function () { $('logSheet').classList.remove('on'); });
  $('logSheet').addEventListener('click', function (e) { if (e.target === $('logSheet')) $('logSheet').classList.remove('on'); });
  $('coinPill').addEventListener('click', function () {
    think(tr('You have ' + $('coinVal').textContent + ' Moints. Not that I am counting. (I am counting.)',
             'キミは ' + $('coinVal').textContent + ' Moint 持ってるモク。べつに数えてないモク。(数えてるモク)'), 'moint', 3000);
  });

  // ---------- ことばの切りかえ ----------
  function paintLang() {
    document.documentElement.lang = ja() ? 'ja' : 'en';
    $('langBtn').textContent = ja() ? '🌐 English' : '🌐 日本語';
    $('langBtn').setAttribute('aria-label', ja() ? 'Switch to English' : '日本語にする');
    $('nameTagText').textContent = tr('Sir CEO Moku', 'モク社長');
    $('logTitle').textContent = tr('📜 Our Talks', '📜 これまでの話');
    $('logClose').textContent = tr('Close', 'とじる');
    paintPick();
  }
  $('langBtn').addEventListener('click', function () {
    settings.lang = ja() ? 'en' : 'ja';
    saveSettings();
    paintLang();
    // メニューの時はすぐに新しいことばで出し直す。会話の途中なら次のセリフから
    if (atMenu && !busy) menu(tr('Okay! English it is, moku!', 'オッケー!ここからは日本語で話すモク!'));
  });

  function confetti() {
    var colors = ['#F2C14E', '#E98FC7', '#4CBE55', '#6E7BFF', '#FF8A5B'];
    for (var i = 0; i < 26; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = (10 + Math.random() * 80) + 'vw';
      c.style.top = (5 + Math.random() * 20) + 'vh';
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(c);
      setTimeout(function (el) { return function () { el.remove(); }; }(c), 2100);
    }
  }

  // ---------- はじまり ----------
  layout();
  setMood('usual');
  paintLang();
  loadRiddles();
  greeting().then(function () {
    var first = !pickIsOn();
    var p = first ? announcePick() : bonusTalk();
    return p.then(function () {
      return menu(first ? tr('So, what shall we do, moku?', 'さて、なにするモク?') : menuLine());
    });
  });
})();
</script>
</body>
</html>
