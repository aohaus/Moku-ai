<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="shared/moku-errors.js?v=20261031c"></script>
<script src="shared/moku-gate.js?v=20261031c"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Moku Watch 6 Lazy</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
:root {
  --hi: #FFA552; --lo: #7A4214;
  --u: 3.4px;
  --ink: #3B2A20;
  --paper: #FBF4E6;
  --tan: #D49A6A;
  --teal: #2A9D8F;
}
body {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,170,100,0.30), transparent 60%),
    linear-gradient(180deg, #3a2430 0%, #5a3428 55%, #2a1a14 100%);
  color: #EDEEF6;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ---------- shared frame / hub link (Moku series design system) ---------- */
#title-frame {
  position: fixed; inset: 14px;
  border: 3px solid var(--hi);
  border-radius: 10px;
  pointer-events: none;
  z-index: 40;
}
#title-frame::after {
  content: '';
  position: absolute; inset: 5px;
  border: 1px solid var(--lo);
  border-radius: 8px;
}
#hub-link {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  z-index: 41;
  font-size: 14px;
  font-weight: 800;
  color: var(--hi);
  text-decoration: none;
  animation: hubLinkPulse 2.2s ease-in-out infinite;
}
@keyframes hubLinkPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
#buildInfo {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 18px);
  z-index: 41;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: rgba(255,255,255,0.28);
  pointer-events: none;
}
body:not(.on-title) #title-frame,
body:not(.on-title) #hub-link,
body:not(.on-title) #buildInfo,
body:not(.on-title) #titleScreen { display: none; }
body.on-title #watchScreen { display: none; }

/* ---------- title screen ---------- */
#titleScreen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
#titleHero {
  width: min(52vw, 230px, 34vh);
  aspect-ratio: 1;
  object-fit: cover;
  object-position: center 30%;
  filter: drop-shadow(0 0 22px rgba(255,165,82,0.55));
  animation: heroFloat 3.4s ease-in-out infinite;
}
@keyframes heroFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
.title-zzz {
  position: absolute; font-weight: 800; color: #FFE2B8; opacity: 0;
  animation: zzz 3s ease-in-out infinite;
}
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 0) scale(0.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -40px) scale(1.2); } }
#titleHeroWrap { position: relative; }
#titleName {
  margin-top: 14px;
  font-size: clamp(30px, 8vw, 46px);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.05;
  color: #FFF4E2;
  text-shadow: 0 3px 0 var(--lo), 0 8px 24px rgba(0,0,0,0.4);
}
#titleName span { display: block; color: var(--hi); font-size: 0.62em; letter-spacing: 0.04em; margin-top: 6px; }
#titleTag { margin-top: 10px; font-size: 14px; color: rgba(255,244,226,0.75); font-weight: 600; }
.titleMenu { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.titleMenuItem {
  font-size: 19px; font-weight: 800;
  padding: 8px 18px;
  color: #FFF4E2;
  border-radius: 999px;
}
.titleMenuItem:hover, .titleMenuItem:focus-visible { color: var(--hi); text-shadow: 0 0 12px rgba(255,165,82,0.7); outline: none; }

/* ---------- watch screen ---------- */
#watchScreen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#watchTop {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 5;
}
.chip-btn {
  font-size: 13px; font-weight: 800;
  color: #FFE2B8;
  background: rgba(0,0,0,0.25);
  padding: 7px 12px;
  border-radius: 999px;
}
#lazyRank { font-size: 12px; font-weight: 800; color: #FFE2B8; opacity: 0.85; }

.watch { position: relative; width: calc(var(--u) * 100); height: calc(var(--u) * 112); }
.strap {
  position: absolute; left: 50%;
  width: calc(var(--u) * 62);
  height: 60vh;
  transform: translateX(-50%);
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0 3px, transparent 3px 9px),
    linear-gradient(90deg, #8a5a34, #b07a4a 45%, #9a6a40 70%, #7a4e2c);
  border-left: 2px solid rgba(0,0,0,0.25);
  border-right: 2px solid rgba(0,0,0,0.25);
  z-index: 0;
}
.strap::before {
  content: ''; position: absolute; left: 7%; right: 7%; top: 0; bottom: 0;
  border-left: 2px dashed rgba(255,226,184,0.45);
  border-right: 2px dashed rgba(255,226,184,0.45);
}
.strap.top { bottom: 88%; border-radius: 12px 12px 0 0; }
.strap.bottom { top: 88%; border-radius: 0 0 12px 12px; }
.strap.bottom::after {
  content: ''; position: absolute; left: 50%; top: calc(var(--u) * 36);
  width: calc(var(--u) * 5); height: calc(var(--u) * 5);
  transform: translateX(-50%);
  border-radius: 50%;
  background: #4a2e1a;
  box-shadow: 0 calc(var(--u) * 10) 0 #4a2e1a, 0 calc(var(--u) * 20) 0 #4a2e1a;
}
.bezel {
  position: absolute; inset: 0;
  border-radius: calc(var(--u) * 26);
  padding: calc(var(--u) * 3.6);
  background: linear-gradient(145deg, #f3d6a8, #c8955f 40%, #8a5a34 100%);
  box-shadow: 0 18px 40px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.25);
  z-index: 1;
}
.crown {
  position: absolute; right: calc(var(--u) * -3); top: 34%;
  width: calc(var(--u) * 4.5); height: calc(var(--u) * 13);
  border-radius: 6px;
  background: repeating-linear-gradient(180deg, #c8955f 0 3px, #8a5a34 3px 5px);
  z-index: 0;
}
.crown.c2 { top: 58%; height: calc(var(--u) * 9); }
.screen {
  position: relative; width: 100%; height: 100%;
  border-radius: calc(var(--u) * 22.5);
  background: var(--paper);
  overflow: hidden;
  color: var(--ink);
  font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", ui-rounded, "Hiragino Maru Gothic ProN", -apple-system, "Segoe UI", Roboto, sans-serif;
  box-shadow: inset 0 0 0 calc(var(--u) * 0.8) rgba(59,42,32,0.85);
  touch-action: pan-y;
}
.track {
  display: flex; width: 400%; height: 100%;
  transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
}
.track.dragging { transition: none; }
.face { position: relative; width: 25%; height: 100%; padding: calc(var(--u) * 6) calc(var(--u) * 6.5); }

/* ink-drawn tiles, like the original whiteboard sketch */
.tile {
  position: relative;
  border: calc(var(--u) * 0.9) solid var(--ink);
  border-radius: calc(var(--u) * 4);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 800;
  line-height: 1.05;
  color: var(--ink);
  transition: transform 0.12s ease;
  overflow: hidden;
}
.tile:active, .tile.pressed { transform: scale(0.94); }
.tile svg { width: 72%; height: 72%; }

/* main face */
.mf-top {
  position: relative;
  height: 66%;
  border-bottom: calc(var(--u) * 0.9) solid var(--ink);
  display: flex; align-items: flex-end; justify-content: center;
}
#clock {
  position: absolute; left: calc(var(--u) * 1); top: 0;
  font-size: calc(var(--u) * 7.4); font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
}
#clockDate { display: block; font-size: calc(var(--u) * 3.1); opacity: 0.6; margin-top: calc(var(--u) * 0.8); letter-spacing: 0.04em; }
#lazyMeter {
  position: absolute; right: 0; top: calc(var(--u) * 0.6);
  text-align: right;
  font-size: calc(var(--u) * 3); font-weight: 800; opacity: 0.85; line-height: 1.15;
}
#lazyMeter b { display: block; font-size: calc(var(--u) * 4.4); color: #C2611F; font-variant-numeric: tabular-nums; }
#mokuBtn { width: calc(var(--u) * 58); height: calc(var(--u) * 58); margin-bottom: calc(var(--u) * -1); }
#mokuBtn svg { width: 100%; height: 100%; overflow: visible; }
#mokuBtn:active svg { transform: scale(0.97); }
.mf-bottom {
  height: 34%;
  display: grid; grid-template-columns: 1.25fr 1fr 1fr;
  align-items: center;
  padding-top: calc(var(--u) * 2.5);
}
.mf-cell {
  height: 100%;
  display: flex; align-items: center; justify-content: center;
  border-left: calc(var(--u) * 0.6) dashed rgba(59,42,32,0.55);
}
.mf-cell:first-child { border-left: none; }
.mf-cell > button { width: 88%; height: 82%; display: flex; align-items: center; justify-content: center; border-radius: calc(var(--u) * 3); }
.mf-cell > button:active { transform: scale(0.92); background: rgba(255,165,82,0.18); }
.mf-cell svg { width: 78%; height: 78%; }
#orderBtn { font-size: calc(var(--u) * 6.4); font-weight: 800; letter-spacing: 0.01em; }

/* sub face */
.sub-grid {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: 1fr 1fr 1.75fr;
  gap: calc(var(--u) * 2.4);
}
#tSettings { grid-area: 1 / 1; background: #EDE3D3; }
#tLunch    { grid-area: 1 / 2; background: #FFE3B3; }
#tSteps    { grid-area: 1 / 3; background: #F9D9C0; }
#tCal      { grid-area: 2 / 3; background: #FFD0C2; }
#tQuiz     { grid-area: 1 / 4 / 3 / 5; background: #D9ECD8; font-size: calc(var(--u) * 5); }
#tQuiz span { display: block; text-align: center; line-height: 1; }
#tDex      { grid-area: 2 / 1 / 3 / 3; background: #F7E7A8; font-size: calc(var(--u) * 4.4); }
#tSleep    { grid-area: 3 / 1 / 4 / 3; background: #DCD6F2; font-size: calc(var(--u) * 4.5); padding: calc(var(--u) * 1.5); text-align: center; }
#tWalk     { grid-area: 3 / 3 / 4 / 5; background: #CFE8F2; font-size: calc(var(--u) * 4.5); padding: calc(var(--u) * 1.5); text-align: center; }
.tile small { display: block; font-size: 0.62em; opacity: 0.65; margin-top: calc(var(--u) * 1.2); letter-spacing: 0.02em; }
.excl { letter-spacing: 0.04em; }

/* extra face (right of the main face) */
.extra-grid {
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1.25fr 1fr;
  gap: calc(var(--u) * 2.6);
}
#tNothing { grid-column: 1 / 3; background: #E4EFD9; flex-direction: row; gap: calc(var(--u) * 2); padding: calc(var(--u) * 2); font-size: calc(var(--u) * 5); text-align: left; }
#tNothing svg { width: calc(var(--u) * 26); height: calc(var(--u) * 26); flex: none; }
#tAlarm  { background: #FFE3B3; font-size: calc(var(--u) * 4.4); }
#tExcuse { background: #F3DCEB; font-size: calc(var(--u) * 4.4); }
#alarmIcon, #excuseIcon { display: block; width: 58%; aspect-ratio: 1; }
#alarmIcon svg, #excuseIcon svg { width: 100%; height: 100%; }
#nothingIcon { display: block; flex: none; }
.excuse-card {
  position: relative;
  width: 100%;
  border: calc(var(--u) * 0.8) solid var(--ink);
  border-radius: calc(var(--u) * 5);
  background: #FFF;
  padding: calc(var(--u) * 3.4) calc(var(--u) * 3);
  font-weight: 800;
  font-size: calc(var(--u) * 4.6);
  line-height: 1.3;
}
.excuse-card::after {
  content: ''; position: absolute; left: 22%; bottom: calc(var(--u) * -3.4);
  width: calc(var(--u) * 5); height: calc(var(--u) * 5);
  background: #FFF;
  border-right: calc(var(--u) * 0.8) solid var(--ink);
  border-bottom: calc(var(--u) * 0.8) solid var(--ink);
  transform: rotate(45deg);
}
/* Moku Moku: the LCD pet face */
/* The pink device body fills the whole screen up to the watch frame (the screen's own rounded edge
   clips it); the padding keeps the contents where they were when the body sat inside a white margin. */
.pet {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 2.6);
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.45), transparent 40%),
    #F2C7A8;
  padding: calc(var(--u) * 7.8);
}
#petFace { padding: 0; }
.pet-head { display: flex; align-items: center; gap: calc(var(--u) * 2.4); }
.pet-name { font-weight: 800; font-size: calc(var(--u) * 4.4); letter-spacing: 0.08em; }
.pet-help {
  width: calc(var(--u) * 7); height: calc(var(--u) * 7);
  border-radius: 50%;
  border: calc(var(--u) * 0.7) solid var(--ink);
  background: #FFF4E2;
  font-weight: 800; font-size: calc(var(--u) * 4.2); line-height: 1;
}
.pet-help:active { transform: scale(0.9); }
.help-sec { width: 100%; text-align: left; }
.help-sec h3 { font-size: calc(var(--u) * 4.6); margin: calc(var(--u) * 1) 0 calc(var(--u) * 1.4); }
.help-row { display: flex; gap: calc(var(--u) * 2.4); align-items: flex-start; margin-bottom: calc(var(--u) * 1.8); font-size: calc(var(--u) * 3.7); line-height: 1.3; }
.help-key {
  flex: none;
  width: calc(var(--u) * 8); height: calc(var(--u) * 8);
  display: flex; align-items: center; justify-content: center;
  border-radius: calc(var(--u) * 1.6);
  background: #9CA87C;
  font-weight: 800;
}
.help-key.btn { border-radius: 50%; background: #FFA552; border: calc(var(--u) * 0.6) solid var(--ink); }
.help-key canvas { width: 70%; height: auto; image-rendering: pixelated; }
.pet-lcd {
  width: 100%;
  padding: calc(var(--u) * 1.6);
  border: calc(var(--u) * 0.9) solid var(--ink);
  border-radius: calc(var(--u) * 3);
  background: #7A6A55;
  box-shadow: inset 0 calc(var(--u) * 0.8) 0 rgba(0,0,0,0.25);
}
#petLcd { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: calc(var(--u) * 1); }
.pet-btns { display: flex; gap: calc(var(--u) * 7); }
.pet-btns button {
  width: calc(var(--u) * 11); height: calc(var(--u) * 11);
  border-radius: 50%;
  border: calc(var(--u) * 0.8) solid var(--ink);
  background: #FFA552;
  box-shadow: 0 calc(var(--u) * 0.9) 0 var(--ink);
  font-weight: 800; font-size: calc(var(--u) * 4);
}
.pet-btns button:active { transform: translateY(calc(var(--u) * 0.8)); box-shadow: 0 0 0 var(--ink); }
.bell { width: calc(var(--u) * 30); height: calc(var(--u) * 30); }
.bell.ringing { animation: ring 0.12s ease-in-out infinite alternate; }
.ink-btn:disabled { opacity: 0.4; }

/* page dots */
#dots { margin-top: calc(var(--u) * 7 + 8px); display: flex; gap: 10px; z-index: 3; position: relative; }
#dots button { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,226,184,0.3); }
#dots button.on { background: #FFE2B8; width: 24px; border-radius: 6px; }
#swipeHint { margin-top: 8px; font-size: 12px; font-weight: 700; color: rgba(255,226,184,0.6); z-index: 3; position: relative; }

/* app overlay (inside the watch screen) */
.layer {
  position: absolute; inset: 0;
  background: var(--paper);
  z-index: 10;
  display: none;
  flex-direction: column;
  padding: calc(var(--u) * 6) calc(var(--u) * 7) calc(var(--u) * 6);
}
.layer.show { display: flex; animation: appIn 0.22s ease-out; }
@keyframes appIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
.app-head { display: flex; align-items: center; gap: calc(var(--u) * 2); margin-bottom: calc(var(--u) * 2.5); }
.app-back {
  width: calc(var(--u) * 9); height: calc(var(--u) * 9);
  border-radius: 50%;
  border: calc(var(--u) * 0.7) solid var(--ink);
  font-size: calc(var(--u) * 5.4); font-weight: 800; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  flex: none;
}
.app-title { font-size: calc(var(--u) * 5.6); font-weight: 800; line-height: 1.05; }
.app-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  font-size: calc(var(--u) * 4.2);
  line-height: 1.3;
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
  gap: calc(var(--u) * 2.4);
  touch-action: pan-y;
}
.app-body::-webkit-scrollbar { display: none; }
.big-num { font-size: calc(var(--u) * 12); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.muted { opacity: 0.65; font-size: 0.9em; }
.ink-btn {
  border: calc(var(--u) * 0.8) solid var(--ink);
  border-radius: 999px;
  padding: calc(var(--u) * 2) calc(var(--u) * 5);
  font-weight: 800;
  font-size: calc(var(--u) * 4.4);
  background: #FFE3B3;
}
.ink-btn:active { transform: scale(0.95); }
.ink-btn.alt { background: #EDE3D3; }
.food-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u) * 2.4); width: 100%; }
.food {
  border: calc(var(--u) * 0.7) solid var(--ink);
  border-radius: calc(var(--u) * 3.4);
  padding: calc(var(--u) * 1.6) calc(var(--u) * 1);
  background: #FFF;
  font-weight: 800; font-size: calc(var(--u) * 3.5); line-height: 1.1;
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.6);
}
.food svg { width: calc(var(--u) * 17); height: calc(var(--u) * 14); }
.food small { font-size: 0.8em; opacity: 0.6; }
.food:active { transform: scale(0.94); background: #FFF3DD; }
.quiz-choice { width: 100%; text-align: left; border-radius: calc(var(--u) * 3.4); }
.dex-list { display: flex; flex-direction: column; gap: calc(var(--u) * 2); width: 100%; }
.dex-item {
  display: flex; gap: calc(var(--u) * 2.4); align-items: center;
  border: calc(var(--u) * 0.6) solid var(--ink);
  border-radius: calc(var(--u) * 3.4);
  padding: calc(var(--u) * 1.6);
  text-align: left;
  background: #FFF;
}
.dex-item svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); flex: none; }
.dex-item b { display: block; font-size: calc(var(--u) * 4); }
.dex-item span { display: block; font-size: calc(var(--u) * 3.2); opacity: 0.75; line-height: 1.25; }
.dex-item.locked { background: #EDE3D3; }
.dex-item.locked svg { filter: brightness(0) opacity(0.35); }
.setting-row {
  width: 100%;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: calc(var(--u) * 0.5) dashed rgba(59,42,32,0.4);
  padding: calc(var(--u) * 2) 0;
  font-weight: 800; text-align: left;
}
.toggle {
  width: calc(var(--u) * 13); height: calc(var(--u) * 7);
  border-radius: 999px;
  border: calc(var(--u) * 0.6) solid var(--ink);
  background: #EDE3D3;
  position: relative; flex: none;
}
.toggle::after {
  content: ''; position: absolute; top: 50%; left: calc(var(--u) * 0.8);
  width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4);
  transform: translateY(-50%);
  border-radius: 50%; background: var(--ink);
  transition: left 0.18s ease;
}
.toggle.on { background: #FFC27A; }
.toggle.on::after { left: calc(100% - var(--u) * 5.2); }
.toggle.wiggle { animation: wiggle 0.35s ease; }
@keyframes wiggle { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.ring { width: calc(var(--u) * 40); height: calc(var(--u) * 40); }
.date-card {
  border: calc(var(--u) * 0.9) solid var(--ink);
  border-radius: calc(var(--u) * 4);
  width: calc(var(--u) * 52);
  overflow: hidden;
  background: #FFF;
}

  // ---------- Moku Moku: a black-and-white LCD pet on the 4th face ----------
  // A 48x32 dot LCD that runs on real time. Moku grows from an egg (5 min) to a
  // baby, and to an adult after 1 day. The more it was left alone, the lazier
  // the adult it becomes. If it starves or the poop piles up for 12 hours, it
  // leaves on a long nap trip and a new egg arrives.
  var PET_KEY = 'moku:' + GAME_ID + ':pet';
  var LCD_W = 48, LCD_H = 32, LCD_S = 8;
  var PET_HATCH_MIN = 5, PET_ADULT_MIN = 24 * 60, PET_TRIP_MIN = 12 * 60;
  function newPet(gen, history) {
    var now = Date.now();
    return {
      version: 1, stage: 'egg', adultType: null, gen: gen || 1,
      age: 0, hunger: 2, goro: 2, poop: 0, lightsOff: false,
      hungerT: 0, goroT: 0, nextPoop: 120, neglect: 0, streak: 0,
      weight: 5, sick: false, sickDose: 0,
      lifespan: 0,                 // age (min) when a grown-up Moku moves to the Land of Endless Naps
      history: history || [],      // past generations: { gen, type, days, end }
      born: now, last: now
    };
  }
  var pet = load(PET_KEY, newPet(1));
  // Grown-ups live about a week. Lazy Moku saves its energy, so it lives longer;
  // being left alone shortens it a little.
  function petLifespan() {
    var days = pet.adultType === 'lazy' ? 10 : 7;
    return days * 1440 + Math.floor(Math.random() * 1440) - Math.min(3 * 1440, pet.neglect * 2);
  }
  function petMoveOut(end) {
    pet.stage = end;
    pet.history = (pet.history || []).concat([{ gen: pet.gen, type: pet.adultType || 'baby', days: Math.floor(pet.age / 1440), end: end }]).slice(-20);
    petEvent(end);
  }
  function petNextEgg() {
    pet = newPet(pet.gen + 1, pet.history);
    petSel = -1; petMode = 'idle'; petGame = null;
    savePet();
    petTune('egg');
    toast('Generation ' + pet.gen + ': a new egg arrived! 🥚');

  }

  // Sprites: '#' dark, '+' dithered (Moku's tan feathers), '.' off.
  function rasterMoku(eyes, flat) {
    var W = flat ? 24 : 20, H = flat ? 22 : 21, cx = W / 2 - 0.5;
    var cy = flat ? 13 : 9.5, rx = flat ? 11.2 : 9.6, ry = flat ? 7.2 : 9.2;
    var px = {};
    function inside(x, y) { return Math.pow((x - cx) / rx, 2) + Math.pow((y - cy) / ry, 2) <= 1; }
    var fy = cy - (flat ? 0.8 : 1.6), lob = flat ? 4.6 : 4.5, bottom = cy + (flat ? 4.2 : 5.2);
    function face(x, y) {
      var a = Math.pow(x - (cx - 3.2), 2) + Math.pow(y - fy, 2) <= lob * lob;
      var b = Math.pow(x - (cx + 3.2), 2) + Math.pow(y - fy, 2) <= lob * lob;
      var tri = y >= fy && y <= bottom && Math.abs(x - cx) <= (bottom - y) * 1.15;
      return a || b || tri;
    }
    function belly(x, y) {
      return Math.pow((x - cx) / (flat ? 7 : 5.6), 2) + Math.pow((y - (cy + (flat ? 3.6 : 6.2))) / (flat ? 3.2 : 4.2), 2) <= 1;
    }
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      if (!inside(x, y)) continue;
      var edge = !inside(x + 1, y) || !inside(x - 1, y) || !inside(x, y + 1) || !inside(x, y - 1);
      if (edge) px[x + ',' + y] = '#';
      else if (!face(x, y) && !belly(x, y)) px[x + ',' + y] = '+';
    }
    function set(x, y, v) { if (v) px[x + ',' + y] = v; else delete px[x + ',' + y]; }
    var ex = [Math.floor(cx - 3.5), Math.floor(cx + 2.5)], ey = Math.floor(fy);
    ex.forEach(function (e) {
      var dx, dy;
      if (eyes === 'open') {
        for (dx = 0; dx < 3; dx++) for (dy = 0; dy < 3; dy++) set(e + dx, ey + dy, '#');
        set(e + 2, ey, null);
      } else if (eyes === 'half') {
        for (dx = 0; dx < 3; dx++) { set(e + dx, ey + 1, '#'); set(e + dx, ey + 2, '#'); }
        set(e + 2, ey + 1, null);
      } else {
        set(e, ey + 1, '#'); set(e + 1, ey + 2, '#'); set(e + 2, ey + 1, '#');
      }
      if (eyes !== 'closed') for (dx = 0; dx < 3; dx++) set(e + dx, ey - 2, '#');
    });
    var b0 = Math.floor(cx), by = ey + 3;
    set(b0, by, '#'); set(b0 + 1, by, '#'); set(b0, by + 1, '#'); set(b0 + 1, by + 1, '#');
    var ty = by + 3;
    for (var d = 0; d < 4; d++) {
      var h = d === 0 ? 1 : 0;
      for (var k = -1 + h; k <= 1 - h; k++) { set(b0 - 1 - d, ty + k, '#'); set(b0 + 2 + d, ty + k, '#'); }
    }
    set(b0, ty, '#'); set(b0 + 1, ty, '#');
    if (!flat) {
      var fyy = H - 2;
      [Math.floor(cx - 3), Math.floor(cx + 2)].forEach(function (fx) {
        set(fx - 1, fyy, '#'); set(fx + 1, fyy, '#'); set(fx, fyy + 1, '#');
      });
    }
    return toRows(px, W, H);
  }
  function rasterBaby(sleeping) {

    if (btn === 'A') { petSel = (petSel + 1) % PET_SELECTABLE; return; }
    if (btn === 'C') { petSel = -1; return; }
    var id = petSel >= 0 ? PET_ICONS[petSel].id : null;
    if (!id) return;
    if (id === 'status') { petMode = 'status'; petStatusPage = 0; return; }
    if (pet.stage === 'egg') { petBeep('no'); return; }
    if (id === 'snack') {
      if (pet.lightsOff) { petBeep('no'); return; }
      if (pet.sick) { petBeep('no'); toast('Too sick to snack… zzz', 1600); return; }
      petMode = 'food'; petFoodSel = 1;
    }
    else if (id === 'light') { pet.lightsOff = !pet.lightsOff; savePet(); }
    else if (id === 'play') {
      if (pet.lightsOff || pet.sick) { petBeep('no'); return; }
      if (Math.random() < 0.7) { petMode = 'game'; petGame = { round: 0, wins: 0, phase: 'ask', t: 0 }; return; }
      // Sometimes Moku won't even play. Being turned down makes the watch lazier.
      startAnim('play', 9, function () {
        pet.goro = Math.min(4, pet.goro + 1); savePet();
        toast('Moku: “…nah. Let’s just nap.”', 1800);
        addLazy(100);
      });
    } else if (id === 'futon') {
      // Two blankets cure the can't-be-bothered sickness.
      if (!pet.sick) { petBeep('no'); return; }
      startAnim('futon', 8, function () {
        pet.sickDose++;
        if (pet.sickDose >= 2) { pet.sick = false; pet.sickDose = 0; petTune('cure'); toast('Moku feels better! (Still lazy.)', 1800); }
        else toast('One more blanket, please…', 1600);
        savePet();
      });
    } else if (id === 'clean') {
      if (!pet.poop) { petBeep('no'); return; }
      startAnim('clean', 12, function () { pet.poop = 0; savePet(); petBeep('yay'); });
    }
  }
  ['A', 'B', 'C'].forEach(function (b) {
    // A small delay, like a cheap toy's rubber buttons.
    $('pet' + b).addEventListener('click', function () { setTimeout(function () { petPress(b); petRender(); }, 120); });
  });

  function petRender() {
    // Events that happened while the face was hidden (or the page was closed)
    // wait here until the pet face is actually on screen.
    if (petEvents.length && petVisible()) {
      var ev = petEvents.shift();
      if (ev === 'hatch') { startAnim('hatch', 8); petTune('hatch'); toast('The egg hatched! 🐣'); }
      else if (ev === 'grow') { petTune('grow'); toast(pet.adultType === 'lazy' ? 'Moku grew up… very, very lazy.' : 'Moku grew up!'); }
      else if (ev === 'trip') { petTune('trip'); toast('Moku left on a long nap trip. ✉️'); }
      else if (ev === 'dream') { petTune('dream'); toast('Moku moved to the Land of Endless Naps. 💤 Thank you for taking care of it!', 3200); }
    }
    drawPet();
    paintLCD(pet.lightsOff && pet.stage !== 'trip' && pet.stage !== 'dream' && petMode === 'idle' && !petAnim);
  }
  // 2 frames per second, like an old LCD toy. Only draws while the face is visible.
  setInterval(function () {
    if (!petVisible()) return;
    petSim();
    petRender();
  }, 500);
  setInterval(petSim, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) petSim(); });
  petSim();
  savePet(); // keep the egg's birth time even if nothing has happened yet
  // Show the first frame right away so the face is never blank.
  petRender();

  // ---------- sizing ----------
  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = Math.min(vw * 0.9, 400, (vh - 150) / 1.12);
    w = Math.max(w, 230);
    document.documentElement.style.setProperty('--u', (w / 100).toFixed(3) + 'px');
  }
  window.addEventListener('resize', layout);

  // ---------- screens ----------
  function showTitle() {
    closeApp(true);
    body.classList.add('on-title');
    $('startBtn').focus({ preventScroll: true });
  }
  function showWatch() {
    body.classList.remove('on-title');
    setPage(1);
    renderMeter();
    tickClock();
    sfx.yay();
    if (!state.updatedAt) save();
    scheduleCall();
  }
  $('startBtn').addEventListener('click', showWatch);
  $('backTitle').addEventListener('click', showTitle);

  document.addEventListener('keydown', function (e) {
    if (body.classList.contains('on-title')) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showWatch(); }
      return;
    }
    if (e.key === 'Escape') { if (appOpen) closeApp(); else showTitle(); }
    else if (!appOpen && e.key === 'ArrowLeft') setPage(page - 1);
    else if (!appOpen && e.key === 'ArrowRight') setPage(page + 1);
    else if (!appOpen && page === 3 && /^[abc]$/i.test(e.key)) $('pet' + e.key.toUpperCase()).click();
  });

  layout();
  renderMeter();
  tickClock();
  setInterval(tickClock, 10000);
  setPage(1);
})();
</script>
</body>
</html>
