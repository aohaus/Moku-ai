// 一斉公開(2026-11-21 13:00 マレーシア時間)までは「Coming soon」だけを出す。hub.html の RELEASE_ASIA とそろえる。
// プレビュー(*.pages.dev)・localhost・ファイルを直接開いた時は、すぐ遊べる。
(function () {
  var OPENS_AT = Date.parse('2026-11-21T13:00:00+08:00');
  var dev = location.protocol === 'file:' || /\.pages\.dev$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (dev || Date.now() >= OPENS_AT) return;
  document.documentElement.className += ' moku-soon';
  document.write('<style>html.moku-soon body > *:not(#mokuSoon) { display: none !important; }' +
    '#mokuSoon { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center;' +
    ' background: linear-gradient(#FFD9A8, #F7B98A); color: #4A2E1A; font: 700 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }' +
    '#mokuSoon .o { font-size: 64px; } #mokuSoon h1 { margin: 0; font-size: 28px; font-weight: 800; }' +
    '#mokuSoon a { margin-top: 8px; padding: 10px 22px; border-radius: 999px; background: #4A2E1A; color: #FFF4DE; text-decoration: none; }</style>');
  document.addEventListener('DOMContentLoaded', function () {
    var when = new Date(OPENS_AT).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    var d = document.createElement('div');
    d.id = 'mokuSoon';
    d.innerHTML = '<div class="o">🦉</div><h1>Coming soon!</h1><p>This game opens on ' + when + '.</p><a href="hub.html">◀ Hub</a>';
    document.body.appendChild(d);
    setTimeout(function () { location.reload(); }, Math.min(OPENS_AT - Date.now() + 1000, 2147483000));
  });
})();
</script>

<!--
  Moku Night Jungle(v0.1.0、2026-11-19)— 棚「Live in ASIA」の第4弾。
  夜の東南アジアの熱帯雨林を懐中電灯で照らし、手がかり(本当の話)と鳴き声から生き物を探す。
  Live in ASIA の目標(CLAUDE.md §2)に合わせて: ①どの生き物にも「どの国にいるか」②にている・ちがう(とても小さい/いちばん大きい…)
  ③Junglepedia の「Tell a friend」の一文。
  - 🔦 Night Walk: 1晩に 5 つの生き物を探す(ほかに 2 つ、おとりがいる)。暗い森で、夜の動物は目だけが光る(eyeshine。本当の話)。
    指でなぞる(マウスは動かす)と懐中電灯が動き、生き物をタップで見つける。電池は時間で減り、まちがいのタップで少し減る。
    電池がなくなるか 5 つ見つけたら朝。🔊 Listen でその生き物の鳴き声(Web Audio で作った「らしい」音。花と蛾は鳴かないので、においや見た目のヒント)。
  - 📗 Junglepedia: 見つけた(まちがえて照らしたのも)生き物の図鑑。本当の話 2 つ・住んでいる国・Tell a friend。
  生き物のデータは下の CRITTERS(14)。絵はこげ茶の輪郭の SVG(ART)か絵文字。怖くならないよう、牙・毒の話はやわらかく。
  Moint(SPEC.md §13): 見つけた 1 つ +10(1晩で最大 50)、5 つ全部を電池 30% 以上で +20(1日 500 の上限の中)。
  1回きり = その生き物を初めて見つけた +20、14 全部 +200(受け取り済みは progress.mointClaims の s:<id> と all)。
  記録は moku:moku-night-jungle:progress、音は moku:moku-night-jungle:settings。
-->

<script>
(function () {
  'use strict';
  var GAME_ID = 'moku-night-jungle';
  var SAVE_KEY = 'moku:' + GAME_ID + ':progress', SET_KEY = 'moku:' + GAME_ID + ':settings';
  var $ = function (id) { return document.getElementById(id); };
  function readJSON(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // =====================================================================
  // 生き物の絵(こげ茶の輪郭の SVG。100×100)
  // =====================================================================
  var O = 'stroke="#4A2E1A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
  var ART = {
    tarsier: '<path d="M10 70 Q50 64 90 70" fill="none" stroke="#6E4A2C" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M62 70 Q80 92 70 98" fill="none" ' + O + '/>' +

    // 生き物
    night.items.forEach(function (it) {
      if (it.c.id === 'firefly') return;
      if (it.state === 'gone') return;
      var bob = Math.sin(t / 600 + it.x) * 2;
      ctx.globalAlpha = it.state === 'found' ? 1 : 1;
      if (it.c.art) { var im = IMG[it.c.art]; if (im.complete) ctx.drawImage(im, it.x - it.s / 2, it.y - it.s / 2 + bob, it.s, it.s); }
      else { ctx.font = Math.round(it.s * 0.85) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.c.em, it.x, it.y + bob); }
      if (it.state === 'found') { ctx.strokeStyle = '#F5D04A'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(it.x, it.y, it.s * 0.62, 0, 7); ctx.stroke(); }
    });
    // 前の葉(少しかくす)
    ctx.globalAlpha = 1;
    // 暗やみ+懐中電灯
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, W, H);
    var morning = night.over ? Math.min(1, (t - night.overAt) / 1500) : 0;
    dctx.fillStyle = 'rgba(4,10,16,' + (0.965 * (1 - morning)) + ')'; dctx.fillRect(0, 0, W, H);
    if (light.on && !night.over) {
      dctx.globalCompositeOperation = 'destination-out';
      var r = lightR(), g = dctx.createRadialGradient(light.x, light.y, r * 0.3, light.x, light.y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(light.x, light.y, r, 0, 7); dctx.fill();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(dark, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 光る目(eyeshine)
    if (!night.over) night.items.forEach(function (it) {
      if (!it.c.eyes || it.state === 'found') return;
      var blinkOff = Math.sin(t / 900 + it.x * 3) > 0.92;
      if (blinkOff) return;
      ctx.fillStyle = 'rgba(250,240,150,0.75)';
      for (var e = 0; e < it.c.eyes.length; e += 2) {
        ctx.beginPath(); ctx.arc(it.x - it.s / 2 + it.c.eyes[e] * it.s, it.y - it.s / 2 + it.c.eyes[e + 1] * it.s, Math.max(1.6, it.s * 0.035), 0, 7); ctx.fill();
      }
    });
    // ホタル(みんな同時に光る)
    var ff = night.items.filter(function (it) { return it.c.id === 'firefly'; })[0];
    var flashOn = (t % 1100) < 380;
    if (ff) {
      var R = rnd(42);
      for (var i = 0; i < 18; i++) {
        var fx = ff.x + (R() - 0.5) * ff.s * 2.2, fy = ff.y + (R() - 0.5) * ff.s * 0.9;
        ctx.fillStyle = flashOn ? 'rgba(240,250,140,0.95)' : 'rgba(240,250,140,0.12)';
        ctx.beginPath(); ctx.arc(fx, fy, flashOn ? 3 : 2, 0, 7); ctx.fill();
        if (flashOn) { ctx.fillStyle = 'rgba(240,250,140,0.25)'; ctx.beginPath(); ctx.arc(fx, fy, 8, 0, 7); ctx.fill(); }
      }
      if (ff.state === 'found') { ctx.strokeStyle = '#F5D04A'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(ff.x, ff.y, ff.s * 1.2, ff.s * 0.55, 0, 0, 7); ctx.stroke(); }
    }
    // 懐中電灯の輪
    if (light.on && !night.over) { ctx.strokeStyle = 'rgba(255,240,180,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(light.x, light.y, lightR(), 0, 7); ctx.stroke(); }
  }
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (!night) return;
    var dt = last ? Math.min(0.1, (t - last) / 1000) : 0; last = t;
    if (!night.over && light.on && !$('sheet').classList.contains('show')) {
      night.battery = Math.max(0, night.battery - dt * night.drain);
      updateBattery();
      if (night.battery <= 0) endNight(t);
    }
    draw(t);
  }

  // ---------- input ----------
  var down = null;
  function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', function (e) {
    var p = pos(e); down = { x: p.x, y: p.y, t: Date.now() };
    light.x = p.x; light.y = p.y; light.on = true; $('hint').style.opacity = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  });
  cv.addEventListener('pointermove', function (e) {
    var p = pos(e);
    if (e.pointerType === 'mouse' || down) { light.x = p.x; light.y = p.y; light.on = true; $('hint').style.opacity = 0; }
  });
  cv.addEventListener('pointerup', function (e) {
    var p = pos(e);
    if (down && Math.hypot(p.x - down.x, p.y - down.y) < 14 && Date.now() - down.t < 600) tapAt(p.x, p.y);
    down = null;
    if (e.pointerType !== 'mouse') light.on = true;   // 指を離しても、最後の場所を照らしたまま
  });

  // =====================================================================
  // 🔦 Night Walk
  // =====================================================================
  var TARGETS = 5;
  function startWalk() {
    progress.played++; save();
    document.body.classList.remove('on-title');
    $('modeTitle').textContent = '🔦 Night Walk';
    $('sheet').classList.remove('show');
    $('hint').style.opacity = 1;
    // まだ見つけていない生き物を先に
    var pool = shuffle(CRITTERS).sort(function (a, b) { return (progress.found[a.id] ? 1 : 0) - (progress.found[b.id] ? 1 : 0); });
    var targets = pool.slice(0, TARGETS), decoys = pool.slice(TARGETS, TARGETS + 2);
    night = { seed: Math.floor(Math.random() * 1e6) + 1, targets: targets.map(function (c) { return c.id; }), cur: 0, found: [], wrong: 0,
      battery: 100, drain: 2.2, over: false,
      items: targets.concat(decoys).map(function (c) { return { c: c, state: 'hidden' }; }) };
    resize();
    drawBG(); placeCritters();
    light.x = W / 2; light.y = H / 2; light.on = false;
    renderSlots(); showClue(); updateBattery();
    $('topInfo').textContent = '0/' + TARGETS;
    last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }
  function curTarget() { return BY[night.targets[night.cur]]; }
  function showClue() {
    var c = curTarget();
    $('clueK').textContent = 'Find ' + (night.cur + 1) + ' of ' + TARGETS;
    $('clueT').textContent = c.clue;
    $('listen').textContent = SILENT[c.snd] ? (c.snd === 'smell' ? '👃 Sniff' : '👀 Hint') : '🔊 Listen';
  }
  $('listen').addEventListener('click', function () {
    if (!night || night.over) return;
    var c = curTarget();
    CALLS[c.snd] && CALLS[c.snd]();
    if (SILENT[c.snd]) toast(null, SILENT[c.snd]);
    else toast(null, '👂 Listen… that’s the sound it makes!');
  });
  function renderSlots() {
    $('slots').innerHTML = night.targets.map(function (id, i) {
      var c = BY[id], got = night.found.indexOf(id) >= 0;
      return '<span class="' + (got ? 'got' : '') + '">' + (got ? (c.art ? '<img src="' + IMG[c.art].src + '">' : c.em) : (i === night.cur ? '?' : '')) + '</span>';
    }).join('');
  }
  function updateBattery() {
    var b = $('battery'); b.querySelector('i').style.width = night.battery + '%';
    b.classList.toggle('low', night.battery < 30);
  }
  var toastT = 0;
  function toast(c, text) {
    var el = $('toast');
    el.innerHTML = (c ? artHTML(c) : '') + '<span>' + text + '</span>';
    el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
  function hitItem(x, y) {
    var best = null, bd = 1e9;
    night.items.forEach(function (it) {
      if (it.state === 'found') return;
      var w = it.c.id === 'firefly' ? it.s * 1.3 : it.s * 0.55, h = it.c.id === 'firefly' ? it.s * 0.6 : it.s * 0.55;
      var dx = (x - it.x) / w, dy = (y - it.y) / h, d = dx * dx + dy * dy;
      if (d < 1 && d < bd) { bd = d; best = it; }
    });
    return best;
  }
  function tapAt(x, y) {
    if (!night || night.over) return;
    var it = hitItem(x, y);
    if (!it) return;
    var c = it.c, target = curTarget();
    progress.seen[c.id] = 1;
    if (c.id === target.id) {
      it.state = 'found';
      night.found.push(c.id);
      var first = !progress.found[c.id];
      progress.found[c.id] = (progress.found[c.id] | 0) + 1;
      save();
      sfx.good(); CALLS[c.snd] && setTimeout(CALLS[c.snd], 350);
      toast(c, '<b>' + esc(c.name) + '!</b> ' + esc(c.facts[0]) + (first ? ' <b>📗 New!</b>' : ''));
      night.cur++;
      $('topInfo').textContent = night.found.length + '/' + TARGETS;
      renderSlots();
      if (night.cur >= TARGETS) endNight(performance.now());
      else showClue();
    } else {
      night.wrong++;
      night.battery = Math.max(0, night.battery - 5);
      updateBattery(); sfx.bad();
      toast(c, 'That’s a <b>' + esc(c.name) + '</b> — not the one we’re looking for. (−5% battery)');
      save();
    }
  }
  function endNight(t) {
    if (night.over) return;
    night.over = true; night.overAt = t || performance.now();
    var n = night.found.length, perfect = n === TARGETS && night.battery >= 30;
    progress.nights++; progress.best = Math.max(progress.best, n); if (perfect) progress.perfect++;
    var lines = [['Animals found: ' + n + ' × 10', earn(n * 10)]];
    if (perfect) lines.push(['All 5 with battery left! 🔋', earn(20)]);
    night.found.forEach(function (id) { if (!progress.mointClaims['s:' + id]) lines.push(['First ' + BY[id].name + '!', claimOnce('s:' + id, 20)]); });
    if (foundCount() >= CRITTERS.length) lines.push(['Every critter found! 🎉', claimOnce('all', 200)]);
    save();
    sfx.morning();
    setTimeout(function () {
      var sh = $('sheet');
      sh.innerHTML = '<div class="card"><div class="h">' + (n === TARGETS ? '🌅 Good morning! You found them all!' : night.battery <= 0 ? '🔋 Your battery ran out!' : '🌅 Good morning!') + '</div>' +
        '<div class="sub">The jungle wakes up. Here’s what you found tonight.</div>' +
        '<div class="bigNum">' + n + ' / ' + TARGETS + '</div>' +
        '<div class="found">' + night.targets.map(function (id) { var c = BY[id], got = night.found.indexOf(id) >= 0;
          return '<div class="fc' + (got ? '' : ' miss') + '">' + artHTML(c) + '<span>' + esc(c.name) + '</span></div>'; }).join('') + '</div>' +
        mointBox(lines) +
        '<div class="row"><button class="btn primary" id="again">🔦 Another night</button><button class="btn" id="toBook">📗 Junglepedia</button></div></div>';
      sh.classList.add('show');
      $('again').addEventListener('click', function () { sfx.tap(); startWalk(); });
      $('toBook').addEventListener('click', function () { sfx.tap(); openBook(); });
    }, 1300);
  }

  // =====================================================================
  // 📗 Junglepedia
  // =====================================================================
  function openBook(sel) {
    document.body.classList.remove('on-title');
    $('modeTitle').textContent = '📗 Junglepedia';
    $('topInfo').textContent = foundCount() + '/' + CRITTERS.length;
    if (!night) { night = { seed: 99, items: [], targets: [], found: [], over: true, overAt: -1e9, battery: 0 }; }
    resize(); drawBG();
    cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(loop);
    var sh = $('sheet');
    function draw(open) {
      var h = '<div class="card"><div class="h">Junglepedia</div><div class="sub">Animals you found on your night walks. Tap one to read about it.</div><div class="found">' +
        CRITTERS.map(function (c) {
          var known = progress.found[c.id] || progress.seen[c.id];
          if (!known) return '<div class="fc lock"><span class="q">?</span><span>???</span></div>';
          return '<button class="fc" data-c="' + c.id + '">' + artHTML(c) + '<span>' + esc(c.name) + '</span></button>';
        }).join('') + '</div>';
      if (open) {
        var c = BY[open];
        h += '<div class="entry"><div class="top">' + artHTML(c) + '<div><div class="nm">' + esc(c.name) + '</div><div class="lat">🌏 Where: ' + esc(c.where) + '</div>' +
          '<div class="lat">' + (progress.found[c.id] ? '✅ Found ' + progress.found[c.id] + (progress.found[c.id] === 1 ? ' time' : ' times') : '👀 Seen, not found yet') + '</div></div></div>' +
          '<ul>' + c.facts.map(function (f) { return '<li>✨ ' + esc(f) + '</li>'; }).join('') + '</ul>' +
          '<div class="tell"><span class="cn">🗣️ Tell a friend</span><b>' + esc(c.name.replace(/ \(.*\)$/, '')) + '</b>: ' + esc(c.tell) + '. It lives ' + (/^across/.test(c.where) ? '' : 'in ') + esc(c.where) + '.</div></div>';
      }
      h += '<div class="row"><button class="btn primary" id="walk">🔦 Night Walk</button></div><div class="tip">Animals you shine your light on (even by mistake) show up here too.</div></div>';
      sh.innerHTML = h; sh.classList.add('show');
      sh.querySelectorAll('[data-c]').forEach(function (b) { b.addEventListener('click', function () { sfx.tap(); var c = BY[b.getAttribute('data-c')]; CALLS[c.snd] && CALLS[c.snd](); draw(c.id); var e = sh.querySelector('.entry'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); });
      $('walk').addEventListener('click', function () { sfx.tap(); startWalk(); });
    }
    draw(sel);
  }

  // ---------- title ----------
  function showTitle() {
    document.body.classList.add('on-title');
    cancelAnimationFrame(raf); night = null;
    $('bookCount').textContent = foundCount() + ' / ' + CRITTERS.length + ' found';
    $('titleBal').textContent = Math.round(balance()).toLocaleString('en-US');
    $('titleToday').textContent = '· Today ' + earnedToday() + ' / ' + dailyCap();
    try { if (window.MokuMoint) $('titleOutfit').innerHTML = MokuMoint.outfitSVG(MokuMoint.closet().equipped); } catch (e) {}
  }
  $('menuBtn').addEventListener('click', function () { sfx.tap(); showTitle(); });
  syncSoundBtn();
  $('goWalk').addEventListener('click', function () { sfx.tap(); startWalk(); });
  $('goBook').addEventListener('click', function () { sfx.tap(); openBook(); });
  window.addEventListener('moku:moint', function () { if (document.body.classList.contains('on-title')) showTitle(); });
  showTitle();
  // 開発用: ?screen=walk|book
  try {
    var scr = new URLSearchParams(location.search).get('screen');
    if (scr === 'walk') startWalk(); else if (scr === 'book') openBook();
    if (location.protocol === 'file:') window.__mnj = { items: function () { return night && night.items.map(function (it) { return { id: it.c.id, x: it.x, y: it.y, state: it.state }; }); }, target: function () { return night && night.cur < TARGETS ? curTarget().id : null; } };
  } catch (e) {}
})();
</script>
</body>
</html>
