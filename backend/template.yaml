AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Moku Series — shared game records API + player accounts / cloud save.
  API Gateway (HTTP API) + Lambda + DynamoDB, sized for Free Tier / a few hundred players.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref ScoresTable
        AUTH_SECRET: !Ref AuthSecret

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      CORS origin allowed to call this API (e.g. https://aohaus.github.io).
      Use "*" during development only.
  ExtraAllowedOrigin:
    Type: String
    Default: "https://dechatgpt.com"
    Description: >
      A second site allowed to call this API: the Cloudflare domain that
      serves the same pages (https://dechatgpt.com/Moku-ai/). Origin only, no path.
  AuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      HMAC key that signs login tokens (e.g. `openssl rand -hex 32`).
      dreamlo-proxy must be deployed with the same value. Changing it logs
      everyone out.
  InviteCode:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Code a new player must enter to create an account. Hand it out to the
      people you want to invite; redeploy with a new value to rotate it.
      Empty = sign-up closed.
  MaxUsers:
    Type: Number
    Default: 100
    Description: Maximum number of accounts. Sign-up refuses once reached.

Resources:
  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: moku-scores
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: scoreSort
          AttributeType: S
      KeySchema:
        - AttributeName: gameId
          KeyType: HASH
        - AttributeName: deviceId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gameId-scoreSort-index
          KeySchema:
            - AttributeName: gameId
              KeyType: HASH
            - AttributeName: scoreSort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: moku-accounts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Access-log items (pk LOG#<day>, 90 days) and error reports (pk ERR,
      # 60 days after the last one) carry `ttl`; DynamoDB deletes them.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MokuScoresApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Per-route cap (each route gets its own 10/s): slows down PIN guessing
      # on top of the per-account lockout, and is far above what 100 players need.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # Online matches get their own limits. A page polls GET /matches/{id}
      # every 3 s while it waits for the friend's move, so that route is the
      # busy one: ~50 players waiting at once ≈ 17/s.
      RouteSettings:
        "GET /matches/{id}":
          ThrottlingBurstLimit: 80
          ThrottlingRateLimit: 40
        "POST /matches/{id}/move":
          ThrottlingBurstLimit: 30
          ThrottlingRateLimit: 15
        "GET /matches":
          ThrottlingBurstLimit: 30
          ThrottlingRateLimit: 15
        "POST /matches":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - !Ref ExtraAllowedOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization

  SubmitScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/submitScore.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
      Events:
        Submit:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /scores
            Method: POST

  GetScoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/getScores.handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScoresTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /scores
            Method: GET

  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/accountApi.handler
      CodeUri: .
      MemorySize: 256 # scrypt PIN hashing is CPU-bound; more memory = more CPU
      Environment:
        Variables:
          ACCOUNTS_TABLE_NAME: !Ref AccountsTable
          INVITE_CODE: !Ref InviteCode
          MAX_USERS: !Ref MaxUsers
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountsTable
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /auth/register
            Method: POST
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /auth/login
            Method: POST
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /auth/me
            Method: GET
        ChangePin:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /auth/pin
            Method: POST
        Players:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /players
            Method: GET
        AdminListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/users
            Method: GET
        AdminLogs:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/logs
            Method: GET
        ReportError:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /errors
            Method: POST
        AdminListErrors:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/errors
            Method: GET
        AdminUpdateError:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/errors/{sig}
            Method: PATCH
        AdminDeleteError:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/errors/{sig}
            Method: DELETE
        AdminCreateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/users
            Method: POST
        AdminUpdateUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/users/{loginId}
            Method: PATCH
        AdminDeleteUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /admin/users/{loginId}
            Method: DELETE
        GetSave:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /save
            Method: GET
        PutSave:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /save
            Method: PUT

  # Online matches (src/matchApi.js, API_SPEC.md "Matches"). Its own function so
  # polling never waits behind the slow scrypt logins of AccountFunction.
  MatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/matchApi.handler
      CodeUri: .
      Environment:
        Variables:
          ACCOUNTS_TABLE_NAME: !Ref AccountsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountsTable
      Events:
        CreateMatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /matches
            Method: POST
        ListMatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /matches
            Method: GET
        GetMatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /matches/{id}
            Method: GET
        MakeMove:
          Type: HttpApi
          Properties:
            ApiId: !Ref MokuScoresApi
            Path: /matches/{id}/move
            Method: POST

Outputs:
  ApiUrl:
    Description: >
      Base URL for the Moku scores + accounts API. Put it in
      shared/moku-account.js (API_BASE_URL).
    Value: !Sub "https://${MokuScoresApi}.execute-api.${AWS::Region}.amazonaws.com"
