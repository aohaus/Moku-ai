<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Angry Mokumoku - Asia & Beyond Edition</title>

<!-- Home-screen / PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1228">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Angry Mokumoku">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #120b1f;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: 'StoreGothic', 'Helvetica Neue', Arial, sans-serif;
  user-select: none;
  overflow: hidden;
  touch-action: none;
  color: #fff;
}
#wrapper {
  position: relative;
  display: inline-block;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(102, 255, 68, 0.15);
  width: 100vw;
  max-width: min(1366px, calc(100vh * 1.8));
  border: 1px solid rgba(255,255,255,0.1);
}
canvas { display: block; cursor: crosshair; width: 100%; height: auto; }

/* Title-screen hero mascot */
#titleMascotImg {
  display: block;
  position: absolute;
  left: 50%;
  top: 42%;
  width: 15%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 30px rgba(102,255,68,0.5));
  animation: titleMascotBob 3.2s ease-in-out infinite;
  pointer-events: none;
  z-index: 3;
}
@keyframes titleMascotBob {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -50%) translateY(-10px); }
}

/* Glassmorphism Modern HUD */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 20px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
  pointer-events: none;
  z-index: 5;
}
#hud-info {
  display: flex; justify-content: space-between; align-items: center;
  flex: 1;
  gap: 12px;
}
.hud-card {
  background: rgba(26, 18, 40, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  border-radius: 24px;
}
#pause-btn {
  pointer-events: all;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  width: 44px; height: 44px;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex; align-items: center; justify-content: center;
}
#pause-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.08); }

#score-display {
  color: #FFE066;
  font-size: 18px; font-weight: 800;
  padding: 8px 18px;
  letter-spacing: 0.5px;
  text-shadow: 0 0 10px rgba(255, 224, 102, 0.4);
  transition: transform 0.1s ease;
}
#score-display.score-bump {
  animation: scoreBump 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes scoreBump {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); color: #fff; }
  100% { transform: scale(1); }
}

#target-display {
  color: rgba(255, 255, 255, 0.9);
  font-size: 14px; font-weight: 600;
  padding: 6px 16px;
}
#birds-display {
  font-size: 20px;
  padding: 6px 16px;
  display: flex; gap: 6px; align-items: center;
}

/* Glassmorphism Overlays */
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(15, 10, 26, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  pointer-events: all;
  z-index: 10;
  transition: opacity 0.3s ease;
}
#overlay.hidden { display: none; opacity: 0; pointer-events: none; }
#overlay h1 {
  color: #fff; font-size: 48px; font-weight: 900; margin-bottom: 8px;
  letter-spacing: 1px;
  text-shadow: 0 0 20px rgba(102, 255, 68, 0.6), 0 4px 12px rgba(0,0,0,0.8);
  background: linear-gradient(135deg, #ffffff 0%, #66ff44 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#overlay p {
  color: #FFE066; font-size: 20px; font-weight: 700; margin-bottom: 28px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
#overlay .btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
#overlay button {
  background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
  color: #fff;
  border: none; border-radius: 30px;
  padding: 14px 38px; font-size: 18px; font-weight: 800;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4), 0 0 15px rgba(255, 107, 53, 0.2);
}
#overlay button:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 10px 28px rgba(255, 107, 53, 0.6), 0 0 25px rgba(255, 107, 53, 0.4);
}
#overlay button:active { transform: translateY(1px) scale(0.98); }

/* Combo Popups overlay container */
#effects-container {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 4;
}
.floating-text {
  position: absolute;
  font-weight: 900;
  font-size: 24px;
  color: #FFE066;
  text-shadow: 0 0 10px rgba(255, 224, 102, 0.8), 0 2px 4px rgba(0,0,0,0.9);
  transform: translate(-50%, -50%) scale(0.5);
  animation: floatUp 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.floating-text.combo {
  color: #FF3366;
  font-size: 32px;
  text-shadow: 0 0 15px rgba(255, 51, 102, 0.9), 0 2px 6px rgba(0,0,0,0.9);
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-5deg); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(3deg); }
  40% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); }
  100% { opacity: 0; transform: translate(-50%, -80px) scale(0.9); }
}
</style>
</head>
<body>

<div id="wrapper">
  <!-- Title screen hero mascot img -->
  <img id="titleMascotImg" src="brand/mokumoku-hero.png" alt="Mokumoku Hero" onerror="this.style.display='none'">
  
  <canvas id="gameCanvas" width="900" height="500"></canvas>
  <div id="effects-container"></div>

  <!-- HUD -->
  <div id="hud">
    <button id="pause-btn" onclick="togglePause()">❚❚</button>
    <div id="hud-info">
      <div id="score-display" class="hud-card">SCORE: <span id="score-val">0</span></div>
      <div id="target-display" class="hud-card">TARGET: <span id="target-val">1500</span></div>
      <div id="birds-display" class="hud-card">🦤 <span id="birds-val">3</span></div>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay">
    <h1 id="ov-title">ANGRY MOKUMOKU</h1>
    <p id="ov-sub">Asia & Beyond Edition</p>
    <div class="btn-row">
      <button id="ov-main-btn" onclick="startOrRestartGame()">START GAME</button>
      <button id="ov-next-btn" style="display:none;" onclick="nextLevel()">NEXT LEVEL</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
// Canvas & Matter.js Setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const effectsContainer = document.getElementById('effects-container');

const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Events, Vector, Body } = Matter;

let engine, world, runner;
let gameState = 'TITLE'; // TITLE, PLAYING, PAUSED, CLEAR, GAMEOVER
let score = 0;
let targetScore = 1500;
let remainingBirds = 3;
let currentBird = null;
let slingConstraint = null;
let isDragging = false;
let screenShake = 0;
let particles = [];
let comboCount = 0;

const SLING_POS = { x: 170, y: 370 };

// Initialize Game Engine
function initEngine() {
  engine = Engine.create({
    gravity: { x: 0, y: 0.98, scale: 0.001 }
  });
  world = engine.world;
  runner = Runner.create();
  Runner.run(runner, engine);

  setupGroundAndBoundaries();
  setupCollisionEvents();
}

function setupGroundAndBoundaries() {
  const ground = Bodies.rectangle(450, 490, 900, 30, { isStatic: true, friction: 0.8, label: 'ground' });
  const leftWall = Bodies.rectangle(-10, 250, 20, 500, { isStatic: true });
  const rightWall = Bodies.rectangle(910, 250, 20, 500, { isStatic: true });
  const ceiling = Bodies.rectangle(450, -50, 900, 20, { isStatic: true });
  Composite.add(world, [ground, leftWall, rightWall, ceiling]);
}

// Spawn Bird
function spawnBird() {
  if (remainingBirds <= 0) return null;
  
  const bird = Bodies.circle(SLING_POS.x, SLING_POS.y, 18, {
    density: 0.004,
    friction: 0.2,
    restitution: 0.4,
    label: 'bird'
  });

  slingConstraint = Constraint.create({
    pointA: SLING_POS,
    bodyB: bird,
    stiffness: 0.12,
    damping: 0.04,
    length: 0
  });

  Composite.add(world, [bird, slingConstraint]);
  return bird;
}

// Build Level Structure
function loadLevel() {
  // Clear old bodies except ground
  const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
  bodies.forEach(b => Composite.remove(world, b));

  score = 0;
  comboCount = 0;
  updateHUD();

  // Create Targets & Obstacles
  const startX = 600;
  const startY = 430;
  const blockWidth = 35;
  const blockHeight = 70;

  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 2 - i; j++) {
      const x = startX + j * 90 + i * 45;
      const y = startY - i * 80;

      // Wooden Pillars
      const p1 = Bodies.rectangle(x - 25, y, 16, blockHeight, { density: 0.001, label: 'wood' });
      const p2 = Bodies.rectangle(x + 25, y, 16, blockHeight, { density: 0.001, label: 'wood' });
      // Beam
      const beam = Bodies.rectangle(x, y - 40, 75, 14, { density: 0.0008, label: 'wood' });
      // Enemy Pig/Mokumoku
      const enemy = Bodies.circle(x, y - 10, 16, { density: 0.002, label: 'enemy' });

      Composite.add(world, [p1, p2, beam, enemy]);
    }
  }

  currentBird = spawnBird();
}

// Dynamic Floating Text and Score Bump
function addScore(points, x, y, customText = null) {
  score += points;
  comboCount++;
  
  const scoreDisplay = document.getElementById('score-display');
  document.getElementById('score-val').innerText = score;
  scoreDisplay.classList.remove('score-bump');
  void scoreDisplay.offsetWidth; // Trigger reflow
  scoreDisplay.classList.add('score-bump');

  // Create Floating Text
  const textEl = document.createElement('div');
  textEl.className = 'floating-text' + (comboCount > 2 ? ' combo' : '');
  
  let displayText = customText || `+${points}`;
  if (comboCount > 2 && !customText) {
    displayText = `COMBO x${comboCount}!\n+${points}`;
  }
  
  textEl.innerText = displayText;
  textEl.style.left = `${(x / 900) * 100}%`;
  textEl.style.top = `${(y / 500) * 100}%`;

  effectsContainer.appendChild(textEl);
  setTimeout(() => textEl.remove(), 800);

  // Trigger Sparks
  createSparks(x, y, comboCount > 2 ? '#FF3366' : '#FFE066');
}

// Particle Sparks Effect
function createSparks(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      color: color,
      size: Math.random() * 4 + 2
    });
  }
}

// Collision Logic
function setupCollisionEvents() {
  Events.on(engine, 'collisionStart', (evt) => {
    evt.pairs.forEach(pair => {
      const { bodyA, bodyB } = pair;
      const speed = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));

      [bodyA, bodyB].forEach(body => {
        if (body.label === 'enemy' && speed > 2.5) {
          addScore(500, body.position.x, body.position.y, 'BOOM! +500');
          Composite.remove(world, body);
          screenShake = 12;
        } else if (body.label === 'wood' && speed > 3.5) {
          addScore(100, body.position.x, body.position.y);
          screenShake = 4;
        }
      });
    });
  });
}

// Sling Drag Input Controls
function setupControls() {
  let isPointerDown = false;

  const getCanvasPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  };

  const onStart = (e) => {
    if (gameState !== 'PLAYING' || !currentBird || !slingConstraint) return;
    const pos = getCanvasPos(e);
    const dist = Vector.magnitude(Vector.sub(pos, currentBird.position));
    if (dist < 35) {
      isPointerDown = true;
      isDragging = true;
    }
  };

  const onMove = (e) => {
    if (!isPointerDown || !currentBird || !slingConstraint) return;
    const pos = getCanvasPos(e);
    const offset = Vector.sub(pos, SLING_POS);
    const maxDist = 90;
    if (Vector.magnitude(offset) > maxDist) {
      const limited = Vector.mult(Vector.normalise(offset), maxDist);
      Body.setPosition(currentBird, Vector.add(SLING_POS, limited));
    } else {
      Body.setPosition(currentBird, pos);
    }
  };

  const onEnd = () => {
    if (!isPointerDown) return;
    isPointerDown = false;
    isDragging = false;

    if (slingConstraint && currentBird) {
      const pullVec = Vector.sub(SLING_POS, currentBird.position);
      if (Vector.magnitude(pullVec) > 15) {
        // Release bird!
        Composite.remove(world, slingConstraint);
        slingConstraint = null;
        screenShake = 6;
        
        remainingBirds--;
        updateHUD();

        setTimeout(() => {
          comboCount = 0;
          if (remainingBirds > 0 && gameState === 'PLAYING') {
            currentBird = spawnBird();
          } else {
            checkGameEndStatus();
          }
        }, 3500);
      } else {
        // Reset position
        Body.setPosition(currentBird, SLING_POS);
      }
    }
  };

  canvas.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  canvas.addEventListener('touchstart', onStart, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onEnd);
}

// Custom Rendering Loop
function render() {
  requestAnimationFrame(render);

  ctx.save();
  // Screen Shake effect
  if (screenShake > 0) {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
    screenShake *= 0.85;
    if (screenShake < 0.1) screenShake = 0;
  }

  // Draw Dynamic Background
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a1228');
  grad.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Ground
  ctx.fillStyle = '#22153b';
  ctx.fillRect(0, 475, 900, 25);
  ctx.fillStyle = '#66ff44';
  ctx.fillRect(0, 475, 900, 4);

  // Draw Trajectory Trailing Line when dragging
  if (isDragging && currentBird) {
    const pull = Vector.sub(SLING_POS, currentBird.position);
    ctx.strokeStyle = 'rgba(255, 224, 102, 0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(currentBird.position.x, currentBird.position.y);
    let simX = currentBird.position.x;
    let simY = currentBird.position.y;
    let vx = pull.x * 0.13;
    let vy = pull.y * 0.13;
    for (let i = 0; i < 20; i++) {
      simX += vx;
      simY += vy;
      vy += 0.3; // gravity approx
      ctx.lineTo(simX, simY);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw Slingshot Bands
  if (slingConstraint && currentBird) {
    ctx.strokeStyle = '#d96832';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(SLING_POS.x - 10, SLING_POS.y);
    ctx.lineTo(currentBird.position.x, currentBird.position.y);
    ctx.moveTo(SLING_POS.x + 10, SLING_POS.y);
    ctx.lineTo(currentBird.position.x, currentBird.position.y);
    ctx.stroke();
  }

  // Draw Slingshot Base
  ctx.fillStyle = '#783819';
  ctx.fillRect(SLING_POS.x - 6, SLING_POS.y, 12, 70);

  // Draw Physics Bodies
  const bodies = Composite.allBodies(world);
  bodies.forEach(body => {
    if (body.label === 'ground') return;
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.rotate(body.angle);

    if (body.label === 'bird') {
      ctx.fillStyle = '#FF3366';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (body.label === 'enemy') {
      ctx.fillStyle = '#66ff44';
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowColor = '#66ff44';
      ctx.shadowBlur = 8;
      // Crown/Ears
      ctx.fillStyle = '#33cc22';
      ctx.beginPath();
      ctx.arc(-8, -12, 5, 0, Math.PI * 2);
      ctx.arc(8, -12, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (body.label === 'wood') {
      const width = body.bounds.max.x - body.bounds.min.x;
      const height = body.bounds.max.y - body.bounds.min.y;
      ctx.fillStyle = '#cf8844';
      ctx.strokeStyle = '#5a3410';
      ctx.lineWidth = 2;
      ctx.fillRect(-width / 2, -height / 2, width, height);
      ctx.strokeRect(-width / 2, -height / 2, width, height);
    }
    ctx.restore();
  });

  // Render & Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  ctx.restore();
}

function updateHUD() {
  document.getElementById('score-val').innerText = score;
  document.getElementById('target-val').innerText = targetScore;
  document.getElementById('birds-val').innerText = '🦤'.repeat(Math.max(0, remainingBirds));
}

function checkGameEndStatus() {
  const enemies = Composite.allBodies(world).filter(b => b.label === 'enemy');
  if (enemies.length === 0 || score >= targetScore) {
    showOverlay('STAGE CLEAR!', 'Awesome Shooting!', 'NEXT STAGE');
    gameState = 'CLEAR';
  } else if (remainingBirds <= 0) {
    showOverlay('GAME OVER', 'Try Again!', 'RESTART');
    gameState = 'GAMEOVER';
  }
}

function showOverlay(title, sub, btnText) {
  document.getElementById('ov-title').innerText = title;
  document.getElementById('ov-sub').innerText = sub;
  document.getElementById('ov-main-btn').innerText = btnText;
  document.getElementById('titleMascotImg').style.display = (gameState === 'TITLE') ? 'block' : 'none';
  document.getElementById('overlay').classList.remove('hidden');
}

function startOrRestartGame() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('titleMascotImg').style.display = 'none';
  gameState = 'PLAYING';
  remainingBirds = 3;
  loadLevel();
}

function togglePause() {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSED';
    showOverlay('PAUSED', 'Game Resumed?', 'RESUME');
  } else if (gameState === 'PAUSED') {
    gameState = 'PLAYING';
    document.getElementById('overlay').classList.add('hidden');
  }
}

function nextLevel() {
  targetScore += 1000;
  startOrRestartGame();
}

// Launch Game Setup
window.addEventListener('load', () => {
  initEngine();
  setupControls();
  render();
});
</script>
</body>
</html>
