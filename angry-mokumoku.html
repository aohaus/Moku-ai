<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Angry Mokumoku - Asia & Beyond Edition</title>

<!-- Home-screen / PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1228">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Angry Mokumoku">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1228;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  user-select: none;
  overflow: hidden;
  touch-action: none;
}
#wrapper {
  position: relative;
  display: inline-block;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  width: 100vw;
  max-width: min(1366px, calc(100vh * 1.8));
}
canvas { display: block; cursor: crosshair; width: 100%; height: auto; }

#titleMascotImg {
  display: block;
  position: absolute;
  left: 50%;
  top: 42%;
  width: 15%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 30px rgba(102,255,68,0.45));
  animation: titleMascotBob 3.2s ease-in-out infinite;
  pointer-events: none;
  z-index: 3;
}
@keyframes titleMascotBob {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -50%) translateY(-8px); }
}
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px;
  pointer-events: none;
  z-index: 5;
}
#hud-info {
  display: flex; justify-content: space-between; align-items: center;
  flex: 1;
  gap: 8px;
}
#pause-btn {
  pointer-events: all;
  flex-shrink: 0;
  background: rgba(0,0,0,0.45);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 17px;
  cursor: pointer;
}
#score-display {
  background: rgba(0,0,0,0.45);
  color: #FFE066;
  font-size: 16px; font-weight: 700;
  padding: 6px 14px; border-radius: 20px;
  letter-spacing: 0.3px;
}
#target-display {
  background: rgba(0,0,0,0.35);
  color: rgba(255,255,255,0.85);
  font-size: 13px;
  padding: 5px 12px; border-radius: 20px;
  letter-spacing: 0.2px;
}
#birds-display {
  font-size: 20px;
  background: rgba(0,0,0,0.45);
  padding: 6px 12px; border-radius: 20px;
  color: #fff;
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(5px);
  pointer-events: all;
  z-index: 10;
}
#overlay.hidden { display: none; }
#overlay h1 { color: #fff; font-size: 40px; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
#overlay p { color: #FFE066; font-size: 18px; margin-bottom: 24px; text-align: center; line-height: 1.5; }
#overlay .btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
#overlay button {
  background: #FF6B35; color: #fff;
  border: none; border-radius: 30px;
  padding: 12px 32px; font-size: 18px; font-weight: 700;
  cursor: pointer; transition: transform 0.15s, background 0.15s;
  box-shadow: 0 4px 16px rgba(255,107,53,0.4);
}
#overlay button:hover { background: #FF8C5A; transform: scale(1.05); }
#ov-next-btn { background: #4CAF50; box-shadow: 0 4px 16px rgba(76,175,80,0.4); }
#ov-next-btn:hover { background: #66BB6A; }
</style>
</head>
<body>

<div id="wrapper">
  <canvas id="canvas" width="900" height="500"></canvas>

  <div id="hud">
    <button id="pause-btn">⏸</button>
    <div id="hud-info">
      <div id="score-display">SCORE: <span id="score-val">0</span></div>
      <div id="target-display">LEVEL <span id="level-val">1</span></div>
      <div id="birds-display">🐤 × <span id="birds-val">3</span></div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="ov-title">ANGRY MOKUMOKU</h1>
    <p id="ov-msg">スリングでモクモクを飛ばして<br>ターゲットを倒そう！</p>
    <div class="btn-row">
      <button id="ov-start-btn">スタート</button>
      <button id="ov-next-btn" style="display:none;">次のステージ</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Game Elements
const SLING_X = 170;
const SLING_Y = 370;

let score = 0;
let level = 1;
let birdsLeft = 3;
let gameState = 'TITLE'; // TITLE, PLAYING, PAUSED, CLEAR, GAMEOVER

let bird = null;
let isDragging = false;
let dragPos = { x: SLING_X, y: SLING_Y };

let blocks = [];
let targets = [];
let particles = [];
let floatingTexts = [];

// Sound / FX Effects Helper
function addParticle(x, y, color, size = 4) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      color: color,
      radius: Math.random() * size + 2,
      alpha: 1,
      life: 0.03
    });
  }
}

function addFloatingText(x, y, text, color = '#FFE066') {
  floatingTexts.push({
    x: x,
    y: y,
    text: text,
    color: color,
    alpha: 1.0,
    vy: -1.5
  });
}

// Initialize Level
function initLevel(lvl) {
  level = lvl;
  birdsLeft = 3;
  document.getElementById('level-val').innerText = level;
  document.getElementById('birds-val').innerText = birdsLeft;
  
  resetBird();

  blocks = [];
  targets = [];
  particles = [];
  floatingTexts = [];

  // Construct target structures depending on level
  const baseX = 620;
  const baseY = 420;

  // Ground Block Base
  blocks.push({ x: baseX - 40, y: baseY, w: 140, h: 20, hp: 30, maxHp: 30, color: '#8B5A2B' });
  blocks.push({ x: baseX - 30, y: baseY - 60, w: 20, h: 60, hp: 20, maxHp: 20, color: '#A0522D' });
  blocks.push({ x: baseX + 70, y: baseY - 60, w: 20, h: 60, hp: 20, maxHp: 20, color: '#A0522D' });
  blocks.push({ x: baseX - 40, y: baseY - 80, w: 140, h: 20, hp: 30, maxHp: 30, color: '#8B5A2B' });

  // Targets (Oni/Pigs)
  targets.push({ x: baseX + 20, y: baseY - 30, r: 18, hp: 15, maxHp: 15 });

  if (lvl >= 2) {
    blocks.push({ x: baseX, y: baseY - 140, w: 20, h: 60, hp: 20, maxHp: 20, color: '#4A6572' });
    blocks.push({ x: baseX + 40, y: baseY - 140, w: 20, h: 60, hp: 20, maxHp: 20, color: '#4A6572' });
    blocks.push({ x: baseX - 10, y: baseY - 160, w: 80, h: 20, hp: 30, maxHp: 30, color: '#34495E' });
    targets.push({ x: baseX + 20, y: baseY - 110, r: 16, hp: 15, maxHp: 15 });
  }

  if (lvl >= 3) {
    targets.push({ x: baseX + 20, y: baseY - 190, r: 15, hp: 15, maxHp: 15 });
  }
}

function resetBird() {
  bird = {
    x: SLING_X,
    y: SLING_Y,
    r: 16,
    vx: 0,
    vy: 0,
    launched: false,
    stopped: false
  };
  dragPos = { x: SLING_X, y: SLING_Y };
}

// Mouse / Touch Controls
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function onDown(e) {
  if (gameState !== 'PLAYING' || bird.launched) return;
  const p = getPos(e);
  const dist = Math.hypot(p.x - bird.x, p.y - bird.y);
  if (dist < 35) {
    isDragging = true;
  }
}

function onMove(e) {
  if (!isDragging) return;
  const p = getPos(e);
  const dx = p.x - SLING_X;
  const dy = p.y - SLING_Y;
  const angle = Math.atan2(dy, dx);
  const dist = Math.min(Math.hypot(dx, dy), 75);

  dragPos.x = SLING_X + Math.cos(angle) * dist;
  dragPos.y = SLING_Y + Math.sin(angle) * dist;
  bird.x = dragPos.x;
  bird.y = dragPos.y;
}

function onUp() {
  if (!isDragging) return;
  isDragging = false;
  bird.launched = true;

  const dx = SLING_X - bird.x;
  const dy = SLING_Y - bird.y;
  bird.vx = dx * 0.25;
  bird.vy = dy * 0.25;
}

window.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
window.addEventListener('touchstart', onDown, { passive: true });
window.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchend', onUp);

// Update Game Loop
function update() {
  if (gameState !== 'PLAYING') return;

  // Particle updates
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.life;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // Floating text updates
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.02;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  if (!bird.launched) return;

  // Physics
  bird.vy += 0.35; // Gravity
  bird.x += bird.vx;
  bird.y += bird.vy;

  // Trail Particles
  if (Math.random() < 0.6) {
    addParticle(bird.x, bird.y, '#66FF44', 2);
  }

  // Ground collision
  if (bird.y + bird.r >= 440) {
    bird.y = 440 - bird.r;
    bird.vx *= 0.5;
    bird.vy *= -0.3;
    if (Math.abs(bird.vx) < 0.5 && Math.abs(bird.vy) < 0.5) {
      bird.stopped = true;
    }
  }

  // Canvas bounds
  if (bird.x > canvas.width + 50 || bird.x < -50) {
    bird.stopped = true;
  }

  // Collision with Blocks
  blocks.forEach(b => {
    if (bird.x + bird.r > b.x && bird.x - bird.r < b.x + b.w &&
        bird.y + bird.r > b.y && bird.y - bird.r < b.y + b.h) {
      
      const speed = Math.hypot(bird.vx, bird.vy);
      if (speed > 1.5) {
        const damage = Math.floor(speed * 4);
        b.hp -= damage;
        addParticle(bird.x, bird.y, b.color, 5);

        if (b.hp <= 0) {
          score += 100;
          addFloatingText(b.x + b.w / 2, b.y, '+100');
        }
      }
      bird.vx *= -0.4;
      bird.vy *= 0.4;
    }
  });

  // Remove destroyed blocks
  blocks = blocks.filter(b => b.hp > 0);

  // Collision with Targets
  targets.forEach(t => {
    const dist = Math.hypot(bird.x - t.x, bird.y - t.y);
    if (dist < bird.r + t.r) {
      const speed = Math.hypot(bird.vx, bird.vy);
      if (speed > 1.2) {
        t.hp -= speed * 6;
        addParticle(t.x, t.y, '#FF5252', 6);

        if (t.hp <= 0) {
          score += 500;
          addFloatingText(t.x, t.y - 10, '+500', '#FFD700');
        }
      }
      bird.vx *= 0.5;
    }
  });

  // Remove destroyed targets
  targets = targets.filter(t => t.hp > 0);

  // Check Level Clear
  if (targets.length === 0) {
    gameState = 'CLEAR';
    setTimeout(showClearOverlay, 800);
  }

  // Next Bird handling
  if (bird.stopped) {
    birdsLeft--;
    document.getElementById('birds-val').innerText = birdsLeft;

    if (birdsLeft > 0 && targets.length > 0) {
      resetBird();
    } else if (targets.length > 0) {
      gameState = 'GAMEOVER';
      setTimeout(showGameOverOverlay, 800);
    }
  }

  document.getElementById('score-val').innerText = score;
}

// Render Function
function draw() {
  // Background
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, '#1a1228');
  gradient.addColorStop(0.7, '#2d1b4e');
  gradient.addColorStop(1, '#150d21');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Moon
  ctx.fillStyle = 'rgba(255, 243, 196, 0.15)';
  ctx.beginPath();
  ctx.arc(750, 100, 70, 0, Math.PI * 2);
  ctx.fill();

  // Ground
  ctx.fillStyle = '#2c1e38';
  ctx.fillRect(0, 440, canvas.width, 60);
  ctx.fillStyle = '#412a52';
  ctx.fillRect(0, 440, canvas.width, 6);

  // Slingshot
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(SLING_X - 10, SLING_Y + 40);
  ctx.lineTo(SLING_X - 10, SLING_Y);
  ctx.lineTo(SLING_X - 22, SLING_Y - 30);
  ctx.moveTo(SLING_X - 10, SLING_Y);
  ctx.lineTo(SLING_X + 10, SLING_Y - 30);
  ctx.stroke();

  // Rubber Band (Back)
  if (isDragging) {
    ctx.strokeStyle = '#27150d';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(SLING_X - 20, SLING_Y - 25);
    ctx.lineTo(bird.x, bird.y);
    ctx.stroke();
  }

  // Bird (Mokumoku)
  if (bird) {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.fillStyle = '#66FF44';
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(-4, -3, 5, 0, Math.PI * 2);
    ctx.arc(4, -3, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-2, -3, 2, 0, Math.PI * 2);
    ctx.arc(6, -3, 2, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#FF9800';
    ctx.beginPath();
    ctx.moveTo(0, 1);
    ctx.lineTo(-4, 6);
    ctx.lineTo(4, 6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // Rubber Band (Front)
  if (isDragging) {
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(SLING_X + 10, SLING_Y - 25);
    ctx.lineTo(bird.x, bird.y);
    ctx.stroke();
  }

  // Trajectory dots while dragging
  if (isDragging) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    let simX = bird.x;
    let simY = bird.y;
    let simVx = (SLING_X - bird.x) * 0.25;
    let simVy = (SLING_Y - bird.y) * 0.25;

    for (let i = 0; i < 15; i++) {
      simX += simVx;
      simY += simVy;
      simVy += 0.35;
      ctx.beginPath();
      ctx.arc(simX, simY, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Blocks
  blocks.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    // Damage overlay
    if (b.hp < b.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  });

  // Targets
  targets.forEach(t => {
    ctx.fillStyle = '#FF5252';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(t.x - 5, t.y - 3, 4, 0, Math.PI * 2);
    ctx.arc(t.x + 5, t.y - 3, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(t.x - 5, t.y - 3, 1.5, 0, Math.PI * 2);
    ctx.arc(t.x + 5, t.y - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Floating Texts (Added FX)
  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 18px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Overlay Handlers
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovMsg = document.getElementById('ov-msg');
const ovStartBtn = document.getElementById('ov-start-btn');
const ovNextBtn = document.getElementById('ov-next-btn');

function showClearOverlay() {
  ovTitle.innerText = 'STAGE CLEAR!';
  ovMsg.innerHTML = `見事ターゲットを倒しました！<br>SCORE: ${score}`;
  ovStartBtn.innerText = 'やり直す';
  ovNextBtn.style.display = 'inline-block';
  overlay.classList.remove('hidden');
}

function showGameOverOverlay() {
  ovTitle.innerText = 'GAME OVER';
  ovMsg.innerHTML = `モクモクがいなくなってしまった...<br>SCORE: ${score}`;
  ovStartBtn.innerText = 'もう一度プレイ';
  ovNextBtn.style.display = 'none';
  overlay.classList.remove('hidden');
}

ovStartBtn.addEventListener('click', () => {
  score = 0;
  document.getElementById('score-val').innerText = score;
  initLevel(level);
  gameState = 'PLAYING';
  overlay.classList.add('hidden');
});

ovNextBtn.addEventListener('click', () => {
  initLevel(level + 1);
  gameState = 'PLAYING';
  overlay.classList.add('hidden');
});

document.getElementById('pause-btn').addEventListener('click', () => {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSED';
    ovTitle.innerText = 'PAUSED';
    ovMsg.innerText = '一時停止中';
    ovStartBtn.innerText = '再開';
    ovNextBtn.style.display = 'none';
    overlay.classList.remove('hidden');
  }
});

// Start loop
initLevel(1);
loop();
</script>
</body>
</html>
