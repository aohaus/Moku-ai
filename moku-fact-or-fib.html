<!--
  Fact or Fib? Asia(v0.1.0、2026-11-19)— 棚「Live in ASIA」の第3弾。
  「うそみたいな本当の話」と「本当っぽいうそ」を見分ける。Live in ASIA の目標(CLAUDE.md §2)に合わせて:
  ①どの話にも国旗と国の名前が付く(国を覚える)②くらべる話が多い(いちばん大きい・同じお金 など)
  ③答えのあとに必ず理由。うそ(Fib)には「本当は…」を出して、友達に説明できるようにする。
  - 🎯 Quiz(1人): 10問。正解 +5 Moint、10問全部 +25(1日 500 の上限の中)。続けて正解すると Streak。
  - 🎉 Party(1台を回して 2〜4人): 8問。1問ごとに全員が自分の列で Fact / Fib を押す(何を押したかは出さず ✓ だけ)
    → Reveal で答えと理由 → 当たった人に 1点。Moint はなし(Moku Wolf と同じ)。
  - 📚 Fact Book: 一度でも正解した話が国ごとにたまる。
  話のデータは下の CLAIMS(a: true = Fact / false = Fib)。うそは「まちがいがはっきりしている」ものだけ(言い方しだいで
  本当にもなる話は入れない)。宗教・政治・争いのある話は入れない。新しい話は id を変えずに足す(id はセーブのキー)。
  記録は moku:moku-fact-or-fib:progress、音とプレイヤー名は moku:moku-fact-or-fib:settings。

<script>
(function () {
  'use strict';
  var GAME_ID = 'moku-fact-or-fib';
  var SAVE_KEY = 'moku:' + GAME_ID + ':progress', SET_KEY = 'moku:' + GAME_ID + ':settings';
  var $ = function (id) { return document.getElementById(id); };
  function readJSON(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var NAMES = { MM: 'Myanmar', TH: 'Thailand', LA: 'Laos', KH: 'Cambodia', VN: 'Vietnam', MY: 'Malaysia', SG: 'Singapore', BN: 'Brunei', ID: 'Indonesia', PH: 'Philippines', TL: 'Timor-Leste' };

  // ---------- 国旗(Where's Moku? と同じ絵。30×20) ----------
  function starPts(cx, cy, r, n, inner, rot) {
    n = n || 5; inner = inner || 0.4; rot = rot == null ? -90 : rot;
    var pts = [];
    for (var i = 0; i < n * 2; i++) {
      var rr = i % 2 ? r * inner : r, a = (rot + i * 180 / n) * Math.PI / 180;
      pts.push((cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2));
    }
    return pts.join(' ');
  }

    var p = readJSON(SAVE_KEY);
    if (!p || p.version !== 1) p = {};
    return { version: 1, gameId: GAME_ID, known: p.known || {}, quizzes: p.quizzes | 0, best: p.best | 0, bestStreak: p.bestStreak | 0,
      correct: p.correct | 0, parties: p.parties | 0, played: p.played | 0, updatedAt: p.updatedAt || null };
  }
  var progress = loadProgress();
  function save() { progress.updatedAt = new Date().toISOString(); writeJSON(SAVE_KEY, progress); }
  function knownCount() { return Object.keys(progress.known).filter(function (k) { return BY_ID[k]; }).length; }
  var settings = readJSON(SET_KEY) || {};
  if (settings.sound === undefined) settings.sound = true;
  function saveSettings() { writeJSON(SET_KEY, settings); }

  function balance() { if (window.MokuMoint) return MokuMoint.balance(); var w = readJSON('moku:moint:wallet'); return w && w.balance > 0 ? w.balance : 0; }
  function earn(n) {
    if (!n) return 0;
    if (window.MokuMoint) return MokuMoint.earn(GAME_ID, n);
    writeJSON('moku:moint:wallet', { version: 1, balance: Math.max(0, balance() + n), updatedAt: new Date().toISOString() });
    return n;
  }
  function earnedToday() { return window.MokuMoint ? MokuMoint.earnedToday(GAME_ID) : 0; }
  function dailyCap() { return window.MokuMoint ? MokuMoint.DAILY_GAME_CAP : 500; }
  function mointBox(lines) {
    var got = lines.filter(function (l) { return l[1] > 0; });
    if (!got.length) return '';
    var tot = got.reduce(function (a, l) { return a + l[1]; }, 0);
    return '<div class="moints">' + got.map(function (l) { return '<div><span>' + esc(l[0]) + '</span><span>+' + l[1] + '</span></div>'; }).join('') +
      '<div class="tot"><span><span class="mcoin">M</span> Moints</span><span>+' + tot + '</span></div>' +
      '<div style="font-size:12px;color:#9A7420;justify-content:flex-start">Today: ' + earnedToday() + ' / ' + dailyCap() + '</div></div>';
  }
  var actx = null, gestured = false;
  function audio() {
    if (!settings.sound || !gestured) return null;
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  document.addEventListener('pointerdown', function () { gestured = true; if (settings.sound) audio(); }, { passive: true });
  function tone(f, t0, dur, type, vol) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0 || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  var sfx = {
    tap: function () { tone(660, 0, 0.08, 'triangle', 0.08); },
    lock: function () { tone(520, 0, 0.06, 'square', 0.05); },
    good: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.08, 0.22, 'triangle', 0.13); }); },
    bad: function () { tone(330, 0, 0.16, 'sine', 0.12); tone(262, 0.12, 0.22, 'sine', 0.12); },
    drum: function () { for (var i = 0; i < 6; i++) tone(120 + i * 8, i * 0.07, 0.08, 'triangle', 0.12); },
    fanfare: function () { [392, 523, 659, 784, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.11, 0.25, 'triangle', 0.12); }); }
  };
  function syncSoundBtn() { $('soundBtn').textContent = settings.sound ? '🔊' : '🔇'; }
  $('soundBtn').addEventListener('click', function () { settings.sound = !settings.sound; saveSettings(); syncSoundBtn(); if (settings.sound) sfx.tap(); });

  // ---------- screens ----------
  var inner = $('inner'), fresh = false;
  function setInner(h) {
    inner.innerHTML = h;
    if (fresh) { var c = inner.querySelector('.card'); if (c) c.classList.add('enter'); $('main').scrollTop = 0; }
    fresh = false;
  }
  function avatar() {
    var o = '';
    if (window.MokuMoint) { try { o = MokuMoint.outfitSVG(MokuMoint.closet().equipped); } catch (e) {} }
    return '<span class="av"><img src="brand/mokumoku-hero.png" alt="">' + o + '</span>';
  }
  function showTitle() {
    document.body.classList.add('on-title');
    $('cover').classList.remove('show');
    $('bookCount').textContent = knownCount() + ' / ' + CLAIMS.length + ' facts found';
    $('titleBal').textContent = Math.round(balance()).toLocaleString('en-US');
    $('titleToday').textContent = '· Today ' + earnedToday() + ' / ' + dailyCap();
    try { if (window.MokuMoint) $('titleOutfit').innerHTML = MokuMoint.outfitSVG(MokuMoint.closet().equipped); } catch (e) {}
  }
  function showPlay(title) { document.body.classList.remove('on-title'); $('modeTitle').textContent = title; $('topInfo').textContent = ''; fresh = true; }
  $('menuBtn').addEventListener('click', function () { sfx.tap(); showTitle(); });
  function claimHTML(cl) {
    return '<div class="where">' + flagSVG(cl.c) + esc(NAMES[cl.c]) + '</div><div class="claim">' + esc(cl.t) + '</div>';
  }
  function verdictHTML(cl, ok, extra) {
    return '<div class="verdict ' + ((ok === null ? cl.a : ok) ? 'ok' : 'no') + '"><div class="t"><span class="stamp ' + (cl.a ? 'fact' : 'fib') + '">' + (cl.a ? 'FACT ✓' : 'FIB ✗') + '</span>' +
      (ok === null ? '' : ok ? 'You got it!' : 'Oops!') + (extra || '') + '</div><p>' + (cl.a ? '' : '<b>The truth:</b> ') + esc(cl.why) + '</p></div>';
  }
  // 出す話: まだ正解していない話を多めに、Fact と Fib を半分ずつ
  function pickClaims(n) {
    var facts = shuffle(CLAIMS.filter(function (c) { return c.a; })), fibs = shuffle(CLAIMS.filter(function (c) { return !c.a; }));
    var newFirst = function (list) { return list.filter(function (c) { return !progress.known[c.id]; }).concat(list.filter(function (c) { return progress.known[c.id]; })); };
    facts = newFirst(facts); fibs = newFirst(fibs);
    var out = facts.slice(0, Math.ceil(n / 2)).concat(fibs.slice(0, Math.floor(n / 2)));
    return shuffle(out);
  }

  // =====================================================================
  // 🎯 Quiz
  // =====================================================================
  var QUIZ_LEN = 10, quiz = null;
  function startQuiz() {
    progress.played++; save();
    quiz = { list: pickClaims(QUIZ_LEN), i: 0, res: [], streak: 0, bestStreak: 0, answered: null };
    showPlay('🎯 Quiz');
    renderQuiz();
  }
  function renderQuiz() {
    var cl = quiz.list[quiz.i];
    $('topInfo').textContent = (quiz.i + 1) + '/' + QUIZ_LEN + ' · ✓ ' + quiz.res.filter(Boolean).length;
    var dots = '<div class="dots">' + quiz.list.map(function (x, i) { return '<i class="' + (i < quiz.res.length ? (quiz.res[i] ? 'ok' : 'no') : i === quiz.i ? 'now' : '') + '"></i>'; }).join('') + '</div>';
    var h = '<div class="card">' + dots + '<div class="host">' + avatar() + '<div class="bub">' + claimHTML(cl) + '</div></div>';
    if (quiz.answered === null) {
      h += '<div class="ff"><button class="big fact" data-a="1">✓ FACT<small>It’s true!</small></button><button class="big fib" data-a="0">✗ FIB<small>That’s made up!</small></button></div>' +
        '<div class="tip">Hmm… true or made up? Trust your brain!</div>';
    } else {
      var ok = quiz.res[quiz.i];
      h += '<div class="ff"><button class="big fact' + (quiz.answered ? '' : ' dim') + '" disabled>✓ FACT</button><button class="big fib' + (quiz.answered ? ' dim' : '') + '" disabled>✗ FIB</button></div>' +
        verdictHTML(cl, ok, ok && quiz.streak >= 3 ? '<span class="streak">🔥 ' + quiz.streak + ' in a row!</span>' : '') +
        '<div class="row"><button class="btn primary" id="qNext">' + (quiz.i + 1 >= QUIZ_LEN ? 'See results ▶' : 'Next ▶') + '</button></div>';
    }
    h += '</div>';
    setInner(h);
    inner.querySelectorAll('[data-a]').forEach(function (b) { b.addEventListener('click', function () { answerQuiz(b.getAttribute('data-a') === '1'); }); });
    if ($('qNext')) $('qNext').addEventListener('click', function () { sfx.tap(); quiz.i++; quiz.answered = null; fresh = true; if (quiz.i >= QUIZ_LEN) endQuiz(); else renderQuiz(); });
  }
  function answerQuiz(said) {
    if (quiz.answered !== null) return;
    var cl = quiz.list[quiz.i], ok = said === cl.a;
    quiz.answered = said; quiz.res.push(ok);
    if (ok) { quiz.streak++; quiz.bestStreak = Math.max(quiz.bestStreak, quiz.streak); progress.known[cl.id] = 1; progress.correct++; sfx.good(); }
    else { quiz.streak = 0; sfx.bad(); }
    save();
    renderQuiz();
  }
  function endQuiz() {
    var n = quiz.res.filter(Boolean).length;
    progress.quizzes++; progress.best = Math.max(progress.best, n); progress.bestStreak = Math.max(progress.bestStreak, quiz.bestStreak);
    var lines = [['Right answers: ' + n + ' × 5', earn(n * 5)]];
    if (n === QUIZ_LEN) lines.push(['All 10 right! ⭐', earn(25)]);
    save(); sfx.fanfare();
    $('topInfo').textContent = '✓ ' + n + '/' + QUIZ_LEN;
    fresh = true;
    var missed = quiz.list.filter(function (c, i) { return !quiz.res[i]; });
    setInner('<div class="card"><div class="host">' + avatar() + '<div class="bub"><div class="h">' + (n === QUIZ_LEN ? 'Perfect! You can’t be fooled!' : n >= 7 ? 'Great fact-finder!' : 'Good try — tricky ones!') + '</div>' +
      '<div class="sub">Best streak this time: 🔥 ' + quiz.bestStreak + '</div></div></div>' +
      '<div class="bigNum">' + n + ' / ' + QUIZ_LEN + '</div>' + mointBox(lines) +
      (missed.length ? '<div class="sub" style="margin-top:12px">Remember these:</div>' + missed.map(function (c) { return verdictHTML(c, null); }).join('') : '') +
      '<div class="row"><button class="btn primary" id="again">🎯 Play again</button><button class="btn" id="toMenu">Menu</button></div>' +
      '<div class="tip">📚 ' + knownCount() + ' / ' + CLAIMS.length + ' facts in your Fact Book</div></div>');
    $('again').addEventListener('click', function () { sfx.tap(); startQuiz(); });
    $('toMenu').addEventListener('click', function () { sfx.tap(); showTitle(); });
  }

  // =====================================================================
  // 🎉 Party(1台で 2〜4人)
  // =====================================================================
  var PARTY_LEN = 8, COLORS = ['#E8A23A', '#4AA3DF', '#3E9B5A', '#E0607E'], party = null;
  function startPartySetup() {
    showPlay('🎉 Party');
    var saved = settings.players || ['Player 1', 'Player 2', 'Player 3', 'Player 4'], count = settings.playerCount || 2;
    function draw() {
      var h = '<div class="card"><div class="host">' + avatar() + '<div class="bub"><div class="h">Party time!</div><div class="sub">Put the phone in the middle. Read each claim out loud, then everyone taps <b>Fact</b> or <b>Fib</b> on their own row. Then reveal!</div></div></div>' +
        '<div class="sub" style="margin-top:12px">How many players?</div><div class="seg">' + [2, 3, 4].map(function (n) { return '<button data-n="' + n + '" class="' + (n === count ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div><div class="players">';
      for (var i = 0; i < count; i++) h += '<input maxlength="12" data-p="' + i + '" value="' + esc(saved[i] || 'Player ' + (i + 1)) + '">';
      h += '</div><div class="row"><button class="btn primary" id="pStart">▶ Start (' + PARTY_LEN + ' claims)</button></div></div>';
      setInner(h);
      inner.querySelectorAll('[data-n]').forEach(function (b) { b.addEventListener('click', function () { collect(); count = +b.getAttribute('data-n'); sfx.tap(); draw(); }); });
      $('pStart').addEventListener('click', function () {
        collect(); settings.players = saved; settings.playerCount = count; saveSettings();
        var names = saved.slice(0, count).map(function (s, i) { return (s || '').trim() || 'Player ' + (i + 1); });
        sfx.tap(); progress.played++; save();
        party = { names: names, pts: names.map(function () { return 0; }), list: pickClaims(PARTY_LEN), i: 0, votes: {}, revealed: false };
        fresh = true; renderParty();
      });
    }
    function collect() { inner.querySelectorAll('[data-p]').forEach(function (inp) { saved[+inp.getAttribute('data-p')] = inp.value.trim().slice(0, 12); }); }
    draw();
  }
  function renderParty() {
    var cl = party.list[party.i];
    $('topInfo').textContent = (party.i + 1) + '/' + PARTY_LEN;
    var all = party.names.every(function (n, i) { return party.votes[i] !== undefined; });
    var h = '<div class="card"><div class="host">' + avatar() + '<div class="bub">' + claimHTML(cl) + '</div></div>';
    party.names.forEach(function (n, i) {
      var v = party.votes[i];
      h += '<div class="pl"><div class="nm"><i style="background:' + COLORS[i] + '"></i><span>' + esc(n) + '</span></div>';
      if (party.revealed) {
        var ok = v === cl.a;
        h += '<span class="res ' + (ok ? 'ok' : 'no') + '">' + (v ? 'Fact' : 'Fib') + (ok ? ' ✓ +1' : ' ✗') + '</span>';
      } else if (v === undefined) {
        h += '<button class="mini fact" data-p="' + i + '" data-v="1">Fact</button><button class="mini fib" data-p="' + i + '" data-v="0">Fib</button>';
      } else {
        h += '<span class="lock">🔒 Locked</span><button class="mini" style="background:#B9A88E" data-undo="' + i + '">↺</button>';
      }
      h += '<span class="pts">' + party.pts[i] + (party.pts[i] === 1 ? ' pt' : ' pts') + '</span></div>';
    });
    if (!party.revealed) h += '<div class="row"><button class="btn primary" id="reveal"' + (all ? '' : ' disabled') + '>🥁 Reveal!</button></div>' +
      '<div class="tip">No peeking! Your answer stays hidden until Reveal.</div>';
    else h += verdictHTML(cl, null) + '<div class="row"><button class="btn primary" id="pNext">' + (party.i + 1 >= PARTY_LEN ? 'Final scores ▶' : 'Next claim ▶') + '</button></div>';
    h += '</div>';
    setInner(h);
    inner.querySelectorAll('[data-p][data-v]').forEach(function (b) { b.addEventListener('click', function () { party.votes[+b.getAttribute('data-p')] = b.getAttribute('data-v') === '1'; sfx.lock(); renderParty(); }); });
    inner.querySelectorAll('[data-undo]').forEach(function (b) { b.addEventListener('click', function () { delete party.votes[+b.getAttribute('data-undo')]; sfx.tap(); renderParty(); }); });
    if ($('reveal')) $('reveal').addEventListener('click', function () {
      sfx.drum();
      party.names.forEach(function (n, i) { if (party.votes[i] === cl.a) party.pts[i]++; });
      party.revealed = true;
      setTimeout(function () { sfx.good(); }, 450);
      renderParty();
    });
    if ($('pNext')) $('pNext').addEventListener('click', function () {
      sfx.tap(); party.i++; party.votes = {}; party.revealed = false; fresh = true;
      if (party.i >= PARTY_LEN) endParty(); else renderParty();
    });
  }
  function endParty() {
    progress.parties++; save(); sfx.fanfare();
    var top = Math.max.apply(null, party.pts), win = party.names.filter(function (n, i) { return party.pts[i] === top; });
    var rows = party.names.map(function (n, i) { return { n: n, p: party.pts[i], i: i }; }).sort(function (a, b) { return b.p - a.p; });
    fresh = true;
    setInner('<div class="card"><div class="host">' + avatar() + '<div class="bub"><div class="h">' + (win.length > 1 ? 'A tie! Super fact-finders!' : esc(win[0]) + ' wins!') + '</div>' +
      '<div class="sub">Now tell your family one surprising fact you learned!</div></div></div>' +
      rows.map(function (r) { return '<div class="pl"><div class="nm"><i style="background:' + COLORS[r.i] + '"></i><span>' + (r.p === top ? '👑 ' : '') + esc(r.n) + '</span></div><span class="pts">' + r.p + (r.p === 1 ? ' pt' : ' pts') + '</span></div>'; }).join('') +
      '<div class="row"><button class="btn primary" id="pAgain">🎉 Play again</button><button class="btn" id="pMenu">Menu</button></div></div>');
    $('topInfo').textContent = '';
    $('pAgain').addEventListener('click', function () {
      sfx.tap(); progress.played++; save();
      party = { names: party.names, pts: party.names.map(function () { return 0; }), list: pickClaims(PARTY_LEN), i: 0, votes: {}, revealed: false };
      fresh = true; renderParty();
    });
    $('pMenu').addEventListener('click', function () { sfx.tap(); showTitle(); });
  }

  // =====================================================================
  // 📚 Fact Book
  // =====================================================================
  function openBook() {
    showPlay('📚 Fact Book');
    $('topInfo').textContent = knownCount() + '/' + CLAIMS.length;
    var sel = settings.bookC || 'MY';
    function draw() {
      var h = '<div class="card"><div class="h">Fact Book</div><div class="sub">Claims you got right are saved here. Tap a country.</div><div class="cgrid">' +
        ORDER.map(function (c) {
          var all = CLAIMS.filter(function (x) { return x.c === c; }), got = all.filter(function (x) { return progress.known[x.id]; }).length;
          return '<button class="cbtn' + (c === sel ? ' on' : '') + '" data-c="' + c + '">' + flagSVG(c) + '<span>' + esc(NAMES[c]) + '<small>' + got + ' / ' + all.length + '</small></span></button>';
        }).join('') + '</div><div class="facts">' +
        CLAIMS.filter(function (x) { return x.c === sel; }).map(function (x) {
          if (!progress.known[x.id]) return '<div class="fitem locked">🔒 Not found yet — play a Quiz!</div>';
          return '<div class="fitem"><span class="stamp ' + (x.a ? 'fact' : 'fib') + '" style="display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;font:700 12px var(--round);margin-right:6px">' + (x.a ? 'FACT' : 'FIB') + '</span>' + esc(x.t) +
            '<span class="why">' + (x.a ? '' : 'The truth: ') + esc(x.why) + '</span></div>';
        }).join('') + '</div></div>';
      setInner(h);
      inner.querySelectorAll('[data-c]').forEach(function (b) { b.addEventListener('click', function () { sel = b.getAttribute('data-c'); settings.bookC = sel; saveSettings(); sfx.tap(); draw(); }); });
    }
    draw();
  }

  // ---------- start ----------
  syncSoundBtn();
  $('goQuiz').addEventListener('click', function () { sfx.tap(); startQuiz(); });
  $('goParty').addEventListener('click', function () { sfx.tap(); startPartySetup(); });
  $('goBook').addEventListener('click', function () { sfx.tap(); openBook(); });
  window.addEventListener('moku:moint', function () { if (document.body.classList.contains('on-title')) showTitle(); });
  showTitle();
  try {
    var scr = new URLSearchParams(location.search).get('screen');
    if (scr === 'quiz') startQuiz(); else if (scr === 'party') startPartySetup(); else if (scr === 'book') openBook();
  } catch (e) {}
})();
</script>
</body>
</html>
