<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MOKU FISHING POND - Cozy Night Lake | Moku Series</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg-top: #0A1224;
  --bg-bottom: #050814;
  --lake-water: #0C2340;
  --lake-highlight: #1B4965;
  --accent-cyan: #38BDF8;
  --accent-gold: #FFC94A;
  --accent-mint: #6EE7A8;
  --accent-pink: #FF6B97;
  --text-main: #EDEEF6;
  --text-muted: rgba(237, 238, 246, 0.65);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: radial-gradient(circle at 50% 20%, #15254A 0%, var(--bg-top) 55%, var(--bg-bottom) 100%);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

#game-wrapper {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100vh;
  height: 100dvh;
  max-height: 860px;
  display: flex;
  flex-direction: column;
  padding: 8px 12px 14px;
  z-index: 2;
  justify-content: space-between;
}

/* Header */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  z-index: 10;
}

.hub-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--text-main);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
  backdrop-filter: blur(8px);
}
.hub-link:active {
  transform: scale(0.96);
}

.stats-pill {
  background: rgba(56, 189, 248, 0.12);
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 13px;
  padding: 4px 12px;
  text-align: center;
  backdrop-filter: blur(8px);
}
.stats-label {
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 800;
}
.stats-value {
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 19px;
  font-weight: 700;
  color: #FFF;
  line-height: 1.1;
}

.header-actions {
  display: flex;
  gap: 5px;
}
.action-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: var(--text-main);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  cursor: pointer;
}
.action-btn:active { transform: scale(0.92); }

/* Main Pond Canvas Area */
.pond-container {
  flex: 1;
  position: relative;
  width: 100%;
  margin: 6px 0;
  border-radius: 20px;
  overflow: hidden;
  border: 2px solid rgba(56, 189, 248, 0.3);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(12, 35, 64, 0.8);
}

canvas#pondCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Tension Minigame Overlay (appears when fish is hooked) */
.reel-overlay {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  background: rgba(8, 14, 28, 0.88);
  border: 2px solid var(--accent-cyan);
  border-radius: 20px;
  padding: 12px 16px;
  backdrop-filter: blur(10px);
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 25;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
}
.reel-overlay.active {
  display: flex;
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.reel-status-text {
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-gold);
}

.tension-bar-track {
  width: 100%;
  height: 20px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.tension-sweet-zone {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 40%;
  width: 30%;
  background: rgba(110, 231, 168, 0.45);
  border-left: 2px dashed #6EE7A8;
  border-right: 2px dashed #6EE7A8;
}
.tension-needle {
  position: absolute;
  top: -2px;
  bottom: -2px;
  left: 10%;
  width: 8px;
  background: #FF6B97;
  border-radius: 999px;
  box-shadow: 0 0 10px #FF6B97;
  transform: translateX(-50%);
  transition: left 0.05s linear;
}

.reel-progress-track {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  overflow: hidden;
}
.reel-progress-fill {
  height: 100%;
  width: 20%;
  background: linear-gradient(90deg, #38BDF8, #6EE7A8);
  border-radius: 999px;
  transition: width 0.08s ease;
}

.btn-reel {
  width: 100%;
  background: linear-gradient(135deg, #38BDF8, #0284C7);
  border: none;
  color: #FFF;
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 16px;
  font-weight: 700;
  padding: 12px;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
}
.btn-reel:active { transform: scale(0.97); }

/* Bottom Action Bar */
.bottom-bar {
  display: flex;
  gap: 8px;
  width: 100%;
}
.btn-cast {
  flex: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(135deg, #6EE7A8, #10B981);
  color: #062312;
  border: none;
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 16px;
  font-weight: 800;
  padding: 14px;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(110, 231, 168, 0.4);
  transition: transform 0.12s ease;
}
.btn-cast:active { transform: scale(0.96); }
.btn-cast:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-book {
  flex: 1;
  background: rgba(255, 255, 255, 0.08);
  border: 1.5px solid rgba(255, 255, 255, 0.16);
  color: var(--text-main);
  padding: 12px 14px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-book:active { transform: scale(0.96); }

/* Catch Popup Modal */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(6, 10, 22, 0.9);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
  border-radius: 20px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.catch-card {
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid rgba(56, 189, 248, 0.4);
  border-radius: 20px;
  padding: 20px;
  width: 100%;
  max-width: 280px;
  margin-bottom: 20px;
  animation: bouncePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.catch-emoji {
  font-size: 60px;
  line-height: 1;
  margin-bottom: 8px;
  filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.5));
}
.catch-name {
  font-family: 'Fredoka', cursive, sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent-gold);
  margin-bottom: 4px;
}
.catch-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.catch-size {
  display: inline-block;
  background: rgba(56, 189, 248, 0.18);
  border: 1px solid var(--accent-cyan);
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  color: #FFF;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #38BDF8, #6EE7A8);
  border: none;
  color: #061A28;
  font-size: 15px;
  font-weight: 800;
  padding: 13px 32px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(56, 189, 248, 0.4);
}
.btn-primary:active { transform: scale(0.96); }

/* Fishbook Collection Modal */
.fishbook-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  max-height: 280px;
  overflow-y: auto;
  padding: 8px 4px;
  margin-bottom: 16px;
}
.fishbook-item {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
}
.fishbook-item.unlocked {
  border-color: rgba(56, 189, 248, 0.5);
  background: rgba(56, 189, 248, 0.1);
  color: #FFF;
}
.fishbook-item .emoji { font-size: 26px; margin-bottom: 2px; }

@keyframes popIn {
  from { transform: translateX(-50%) scale(0.8); opacity: 0; }
  to { transform: translateX(-50%) scale(1); opacity: 1; }
}
@keyframes bouncePop {
  0% { transform: scale(0.6); }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* Tablet & iPad Pro / Landscape mode */
@media (min-width: 768px), (orientation: landscape) and (min-width: 560px) {
  #game-wrapper {
    max-width: 1060px;
    width: 95%;
    max-height: 92vh;
    padding: 12px 24px;
  }
  .pond-container {
    margin: 8px 0 12px;
    border-radius: 24px;
  }
  .reel-overlay {
    max-width: 480px;
    padding: 16px 20px;
  }
  .btn-cast {
    font-size: 16px;
    padding: 14px 20px;
  }
  .btn-book {
    padding: 14px 20px;
    font-size: 15px;
  }
}

/* Compact landscape on iPhones */
@media (max-height: 500px) and (orientation: landscape) {
  #game-wrapper {
    max-height: 98vh;
    padding: 4px 14px;
    gap: 4px;
  }
  .game-header {
    gap: 4px;
  }
  .stats-pill {
    padding: 2px 8px;
  }
  .stats-value {
    font-size: 15px;
  }
  .pond-container {
    margin: 2px 0 4px;
    border-radius: 14px;
  }
  .reel-overlay {
    bottom: 8px;
    padding: 8px 12px;
    gap: 4px;
    max-width: 400px;
  }
  .reel-status-text {
    font-size: 11px;
  }
  .tension-bar-track, .reel-progress-track {
    height: 10px;
  }
  .btn-reel {
    padding: 6px 14px;
    font-size: 12px;
  }
  .bottom-bar {
    gap: 6px;
  }
  .btn-cast {
    padding: 8px 14px;
    font-size: 12.5px;
  }
  .btn-book {
    padding: 8px 12px;
    font-size: 12px;
  }
}
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- Top Header -->
  <div class="game-header">
    <a href="hub.html" class="hub-link" id="backToHubBtn" aria-label="Return to Moku Series Hub">
      <span>◀ Hub</span>
    </a>
    
    <div class="stats-pill">
      <div class="stats-label">Fish Caught</div>
      <div class="stats-value" id="fishCountVal">0</div>
    </div>

    <div class="stats-pill">
      <div class="stats-label">Pond Points</div>
      <div class="stats-value" id="pondPointsVal" style="color: var(--accent-gold);">0</div>
    </div>

    <div class="header-actions">
      <button class="action-btn" id="soundToggleBtn" aria-label="Toggle Sound">🔊</button>
    </div>
  </div>

  <!-- Pond Arena -->
  <div class="pond-container">
    <canvas id="pondCanvas"></canvas>

    <!-- Reel Tension Minigame Widget -->
    <div class="reel-overlay" id="reelOverlay">
      <div class="reel-status-text" id="reelStatusText">🎣 FISH ON! Tap Reel to balance tension!</div>
      
      <div class="tension-bar-track">
        <div class="tension-sweet-zone" id="sweetZone"></div>
        <div class="tension-needle" id="tensionNeedle"></div>
      </div>

      <div class="reel-progress-track">
        <div class="reel-progress-fill" id="reelProgressFill"></div>
      </div>

      <button class="btn-reel" id="reelHoldBtn">REEL IN! 🌀</button>
    </div>
  </div>

  <!-- Bottom Cast Bar -->
  <div class="bottom-bar">
    <button class="btn-cast" id="castBtn">
      <span>🎣</span>
      <span id="castBtnText">CAST LINE INTO POND</span>
    </button>
    <button class="btn-book" id="bookBtn">
      <span>📖</span>
      <span>Fishbook</span>
    </button>
  </div>

  <!-- Catch Success Modal -->
  <div id="catchModal" class="modal-overlay">
    <div class="catch-card">
      <div class="catch-emoji" id="catchEmoji">🐟</div>
      <div class="catch-name" id="catchName">Moonlight Carp</div>
      <div class="catch-desc" id="catchDesc">A shimmering fish native to Moku Lake.</div>
      <div class="catch-size" id="catchSize">Size: 42.5 cm · +120 Pts</div>
    </div>
    <button class="btn-primary" id="keepCatchBtn">Keep & Continue</button>
  </div>

  <!-- Fishbook Collection Modal -->
  <div id="bookModal" class="modal-overlay">
    <h2 style="font-family: 'Fredoka', cursive; font-size: 24px; color: var(--accent-cyan); margin-bottom: 6px;">📖 Moku Lake Fishbook</h2>
    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;" id="bookProgress">Discovered: 0 / 8</div>
    <div class="fishbook-grid" id="fishbookGrid"></div>
    <button class="btn-primary" id="closeBookBtn">Back to Pond</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // --- SOUND SYNTHESIZER ---
  var audioCtx = null;
  var soundEnabled = true;

  function getAudioContext() {
    if (!audioCtx) {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      var ctx = getAudioContext();
      if (!ctx) return;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      var now = ctx.currentTime;

      if (type === 'cast') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'splash') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'bite') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === 'catch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.08);
        osc.frequency.setValueAtTime(659, now + 0.16);
        osc.frequency.setValueAtTime(880, now + 0.24);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    } catch(e) {}
  }

  // --- FISH SPECIES CATALOG ---
  var SPECIES = [
    { id: 'minnow', name: 'Moku Minnow', emoji: '🐟', desc: 'A lively, curious little swimmer in the shallows.', minSize: 12, maxSize: 24, pts: 50, diff: 1.0 },
    { id: 'carp', name: 'Moonlight Carp', emoji: '🐠', desc: 'Glowing with soft luminescent scales.', minSize: 30, maxSize: 55, pts: 120, diff: 1.2 },
    { id: 'catfish', name: 'Whisker Moku Fish', emoji: '🐡', desc: 'Calm bottom-feeder with super sensitive whiskers.', minSize: 45, maxSize: 80, pts: 200, diff: 1.4 },
    { id: 'starfish', name: 'Cosmic Starfish', emoji: '⭐', desc: 'Fell from the night sky into the lake.', minSize: 15, maxSize: 30, pts: 280, diff: 1.5 },
    { id: 'goldfish', name: 'Royal Golden Guppy', emoji: '✨', desc: 'Brings immense good luck to the angler.', minSize: 20, maxSize: 38, pts: 350, diff: 1.6 },
    { id: 'chest', name: 'Sunken Forest Chest', emoji: '📦', desc: 'Ancient treasure chest full of forest coins.', minSize: 50, maxSize: 50, pts: 500, diff: 1.8 },
    { id: 'angler', name: 'Lantern Owl-Fish', emoji: '🏮', desc: 'Illuminates the deepest depths of the pond.', minSize: 60, maxSize: 95, pts: 700, diff: 2.0 },
    { id: 'king', name: 'Leviathan King Moku', emoji: '👑', desc: 'The mythical giant ruler of Moku Pond!', minSize: 110, maxSize: 160, pts: 1200, diff: 2.4 }
  ];

  // --- STATE ---
  var state = 'IDLE'; // IDLE, CASTING, WAITING, NIBBLE, HOOKED, REELING
  var bobber = { x: 0, y: 0, targetX: 0, targetY: 0, alpha: 0, bobPhase: 0 };
  var currentTargetFish = null;
  var fishCaughtCount = parseInt(localStorage.getItem('moku_fishing_count') || '0', 10);
  var pondPoints = parseInt(localStorage.getItem('moku_fishing_points') || '0', 10);
  var unlockedFish = {};
  try {
    unlockedFish = JSON.parse(localStorage.getItem('moku_fishing_catalog') || '{}');
  } catch(e) {}

  // Reel Minigame Physics
  var tension = 20; // 0 to 100
  var tensionTarget = 50;
  var sweetZoneMin = 35;
  var sweetZoneMax = 65;
  var sweetZoneCenter = 50;
  var sweetZoneDir = 1;
  var reelProgress = 20; // 0 to 100
  var isReelingHold = false;
  var reelAnimTimer = null;

  // Background swimming silhouettes
  var wildFishes = [];

  // Canvas
  var canvas = document.getElementById('pondCanvas');
  var ctx = canvas.getContext('2d');
  var width = 360, height = 480, dpr = window.devicePixelRatio || 1;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width <= 0) return;
    width = rect.width;
    height = rect.height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Spawn wild silhouettes
  for (var i = 0; i < 8; i++) {
    wildFishes.push({
      x: Math.random() * (width || 400),
      y: 80 + Math.random() * ((height || 400) * 0.7),
      speed: 0.3 + Math.random() * 0.5,
      dir: Math.random() > 0.5 ? 1 : -1,
      size: 14 + Math.random() * 18,
      phase: Math.random() * 10
    });
  }

  // --- CASTING & FISHING LOOP ---
  var castBtn = document.getElementById('castBtn');
  var castBtnText = document.getElementById('castBtnText');
  var reelOverlay = document.getElementById('reelOverlay');
  var sweetZoneEl = document.getElementById('sweetZone');
  var tensionNeedleEl = document.getElementById('tensionNeedle');
  var reelProgressFill = document.getElementById('reelProgressFill');

  function castLine() {
    if (state !== 'IDLE') return;
    state = 'WAITING';
    playSound('cast');

    bobber.x = width * 0.5;
    bobber.y = height * 0.15;
    bobber.targetX = width * (0.3 + Math.random() * 0.4);
    bobber.targetY = height * (0.45 + Math.random() * 0.35);
    bobber.alpha = 1;

    castBtnText.textContent = 'WAITING FOR BITE... ⏳';
    castBtn.disabled = true;

    // Trigger splash after flight
    setTimeout(function() {
      playSound('splash');
      scheduleBite();
    }, 450);
  }

  var waitTimer = null;
  function scheduleBite() {
    clearTimeout(waitTimer);
    var delay = 1800 + Math.random() * 3000;
    waitTimer = setTimeout(function() {
      if (state !== 'WAITING') return;
      state = 'NIBBLE';
      playSound('bite');
      castBtnText.textContent = '❗ STRIKE! REEL NOW!';

      // Pick fish based on depth
      var r = Math.random();
      if (r < 0.30) currentTargetFish = SPECIES[0];
      else if (r < 0.55) currentTargetFish = SPECIES[1];
      else if (r < 0.75) currentTargetFish = SPECIES[2];
      else if (r < 0.88) currentTargetFish = SPECIES[3];
      else if (r < 0.95) currentTargetFish = SPECIES[4];
      else if (r < 0.98) currentTargetFish = SPECIES[5];
      else if (r < 0.995) currentTargetFish = SPECIES[6];
      else currentTargetFish = SPECIES[7];

      // Auto start reel minigame
      startReelMinigame();
    }, delay);
  }

  function startReelMinigame() {
    state = 'REELING';
    tension = 45;
    reelProgress = 30;
    sweetZoneCenter = 50;
    sweetZoneMin = 35;
    sweetZoneMax = 65;
    sweetZoneDir = 1;

    reelOverlay.classList.add('active');
    castBtn.style.display = 'none';

    clearInterval(reelAnimTimer);
    reelAnimTimer = setInterval(updateReelPhysics, 35);
  }

  function updateReelPhysics() {
    if (state !== 'REELING') return;

    var diff = currentTargetFish.diff || 1.0;

    // Move sweet zone organically back and forth
    sweetZoneCenter += sweetZoneDir * (0.8 * diff);
    if (sweetZoneCenter > 75) { sweetZoneCenter = 75; sweetZoneDir = -1; }
    if (sweetZoneCenter < 25) { sweetZoneCenter = 25; sweetZoneDir = 1; }

    var zoneWidth = Math.max(20, 36 / diff);
    sweetZoneMin = sweetZoneCenter - zoneWidth / 2;
    sweetZoneMax = sweetZoneCenter + zoneWidth / 2;

    sweetZoneEl.style.left = sweetZoneMin + '%';
    sweetZoneEl.style.width = zoneWidth + '%';

    // Player tension physics
    if (isReelingHold) {
      tension += 2.2;
    } else {
      tension -= 1.6;
    }
    tension = Math.max(0, Math.min(100, tension));
    tensionNeedleEl.style.left = tension + '%';

    // Check if needle is inside sweet zone
    if (tension >= sweetZoneMin && tension <= sweetZoneMax) {
      reelProgress += 0.85;
      tensionNeedleEl.style.boxShadow = '0 0 16px #6EE7A8';
    } else {
      reelProgress -= 0.65;
      tensionNeedleEl.style.boxShadow = '0 0 16px #FF6B97';
    }

    reelProgress = Math.max(0, Math.min(100, reelProgress));
    reelProgressFill.style.width = reelProgress + '%';

    if (reelProgress >= 100) {
      // SUCCESS!
      clearInterval(reelAnimTimer);
      finishCatch(true);
    } else if (reelProgress <= 0 || tension <= 0 || tension >= 100) {
      // ESCAPED!
      clearInterval(reelAnimTimer);
      finishCatch(false);
    }
  }

  function finishCatch(success) {
    reelOverlay.classList.remove('active');
    castBtn.style.display = 'inline-flex';
    castBtn.disabled = false;
    castBtnText.textContent = 'CAST LINE INTO POND';

    if (success && currentTargetFish) {
      playSound('catch');
      var sizeRange = currentTargetFish.maxSize - currentTargetFish.minSize;
      var exactSize = (currentTargetFish.minSize + Math.random() * sizeRange).toFixed(1);

      fishCaughtCount++;
      pondPoints += currentTargetFish.pts;
      unlockedFish[currentTargetFish.id] = (unlockedFish[currentTargetFish.id] || 0) + 1;

      localStorage.setItem('moku_fishing_count', fishCaughtCount);
      localStorage.setItem('moku_fishing_points', pondPoints);
      localStorage.setItem('moku_fishing_catalog', JSON.stringify(unlockedFish));

      document.getElementById('fishCountVal').textContent = fishCaughtCount;
      document.getElementById('pondPointsVal').textContent = pondPoints;

      // Show catch modal
      document.getElementById('catchEmoji').textContent = currentTargetFish.emoji;
      document.getElementById('catchName').textContent = currentTargetFish.name;
      document.getElementById('catchDesc').textContent = currentTargetFish.desc;
      document.getElementById('catchSize').textContent = 'Size: ' + exactSize + ' cm · +' + currentTargetFish.pts + ' Pts';
      document.getElementById('catchModal').classList.add('active');
    } else {
      playSound('splash');
      castBtnText.textContent = 'THE FISH GOT AWAY... TRY AGAIN!';
    }
    state = 'IDLE';
  }

  // --- DRAWING LOOP ---
  function loop() {
    ctx.clearRect(0, 0, width, height);

    // 1. Water gradient with soft moonlight ripples
    var grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#0E1F3D');
    grad.addColorStop(0.5, '#0A1830');
    grad.addColorStop(1, '#050C1A');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Moon Reflection
    var time = Date.now() * 0.002;
    ctx.fillStyle = 'rgba(56, 189, 248, 0.04)';
    ctx.beginPath();
    ctx.ellipse(width * 0.5, height * 0.35, 90 + Math.sin(time) * 10, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    // 2. Wild swimming silhouettes
    for (var i = 0; i < wildFishes.length; i++) {
      var wf = wildFishes[i];
      wf.x += wf.speed * wf.dir;
      if (wf.dir > 0 && wf.x > width + 30) wf.x = -30;
      if (wf.dir < 0 && wf.x < -30) wf.x = width + 30;

      ctx.save();
      ctx.translate(wf.x, wf.y + Math.sin(time * 2 + wf.phase) * 4);
      if (wf.dir < 0) ctx.scale(-1, 1);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
      ctx.beginPath();
      ctx.ellipse(0, 0, wf.size, wf.size * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      // Tail
      ctx.beginPath();
      ctx.moveTo(-wf.size * 0.8, 0);
      ctx.lineTo(-wf.size * 1.3, -wf.size * 0.4);
      ctx.lineTo(-wf.size * 1.3, wf.size * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 3. Pier & Angler Owl silhouette at top
    var owlX = width * 0.5;
    var owlY = 40;
    // Wood pier plank
    ctx.fillStyle = '#2A170C';
    ctx.fillRect(owlX - 35, 0, 70, 36);
    ctx.strokeStyle = '#4A2B18';
    ctx.lineWidth = 3;
    ctx.strokeRect(owlX - 35, 0, 70, 36);

    // Cute Moku Owl Angler
    ctx.fillStyle = '#38BDF8';
    ctx.beginPath();
    ctx.arc(owlX, owlY, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#BAE6FD';
    ctx.beginPath();
    ctx.arc(owlX, owlY + 5, 9, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#0F0C20';
    ctx.beginPath();
    ctx.arc(owlX - 5, owlY - 3, 3, 0, Math.PI * 2);
    ctx.arc(owlX + 5, owlY - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    // Beak
    ctx.fillStyle = '#F59E0B';
    ctx.beginPath();
    ctx.moveTo(owlX, owlY + 1);
    ctx.lineTo(owlX - 3, owlY + 6);
    ctx.lineTo(owlX + 3, owlY + 6);
    ctx.closePath();
    ctx.fill();

    // Fishing Rod
    var rodTipX = owlX + 45;
    var rodTipY = owlY - 18;
    ctx.strokeStyle = '#D29054';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(owlX + 8, owlY + 8);
    ctx.lineTo(rodTipX, rodTipY);
    ctx.stroke();

    // 4. Fishing Line & Bobber
    if (state !== 'IDLE') {
      // Smooth travel
      bobber.x += (bobber.targetX - bobber.x) * 0.15;
      bobber.y += (bobber.targetY - bobber.y) * 0.15;

      var bY = bobber.y + (state === 'NIBBLE' ? Math.sin(Date.now() * 0.03) * 6 : Math.sin(Date.now() * 0.004) * 2.5);

      // Line
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(rodTipX, rodTipY);
      ctx.quadraticCurveTo((rodTipX + bobber.x) / 2, (rodTipY + bY) / 2 - 10, bobber.x, bY);
      ctx.stroke();

      // Water Ripple ring
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      var rRadius = (Date.now() % 1400) / 1400 * 24;
      ctx.arc(bobber.x, bY + 4, rRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Bobber (Red & White floating sphere)
      ctx.fillStyle = '#EF4444';
      ctx.beginPath();
      ctx.arc(bobber.x, bY, 8, Math.PI, 0, false);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(bobber.x, bY, 8, 0, Math.PI, false);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(bobber.x, bY, 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    requestAnimationFrame(loop);
  }

  // --- CONTROLS & LISTENERS ---
  castBtn.addEventListener('click', castLine);

  var reelHoldBtn = document.getElementById('reelHoldBtn');
  reelHoldBtn.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    isReelingHold = true;
  });
  window.addEventListener('pointerup', function() { isReelingHold = false; });
  window.addEventListener('pointercancel', function() { isReelingHold = false; });

  document.getElementById('keepCatchBtn').addEventListener('click', function() {
    document.getElementById('catchModal').classList.remove('active');
  });

  // Fishbook
  var bookBtn = document.getElementById('bookBtn');
  var bookModal = document.getElementById('bookModal');
  var closeBookBtn = document.getElementById('closeBookBtn');
  var fishbookGrid = document.getElementById('fishbookGrid');
  var bookProgress = document.getElementById('bookProgress');

  bookBtn.addEventListener('click', function() {
    var discCount = 0;
    fishbookGrid.innerHTML = '';
    SPECIES.forEach(function(sp) {
      var count = unlockedFish[sp.id] || 0;
      if (count > 0) discCount++;

      var item = document.createElement('div');
      item.className = 'fishbook-item' + (count > 0 ? ' unlocked' : '');
      item.innerHTML = '<div class="emoji">' + (count > 0 ? sp.emoji : '❓') + '</div>' +
                       '<div style="font-weight: 800;">' + (count > 0 ? sp.name : 'Unknown') + '</div>' +
                       '<div style="font-size: 9px; color: var(--text-muted);">' + (count > 0 ? 'Caught: ' + count : '???') + '</div>';
      fishbookGrid.appendChild(item);
    });

    bookProgress.textContent = 'Discovered: ' + discCount + ' / ' + SPECIES.length;
    bookModal.classList.add('active');
  });

  closeBookBtn.addEventListener('click', function() {
    bookModal.classList.remove('active');
  });

  var soundBtn = document.getElementById('soundToggleBtn');
  soundBtn.addEventListener('click', function() {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });

  // Init stats
  document.getElementById('fishCountVal').textContent = fishCaughtCount;
  document.getElementById('pondPointsVal').textContent = pondPoints;

  loop();
})();
</script>
</body>
