AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Moku Series — HTTPS proxy in front of Dreamlo (which only serves plain HTTP).
  A single Lambda behind a Function URL, so game pages served over HTTPS
  (e.g. GitHub Pages) can call it without hitting mixed-content blocking.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      CORS origin allowed to call this proxy (e.g. https://aohaus.github.io).
      Use "*" during development only.
  GameKeys:
    Type: String
    Description: >
      JSON map of gameId -> { "public": "...", "private": "..." } Dreamlo key
      pairs, one entry per Moku title using the leaderboard. The private code
      never leaves this Lambda — clients only ever send a gameId.
      Example: {"angry-moku-battle-royal":{"public":"xxx","private":"yyy"}}
  AuthSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Same value as backend/'s AuthSecret. Lets logged-in players' scores
      show their account name with a verified tag. Empty = guests only.

Resources:
  DreamloProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: src/proxy.handler
      CodeUri: .
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          GAME_KEYS: !Ref GameKeys
          AUTH_SECRET: !Ref AuthSecret
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - GET

Outputs:
  ProxyUrl:
    Description: >
      HTTPS base URL for the Dreamlo proxy. Clients call it as
      {ProxyUrl}?gameId=<id>&... — see dreamlo-proxy/README.md for the API.
    Value: !GetAtt DreamloProxyFunctionUrl.FunctionUrl
