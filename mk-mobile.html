<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MK Mobile</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(circle, rgba(255,201,74,0.08) 0 5px, transparent 6px) 20px 30px / 220px 220px repeat,
    radial-gradient(circle, rgba(255,201,74,0.06) 0 7px, transparent 8px) 140px 160px / 320px 320px repeat,
    radial-gradient(circle, rgba(120,200,255,0.06) 0 4px, transparent 5px) 60px 220px / 260px 260px repeat,
    linear-gradient(160deg, #0B1330 0%, #162454 55%, #0A1228 100%);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  user-select: none;
  overflow: hidden;
  touch-action: none;
}
#game-layout {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}
#wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}
/* Canvas has no explicit width/height of its own here — only max-width and
   max-height. That leaves its INTRINSIC size (the canvas.width/height pixel
   attributes set in JS, at the same 1260:574 ratio) as the only thing
   driving its aspect ratio, so the browser's standard replaced-element
   sizing (the same algorithm <img> uses) scales it down uniformly to fit
   within whichever of the two bounds is tighter.
   Giving it an explicit `height: 100dvh` + `width: auto` here instead (as a
   prior version of this rule did) looks equivalent, but isn't: once
   max-width clamped the auto width, the height — never itself auto — held
   at its full dvh value, silently stretching the pitch and every character
   on it taller than wide. That's invisible on phones, where landscape is
   already close to this canvas's own ~2.2:1 ratio and max-width rarely
   binds, but very visible on an iPad, whose landscape viewport is
   considerably less wide relative to its height. */
canvas {
  display: block;
  cursor: pointer;
  touch-action: none;
  max-width: 100%;
  max-height: min(900px, calc(100vh - 16px));
  max-height: min(900px, calc(100dvh - 16px));
}
/* #wrapper centers the canvas with flex and can be larger than the
   canvas's own rendered box, so this shrink-wraps to the canvas's
   actual size (a plain replaced-element box, like <img>) — the only
   reliable anchor for positioning #titleMascotImg with percentages
   that track the canvas's internal 1260x574 coordinate space. */
#canvasBox {
  position: relative;
  display: inline-block;
  line-height: 0;
}
/* Title-screen hero mascot: the real illustrated artwork (see
   brand/mokumoku-hero.png), not the canvas-drawn drawMokumoku() used
   throughout actual gameplay (player, profile preview, etc.). Owl was
   centered at roughly (630, 235) with r=42 in the 1260x574 canvas. */
#titleMascotImg {
  display: block;
  position: absolute;
  left: 50%;
  top: 41%;
  width: 11%;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 26px rgba(255,201,74,0.4));
  animation: titleMascotBob 3.2s ease-in-out infinite;
  pointer-events: none;
  z-index: 3;
}
@keyframes titleMascotBob {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -50%) translateY(-8px); }
}
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 14px;
  display: flex; flex-direction: column; align-items: center;
  pointer-events: none;
}
#score-display {
  background: linear-gradient(135deg, rgba(255,201,74,0.28), rgba(80,160,255,0.22));
  color: #FFE9A8;
  font-size: 26px; font-weight: 900;
  padding: 6px 22px; border-radius: 14px;
  letter-spacing: 1px;
  text-shadow: 0 0 14px rgba(255,224,102,0.6), 0 2px 4px rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,224,102,0.35);
  font-variant-numeric: tabular-nums;
}
#time-display {
  margin-top: 6px;
  background: rgba(5,10,25,0.45);
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  padding: 4px 14px; border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
#pause-btn {
  position: absolute; top: 14px; right: 14px;
  pointer-events: all;
  background: rgba(5,10,25,0.55);
  color: white;
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  width: 42px; height: 42px;
  font-size: 17px;
  cursor: pointer;
}
/* Sized as a % of #wrapper's WIDTH (which shrink-wraps the canvas 1:1),
   not vw — vw is relative to the raw viewport and drifts out of sync
   with the canvas's actual rendered size, which is what determines
   whether these controls actually land inside the pitch-free side
   margins reserved for them outside PITCH_X0/PITCH_X1. Anchored to the
   left/right edges and vertically centered, beside the pitch rather
   than overlapping it. */
#joystick {
  position: absolute;
  left: 6px; top: 64%; transform: translateY(-50%);
  width: clamp(60px, 12%, 140px);
  height: clamp(60px, 12%, 140px);
  border-radius: 50%;
  background: rgba(255,201,74,0.12);
  border: 2px solid rgba(255,201,74,0.4);
  box-shadow: inset 0 0 20px rgba(255,201,74,0.15);
  visibility: hidden;
  touch-action: none;
  pointer-events: all;
}
#joystick-knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 44%; height: 44%;
  border-radius: 50%;
  background: rgba(255,201,74,0.85);
  box-shadow: 0 3px 14px rgba(255,201,74,0.4);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
#shoot-btn {
  position: absolute;
  right: 6px; top: 64%; transform: translateY(-50%);
  width: clamp(48px, 9%, 106px);
  height: clamp(48px, 9%, 106px);
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.5);
  background: radial-gradient(circle at 35% 30%, #FF9A52, #E4483A 70%);
  color: #fff;
  font-size: clamp(12px, 2vw, 16px);
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: 0 4px 18px rgba(228,72,58,0.55), inset 0 2px 6px rgba(255,255,255,0.35);
  visibility: hidden;
  touch-action: none;
  cursor: pointer;
}
#shoot-btn:active {
  transform: translateY(-50%) scale(0.9);
  background: radial-gradient(circle at 35% 30%, #FFB374, #FF6A3D 70%);
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(5,10,25,0.68);
  backdrop-filter: blur(4px);
  pointer-events: all;
}
#overlay.hidden { display: none; }
#overlay h1 { color: #fff; font-size: 30px; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); text-align: center; }
#overlay p { color: #FFE9A8; font-size: 16px; margin-bottom: 24px; text-align: center; white-space: pre-line; }
#overlay button {
  background: #FFC94A; color: #201200;
  border: none; border-radius: 30px;
  padding: 12px 32px; font-size: 18px; font-weight: 700;
  cursor: pointer; transition: transform 0.15s, background 0.15s;
  box-shadow: 0 4px 16px rgba(255,201,74,0.4);
}
#overlay button:hover { background: #FFDD8F; transform: scale(1.05); }
#rotate-hint {
  display: none;
  position: fixed; inset: 0; z-index: 999;
  background: #0A1228;
  flex-direction: column; align-items: center; justify-content: center;
  color: white; font-size: 18px; gap: 16px;
}
#rotate-hint span { font-size: 56px; animation: rotate-hint-spin 1.5s ease-in-out infinite alternate; }
@keyframes rotate-hint-spin { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
/* Console-style frame spanning the whole viewport on the title screen —
   shared structure with the other two games' title screens, so the
   frame always reads as full-screen regardless of this canvas's own
   aspect ratio. */
#title-frame {
  display: block;
  position: fixed; inset: 14px;
  border: 3px solid #FFC94A;
  border-radius: 10px;
  pointer-events: none;
  z-index: 5;
}
#title-frame::after {
  content: '';
  position: absolute; inset: 5px;
  border: 1px solid #8A6218;
  border-radius: 8px;
}
/* Single link back to the Moku series hub — HTML fixed element (not
   canvas-drawn) per the series design system, shown/hidden in lockstep
   with #title-frame. */
#hub-link {
  display: block;
  position: fixed; top: 30px; right: 24px;
  z-index: 6;
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: bold;
  color: #FFC94A;
  text-decoration: none;
  animation: hubLinkPulse 2.2s ease-in-out infinite;
}
@keyframes hubLinkPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
/* Language toggle — mirrors #hub-link's position/behavior on the opposite
   corner so it's just as discoverable before a match starts, shown/hidden
   in lockstep with it (see the JS toggles alongside hub-link below). */
#lang-toggle {
  display: block;
  position: fixed; top: 30px; left: 24px;
  z-index: 6;
  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: bold;
  color: #FFC94A;
  background: rgba(5,10,25,0.4);
  border: 1.5px solid rgba(255,201,74,0.5);
  border-radius: 14px;
  padding: 5px 14px;
  cursor: pointer;
  animation: hubLinkPulse 2.2s ease-in-out infinite;
}
#buildInfo {
  display: block;
  position: fixed; bottom: 16px; left: 22px;
  z-index: 6;
  font-family: Arial, sans-serif;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: rgba(255,255,255,0.28);
  pointer-events: none;
}
@media (max-width: 600px) and (orientation: portrait) {
  #rotate-hint { display: flex; }
  #game-layout { display: none; }
  #title-frame { display: none; }
  #hub-link { display: none !important; }
  #lang-toggle { display: none !important; }
  #buildInfo { display: none !important; }
}
</style>
</head>
<body>
<div id="title-frame"></div>
<a id="hub-link" href="hub.html">🦉 Moku Series ▶</a>
<button id="lang-toggle" type="button">EN</button>
<div id="buildInfo">v1.1.0 · Updated Aug 14, 2026</div>
<div id="game-layout">
  <div id="wrapper">
    <div id="canvasBox">
      <canvas id="c"></canvas>
      <img id="titleMascotImg" src="brand/mokumoku-hero.png" alt="">
    </div>
    <div id="hud" style="visibility:hidden">
      <div id="score-display">0 - 0</div>
      <div id="time-display">1:00</div>
      <button id="pause-btn" title="一時停止">⏸</button>
    </div>
    <div id="joystick" aria-label="移動スティック">
      <div id="joystick-knob"></div>
    </div>
    <button id="shoot-btn" aria-label="シュート">シュート</button>
    <div id="overlay" class="hidden">
      <h1 id="ov-title"></h1>
      <p id="ov-sub"></p>
      <button id="ov-btn">もう一度！</button>
    </div>
  </div>
</div>
<div id="rotate-hint">
  <span>📱</span>
  <p>横向きにしてプレイ！</p>
</div>

<script>
// ─── AUDIO SYSTEM (Web Audio API) ─────────────────────────────
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    if (type === 'hit') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'wall') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    } else if (type === 'powershot') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.22);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (type === 'goal') {
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = now + idx * 0.09;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.25);
      });
    } else if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.04);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if (type === 'count') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }
  } catch (e) {}
}

// ─── CANVAS ───────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 1260, H = 574;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

// ─── CONFIG ───────────────────────────────────────────────────
// The pitch itself is full size again (same 900x438 as the original).
// The canvas is widened instead, leaving dedicated off-pitch margins on
// the left and right (plain stadium background) for the joystick and
// SHOOT button — they used to overlap the grass itself, which put a
// thumb right over the ball whenever it reached that corner.
const PITCH_X0 = 180, PITCH_Y0 = 106, PITCH_X1 = PITCH_X0 + 900, PITCH_Y1 = H - 30;
const PITCH_W  = PITCH_X1 - PITCH_X0, PITCH_H = PITCH_Y1 - PITCH_Y0;
const PITCH_CY = (PITCH_Y0 + PITCH_Y1) / 2;
const HALF_X   = (PITCH_X0 + PITCH_X1) / 2;
const GOAL_H   = 168; // 140 * 1.2 — widened to balance the new goalkeepers below
const GOAL_Y0  = PITCH_Y0 + (PITCH_H - GOAL_H) / 2;
const GOAL_Y1  = GOAL_Y0 + GOAL_H;
const NET_DEPTH = 22;

const PLAYER_R = 28, CPU_R = 24, BALL_R = 13;
const GK_R = 22;
const GK_MARGIN_X = 34;   // how far in front of the goal line each keeper patrols
const GK_BASE_SPEED = 1.1; // px/frame — the CPU keeper's fixed patrol speed
const PLAYER_MAX_SPEED = 6.6;
const BALL_FRICTION = 0.994;
const WALL_BOUNCE = 0.85;
const BALL_MAX_SPEED = 15;
const PADDLE_HIT_BASE_SPEED = 6.2;
const PADDLE_HIT_MOMENTUM = 0.6;
const SHOOT_WINDOW_FRAMES = 9;   // how long a shoot press stays "primed" before a contact
const SHOOT_COOLDOWN_FRAMES = 18; // min frames between accepted presses, discourages button-mashing
const POWER_SHOT_SPEED = 12.5;

const MATCH_DURATIONS = [60, 180, 300]; // 1 / 3 / 5 minutes, in seconds
// CPU_LEVELS / BALL_SKINS hold gameplay data only — their display labels
// are looked up by index/id from STRINGS below, so both languages can
// share these same arrays.
const CPU_LEVELS = [
  { accel: 0.55, maxSpeed: 4.4, wanderAmp: 0.9, wanderMax: 46 },
  { accel: 0.8,  maxSpeed: 5.6, wanderAmp: 0.6, wanderMax: 30 },
  { accel: 1.05, maxSpeed: 6.8, wanderAmp: 0.3, wanderMax: 14 },
];

// ─── PLAYER ROSTER / PROGRESSION ───────────────────────────────
const STARTER_PLAYERS = [
  { id: 'jpn', flag: '🇯🇵', code: 'JPN', name: 'Moto Junya' },
  { id: 'bra', flag: '🇧🇷', code: 'BRA', name: 'Mozemiro' },
  { id: 'esp', flag: '🇪🇸', code: 'ESP', name: 'Momin Yamal' },
];
const BALL_SKINS = [
  { id: 'trionda', colors: ['#2FAE66', '#2C93D6', '#F0632F'] },
  { id: 'classic',  colors: ['#3A3A3A', '#3A3A3A', '#3A3A3A'] },
  { id: 'sunset',   colors: ['#F0632F', '#FFC94A', '#E4483A'] },
];
const MAX_STAT_LEVEL = 20;
const SHOP_PRICE = 50;      // points to unlock a non-starting country's player
const WIN_BASE_POINTS = 3;  // points awarded for a Ready! win, before streak boost
const DRAW_POINTS = 1;      // flat points awarded for a Ready! draw (no streak boost)
function upgradeCost(level) { return level; } // Lv1→2 costs 1pt, Lv2→3 costs 2pt, ...
function statMult(level) { return 1 + (level - 1) * 0.04; } // Lv20 ≈ +76%

const SAVE_KEY = 'moku:mk-mobile:profile';
function defaultProfile() {
  return {
    version: 1,
    gameId: 'mk-mobile',
    players: {},        // id -> { owned, name, sp, sh, def }
    activePlayerId: null,
    ballSkin: BALL_SKINS[0].id,
    points: 0,
    winStreak: 0,
    lastWinDate: null,  // yyyy-mm-dd of the streak's most recent win
    matchDurationIdx: 0,
    cpuLevel: 1,
    lang: 'en',          // 'ja' | 'en' — see STRINGS/t() below
    updatedAt: null,
  };
}

// ─── LOCALIZATION ───────────────────────────────────────────────
// A flat key → string (or key → array/function for dynamic bits) table per
// language. t(key) looks up the current profile.lang, falling back to
// Japanese for any gap. Player names, country codes, and flags are already
// language-neutral (Latin-script punny names, ISO codes, emoji) and don't
// need an entry here.
const STRINGS = {

    pauseTitle: '一時停止',
    joystickLabel: '移動スティック',
    shootLabel: 'シュート',

    langToggle: 'EN',

    cpuLevels: ['かんたん', 'ふつう', 'むずかしい'],
    ballSkinLabels: { trionda: 'トライカラー', classic: 'クラシック', sunset: 'サンセット' },
    titleTagline1: '制限時間内によりたくさんゴールを決めよう',
    titleTagline2: 'スティックで移動・シュートでタイミングよく強打！',
    titleStart: '▶ スタート',
    titleFooter: 'タップ / クリックで選択　・　Enterでスタート',
    homeTitle: '🏠 ホーム',
    streakBoost: n => `🔥 ${n} 連勝中！ブーストx2`,
    homeFirstTime: 'はじめての選手をえらぼう！',
    homeContinue: '▶ すすむ',
    homePickPlayer: '選手をえらぶ',
    backToTitle: '◀ タイトルにもどる',
    rosterTitle: 'スターティング選手をえらぼう',
    backToHome: '◀ ホームへ',
    profileTitle: '選手プロフィール',
    tapToEdit: 'タップして編集',

    panelUpgrade: '⬆️ アップグレード',
    panelShop: '🛒 プレイヤーショップ',
    panelBall: '⚽ ボール',

    upgradeCost: cost => `次のLvまで ${cost}pt`,
    upgradeBtn: '+ 強化',

  en: {

    ballSkinLabels: { trionda: 'Tri-Color', classic: 'Classic', sunset: 'Sunset' },
    titleTagline1: 'Score as many goals as you can before time runs out',
    titleTagline2: 'Move with the stick, time your SHOOT for a power strike!',
    titleStart: '▶ START',

// ─── PLAYER / CPU MOVEMENT ────────────────────────────────────
// No inertia: velocity snaps directly to the target speed/direction (or to
// zero) every frame — direct, arcade-style control rather than a physics
// ramp-up/glide-down that read as too smooth/floaty.
function applyMovement(entity, dx, dy, maxSpeed, minX, maxX, minY, maxY) {
  const len = Math.hypot(dx, dy);
  if (len > 0.001) {
    const pull = Math.min(len, 1); // analog stick tilt scales speed; digital input is always full tilt
    entity.vx = (dx / len) * maxSpeed * pull;
    entity.vy = (dy / len) * maxSpeed * pull;
  } else {
    entity.vx = 0;
    entity.vy = 0;
  }
  entity.x = Math.min(maxX, Math.max(minX, entity.x + entity.vx));
  entity.y = Math.min(maxY, Math.max(minY, entity.y + entity.vy));
}

function updatePlayer() {
  let dx = (held.right ? 1 : 0) - (held.left ? 1 : 0) + stickX;
  let dy = (held.down ? 1 : 0) - (held.up ? 1 : 0) + stickY;
  applyMovement(player, dx, dy, fxPlayerMaxSpeed,
    PITCH_X0 + fxPlayerR, HALF_X - fxPlayerR, PITCH_Y0 + fxPlayerR, PITCH_Y1 - fxPlayerR);
}

let cpuWander = 0;
function updateCPU() {
  const lvl = CPU_LEVELS[cpuLevel];
  cpuWander += (Math.random() - 0.5) * lvl.wanderAmp;
  cpuWander = Math.max(-lvl.wanderMax, Math.min(lvl.wanderMax, cpuWander));
  const ballInCpuHalf = ball.x > HALF_X;
  const targetX = ballInCpuHalf
    ? Math.min(PITCH_X1 - CPU_R, ball.x + 14)
    : HALF_X + PITCH_W * 0.18;
  const targetY = Math.max(PITCH_Y0 + CPU_R, Math.min(PITCH_Y1 - CPU_R, ball.y + cpuWander));
  const dx = targetX - cpu.x, dy = targetY - cpu.y;
  const dist = Math.hypot(dx, dy);
  const nx = dist > 4 ? dx / dist : 0, ny = dist > 4 ? dy / dist : 0;
  applyMovement(cpu, nx, ny, lvl.maxSpeed,
    HALF_X + CPU_R, PITCH_X1 - CPU_R, PITCH_Y0 + CPU_R, PITCH_Y1 - CPU_R);
}

// ─── BALL PHYSICS ─────────────────────────────────────────────
function resolvePaddleHit(entity, radius) {
  const dx = ball.x - entity.x, dy = ball.y - entity.y;
  const dist = Math.hypot(dx, dy);
  const minDist = BALL_R + radius;
  if (dist < minDist && dist > 0.001) {
    const nx = dx / dist, ny = dy / dist;
    const overlap = minDist - dist;
    ball.x += nx * overlap; ball.y += ny * overlap;
    // Only inject a fresh kick on a NEW contact. Against a wall/corner the
    // push-away direction points straight back into the wall, so without
    // this guard the ball gets re-floored to full hit speed every frame it
    // stays pinned there — an infinite-energy loop that (combined with the
    // paddle also parking at its target) reads as everything freezing solid
    // in the corner. Sustained overlap just gets separated positionally and
    // lets normal wall restitution/friction bleed the energy off.
    // Exception: every non-player paddle (the outfield CPU, and now both
    // automatic keepers) re-targets or re-patrols on its own regardless of
    // the ball, so sustained contact (rather than a clean one-frame touch)
    // can end up shepherding the ball along as it moves — reading as an
    // illegal dribble/carry. Force a real kick after a couple of contact
    // frames so touching any of them is always a single decisive hit.
    const sustainedAiContact = entity !== player && entity.touching && entity.contactFrames >= 2;
    if (!entity.touching || sustainedAiContact) {
      const curSpeed = Math.hypot(ball.vx, ball.vy);
      let speed = Math.max(entity === player ? fxPaddleHitBase : PADDLE_HIT_BASE_SPEED, curSpeed);
      let isPowerShot = false;
      if (entity === player && frameCount - shootPressFrame <= SHOOT_WINDOW_FRAMES) {
        speed = Math.max(fxPowerShotSpeed, curSpeed * 1.4);
        isPowerShot = true;
        shootPressFrame = -Infinity; // consume the buffered press
      }
      ball.vx = nx * speed + entity.vx * PADDLE_HIT_MOMENTUM;
      ball.vy = ny * speed + entity.vy * PADDLE_HIT_MOMENTUM;
      const newSpeed = Math.hypot(ball.vx, ball.vy);
      if (newSpeed > BALL_MAX_SPEED) { ball.vx = ball.vx / newSpeed * BALL_MAX_SPEED; ball.vy = ball.vy / newSpeed * BALL_MAX_SPEED; }
      if (isPowerShot) {
        addParticles(ball.x, ball.y, '#FF6A3D', 16, 6);
        addShake(9);
        shotMessage = t('powerShotMsg');
        shotMessageTimer = 36;
        playSound('powershot');
      } else {
        addParticles(ball.x, ball.y, '#FFE9A8', 6, 3);
        playSound('hit');
      }
      if (entity !== player) entity.contactFrames = 0;
    } else if (entity !== player) {
      entity.contactFrames++;
    }
    entity.touching = true;
  } else {
    entity.touching = false;
    if (entity !== player) entity.contactFrames = 0;
  }
}

// ─── GOALKEEPERS ──────────────────────────────────────────────
// Neither keeper is player-controlled — both patrol the goal mouth on
// their own. The CPU's keeper is a fixed, "slow" baseline; the player's
// keeper's speed instead scales with the active player's Defence stat
// (see applyPlayerStats()), so investing in Defence makes your own net
// better-guarded rather than making the opposing AI tougher.
function patrolGK(gk, speed) {
  const topY = GOAL_Y0 + GK_R + 4, bottomY = GOAL_Y1 - GK_R - 4;
  gk.vy = gk.dir * speed;
  gk.y += gk.vy;
  if (gk.y <= topY) { gk.y = topY; gk.dir = 1; }
  else if (gk.y >= bottomY) { gk.y = bottomY; gk.dir = -1; }
}
function updateGoalkeepers() {
  patrolGK(gkCPU, GK_BASE_SPEED);
  patrolGK(gkPlayer, fxGkPlayerSpeed);
}

function updateBall() {
  ball.x += ball.vx; ball.y += ball.vy;
  ball.vx *= BALL_FRICTION; ball.vy *= BALL_FRICTION;
  ball.spin += Math.hypot(ball.vx, ball.vy) * 0.07;

  // Paddle collisions resolve first; the wall clamp below runs last and is
  // authoritative, so a paddle push can never leave the ball resting outside
  // the pitch. (Doing this the other way around let a corner paddle push
  // shove the ball back past the wall it had just bounced off, which made
  // the ball + paddle settle into an exact repeating position/velocity each
  // frame — a permanent freeze whenever the ball got trapped in a corner.)
  resolvePaddleHit(player, fxPlayerR);
  resolvePaddleHit(cpu, CPU_R);
  resolvePaddleHit(gkPlayer, GK_R);
  resolvePaddleHit(gkCPU, GK_R);

  if (ball.y - BALL_R < PITCH_Y0) { ball.y = PITCH_Y0 + BALL_R; ball.vy = -ball.vy * WALL_BOUNCE; playSound('wall'); }
  if (ball.y + BALL_R > PITCH_Y1) { ball.y = PITCH_Y1 - BALL_R; ball.vy = -ball.vy * WALL_BOUNCE; playSound('wall'); }

  const inGoalMouth = ball.y > GOAL_Y0 && ball.y < GOAL_Y1;
  if (ball.x - BALL_R < PITCH_X0) {
    if (inGoalMouth && ball.x < PITCH_X0 - BALL_R * 0.6) { scoreGoal('away'); return; }
    if (!inGoalMouth) { ball.x = PITCH_X0 + BALL_R; ball.vx = -ball.vx * WALL_BOUNCE; playSound('wall'); }
  }
  if (ball.x + BALL_R > PITCH_X1) {
    if (inGoalMouth && ball.x > PITCH_X1 + BALL_R * 0.6) { scoreGoal('home'); return; }
    if (!inGoalMouth) { ball.x = PITCH_X1 - BALL_R; ball.vx = -ball.vx * WALL_BOUNCE; playSound('wall'); }
  }

  // Safety valve: a paddle (especially the CPU/keepers, which re-target or
  // re-patrol on their own) can keep pinning the ball against a corner —
  // every frame it re-separates them positionally, the wall clamp snaps the
  // ball right back, and since contact never breaks no fresh kick ever
  // fires. This is tracked by NET DISPLACEMENT over a rolling window,
  // rather than instantaneous speed: the dribble guard above periodically
  // forces a real kick on sustained AI contact, which spikes the ball's
  // instantaneous speed every couple of frames even while it is, in
  // practice, going nowhere (each kick just gets reflected straight back
  // by the wall/paddle) — a speed-threshold check keeps getting reset by
  // those spikes and never actually fires. Position doesn't lie: if the
  // ball hasn't gone anywhere across the window despite ongoing contact,
  // it's stuck regardless of how its velocity has been bouncing around.
  const anyTouching = player.touching || cpu.touching || gkPlayer.touching || gkCPU.touching;
  if (anyTouching) {
    if (stuckRefX === null) { stuckRefX = ball.x; stuckRefY = ball.y; stuckRefFrames = 0; }
    stuckRefFrames++;
    if (stuckRefFrames >= 40) {
      const moved = Math.hypot(ball.x - stuckRefX, ball.y - stuckRefY);
      if (moved < 30) {
        // Escapes at full BALL_MAX_SPEED, well above any CPU_LEVELS
        // maxSpeed or keeper patrol speed — a weaker nudge lets them simply
        // run the ball straight back down within a frame or two, recreating
        // the same jam instead of breaking it.
        const cx = HALF_X - ball.x, cy = PITCH_CY - ball.y;
        const cd = Math.hypot(cx, cy) || 1;
        ball.vx = (cx / cd) * BALL_MAX_SPEED;
        ball.vy = (cy / cd) * BALL_MAX_SPEED;
      }
      stuckRefX = ball.x; stuckRefY = ball.y; stuckRefFrames = 0; // refresh the window either way
    }
  } else {
    stuckRefX = null; stuckRefFrames = 0;
  }
}

function scoreGoal(who) {
  if (who === 'home') { scoreHome++; goalMessage = t('goalMsg'); }
  else { scoreAway++; goalMessage = t('concededMsg'); }
  updateHUD();
  addParticles(who === 'home' ? PITCH_X1 : PITCH_X0, PITCH_CY, '#FFC94A', 26, 6);
  addShake(14);
  flashAlpha = 0.5;
  playSound('goal');
  state = 'GOAL_PAUSE';
  goalPauseTimer = 90;
}

function updateTimeDisplay() {
  // Counts UP from 0:00 to the selected match length (soccer-style clock),
  // rather than counting down — the end condition itself is unchanged.
  const totalSecs = MATCH_DURATIONS[matchDurationIdx];
  const elapsed = Math.min(totalSecs, Math.floor((matchFramesTotal - matchFramesLeft) / 60));

}

// ─── DRAW ─────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'TITLE') { drawTitleScreen(); return; }
  if (state === 'HOME') { drawHome(); return; }
  if (state === 'ROSTER') { drawRoster(); return; }
  if (state === 'PROFILE') { drawProfile(); return; }
  if (state === 'VS') { drawVS(); return; }

  ctx.save();
  ctx.translate(shakeX, shakeY);
  shakeX *= 0.7; shakeY *= 0.7;
  if (Math.abs(shakeX) < 0.1) shakeX = 0;
  if (Math.abs(shakeY) < 0.1) shakeY = 0;

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0B1330'); bg.addColorStop(1, '#0A1228');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  drawPitch();
  drawMokuFace(gkPlayer.x, gkPlayer.y, GK_R, '#3DA890', '#E8D5B0', 0);
  drawMokuFace(gkCPU.x, gkCPU.y, GK_R, '#D9A62E', '#F0DFBC', 0);
  drawMokumoku(player.x, player.y, fxPlayerR, 0);
  drawMokuFace(cpu.x, cpu.y, CPU_R, '#3D7DD8', '#F0DFBC', 0);
  drawBall();
  drawParticles();

  if (state === 'GOAL_PAUSE' && goalMessage) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px Arial';
    ctx.shadowColor = '#FFC94A'; ctx.shadowBlur = 26;
    ctx.fillStyle = '#fff';
    ctx.fillText(goalMessage, W/2, PITCH_CY);
    ctx.restore();
  }

  if (shotMessageTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, shotMessageTimer / 12);
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px Arial';
    ctx.shadowColor = '#FF6A3D'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#FFE0A0';
    const msgX = Math.max(90, Math.min(W - 90, player.x));
    ctx.fillText(shotMessage, msgX, player.y - fxPlayerR - 16);
    ctx.restore();
  }

  ctx.restore();

  if (flashAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = '#FFE9A0';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    flashAlpha *= 0.85;
  }

  if (state === 'PAUSED') drawPausedOverlay();
}

// ─── UPDATE ───────────────────────────────────────────────────
function update() {
  updateParticles();
  if (shotMessageTimer > 0) shotMessageTimer--;
  if (state === 'PLAYING') {
    frameCount++;
    updatePlayer();
    updateCPU();
    updateGoalkeepers();
    updateBall();
    matchFramesLeft--;
    if (matchFramesLeft % 15 === 0) updateTimeDisplay();
    if (matchFramesLeft <= 0) { matchFramesLeft = 0; updateTimeDisplay(); endMatch(); }
  } else if (state === 'GOAL_PAUSE') {
    if (--goalPauseTimer <= 0) {
      centerBall(scoreHome > scoreAway ? -1 : 1);
      homePositions();
      state = 'PLAYING';
    }
  } else if (state === 'VS') {
    if (vsTimer % 60 === 0 && vsTimer > 0) {
      playSound('count');
    }
    if (--vsTimer <= 0) startMatch();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ─── GAME FLOW ────────────────────────────────────────────────
// Sp/Sh/Def levels (1-20) scale the active player's speed, shot power, and
// blocking radius for the upcoming match. Called once per match start.
function applyPlayerStats() {
  const ap = activePlayer();
  const sp = ap ? ap.sp : 1, sh = ap ? ap.sh : 1, def = ap ? ap.def : 1;
  fxPlayerMaxSpeed = PLAYER_MAX_SPEED * statMult(sp);
  fxPaddleHitBase = PADDLE_HIT_BASE_SPEED * (1 + (sh - 1) * 0.02);
  fxPowerShotSpeed = POWER_SHOT_SPEED * statMult(sh);
  fxPlayerR = PLAYER_R + (def - 1) * 0.5;
  fxGkPlayerSpeed = GK_BASE_SPEED * statMult(def);
}
function startMatch() {
  state = 'PLAYING';
  scoreHome = 0; scoreAway = 0;
  matchFramesTotal = MATCH_DURATIONS[matchDurationIdx] * 60;
  matchFramesLeft = matchFramesTotal;
  applyPlayerStats();
  particles = [];
  shakeX = 0; shakeY = 0; flashAlpha = 0;
  frameCount = 0; shootPressFrame = -Infinity; shootReadyFrame = -Infinity;
  shotMessage = ''; shotMessageTimer = 0;
  stuckRefX = null; stuckRefY = null; stuckRefFrames = 0;
  player.touching = false; cpu.touching = false; cpu.contactFrames = 0;
  gkPlayer.touching = false; gkPlayer.contactFrames = 0;
  gkCPU.touching = false; gkCPU.contactFrames = 0;
  homePositions();
  centerBall(Math.random() < 0.5 ? -1 : 1);
  updateHUD();
  updateTimeDisplay();
  document.getElementById('hud').style.visibility = 'visible';
  document.getElementById('joystick').style.visibility = 'visible';
  document.getElementById('shoot-btn').style.visibility = 'visible';
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('title-frame').style.display = 'none';
  document.getElementById('hub-link').style.display = 'none';
  document.getElementById('lang-toggle').style.display = 'none';
  document.getElementById('buildInfo').style.display = 'none';
  document.getElementById('titleMascotImg').style.display = 'none';
  document.getElementById('pause-btn').textContent = '⏸';
}

function endMatch() {
  state = 'GAMEOVER';
  document.getElementById('joystick').style.visibility = 'hidden';
  document.getElementById('shoot-btn').style.visibility = 'hidden';
  resetStick();

  // Points/streak only accrue in Ready! (vs CPU) mode. A win extends the
  // streak and, from 2 wins in a row, doubles the payout; a loss — or a
  // win on a new calendar day after the streak's last win — zeroes it, so
  // the boost never carries over to the next day. A draw earns a flat,
  // un-boosted consolation payout and, like a loss, breaks the streak.
  const won = scoreHome > scoreAway;
  const drew = scoreHome === scoreAway;
  lastPointsEarned = 0; lastBoostX2 = false;
  if (matchMode === 'ready') {
    if (won) {
      const today = todayStr();
      if (profile.lastWinDate !== today) profile.winStreak = 0;
      profile.winStreak++;
      lastBoostX2 = profile.winStreak >= 2;
      lastPointsEarned = WIN_BASE_POINTS * (lastBoostX2 ? 2 : 1);
      profile.points += lastPointsEarned;
      profile.lastWinDate = today;
    } else {
      profile.winStreak = 0;
      profile.lastWinDate = null;
      if (drew) {
        lastPointsEarned = DRAW_POINTS;
        profile.points += lastPointsEarned;
      }
    }
    saveProfile();
  }

  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  let title;
  if (scoreHome > scoreAway) title = t('victoryTitle');
  else if (scoreHome < scoreAway) title = t('defeatTitle');
  else title = t('drawTitle');
  document.getElementById('ov-title').textContent = title;
  let sub = `${scoreHome} - ${scoreAway}`;
  if (matchMode === 'ready' && (won || drew)) sub += `\n+${lastPointsEarned}pt${lastBoostX2 ? t('boostSuffix') : ''}`;
  document.getElementById('ov-sub').textContent = sub;
}

function pauseGame() {
  if (state !== 'PLAYING') return;
  state = 'PAUSED';
  document.getElementById('pause-btn').textContent = '▶';
  playSound('click');
}
function resumeGame() {
  if (state !== 'PAUSED') return;
  state = 'PLAYING';
  document.getElementById('pause-btn').textContent = '⏸';
  playSound('click');
}
function quitToTitle() {
  state = 'TITLE';
  titleFrame = 0;
  profilePanel = null;
  document.getElementById('hud').style.visibility = 'hidden';
  document.getElementById('joystick').style.visibility = 'hidden';
  document.getElementById('shoot-btn').style.visibility = 'hidden';
  resetStick();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('title-frame').style.display = 'block';
  document.getElementById('hub-link').style.display = 'block';
  document.getElementById('lang-toggle').style.display = 'block';
  document.getElementById('buildInfo').style.display = 'block';
  document.getElementById('titleMascotImg').style.display = 'block';
  document.getElementById('pause-btn').textContent = '⏸';
  playSound('click');
}
function quitToHome() {
  state = 'HOME';
  profilePanel = null;
  document.getElementById('hud').style.visibility = 'hidden';
  document.getElementById('joystick').style.visibility = 'hidden';
  document.getElementById('shoot-btn').style.visibility = 'hidden';
  resetStick();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('title-frame').style.display = 'block';
  document.getElementById('hub-link').style.display = 'block';
  document.getElementById('lang-toggle').style.display = 'block';
  document.getElementById('buildInfo').style.display = 'block';
  document.getElementById('titleMascotImg').style.display = 'none';
  document.getElementById('pause-btn').textContent = '⏸';
  playSound('click');
}
function returnToProfile() {
  state = 'PROFILE';
  profilePanel = null;
  document.getElementById('hud').style.visibility = 'hidden';
  document.getElementById('title-frame').style.display = 'block';
  document.getElementById('hub-link').style.display = 'block';
  document.getElementById('lang-toggle').style.display = 'block';
  document.getElementById('buildInfo').style.display = 'block';
  document.getElementById('titleMascotImg').style.display = 'none';
  playSound('click');
}

// ─── INPUT ────────────────────────────────────────────────────
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
}

function onDown(e) {
  e.preventDefault();
  initAudio();
  const p = getPos(e);
  if (state === 'TITLE') {
    if (p.x >= W/2 - 85 && p.x <= W/2 + 85 && p.y >= 366 && p.y <= 414) {
      playSound('click');
      state = 'HOME';
      document.getElementById('titleMascotImg').style.display = 'none';
      return;
    }
    return;
  }
  if (state === 'HOME') {
    if (p.x >= W/2-100 && p.x <= W/2+100 && p.y >= 394 && p.y <= 446) {
      playSound('click');
      state = activePlayer() ? 'PROFILE' : 'ROSTER';
      return;
    }
    if (p.x < 140 && p.y > H - 46) { quitToTitle(); return; }
    return;
  }
  if (state === 'ROSTER') {
    const totalW = ROSTER_CARD_W * 4 + ROSTER_CARD_GAP * 3;
    const startX = W/2 - totalW/2;
    for (let i = 0; i < 3; i++) {
      const x = startX + i * (ROSTER_CARD_W + ROSTER_CARD_GAP);
      if (p.x >= x && p.x <= x + ROSTER_CARD_W && p.y >= ROSTER_CARD_Y && p.y <= ROSTER_CARD_Y + ROSTER_CARD_H) {
        playSound('click');
        pickStarter(STARTER_PLAYERS[i].id); return;
      }
    }
    if (p.x < 140 && p.y > H - 46) { playSound('click'); state = 'HOME'; return; }
    return;
  }
  if (state === 'PROFILE') {
    if (profilePanel) {
      if (p.x >= PANEL_X+PANEL_W-46 && p.x <= PANEL_X+PANEL_W-10 && p.y >= PANEL_Y+10 && p.y <= PANEL_Y+44) { playSound('click'); profilePanel = null; return; }
      if (profilePanel === 'manage') {
        const owned = ownedIds();
        for (let i = 0; i < owned.length; i++) {
          const y = MANAGE_ROW_Y0 + i * MANAGE_ROW_H;
          if (p.x >= PANEL_X+40 && p.x <= PANEL_X+PANEL_W-40 && p.y >= y && p.y <= y+MANAGE_ROW_H-16) {
            playSound('click'); profile.activePlayerId = owned[i]; saveProfile(); return;
          }
        }
        const renameY = MANAGE_ROW_Y0 + owned.length * MANAGE_ROW_H + 20;
        if (p.x >= PANEL_X+PANEL_W/2-110 && p.x <= PANEL_X+PANEL_W/2+110 && p.y >= renameY && p.y <= renameY+42) {
          playSound('click');
          const ap = activePlayer();
          if (ap) {
            const nn = window.prompt(t('renamePrompt'), ap.name);
            if (nn && nn.trim()) { ap.name = nn.trim().slice(0, 20); saveProfile(); }
          }
          return;
        }
        const langY = renameY + 58;
        if (p.x >= PANEL_X+PANEL_W/2-110 && p.x <= PANEL_X+PANEL_W/2+110 && p.y >= langY && p.y <= langY+42) {
          playSound('click');
          profile.lang = profile.lang === 'en' ? 'ja' : 'en';
          saveProfile();
          applyLanguage();
          return;
        }
        return;
      }
      if (profilePanel === 'upgrade') {
        const ap = activePlayer();
        if (ap) {
          ['sp', 'sh', 'def'].forEach((key, i) => {
            const y = UPG_ROW_Y0 + i * UPG_ROW_H;
            if (p.x >= PANEL_X+PANEL_W-190 && p.x <= PANEL_X+PANEL_W-60 && p.y >= y-10 && p.y <= y+34) upgradeStat(key);
          });
        }
        return;
      }
      if (profilePanel === 'shop') {
        const unowned = STARTER_PLAYERS.filter(pl => !(profile.players[pl.id] && profile.players[pl.id].owned));
        unowned.forEach((meta, i) => {
          const y = SHOP_ROW_Y0 + i * SHOP_ROW_H;
          if (p.x >= PANEL_X+PANEL_W-220 && p.x <= PANEL_X+PANEL_W-70 && p.y >= y+13 && p.y <= y+55) buyPlayer(meta.id);
        });
        return;
      }
      if (profilePanel === 'ball') {
        const totalW = BALL_SKINS.length * BALL_ITEM_W + (BALL_SKINS.length - 1) * 20;
        const startX = PANEL_X + PANEL_W/2 - totalW/2;
        BALL_SKINS.forEach((skin, i) => {
          const x = startX + i * (BALL_ITEM_W + 20);
          if (p.x >= x && p.x <= x+BALL_ITEM_W && p.y >= BALL_ITEM_Y0 && p.y <= BALL_ITEM_Y0+BALL_ITEM_H) {
            playSound('click'); profile.ballSkin = skin.id; saveProfile();
          }
        });
        return;
      }
      return;
    }

    if (Math.hypot(p.x - PF_AVATAR_X, p.y - PF_AVATAR_Y) <= PF_AVATAR_R + 10) { playSound('click'); profilePanel = 'manage'; return; }

    for (let i = 0; i < PROFILE_ICONS.length; i++) {
      const y = PF_ICON_Y0 + i * PF_ICON_GAP;
      if (p.x >= PF_ICON_X-PF_ICON_SIZE/2 && p.x <= PF_ICON_X+PF_ICON_SIZE/2 && p.y >= y-PF_ICON_SIZE/2 && p.y <= y+PF_ICON_SIZE/2) {
        playSound('click'); profilePanel = PROFILE_ICONS[i].key; return;
      }
    }

    const timeTotalW = PF_TIME_W * 3 + PF_TIME_GAP * 2;
    const timeStartX = W/2 - timeTotalW/2;
    for (let i = 0; i < 3; i++) {
      const x = timeStartX + i * (PF_TIME_W + PF_TIME_GAP);
      if (p.x >= x && p.x <= x+PF_TIME_W && p.y >= PF_TIME_Y && p.y <= PF_TIME_Y+PF_TIME_H) {
        playSound('click'); matchDurationIdx = i; profile.matchDurationIdx = i; saveProfile(); return;
      }
    }
    const lvlTotalW = PF_LVL_W * 3 + PF_LVL_GAP * 2;
    const lvlStartX = W/2 - lvlTotalW/2;
    for (let i = 0; i < 3; i++) {
      const x = lvlStartX + i * (PF_LVL_W + PF_LVL_GAP);
      if (p.x >= x && p.x <= x+PF_LVL_W && p.y >= PF_LVL_Y && p.y <= PF_LVL_Y+PF_LVL_H) {
        playSound('click'); cpuLevel = i; profile.cpuLevel = i; saveProfile(); return;
      }
    }
    if (p.x >= W/2-120 && p.x <= W/2+120 && p.y >= PF_READY_Y-28 && p.y <= PF_READY_Y+28) {
      if (activePlayer()) { playSound('click'); matchMode = 'ready'; enterVS(); }
      return;
    }
    if (p.x >= W/2-110 && p.x <= W/2+110 && p.y >= PF_FREEPLAY_Y-22 && p.y <= PF_FREEPLAY_Y+22) { return; } // Free Play: Coming Soon
    if (p.x < 140 && p.y > H - 46) { playSound('click'); state = 'HOME'; return; }
    return;
  }
  if (state === 'VS') { playSound('click'); startMatch(); return; }
  if (state === 'PAUSED') {
    if (p.x >= W/2-90 && p.x <= W/2+90 && p.y >= PAUSE_RESUME_Y-24 && p.y <= PAUSE_RESUME_Y+24) { resumeGame(); return; }
    if (p.x >= W/2-90 && p.x <= W/2+90 && p.y >= PAUSE_QUIT_Y-22 && p.y <= PAUSE_QUIT_Y+22) { quitToHome(); return; }
    return;
  }
}
canvas.addEventListener('mousedown', onDown, { passive: false });
canvas.addEventListener('touchstart', onDown, { passive: false });

// ─── JOYSTICK (analog, replaces the old 4-way D-pad) ───────────
const joystick = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystick-knob');
let joyPointerId = null;

function resetStick() {
  stickX = 0; stickY = 0;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
}
function setStickFromClient(clientX, clientY) {
  const rect = joystick.getBoundingClientRect();
  const maxR = rect.width / 2;
  const dx = clientX - (rect.left + maxR);
  const dy = clientY - (rect.top + maxR);
  const dist = Math.min(Math.hypot(dx, dy), maxR);
  const angle = Math.atan2(dy, dx);
  const kx = Math.cos(angle) * dist, ky = Math.sin(angle) * dist;
  joystickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  stickX = maxR > 0 ? kx / maxR : 0;
  stickY = maxR > 0 ? ky / maxR : 0;
}
joystick.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  joyPointerId = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  setStickFromClient(e.clientX, e.clientY);
});
joystick.addEventListener('pointermove', e => {
  if (e.pointerId !== joyPointerId) return;
  setStickFromClient(e.clientX, e.clientY);
});
function endJoyPointer(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  resetStick();
}
joystick.addEventListener('pointerup', endJoyPointer);
joystick.addEventListener('pointercancel', endJoyPointer);

// ─── SHOOT BUTTON (timed press primes the next paddle contact) ─
const shootBtn = document.getElementById('shoot-btn');
shootBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  if (state !== 'PLAYING') return;
  if (frameCount < shootReadyFrame) return; // still on cooldown from the last press
  shootPressFrame = frameCount;
  shootReadyFrame = frameCount + SHOOT_COOLDOWN_FRAMES;
});

document.addEventListener('keydown', e => {
  initAudio();
  if (state === 'TITLE') {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playSound('click'); state = 'HOME'; }
    return;
  }
  if (e.key === 'Escape' && (state === 'PLAYING' || state === 'PAUSED')) {
    if (state === 'PLAYING') pauseGame(); else resumeGame();
    return;
  }
  if (state !== 'PLAYING') return;
  if (e.key === 'ArrowUp' || e.key === 'w') held.up = true;
  else if (e.key === 'ArrowDown' || e.key === 's') held.down = true;
  else if (e.key === 'ArrowLeft' || e.key === 'a') held.left = true;
  else if (e.key === 'ArrowRight' || e.key === 'd') held.right = true;
  else if (e.key === ' ') {
    e.preventDefault();
    if (frameCount >= shootReadyFrame) {
      shootPressFrame = frameCount;
      shootReadyFrame = frameCount + SHOOT_COOLDOWN_FRAMES;
    }
  }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') held.up = false;
  else if (e.key === 'ArrowDown' || e.key === 's') held.down = false;
  else if (e.key === 'ArrowLeft' || e.key === 'a') held.left = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') held.right = false;
});

document.getElementById('pause-btn').addEventListener('click', () => {
  initAudio();
  if (state === 'PLAYING') pauseGame();
  else if (state === 'PAUSED') resumeGame();
});
document.getElementById('ov-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('overlay').classList.add('hidden');
  returnToProfile();
});

// ─── LANGUAGE TOGGLE ─────────────────────────────────────────
// Static HTML text (everything drawn on canvas re-reads t() live on its
// own each frame, so it needs no explicit refresh here).
function applyLanguage() {
  document.getElementById('hub-link').textContent = t('homeLinkText');
  document.getElementById('pause-btn').title = t('pauseTitle');
  document.getElementById('joystick').setAttribute('aria-label', t('joystickLabel'));
  document.getElementById('shoot-btn').setAttribute('aria-label', t('shootLabel'));
  document.getElementById('shoot-btn').textContent = t('shootLabel');
  document.getElementById('ov-btn').textContent = t('playAgain');
  document.querySelector('#rotate-hint p').textContent = t('rotateHint');
  document.getElementById('lang-toggle').textContent = t('langToggle');
}
document.getElementById('lang-toggle').addEventListener('click', () => {
  initAudio();
  playSound('click');
  profile.lang = profile.lang === 'en' ? 'ja' : 'en';
  saveProfile();
  applyLanguage();
});
applyLanguage();

// ─── VIEWPORT ZOOM GUARDS ───────────────────────────────────────
// iOS Safari ignores the viewport meta's user-scalable=no for its own
// pinch/double-tap zoom gestures, and those aren't stopped by touch-action
// CSS either. A rapid double-tap on the SHOOT button — a normal, encouraged
// input here — could otherwise trigger Safari's native double-tap-zoom and
// leave the whole page zoomed into that button. Swallow both gesture paths
// at the document level.
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
// Scoped to repeat taps on the SAME element within the window — that's the
// actual double-tap-zoom trigger pattern. A document-wide timer regardless
// of target would also cancel unrelated quick sequences (e.g. releasing the
// joystick, then immediately tapping Pause), which suppresses the second
// control's synthetic click along with the zoom, leaving click-driven
// buttons (Pause, game-over, the hub link) intermittently unresponsive.
let lastTouchEnd = { target: null, at: 0 };
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (e.target === lastTouchEnd.target && now - lastTouchEnd.at < 350) e.preventDefault();
  lastTouchEnd = { target: e.target, at: now };
}, { passive: false });

homePositions();
centerBall(1);
requestAnimationFrame(loop);
</script>
