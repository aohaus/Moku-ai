<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shiri of Moku</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(circle at 22% 16%, rgba(255,107,74,0.16), transparent 46%),
    linear-gradient(165deg, #170D0A 0%, #2E1610 55%, #180D09 100%);
  color: #F5EDE7;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
:root {
  --hi: #FF6B4A;
  --lo: #7A2E1A;
}

/* ---------- shared frame / hub link (Moku series design system) ---------- */
#title-frame {
  display: none;
  position: fixed; inset: 14px;
  border: 3px solid var(--hi);
  border-radius: 10px;
  pointer-events: none;
  z-index: 5;
}
#title-frame::after {
  content: '';
  position: absolute; inset: 5px;
  border: 1px solid var(--lo);
  border-radius: 8px;
}
body.on-title #title-frame { display: block; }
#hub-link {
  display: none;
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: calc(env(safe-area-inset-right, 0px) + 16px);
  z-index: 6;
  font-size: 14.5px;
  font-weight: 800;
  color: var(--hi);
  text-decoration: none;
  animation: hubLinkPulse 2.2s ease-in-out infinite;
}
body.on-title #hub-link { display: block; }
@keyframes hubLinkPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
#buildInfo {
  display: none;
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  left: calc(env(safe-area-inset-left, 0px) + 20px);
  z-index: 6;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: rgba(255,255,255,0.28);
  pointer-events: none;
}
body.on-title #buildInfo { display: block; }

#app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding:
    calc(env(safe-area-inset-top, 0px) + 20px)
    18px
    calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: flex;
  flex-direction: column;
}

.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* ---------- title screen ---------- */
#titleScreen { align-items: center; justify-content: center; text-align: center; gap: 16px; }
#titleFace {
  width: clamp(120px, 34vw, 160px);
  height: clamp(120px, 34vw, 160px);
  object-fit: cover;
  object-position: center 30%;
  border-radius: 50%;
  filter: drop-shadow(0 0 30px rgba(255,107,74,0.4));
  animation: titleFaceBob 3.2s ease-in-out infinite;
}
@keyframes titleFaceBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
#titleLogo {
  font-weight: 800;
  letter-spacing: 0.02em;
  font-size: clamp(26px, 8vw, 38px);
  line-height: 1.2;
  text-shadow: 0 0 24px rgba(255,107,74,0.35);
}
#titleLogo span { color: var(--hi); }
#titleSub {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(245,237,231,0.6);
}
#titleMenu { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.titleMenuItem {
  appearance: none; border: none; background: none; cursor: pointer;
  font-family: inherit; font-weight: 800; font-size: 19px;
  color: var(--hi); padding: 8px 18px;
  text-shadow: 0 0 14px rgba(255,107,74,0.5);
}
.titleMenuItem:active { transform: translateY(1px); }
#titleFooterTag {
  margin-top: 30px; padding-top: 14px; width: min(320px, 82%);
  border-top: 1px solid rgba(255,255,255,0.12);
  font-size: 11px; letter-spacing: 0.05em; color: rgba(245,237,231,0.4);
}

/* ---------- generic screen header / text-list nav ---------- */
.screenTitle {
  font-size: 20px; font-weight: 800; letter-spacing: 0.01em;
  margin-bottom: 4px; text-align: center;
}
.screenSub {
  font-size: 12.5px; color: rgba(245,237,231,0.55); text-align: center; margin-bottom: 18px;
}
.textLink {
  appearance: none; border: none; background: none; cursor: pointer;
  font-family: inherit; color: var(--hi); font-weight: 800; font-size: 15px;
  padding: 12px 4px; text-align: center;
}
.textLink:active { transform: translateY(1px); }
.textLink.dim { color: rgba(245,237,231,0.55); font-weight: 700; }

/* ---------- stage select ---------- */
#stageSelectScreen { padding-top: 8px; }
#stageList {
  display: flex; flex-direction: column;
  border-top: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 8px;
  overflow-y: auto;
}
.stageRow {
  appearance: none; border: none; background: none; cursor: pointer;
  font-family: inherit; color: #F5EDE7;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 15px; font-weight: 700;
  text-align: left;
}
.stageRow:active { background: rgba(255,107,74,0.08); }
.stageRow.locked { color: rgba(245,237,231,0.28); cursor: default; }
.stageRowStars { color: var(--hi); font-size: 13px; letter-spacing: 0.06em; }
.stageRow.locked .stageRowStars { color: rgba(245,237,231,0.2); }

/* ---------- game screen ---------- */
#gameScreen { gap: 10px; }
#gameHud {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
  color: rgba(245,237,231,0.7);
}
#gameHud span { color: var(--hi); }
#angerWrap { display: flex; flex-direction: column; gap: 4px; }
#angerLabel { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: rgba(245,237,231,0.5); }
#angerBar {
  height: 10px; border-radius: 6px; background: rgba(255,255,255,0.08);
  overflow: hidden; border: 1px solid rgba(255,255,255,0.12);
}
#angerFill {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #FFC94A, var(--hi));
  transition: width 0.35s ease, background 0.35s ease;
}

#faceWrap {
  align-self: center;
  width: clamp(140px, 40vw, 190px); height: clamp(140px, 40vw, 190px);
  margin: 4px 0 2px;
}
#mokuFace { width: 100%; height: 100%; }
@keyframes faceShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px) rotate(-2deg); }
  40% { transform: translateX(5px) rotate(2deg); }
  60% { transform: translateX(-4px) rotate(-1deg); }
  80% { transform: translateX(3px) rotate(1deg); }
}
@keyframes faceHeal {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(120,220,160,0)); }
  50% { filter: drop-shadow(0 0 16px rgba(120,220,160,0.65)); }
}
#faceWrap.flash-hit { animation: faceShake 0.4s ease; }
#faceWrap.flash-heal { animation: faceHeal 0.6s ease; }

#chatLog {
  max-height: 15vh;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px 2px;
  font-size: 12px;
  color: rgba(245,237,231,0.45);
}
#chatLog .logRow { display: flex; gap: 6px; }
#chatLog .logRow.you { justify-content: flex-end; text-align: right; }
#chatLog .logRow .bubble {
  max-width: 78%;
  padding: 5px 9px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
}
#chatLog .logRow.you .bubble { background: rgba(255,107,74,0.12); color: rgba(245,237,231,0.7); }

#mokuBubble {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 14px 16px;
  min-height: 52px;
  display: flex; align-items: center;
}
#mokuLine { font-size: 15.5px; font-weight: 700; line-height: 1.5; }

#choiceList { display: flex; flex-direction: column; margin-top: 4px; }
.choiceItem {
  appearance: none; border: none; background: none; cursor: pointer;
  font-family: inherit; color: #F5EDE7; font-size: 14.5px; font-weight: 600;
  text-align: left; line-height: 1.4;
  padding: 13px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.choiceItem::before { content: '▸ '; color: var(--hi); font-weight: 800; }
.choiceItem:active { background: rgba(255,107,74,0.1); }
.choiceItem:disabled { opacity: 0.4; }

/* ---------- result screen ---------- */
#resultScreen { align-items: center; justify-content: center; text-align: center; gap: 12px; }
#resultTitle { font-size: 24px; font-weight: 800; }
#resultDesc { font-size: 13.5px; color: rgba(245,237,231,0.6); line-height: 1.6; max-width: 320px; }
#resultStars { font-size: 26px; letter-spacing: 0.1em; color: var(--hi); margin: 4px 0; }
#resultButtons { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }

/* ---------- chill mode: no reading, no fail state, just tap Moku ---------- */
#chillScreen { align-items: center; justify-content: center; text-align: center; gap: 14px; }
#chillCount {
  font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
  color: rgba(245,237,231,0.45);
}
#chillFaceWrap {
  width: clamp(200px, 58vw, 260px); height: clamp(200px, 58vw, 260px);
  animation: chillBob 3.2s ease-in-out infinite;
}
#chillFaceInner {
  position: relative;
  width: 100%; height: 100%;
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
}
#chillFace { width: 100%; height: 100%; display: block; }
@keyframes chillBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes chillBounce { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 60% { transform: scale(0.96); } 100% { transform: scale(1); } }
@keyframes chillBounceBig { 0% { transform: scale(1); } 25% { transform: scale(1.22); } 55% { transform: scale(0.92); } 80% { transform: scale(1.06); } 100% { transform: scale(1); } }
#chillFaceInner.chill-bounce { animation: chillBounce 0.4s ease; }
#chillFaceInner.chill-bounce-big { animation: chillBounceBig 0.55s ease; }
#chillLine { font-size: 17px; font-weight: 800; min-height: 26px; color: var(--hi); }
.chillHeart {
  position: absolute; top: 8%; font-size: 22px; color: var(--hi);
  pointer-events: none;
  animation: chillHeartRise 0.9s ease-out forwards;
}
@keyframes chillHeartRise {
  0% { opacity: 0; transform: translateY(0) scale(0.6); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
}
</style>
</head>
<body class="on-title">
<div id="title-frame"></div>
<a id="hub-link" href="hub.html">🦉 Moku Series ▶</a>
<div id="buildInfo">v1.1.0 · Updated Aug 14, 2026</div>
<div id="app">

  <!-- TITLE SCREEN -->
  <section class="screen active" id="titleScreen">
    <img id="titleFace" src="brand/mokumoku-hero.png" alt="Mokumoku">
    <h1 id="titleLogo">SHIRI <span>OF MOKU</span></h1>
    <p id="titleSub">Talk with Moku without making him angry</p>
    <nav id="titleMenu">
      <button class="titleMenuItem" id="btnGoStageSelect">▶ Quiz Mode</button>
      <button class="titleMenuItem" id="btnGoChill">▶ Chill Mode</button>
    </nav>
    <div id="titleFooterTag">🦉 × 🍬 × ⚽ × 🏆 × 💬&nbsp; M O K U M O K U &nbsp;S E R I E S</div>
  </section>

  <!-- STAGE SELECT -->
  <section class="screen" id="stageSelectScreen">
    <h2 class="screenTitle">ステージ選択(せんたく)</h2>
    <p class="screenSub">機嫌(きげん)ゲージを満(まん)タンにさせずに乗(の)り切(き)ろう</p>
    <div id="stageList"></div>
    <button class="textLink dim" id="btnBackToTitle">◀ タイトルへ</button>
  </section>

  <!-- GAME SCREEN -->
  <section class="screen" id="gameScreen">
    <div id="gameHud">
      <div>STAGE <span id="stageNum">1</span></div>
      <div><span id="turnNow">1</span> / <span id="turnTotal">5</span></div>
    </div>
    <div id="angerWrap">
      <div id="angerLabel">モヨの機嫌(きげん)ゲージ</div>
      <div id="angerBar"><i id="angerFill"></i></div>
    </div>
    <div id="faceWrap"><canvas id="mokuFace" width="200" height="200"></canvas></div>
    <div id="chatLog"></div>
    <div id="mokuBubble"><p id="mokuLine"></p></div>
    <div id="choiceList"></div>
  </section>

  <!-- CHILL MODE: just tap/pet Moku, no reading, no losing -->
  <section class="screen" id="chillScreen">
    <div id="chillCount">🐾 <span id="chillCountNum">0</span></div>
    <div id="chillFaceWrap"><div id="chillFaceInner"><canvas id="chillFace" width="240" height="240"></canvas></div></div>
    <p id="chillLine">&nbsp;</p>
    <button class="textLink dim" id="btnBackToTitleFromChill">◀ タイトルへ</button>
  </section>

  <!-- RESULT SCREEN -->
  <section class="screen" id="resultScreen">
    <h2 id="resultTitle"></h2>
    <p id="resultDesc"></p>
    <div id="resultStars"></div>
    <div id="resultButtons">
      <button class="textLink" id="btnResultPrimary"></button>
      <button class="textLink dim" id="btnResultToSelect">ステージ選択(せんたく)に戻(もど)る</button>
    </div>
  </section>

</div>

<script>
(function () {
  var GAME_ID = 'shiri-of-moku';
  var TOTAL_STAGES = 20;
  var SAVE_KEY = 'moku:' + GAME_ID + ':progress';

  // ---------- content ----------
  // 1 mine / 2 safe replies (one big heal, one small heal).
  var EASY_TOPICS = [
    { id: 'dinner', line: '夜(よる)ご飯(はん)は唐揚(からあ)げモヨか?', choices: [
      { text: '唐揚(からあ)げしかないの?', type: 'mine', reply: 'なんだその言(い)い方(かた)モヨ!' },
      { text: '唐揚(からあ)げ食(た)べたい!', type: 'heal_small', reply: 'よし唐揚(からあ)げにするモヨ' },
      { text: 'モヨの手作(づく)りが一番(ばん)だよ', type: 'heal_big', reply: '…そ、そうモヨか' }
    ]},
    { id: 'early_home', line: '早く帰(かえ)ってきたモヨね', choices: [
      { text: '早く会(あ)いたかったから', type: 'heal_big', reply: 'そそそんなの照(て)れるモヨ' },
      { text: '暇(ひま)だっただけ', type: 'mine', reply: 'なによそれモヨ!' },
      { text: 'ちゃんと時間(じかん)通(どお)りだよ', type: 'heal_small', reply: 'ならいいモヨ' }
    ]},
    { id: 'weather_fluffy', line: '今日(きょう)寒(さむ)いから羽根(はね)膨(ふくら)ませてるモヨ', choices: [
      { text: 'もふもふだね', type: 'heal_big', reply: 'でしょモヨ!もっと撫(な)でていいモヨ' },
      { text: '太(ふと)った?', type: 'mine', reply: 'は?太(ふと)ってないモヨ!!' },
      { text: 'あったかそう', type: 'heal_small', reply: 'そうモヨ、寒(さむ)がりなだけモヨ' }
    ]},
    { id: 'room_mess', line: '部屋(へや)散(ち)らかってるモヨ、片付(かたづ)けないと巣(す)に帰(かえ)れなくなるモヨ', choices: [
      { text: '一緒(いっしょ)に片付(かたづ)けよう', type: 'heal_big', reply: 'それでいいモヨ' },
      { text: 'モヨの巣(す)の方(ほう)が汚(きたな)いじゃん', type: 'mine', reply: 'よけいなお世話(せわ)モヨ!' },
      { text: '今(いま)やるよ', type: 'heal_small', reply: 'ならよしモヨ' }
    ]},
    { id: 'snack_eaten', line: 'モヨのお菓(か)子勝(かっ)手に食(た)べたモヨね', choices: [
      { text: 'ごめん、買(か)い直(なお)すよ', type: 'heal_big', reply: 'わかればいいモヨ' },
      { text: '気のせいじゃない?', type: 'mine', reply: '袋(ふくろ)あるのになにが気のせいモヨ!' },
      { text: '半分(はんぶん)こしよ', type: 'heal_small', reply: '…まあいいモヨ' }
    ]},
    { id: 'oversleep', line: 'モヨが起(お)こしたのに二度(ど)寝(ね)したモヨ', choices: [
      { text: '明日(あした)は一緒(いっしょ)に早起(お)きしよう', type: 'heal_big', reply: '約束(やくそく)モヨよ' },
      { text: 'モヨの声(こえ)小さいからだよ', type: 'mine', reply: '聞(き)こえてたくせにモヨ!' },
      { text: 'ごめんごめん', type: 'heal_small', reply: '次(つぎ)は気をつけるモヨ' }
    ]},
    { id: 'anniversary', line: '今日(きょう)が何(なん)の日か覚(おぼ)えてるモヨ?', choices: [
      { text: 'もちろん、モヨの日でしょ', type: 'heal_big', reply: 'えへへ正解(かい)モヨ' },
      { text: 'うーん、わからない', type: 'mine', reply: '…そうモヨか' },
      { text: '特別(とくべつ)な日だよね', type: 'heal_small', reply: 'まあ及第点(きゅうだいてん)モヨ' }
    ]}
  ];

  // 2 mines / 1 safe reply.
  var HARD_TOPICS = [
    { id: 'chicken_call', line: 'さっきチキンって言(い)ったモヨ?', choices: [
      { text: '言(い)ってないよ', type: 'heal_small', reply: 'ならいいモヨ' },
      { text: '言(い)ったけど何(なに)か?', type: 'mine', reply: 'よくもチキンって呼(よ)んだモヨね!' },
      { text: 'なんとなく雰囲気(ふんいき)で', type: 'mine', reply: '雰囲気(ふんいき)で人をチキン呼(よ)ばわりするなモヨ!' }
    ]},
    { id: 'game_loss_blame', line: 'さっきの試合(しあい)、素人(しろうと)でも勝(か)てたモヨ', choices: [
      { text: 'うるさいな', type: 'mine', reply: 'うるさいとはなんだモヨ!' },
      { text: '次(つぎ)は本気出すよ', type: 'heal_small', reply: 'その意(い)気モヨ' },
      { text: 'モヨの解説(かいせつ)のせいだよ', type: 'mine', reply: 'モヨのせいにするなモヨ!' }
    ]},
    { id: 'attitude', line: '今日(きょう)口調(くちょう)が生意(い)気モヨ', choices: [
      { text: 'そんなことないよ', type: 'heal_small', reply: 'ならいいモヨ' },
      { text: 'モヨこそ生意(い)気じゃん', type: 'mine', reply: '誰(だれ)に向(む)かって言(い)ってるモヨ!' },
      { text: '気のせいだよ、多分(たぶん)', type: 'mine', reply: '多分(たぶん)ってなんだモヨ!' }
    ]},
    { id: 'jealousy_other_apps', line: '最近(さいきん)他(ほか)のアプリばっかり触(さわ)ってるモヨね', choices: [

      { text: 'ちょっと飽(あ)きてきたかも', type: 'mine', reply: '飽(あ)きたって言(い)ったモヨね!?' },
      { text: 'モヨより面(おも)白いのあるし', type: 'mine', reply: 'は!?聞(き)き捨(す)てならないモヨ!' }
    ]},
    { id: 'praise_fishing', line: '今日(きょう)のモヨかっこよかったモヨ?', choices: [

      { text: 'まあまあかな', type: 'mine', reply: 'まあまあってなんだモヨ!' },
      { text: 'フクロウにしては', type: 'mine', reply: 'フクロウにしてはとはなんだモヨ!!' }

  ];

  // Chill mode: short, mostly-kana reaction lines for tapping/petting Moku.
  // Kept text-light on purpose — no furigana needed, nothing to read closely.
  var CHILL_LINES = [
    'なでなでモヨ〜', 'えへへモヨ', 'もふもふ〜', 'くすぐったいモヨ',
    'うれしいモヨ!', 'もっとモヨ〜', 'ふわぁ〜モヨ', 'すきモヨ',
    'んふふモヨ', 'ぽかぽかモヨ', 'ねむいモヨ…', 'たのしいモヨ!',
    'ぴょんっ!', 'きもちいいモヨ〜'
  ];
  var CHILL_SPECIAL_LINES = ['だいすきモヨ!!', 'さいこうモヨ!!'];

  // Fully made-up "next game" running joke — no gameplay effect.
  var IDEA_JOKES = [
    '次(つぎ)は「土下座(ざ)オブモク」はどうモヨ?謝(あやま)る速(はや)さを競(きそ)うゲームモヨ',
    'フクロウがひたすら寝(ね)るだけの放置(ほうち)ゲーム「寝(ね)る前(まえ)のモク」を作(つく)るモヨ',
    'モヨの声(こえ)だけで音ゲー作(つく)ったら売(う)れるモヨかね',

    'いっそ全部(ぜんぶ)のゲームにモヨが乱(らん)入する説(せつ)あるモヨ',
    '「片付(かたづ)けろよモヨ」っていう説教(せっきょう)シミュレーターも需要(じゅよう)あるモヨかもしれん'
  ];

  // ---------- save data ----------
  function loadProgress() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data && data.gameId === GAME_ID) return data;
      }
    } catch (e) {}
    return { version: 1, gameId: GAME_ID, unlockedStage: 1, stageStars: {}, updatedAt: '' };
  }
  function saveProgress() {
    progress.updatedAt = new Date().toISOString();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  var progress = loadProgress();

  // ---------- helpers ----------
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function turnsForStage(n) { return Math.min(12, 5 + Math.floor((n - 1) / 2)); }
  function deltaFor(type) {
    if (type === 'mine') return randInt(25, 35);
    if (type === 'heal_big') return -randInt(15, 20);
    return -randInt(8, 12); // heal_small
  }

  function showScreen(id) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    document.getElementById(id).classList.add('active');
    document.body.classList.toggle('on-title', id === 'titleScreen');
  }

  // ---------- face rendering ----------
  // Ported from angry-mokumoku.html's drawMokumoku() so Moku looks like the
  // same character across the series instead of a one-off face just for
  // this game (moods: 'neutral' / 'angry' / 'super-angry').
  function drawMokumoku(ctx, x, y, r, angle, mood) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle || 0);
    mood = mood || 'neutral';

    // Body — slightly redder when super-angry
    ctx.fillStyle = mood === 'super-angry' ? '#D48060' : '#C8956A';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    var bodyShade = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r);
    bodyShade.addColorStop(0, 'rgba(255,255,255,0.15)');
    bodyShade.addColorStop(1, 'rgba(0,0,0,0.2)');
    ctx.fillStyle = bodyShade;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

    // Face patch
    ctx.fillStyle = '#E8D5B0';
    ctx.beginPath(); ctx.ellipse(0, r * 0.12, r * 0.66, r * 0.76, 0, 0, Math.PI * 2); ctx.fill();

    // Eye height based on mood
    var eyeH = mood === 'super-angry' ? r * 0.145 : mood === 'angry' ? r * 0.175 : r * 0.235;
    var eyeW = r * 0.19;

    // Eyes
    ctx.fillStyle = '#151515';
    ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.14, eyeW, eyeH, -0.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.32, -r * 0.14, eyeW, eyeH, 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.14, eyeW, eyeH, -0.08, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r * 0.32, -r * 0.14, eyeW, eyeH, 0.08, 0, Math.PI * 2); ctx.stroke();

    // Angry eyebrows
    if (mood === 'angry' || mood === 'super-angry') {
      var slope = mood === 'super-angry' ? r * 0.16 : r * 0.10;
      ctx.strokeStyle = '#4A1800';
      ctx.lineWidth = mood === 'super-angry' ? r * 0.09 : r * 0.07;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-r * 0.52, -r * 0.36 - slope); ctx.lineTo(-r * 0.14, -r * 0.36 + slope * 0.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.14, -r * 0.36 + slope * 0.3); ctx.lineTo(r * 0.52, -r * 0.36 - slope); ctx.stroke();
    }

    // Eye highlights
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-r * 0.27, -r * 0.2, r * 0.065, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.37, -r * 0.2, r * 0.065, 0, Math.PI * 2); ctx.fill();

    // Forehead stripe
    ctx.fillStyle = mood === 'super-angry' ? '#C87818' : '#E89230';
    ctx.beginPath(); ctx.ellipse(0, -r * 0.02, r * 0.24, r * 0.115, 0, 0, Math.PI * 2); ctx.fill();

    // Beak — open when angry
    if (mood === 'super-angry') {
      ctx.fillStyle = '#2A1000';
      ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.115, r * 0.10, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#D07818';
      ctx.beginPath(); ctx.ellipse(0, r * 0.10, r * 0.115, r * 0.075, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, r * 0.17, r * 0.115, r * 0.06, 0, 0, Math.PI); ctx.fill();
    } else if (mood === 'angry') {
      ctx.fillStyle = '#5A2800';
      ctx.beginPath(); ctx.ellipse(0, r * 0.14, r * 0.105, r * 0.055, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#D07818';
      ctx.beginPath(); ctx.ellipse(0, r * 0.09, r * 0.115, r * 0.075, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, r * 0.155, r * 0.105, r * 0.055, 0, 0, Math.PI); ctx.fill();
    } else {
      ctx.fillStyle = '#D07818';
      ctx.beginPath(); ctx.ellipse(0, r * 0.12, r * 0.115, r * 0.135, 0, 0, Math.PI); ctx.fill();
    }

    // Teal leaf bowtie
    ctx.fillStyle = '#3DA890';
    ctx.beginPath(); ctx.ellipse(-r * 0.28, r * 0.47, r * 0.24, r * 0.13, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.28, r * 0.47, r * 0.24, r * 0.13, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2A7868';
    ctx.beginPath(); ctx.arc(0, r * 0.47, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2A7868'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-r * 0.04, r * 0.47); ctx.lineTo(-r * 0.48, r * 0.45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.04, r * 0.47); ctx.lineTo(r * 0.48, r * 0.45); ctx.stroke();

    // Orange feet
    ctx.fillStyle = '#E89230';
    ctx.beginPath(); ctx.ellipse(-r * 0.26, r * 0.88, r * 0.13, r * 0.08, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.26, r * 0.88, r * 0.13, r * 0.08, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#C06810'; ctx.lineWidth = 1.2;
    [-r * 0.26, r * 0.26].forEach(function (fx) {
      ctx.beginPath(); ctx.moveTo(fx - r * 0.07, r * 0.9); ctx.lineTo(fx - r * 0.15, r * 0.96); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, r * 0.92); ctx.lineTo(fx, r * 1.0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx + r * 0.07, r * 0.9); ctx.lineTo(fx + r * 0.15, r * 0.96); ctx.stroke();
    });

    ctx.restore();
  }

  function moodFor(anger) {
    return anger >= 70 ? 'super-angry' : anger >= 30 ? 'angry' : 'neutral';
  }

  function drawFace(canvas, anger) {
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    drawMokumoku(ctx, w / 2, h / 2 + 6, w * 0.36, 0, moodFor(anger));
  }

  // #titleFace is now the static #titleFace <img> (the real illustrated
  // artwork) — only #mokuFace (the in-chat reactive face) is canvas-drawn.
  var mokuFace = document.getElementById('mokuFace');

  function flashFace(kind) {
    var wrap = document.getElementById('faceWrap');
    wrap.classList.remove('flash-hit', 'flash-heal');
    void wrap.offsetWidth;
    wrap.classList.add(kind === 'mine' ? 'flash-hit' : 'flash-heal');
  }

  // ---------- chill mode ----------
  var CHILL_KEY = 'moku:' + GAME_ID + ':chillPets';
  var chillFace = document.getElementById('chillFace');
  var chillCount = 0;
  try { chillCount = parseInt(localStorage.getItem(CHILL_KEY), 10) || 0; } catch (e) {}

  // Wordless "growing up" reward: bowtie recolors and accessories keep
  // stacking on as the pet count climbs. Tier 7 is the "final form" — from
  // there the bowtie hue-cycles and sparkles keep drifting forever, so the
  // look never just freezes even at very high counts.
  function chillTierFor(count) {
    if (count >= 400) return 7;
    if (count >= 200) return 6;
    if (count >= 100) return 5;
    if (count >= 60) return 4;
    if (count >= 30) return 3;
    if (count >= 15) return 2;
    if (count >= 5) return 1;
    return 0;
  }

  function updateChillCount() {
    document.getElementById('chillCountNum').textContent = chillCount;
  }

  function popChillHeart() {
    var wrap = document.getElementById('chillFaceInner');
    var heart = document.createElement('span');
    heart.className = 'chillHeart';
    heart.textContent = '♥';
    heart.style.left = (38 + Math.random() * 24) + '%';
    wrap.appendChild(heart);
    heart.addEventListener('animationend', function () { heart.remove(); });
  }

  // ---- cosmetic overlays, drawn on top of the canonical drawMokumoku ----
  function drawChillBowtie(ctx, cx, cy, r, color, colorDark) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(-r * 0.28, r * 0.47, r * 0.24, r * 0.13, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.28, r * 0.47, r * 0.24, r * 0.13, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = colorDark;
    ctx.beginPath(); ctx.arc(0, r * 0.47, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawChillAccessory(ctx, cx, cy, r) {
    ctx.save();
    ctx.translate(cx - r * 0.05, cy - r * 0.95);
    ctx.fillStyle = '#FFD35C';
    for (var i = 0; i < 5; i++) {
      var ang = (Math.PI * 2 / 5) * i;
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * r * 0.09, Math.sin(ang) * r * 0.09, r * 0.07, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#C87818';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawStar(ctx, size) {
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.28, -size * 0.28);
    ctx.lineTo(size, 0);
    ctx.lineTo(size * 0.28, size * 0.28);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.28, size * 0.28);
    ctx.lineTo(-size, 0);
    ctx.lineTo(-size * 0.28, -size * 0.28);
    ctx.closePath();
    ctx.fill();
  }

  // count sparkles procedurally around the head so higher tiers can just
  // ask for more of them instead of needing a hand-placed point per tier.
  function drawChillSparkles(ctx, cx, cy, r, now, count) {
    for (var i = 0; i < count; i++) {
      var ang = (Math.PI * 2 / count) * i + 0.3;
      var rad = 0.75 + (i % 2) * 0.22;
      var dx = Math.cos(ang) * rad;
      var dy = Math.sin(ang) * rad * 0.8 - 0.15;
      var tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(now * 0.003 + i * 1.3));
      ctx.save();
      ctx.globalAlpha = tw;
      ctx.translate(cx + r * dx, cy + r * dy);
      ctx.fillStyle = '#FFE9A8';
      drawStar(ctx, r * 0.085);
      ctx.restore();
    }
  }

  function sparkleCountForTier(tier) {
    if (tier >= 7) return 10;
    if (tier >= 6) return 8;
    if (tier >= 4) return 6;
    return 4;
  }

  function drawChillHalo(ctx, cx, cy, r, tier) {
    var strength = tier >= 6 ? 0.3 : 0.16;
    var grad = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.6);
    grad.addColorStop(0, 'rgba(255,210,150,' + strength + ')');
    grad.addColorStop(1, 'rgba(255,210,150,0)');
    ctx.save();
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawChillStarAccessory(ctx, cx, cy, r) {
    ctx.save();
    ctx.translate(cx + r * 0.55, cy - r * 0.55);
    ctx.fillStyle = '#FFE9A8';
    drawStar(ctx, r * 0.14);
    ctx.restore();
  }

  // hue-cycling color pair, used once the bowtie stops settling on a fixed
  // color (tier 5+) so the "final form" keeps visibly shifting forever.
  function rainbowPair(now) {
    var hue = Math.floor((now * 0.05) % 360);
    return ['hsl(' + hue + ',78%,66%)', 'hsl(' + hue + ',70%,38%)'];
  }

  var CHILL_TIER_COLORS = {
    1: ['#FF8FB0', '#B9527A'],
    2: ['#FFD35C', '#C8961E'],
    3: ['#C77DFF', '#7A3D9C'],
    4: ['#FF6B4A', '#7A2E1A']
  };

  function drawChillCosmetics(ctx, cx, cy, r, tier, now) {
    if (tier >= 1) {
      var c = tier >= 5 ? rainbowPair(now) : CHILL_TIER_COLORS[tier];
      drawChillBowtie(ctx, cx, cy, r, c[0], c[1]);
    }
    if (tier >= 2) drawChillAccessory(ctx, cx, cy, r);
    if (tier >= 5) drawChillStarAccessory(ctx, cx, cy, r);
    if (tier >= 3) drawChillSparkles(ctx, cx, cy, r, now, sparkleCountForTier(tier));
  }

  // ---- idle-only overlays: wings, blink, doze Zzz ----
  function drawChillWings(ctx, cx, cy, r, amt) {
    var angle = amt * 0.6;
    [-1, 1].forEach(function (side) {
      ctx.save();
      ctx.translate(cx + side * r * 0.78, cy + r * 0.05);
      ctx.rotate(side * (0.3 + angle));
      ctx.fillStyle = '#B9835C';
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.42, r * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawChillBlink(ctx, cx, cy, r, amt) {
    var eyeY = cy - r * 0.14;
    var eyeW = r * 0.19 * 1.3;
    var eyeH = r * 0.235 * 1.3 * amt;
    ctx.fillStyle = '#E8D5B0';
    [cx - r * 0.32, cx + r * 0.32].forEach(function (ex) {
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawChillZzz(ctx, cx, cy, r, amt) {
    ctx.save();
    ctx.globalAlpha = amt;
    ctx.fillStyle = 'rgba(245,237,231,0.85)';
    ctx.font = 'bold ' + Math.round(r * 0.22) + 'px sans-serif';
    ctx.fillText('z', cx + r * 0.55, cy - r * 0.95);
    ctx.font = 'bold ' + Math.round(r * 0.16) + 'px sans-serif';
    ctx.fillText('z', cx + r * 0.78, cy - r * 1.15);
    ctx.restore();
  }

  // ---- idle scheduler: fires a random small motion after a few quiet seconds ----
  var chillIdleTimer = null;
  var chillIdleAction = null;
  var chillAnimFrame = null;

  function scheduleChillIdle() {
    clearTimeout(chillIdleTimer);
    chillIdleTimer = setTimeout(triggerChillIdle, randInt(3500, 7000));
  }

  function triggerChillIdle() {
    var types = ['blink', 'blink', 'blink', 'stretch', 'doze', 'flap'];
    var type = types[Math.floor(Math.random() * types.length)];
    var duration = type === 'doze' ? 2200 : type === 'stretch' ? 900 : type === 'flap' ? 700 : 260;
    chillIdleAction = { type: type, start: performance.now(), duration: duration };
    scheduleChillIdle();
  }

  function renderChillFrame(now) {
    var ctx = chillFace.getContext('2d');
    var w = chillFace.width, h = chillFace.height;
    ctx.clearRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2 + 6, r = w * 0.36;
    var scaleY = 1, blinkAmt = 0, wingAmt = 0, dozeAmt = 0;

    if (chillIdleAction) {
      var elapsed = now - chillIdleAction.start;
      var p = clamp(elapsed / chillIdleAction.duration, 0, 1);
      if (chillIdleAction.type === 'blink') {
        blinkAmt = Math.sin(p * Math.PI);
      } else if (chillIdleAction.type === 'stretch') {
        scaleY = 1 + Math.sin(p * Math.PI) * 0.08;
      } else if (chillIdleAction.type === 'flap') {
        wingAmt = Math.sin(p * Math.PI * 3) * 0.5 + 0.5;
      } else if (chillIdleAction.type === 'doze') {
        blinkAmt = Math.sin(p * Math.PI);
        dozeAmt = Math.sin(p * Math.PI);
      }
      if (elapsed >= chillIdleAction.duration) chillIdleAction = null;
    }

    var tier = chillTierFor(chillCount);
    if (tier >= 4) drawChillHalo(ctx, cx, cy, r, tier);

    var restWingAmt = tier >= 6 ? 0.18 : 0;
    var totalWingAmt = Math.max(wingAmt, restWingAmt);
    if (totalWingAmt > 0.02) drawChillWings(ctx, cx, cy, r, totalWingAmt);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, scaleY);
    ctx.translate(-cx, -cy);
    drawMokumoku(ctx, cx, cy, r, 0, 'neutral');
    drawChillCosmetics(ctx, cx, cy, r, tier, now);
    if (blinkAmt > 0.04) drawChillBlink(ctx, cx, cy, r, blinkAmt);
    ctx.restore();

    if (dozeAmt > 0.1) drawChillZzz(ctx, cx, cy, r, dozeAmt);

    chillAnimFrame = requestAnimationFrame(renderChillFrame);
  }

  function startChillLoop() {
    chillIdleAction = null;
    scheduleChillIdle();
    if (chillAnimFrame) cancelAnimationFrame(chillAnimFrame);
    chillAnimFrame = requestAnimationFrame(renderChillFrame);
  }

  function stopChillLoop() {
    if (chillAnimFrame) cancelAnimationFrame(chillAnimFrame);
    chillAnimFrame = null;
    clearTimeout(chillIdleTimer);
  }

  function petMoku() {
    var prevTier = chillTierFor(chillCount);
    chillCount++;
    updateChillCount();
    try { localStorage.setItem(CHILL_KEY, String(chillCount)); } catch (e) {}
    var leveledUp = chillTierFor(chillCount) > prevTier;

    var special = leveledUp || Math.random() < 0.08;
    var pool = special ? CHILL_SPECIAL_LINES : CHILL_LINES;
    document.getElementById('chillLine').textContent = pool[Math.floor(Math.random() * pool.length)];

    var inner = document.getElementById('chillFaceInner');
    inner.classList.remove('chill-bounce', 'chill-bounce-big');
    void inner.offsetWidth;
    inner.classList.add(special ? 'chill-bounce-big' : 'chill-bounce');
    popChillHeart();
    if (leveledUp) {
      setTimeout(popChillHeart, 120);
      setTimeout(popChillHeart, 240);
    }

    chillIdleAction = null;
    scheduleChillIdle();
  }

  // ---------- stage select ----------
  function renderStageList() {
    var wrap = document.getElementById('stageList');
    wrap.innerHTML = '';
    for (var n = 1; n <= TOTAL_STAGES; n++) {
      (function (n) {
        var unlocked = n <= progress.unlockedStage;
        var stars = progress.stageStars[n] || 0;
        var row = document.createElement('button');
        row.className = 'stageRow' + (unlocked ? '' : ' locked');
        row.disabled = !unlocked;
        var left = document.createElement('span');
        left.textContent = unlocked ? ('STAGE ' + n) : ('🔒 STAGE ' + n);
        var right = document.createElement('span');
        right.className = 'stageRowStars';
        right.textContent = unlocked ? ('★'.repeat(stars) + '☆'.repeat(3 - stars)) : '';
        row.appendChild(left);
        row.appendChild(right);
        if (unlocked) row.addEventListener('click', function () { startStage(n); });
        wrap.appendChild(row);
      })(n);
    }
  }

  // ---------- gameplay ----------
  var state = {};

  function startStage(n) {
    state.stage = n;
    state.turnIndex = 0;
    state.turnsTotal = turnsForStage(n);
    state.anger = 0;
    state.lastTopicId = null;
    document.getElementById('stageNum').textContent = n;
    document.getElementById('turnTotal').textContent = state.turnsTotal;
    document.getElementById('chatLog').innerHTML = '';
    updateAnger();
    showScreen('gameScreen');
    nextTurn();
  }

  function updateAnger() {
    document.getElementById('angerFill').style.width = state.anger + '%';
    drawFace(mokuFace, state.anger);
  }

  function appendLog(who, text) {
    var log = document.getElementById('chatLog');
    var row = document.createElement('div');
    row.className = 'logRow' + (who === 'you' ? ' you' : '');
    var bubble = document.createElement('span');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function renderBubble(text) {
    document.getElementById('mokuLine').textContent = text;
  }

  function renderChoices(items, onSelect) {
    var wrap = document.getElementById('choiceList');
    wrap.innerHTML = '';
    items.forEach(function (item, idx) {
      var btn = document.createElement('button');
      btn.className = 'choiceItem';
      btn.textContent = item.text;
      btn.addEventListener('click', function () {
        var all = wrap.querySelectorAll('.choiceItem');
        for (var i = 0; i < all.length; i++) all[i].disabled = true;
        onSelect(idx);
      });
      wrap.appendChild(btn);
    });
  }

  function pickTopic(stage) {
    var hardChance = stage <= 7 ? 0 : stage <= 14 ? 0.4 : 0.7;
    var pool = Math.random() < hardChance ? HARD_TOPICS : EASY_TOPICS;
    var available = pool.filter(function (t) { return t.id !== state.lastTopicId; });
    if (available.length === 0) available = pool;
    return available[Math.floor(Math.random() * available.length)];
  }

  function nextTurn() {
    state.turnIndex++;
    document.getElementById('turnNow').textContent = state.turnIndex;
    var asideChance = state.stage >= 2 ? 0.15 : 0;
    if (Math.random() < asideChance) {
      renderBubble(IDEA_JOKES[Math.floor(Math.random() * IDEA_JOKES.length)]);
      renderChoices([{ text: 'そうモヨね' }], function () { presentTopic(); });
    } else {
      presentTopic();
    }
  }

  function presentTopic() {
    var topic = pickTopic(state.stage);
    state.lastTopicId = topic.id;
    renderBubble(topic.line);
    appendLog('moku', topic.line);
    var shuffled = shuffle(topic.choices.slice());
    renderChoices(shuffled, function (idx) { handleChoice(shuffled[idx]); });
  }

  function handleChoice(choice) {
    var delta = deltaFor(choice.type);
    state.anger = clamp(state.anger + delta, 0, 100);
    updateAnger();
    appendLog('you', choice.text);
    appendLog('moku', choice.reply);
    flashFace(choice.type);
    renderBubble(choice.reply);
    renderChoices([{ text: 'つづける ▶' }], function () {
      if (state.anger >= 100) return endStage(false);
      if (state.turnIndex >= state.turnsTotal) return endStage(true);
      nextTurn();
    });
  }

  function endStage(cleared) {
    var title = document.getElementById('resultTitle');
    var desc = document.getElementById('resultDesc');
    var stars = document.getElementById('resultStars');
    var primary = document.getElementById('btnResultPrimary');
    primary.onclick = null;

    if (cleared) {
      var earned = state.anger <= 33 ? 3 : state.anger <= 66 ? 2 : 1;
      progress.stageStars[state.stage] = Math.max(progress.stageStars[state.stage] || 0, earned);
      if (state.stage === progress.unlockedStage && state.stage < TOTAL_STAGES) {
        progress.unlockedStage = state.stage + 1;
      }
      saveProgress();
      title.textContent = 'ステージクリア!';
      desc.textContent = 'モヨをうまくなだめきったモヨ。';
      stars.textContent = '★'.repeat(earned) + '☆'.repeat(3 - earned);
      var hasNext = state.stage < TOTAL_STAGES;
      primary.textContent = hasNext ? 'つぎのステージへ ▶' : 'ステージ選択(せんたく)に戻(もど)る';
      primary.onclick = function () {
        if (hasNext) startStage(state.stage + 1);
        else { renderStageList(); showScreen('stageSelectScreen'); }
      };
    } else {
      title.textContent = 'んーーーーモヨー!';
      desc.textContent = 'モヨを怒(おこ)らせてしまったモヨ。もう一度(ど)話(はな)しかけてみよう。';
      stars.textContent = '';
      primary.textContent = 'もう一度(ど)';
      primary.onclick = function () { startStage(state.stage); };
    }
    showScreen('resultScreen');
  }

  // ---------- wiring ----------
  document.getElementById('btnGoStageSelect').addEventListener('click', function () {
    renderStageList();
    showScreen('stageSelectScreen');
  });
  document.getElementById('btnBackToTitle').addEventListener('click', function () {
    showScreen('titleScreen');
  });
  document.getElementById('btnResultToSelect').addEventListener('click', function () {
    renderStageList();
    showScreen('stageSelectScreen');
  });
  document.getElementById('btnGoChill').addEventListener('click', function () {
    updateChillCount();
    document.getElementById('chillLine').innerHTML = '&nbsp;';
    showScreen('chillScreen');
    startChillLoop();
  });
  document.getElementById('chillFaceInner').addEventListener('click', petMoku);
  document.getElementById('btnBackToTitleFromChill').addEventListener('click', function () {
    stopChillLoop();
    showScreen('titleScreen');
  });
})();
</script>
</body>
</html>
