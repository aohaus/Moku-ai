// ─── SFX (short synthesized sounds, gameplay only — no BGM) ────

let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
}

// iOS Safari only unlocks the audio hardware inside the very first
// user-gesture handler on the page — unlocking as early as possible
// (rather than waiting for the first sound effect) avoids any edge
// case where a later, indirect call misses that window and SFX stay
// silent even though the game logic runs fine. Just calling resume()
// isn't always enough on iOS in practice, so also fire one truly
// silent buffer through the graph in the same gesture — the standard
// "unlock" trick that fully engages the hardware.
function unlockAudioOnce() {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
  document.removeEventListener('touchstart', unlockAudioOnce);
  document.removeEventListener('mousedown', unlockAudioOnce);
}
document.addEventListener('touchstart', unlockAudioOnce, { passive: true });
document.addEventListener('mousedown', unlockAudioOnce, { passive: true });

function beep(freq, dur, { type = 'square', gain = 0.16, delay = 0, slideTo = null } = {}) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

// ─── CPU対戦 (VS MODE) ────────────────────────────────────────
// A self-contained parallel implementation rather than threading a board
// parameter through the marathon functions above — marathon's grid/piece/
// score/etc. stay plain globals exactly as before (zero risk of a VS
// refactor regressing the score-attack mode), while every vb*-prefixed
// function here operates on an explicit board object `b` so two boards
// (vsP, vsC) can run side by side. Shared pure helpers (rotOffset,
// STAGES, rainbowColor, Particle/addParticles/addShake, drawGummyShape,
// stageVisual, newGrid) are reused as-is.

function vbSimCanPlace(g, col, row, rot) {
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return false;
  if (g[col][row] !== null) return false;
  const sat = rotOffset(col, row, rot);
  if (sat.col < 0 || sat.col >= GRID_COLS || sat.row < 0 || sat.row >= GRID_ROWS) return false;
  if (g[sat.col][sat.row] !== null) return false;
  return true;
}

function vbFindGroups(g) {
  const visited = Array.from({ length: GRID_COLS }, () => new Array(GRID_ROWS).fill(false));
  const groups = [];
  for (let c = 0; c < GRID_COLS; c++) {
    for (let r = 0; r < GRID_ROWS; r++) {
      if (g[c][r] === null || g[c][r] === RAINBOW || g[c][r] === GARBAGE || visited[c][r]) continue;
      const stage = g[c][r];
      const stack = [[c, r]];
      visited[c][r] = true;
      const cells = [];
      while (stack.length) {
        const [cc, rr] = stack.pop();
        cells.push([cc, rr]);
        [[cc+1,rr],[cc-1,rr],[cc,rr+1],[cc,rr-1]].forEach(([nc, nr]) => {
          if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) return;
          if (visited[nc][nr] || g[nc][nr] !== stage) return;
          visited[nc][nr] = true;
          stack.push([nc, nr]);
        });
      }
      if (cells.length >= MATCH_MIN) groups.push({ stage, cells });
    }
  }
  return groups;
}

function vbApplyGravity(g, cols) {
  const targets = cols || Array.from({ length: GRID_COLS }, (_, i) => i);
  for (const c of targets) {
    const vals = [];
    for (let r = 0; r < GRID_ROWS; r++) if (g[c][r] !== null) vals.push(g[c][r]);
    for (let r = 0; r < GRID_ROWS; r++) g[c][r] = null;
    const startRow = GRID_ROWS - vals.length;
    vals.forEach((v, i) => { g[c][startRow + i] = v; });
  }
}

function newVsBoard(x0, isCpu) {
  return {
    x0, isCpu,
    grid: newGrid(),
    piece: null,
    phase: 'FALL',
    pauseTimer: 0,
    fallTimer: 0,
    aiTimer: 0,
    chainCount: 0,
    score: 0,
    nextPair: null,
    lockedCols: [],
    pendingGarbage: 0,
    garbageCols: [], // which columns the next drop (up to VS_GARBAGE_PER_DROP) will land in — kept in sync with pendingGarbage via refreshGarbageCols so the standby preview always matches where it actually lands
    aiTarget: null,
    alive: true,
  };
}

function shuffledCols() {
  const cols = Array.from({ length: GRID_COLS }, (_, i) => i);
  for (let i = cols.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }
  return cols;
}

// Re-picks which columns the NEXT drop will land in, sized to the
// current pendingGarbage (capped at VS_GARBAGE_PER_DROP) — call this
// any time pendingGarbage changes so vbDrawIncomingGarbage's preview and
// vbDropGarbage's actual landing spots never disagree.
function refreshGarbageCols(b) {
  const n = Math.min(b.pendingGarbage, VS_GARBAGE_PER_DROP);
  b.garbageCols = shuffledCols().slice(0, n);
}

// VS mode has no level-up mid-match, but the spawn pool still widens
// with cpuLevel exactly like marathon's does with its own level — 赤
// (stage 3) from Lv3, 青 (stage 4) from Lv5 — instead of every color
// being available from Lv1.
function vbRollStage() {
  if (Math.random() < MAGIC_CHANCE) return RAINBOW;
  const pool = getSpawnPool(cpuLevel);
  return pool[Math.floor(Math.random() * pool.length)];
}
function vbRollPair() { return { s1: vbRollStage(), s2: vbRollStage() }; }

function vbCellCenter(b, col, row) {
  return { x: b.x0 + col * VS_CELL + VS_CELL / 2, y: VS_GRID_Y0 + row * VS_CELL + VS_CELL / 2 };
}

function vbCanPlace(b, col, row, rot) { return vbSimCanPlace(b.grid, col, row, rot); }

function vbMoveLeft(b)  { if (b.piece && vbCanPlace(b, b.piece.col - 1, b.piece.row, b.piece.rot)) { b.piece.col--; if (!b.isCpu) playSfx('move'); } }
function vbMoveRight(b) { if (b.piece && vbCanPlace(b, b.piece.col + 1, b.piece.row, b.piece.rot)) { b.piece.col++; if (!b.isCpu) playSfx('move'); } }
function vbRotate(b) {
  if (!b.piece) return;
  const newRot = (b.piece.rot + 3) % 4;
  if (vbCanPlace(b, b.piece.col, b.piece.row, newRot)) { b.piece.rot = newRot; if (!b.isCpu) playSfx('rotate'); return; }
  if (vbCanPlace(b, b.piece.col - 1, b.piece.row, newRot)) { b.piece.col--; b.piece.rot = newRot; if (!b.isCpu) playSfx('rotate'); return; }
  if (vbCanPlace(b, b.piece.col + 1, b.piece.row, newRot)) { b.piece.col++; b.piece.rot = newRot; if (!b.isCpu) playSfx('rotate'); return; }
}
function vbSoftDrop(b) { if (b.piece && vbCanPlace(b, b.piece.col, b.piece.row + 1, b.piece.rot)) { b.piece.row++; if (!b.isCpu) playSfx('drop'); } }

function vbLockPiece(b) {
  const sat = rotOffset(b.piece.col, b.piece.row, b.piece.rot);
  b.grid[b.piece.col][b.piece.row] = b.piece.s1;
  b.grid[sat.col][sat.row] = b.piece.s2;
  b.lockedCols = [b.piece.col, sat.col];
  b.piece = null;
  b.aiTarget = null;
  b.phase = 'LOCK_PAUSE';
  b.pauseTimer = 10;
  if (!b.isCpu) playSfx('lock');
}

function vbTrySpawnPiece(b) {
  if (b.grid[VS_SPAWN_COL][1] !== null || b.grid[VS_SPAWN_COL][0] !== null) { b.alive = false; return; }
  b.piece = { col: VS_SPAWN_COL, row: 1, rot: 0, s1: b.nextPair.s1, s2: b.nextPair.s2 };
  b.nextPair = vbRollPair();
  b.fallTimer = 0;
  if (b.isCpu) b.aiTarget = vbAiPickTarget(b);
}

function vbTriggerRainbows(b, seedCells, affectedCols) {
  const triggered = new Set();
  const queue = seedCells.slice();
  let fired = false;

  function detonate(c, r) {
    const key = c + ',' + r;
    if (triggered.has(key)) return;
    triggered.add(key);
    fired = true;
    const { x, y } = vbCellCenter(b, c, r);
    addParticles(x, y, rainbowColor(0), 14, 5);
    b.score += 30;
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (dc === 0 && dr === 0) continue;
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) continue;
        const stage = b.grid[nc][nr];
        if (stage === null) continue;
        if (stage === GARBAGE) {
          // Puyo-style: お邪魔 next to anything that just popped clears
          // along with it instead of sitting on the board forever.
          const { x: gx, y: gy } = vbCellCenter(b, nc, nr);
          addParticles(gx, gy, '#8A8A96', 8, 4);
          b.grid[nc][nr] = null;
          affectedCols.add(nc);
          continue;
        }
        if (stage === RAINBOW) {
          b.grid[nc][nr] = null;
          affectedCols.add(nc);
          detonate(nc, nr);
        } else {
          const { x: ex, y: ey } = vbCellCenter(b, nc, nr);
          b.score += Math.round(STAGES[stage].pts * 2);
          addParticles(ex, ey, STAGES[stage].color, 8, 4);
          b.grid[nc][nr] = null;
          affectedCols.add(nc);
          queue.push([nc, nr]);
        }
      }
    }
  }

  while (queue.length) {
    const [c, r] = queue.pop();
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (dc === 0 && dr === 0) continue;
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) continue;
        if (b.grid[nc][nr] !== RAINBOW) continue;
        b.grid[nc][nr] = null;
        affectedCols.add(nc);
        detonate(nc, nr);
      }
    }
  }
  return fired;
}

// Attack trigger: only a max-stage group actually vanishing (the branch
// below where a group doesn't merge up into a new stage) counts toward
// お邪魔 — merges into a higher stage stay on the board, same as marathon.
function vbResolveStep(b) {
  const groups = vbFindGroups(b.grid);
  if (groups.length === 0) return false;
  b.chainCount++;
  const mult = b.chainCount; // 2連鎖=2倍, 3連鎖=3倍, ... — same scaling as marathon
  const affectedCols = new Set();
  const clearedCells = [];

  groups.forEach(g => {
    let anchor = g.cells[0];
    g.cells.forEach(cell => {
      if (cell[1] > anchor[1] || (cell[1] === anchor[1] && cell[0] < anchor[0])) anchor = cell;
    });
    g.cells.forEach(([c, r]) => { b.grid[c][r] = null; affectedCols.add(c); clearedCells.push([c, r]); });
    const { x: mx, y: my } = vbCellCenter(b, anchor[0], anchor[1]);
    if (g.stage < STAGES.length - 1) {
      const newStage = g.stage + 1;
      b.grid[anchor[0]][anchor[1]] = newStage;
      b.score += Math.round(STAGES[newStage].pts * mult);
      addParticles(mx, my, STAGES[newStage].color, 16, 5);
    } else {
      b.score += Math.round(150 * mult);
      addParticles(mx, my, STAGES[g.stage].color, 22, 6);
    }
    addParticles(mx, my, STAGES[g.stage].color, 8 + g.cells.length, 3);
  });

  // Puyo-style: お邪魔 directly adjacent to a cell that actually vanished
  // this step (not one that got upgraded into a new stage) clears along
  // with it, instead of sitting on the board forever.
  const poppedGarbage = new Set();
  clearedCells.forEach(([c, r]) => {
    if (b.grid[c][r] !== null) return; // this one got upgraded, not actually gone
    [[c+1,r],[c-1,r],[c,r+1],[c,r-1]].forEach(([nc, nr]) => {
      if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) return;
      if (b.grid[nc][nr] === GARBAGE) poppedGarbage.add(nc + ',' + nr);
    });
  });
  poppedGarbage.forEach(key => {
    const [nc, nr] = key.split(',').map(Number);
    const { x, y } = vbCellCenter(b, nc, nr);
    addParticles(x, y, '#8A8A96', 10, 4);
    b.grid[nc][nr] = null;
    affectedCols.add(nc);
  });

  const rainbowFired = vbTriggerRainbows(b, clearedCells, affectedCols);
  addShake(rainbowFired ? 10 : (3 + b.chainCount));
  if (!b.isCpu) playSfx(rainbowFired ? 'magic' : 'match', b.chainCount);
  vbApplyGravity(b.grid, [...affectedCols]);
  return true;
}

// Garbage lands like a normal piece would — one per column, settling on
// top of whatever's already stacked there — rather than shoving the
// existing stack upward. A big attack is spread over a few spawn cycles
// (VS_GARBAGE_PER_DROP per drop) instead of dumping it all at once.
function vbDropGarbage(b) {
  if (b.pendingGarbage <= 0) return;
  // Uses the exact columns already committed to in b.garbageCols (set by
  // refreshGarbageCols) — the same list vbDrawIncomingGarbage previewed —
  // so what landed always matches what was shown standing by above the
  // board, instead of silently re-rolling a different set at drop time.
  let placed = 0;
  b.garbageCols.forEach(c => {
    for (let r = GRID_ROWS - 1; r >= 0; r--) {
      if (b.grid[c][r] === null) { b.grid[c][r] = GARBAGE; placed++; break; }
    }
  });
  b.pendingGarbage -= placed; // a full column that couldn't take garbage just carries the remainder to the next drop
  refreshGarbageCols(b);
  if (b.grid[VS_SPAWN_COL][1] !== null || b.grid[VS_SPAWN_COL][0] !== null) b.alive = false;
}

function vbUpdateBoard(b, opponent) {
  if (!b.alive) return;
  if (b.phase === 'FALL') {
    if (b.isCpu) {
      b.aiTimer++;
      if (b.aiTimer >= 5) { b.aiTimer = 0; vbAiStep(b); }
    }
    b.fallTimer++;
    // Difficulty is tuned primarily through the CPU's own fall speed —
    // slow and forgiving for the Lv1 boss, ramping up to faster than the
    // player's own fixed 28-frame pace by Lv5. The player's speed never
    // changes.
    const interval = b.isCpu ? currentCpuEnemy().fallInterval : 28;
    if (b.fallTimer >= interval) {
      b.fallTimer = 0;
      if (vbCanPlace(b, b.piece.col, b.piece.row + 1, b.piece.rot)) b.piece.row++;
      else vbLockPiece(b);
    }
  } else if (b.phase === 'LOCK_PAUSE') {
    if (--b.pauseTimer <= 0) {
      vbApplyGravity(b.grid, b.lockedCols);
      b.phase = 'RESOLVING';
    }
  } else if (b.phase === 'RESOLVING') {
    if (--b.pauseTimer <= 0) {
      if (vbResolveStep(b)) {
        b.pauseTimer = 16;
      } else {
        if (b.chainCount > 0) {
          let atk = garbageCellsForChain(b.chainCount);
          // Puyo-style 相殺 (offset): a counter-attack cancels out this
          // board's own still-pending incoming お邪魔 first — only
          // whatever's left over after that actually reaches the
          // opponent, instead of both sides' attacks just stacking up
          // independently.
          const cancel = Math.min(atk, b.pendingGarbage);
          b.pendingGarbage -= cancel;
          atk -= cancel;
          refreshGarbageCols(b);
          if (atk > 0) {
            opponent.pendingGarbage += atk;
            refreshGarbageCols(opponent);
          }
        }
        b.chainCount = 0;
        b.phase = 'SPAWN_PAUSE';
        b.pauseTimer = 10;
      }
    }
  } else if (b.phase === 'SPAWN_PAUSE') {
    if (--b.pauseTimer <= 0) {
      vbDropGarbage(b);
      if (!b.alive) return;
      b.phase = 'FALL';
      vbTrySpawnPiece(b);
    }
  }
}

// ─── CPU AI ───────────────────────────────────────────────────
// Simple evaluation-function AI: at spawn, scores every (column, rotation)
// landing spot on a cloned grid — flat stacks, no deep holes, bonus for
// sitting next to same-stage cells, bigger bonus if it would pop a match
// immediately — and picks the best. It then steers toward that spot a
// few times a second (vbAiStep, throttled via aiTimer) using the exact
// same move/rotate primitives the player uses.
function vbCloneGrid(g) { return g.map(col => col.slice()); }

function vbColumnHeights(g) {
  return Array.from({ length: GRID_COLS }, (_, c) => {
    for (let r = 0; r < GRID_ROWS; r++) if (g[c][r] !== null) return GRID_ROWS - r;
    return 0;
  });
}

function vbDropRow(g, col, rot) {
  let r = 1;
  if (!vbSimCanPlace(g, col, r, rot)) return -1;
  while (vbSimCanPlace(g, col, r + 1, rot)) r++;
  return r;
}

function vbEvaluateGrid(g) {
  const heights = vbColumnHeights(g);
  let sc = 0;
  for (let c = 0; c < GRID_COLS - 1; c++) sc -= Math.abs(heights[c] - heights[c + 1]) * 2;
  heights.forEach(h => { if (h > GRID_ROWS - 2) sc -= (h - (GRID_ROWS - 2)) * 12; });
  for (let c = 0; c < GRID_COLS; c++) {
    for (let r = 0; r < GRID_ROWS; r++) {
      const v = g[c][r];
      if (v === null || v === RAINBOW || v === GARBAGE) continue;
      if (c + 1 < GRID_COLS && g[c + 1][r] === v) sc += 3;
      if (r + 1 < GRID_ROWS && g[c][r + 1] === v) sc += 3;
    }
  }
  return sc;
}

function vbAiPickTarget(b) {
  if (!b.piece) return null;
  let best = null, bestScore = -Infinity;
  for (let rot = 0; rot < 4; rot++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const row = vbDropRow(b.grid, col, rot);
      if (row < 0) continue;
      const sat = rotOffset(col, row, rot);
      const g2 = vbCloneGrid(b.grid);
      g2[col][row] = b.piece.s1;
      g2[sat.col][sat.row] = b.piece.s2;
      const popBonus = vbFindGroups(g2).reduce((n, gr) => n + gr.cells.length, 0) * 6;
      const sc = vbEvaluateGrid(g2) + popBonus;
      if (sc > bestScore) { bestScore = sc; best = { col, rot }; }
    }
  }
  return best;
}

function vbAiStep(b) {
  if (!b.piece || !b.aiTarget) return;
  if (b.piece.rot !== b.aiTarget.rot) { vbRotate(b); return; }
  if (b.piece.col < b.aiTarget.col) { vbMoveRight(b); return; }
  if (b.piece.col > b.aiTarget.col) { vbMoveLeft(b); return; }
  // Aligned — stop here and let the level-tuned passive fall timer (see
  // vbUpdateBoard's `interval`) carry the piece down instead of
  // soft-dropping it. Soft-dropping every aiTimer tick used to slam the
  // piece down in ~5 frames flat regardless of level, completely
  // overriding fallInterval — a Lv1 CPU looked just as fast as Lv5 the
  // moment it lined up.
}

// ─── VS ENEMY PORTRAITS ───────────────────────────────────────
// Ported directly from angry-mokumoku.html's Rat drawing code
// (_drawRatBase + its per-type decorations) rather than shared — per
// SPEC.md, each Moku title is a single self-contained HTML file with no
// cross-file dependencies, so the art is duplicated here rather than
// imported.

function _vsRatBase(r, bodyCol, earInnerCol) {
  ctx.fillStyle = bodyCol;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = bodyCol === '#787878' ? '#A09090' : '#C0A0A0';
  ctx.beginPath(); ctx.ellipse(r*0.55, r*0.08, r*0.42, r*0.28, 0, 0, Math.PI*2); ctx.fill();
  [[-r*0.25, -r*0.88], [r*0.38, -r*0.88]].forEach(([ex, ey]) => {
    ctx.fillStyle = bodyCol;
    ctx.beginPath(); ctx.ellipse(ex, ey, r*0.22, r*0.28, ex > 0 ? 0.25 : -0.25, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = earInnerCol;
    ctx.beginPath(); ctx.ellipse(ex, ey, r*0.12, r*0.16, ex > 0 ? 0.25 : -0.25, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-r*0.05, -r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.5, -r*0.05, r*0.09, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-r*0.01, -r*0.2, r*0.04, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FF8888';
  ctx.beginPath(); ctx.arc(r*0.9, r*0.08, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,200,200,0.7)'; ctx.lineWidth = 0.8;
  [[-0.3,0.1],[0.1,-0.05],[-0.1,0.3]].forEach(([a,b]) => {
    ctx.beginPath(); ctx.moveTo(r*0.5,r*0.08); ctx.lineTo(r*1.5+a*r,r*0.08+b*r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.5,r*0.08); ctx.lineTo(-r*0.2+a*r*0.3,r*0.08+b*r); ctx.stroke();
  });
  ctx.strokeStyle = '#909090'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-r,r*0.15);
  ctx.bezierCurveTo(-r*1.6,-r*0.4,-r*2.1,r*0.7,-r*1.9,r*1.3); ctx.stroke();
}

function drawEnemyRat(x, y, r, type) {
  ctx.save();
  ctx.translate(x, y);
  if (type === 'boss') {
    _vsRatBase(r, '#7A4A20', '#D08060');
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.moveTo(-r*0.5,-r*0.9); ctx.lineTo(-r*0.5,-r*1.5);
    ctx.lineTo(-r*0.2,-r*1.2); ctx.lineTo(0,-r*1.6); ctx.lineTo(r*0.2,-r*1.2);
    ctx.lineTo(r*0.5,-r*1.5); ctx.lineTo(r*0.5,-r*0.9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#C8A000'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#FF4444';
    ctx.beginPath(); ctx.arc(0,-r*1.6,r*0.1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*0.5,-r*1.5,r*0.08,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.5,-r*1.5,r*0.08,0,Math.PI*2); ctx.fill();
  } else if (type === 'ninja') {
    _vsRatBase(r, '#2A2A2A', '#550000');
    ctx.fillStyle = '#CC0000';
    ctx.beginPath(); ctx.ellipse(0,-r*0.55,r*0.7,r*0.18,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF3333';
    ctx.beginPath(); ctx.arc(0,-r*0.55,r*0.1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(-r*0.2,-r*0.15,r*0.2,r*0.12,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.4,-r*0.05,r*0.16,r*0.1,0,0,Math.PI*2); ctx.fill();
  } else if (type === 'suit') {
    _vsRatBase(r, '#606060', '#D08080');
    ctx.fillStyle = '#2244CC';
    ctx.beginPath(); ctx.moveTo(-r*0.12,r*0.25); ctx.lineTo(r*0.12,r*0.25);
    ctx.lineTo(r*0.08,r*0.75); ctx.lineTo(0,r*0.9); ctx.lineTo(-r*0.08,r*0.75);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1133AA';
    ctx.beginPath(); ctx.moveTo(-r*0.1,r*0.25); ctx.lineTo(r*0.1,r*0.25);
    ctx.lineTo(r*0.06,r*0.45); ctx.lineTo(-r*0.06,r*0.45); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'white'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-r*0.18,r*0.2); ctx.lineTo(0,r*0.32); ctx.lineTo(r*0.18,r*0.2); ctx.stroke();
  } else if (type === 'baby') {
    _vsRatBase(r, '#FFB0C8', '#FF8888');
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-r*0.1,-r*0.1,r*0.18,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.45,-r*0.05,r*0.14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white';
    ctx.beginPath(); ctx.arc(-r*0.05,-r*0.17,r*0.07,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF4488';
    ctx.beginPath(); ctx.ellipse(-r*0.3,-r*1.05,r*0.25,r*0.12,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.3,-r*1.05,r*0.25,r*0.12,0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF2266'; ctx.beginPath(); ctx.arc(0,-r*1.05,r*0.1,0,Math.PI*2); ctx.fill();
  } else {
    // chef (default)
    _vsRatBase(r, '#787878', '#D08080');
    ctx.fillStyle = 'white';
    ctx.fillRect(-r*0.35, -r*1.35, r*0.7, r*0.35);
    ctx.beginPath(); ctx.ellipse(0,-r*1.55,r*0.28,r*0.28,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#DDD'; ctx.lineWidth=1;
    ctx.strokeRect(-r*0.35,-r*1.35,r*0.7,r*0.35);
  }
  ctx.restore();
}

// ─── VS DRAW ──────────────────────────────────────────────────

function vbDrawPanel(b) {
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.roundRect(b.x0 - 5, VS_GRID_Y0 - 5, VS_GRID_W + 10, VS_GRID_H + 10, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let c = 1; c < GRID_COLS; c++) {
    const x = b.x0 + c * VS_CELL;
    ctx.beginPath(); ctx.moveTo(x, VS_GRID_Y0); ctx.lineTo(x, VS_GRID_Y0 + VS_GRID_H); ctx.stroke();
  }
  for (let r = 1; r < GRID_ROWS; r++) {
    const y = VS_GRID_Y0 + r * VS_CELL;
    ctx.beginPath(); ctx.moveTo(b.x0, y); ctx.lineTo(b.x0 + VS_GRID_W, y); ctx.stroke();
  }
  ctx.strokeStyle = b.isCpu ? 'rgba(255,180,120,0.4)' : 'rgba(255,143,196,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x0, VS_GRID_Y0, VS_GRID_W, VS_GRID_H);
}

function drawGarbageBlock(x, y, cell) {
  const s = cell * 0.82;
  ctx.save();
  ctx.fillStyle = '#5A5A66';
  ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, cell * 0.18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.roundRect(x - s / 2 + s * 0.12, y - s / 2 + s * 0.1, s * 0.35, s * 0.2, cell * 0.1); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, cell * 0.18); ctx.stroke();
  ctx.restore();
}

function vbDrawCells(b) {
  for (let c = 0; c < GRID_COLS; c++) {
    for (let r = 0; r < GRID_ROWS; r++) {
      const stage = b.grid[c][r];
      if (stage === null) continue;
      const { x, y } = vbCellCenter(b, c, r);
      if (stage === GARBAGE) { drawGarbageBlock(x, y, VS_CELL); continue; }
      const v = stageVisual(stage);
      drawGummyShape(x, y, VS_CELL * 0.42, v.color, v.face, 0, 1, v.legendary, v.magic);
    }
  }
}

function vbDrawPiece(b) {
  if (!b.piece) return;
  const sat = rotOffset(b.piece.col, b.piece.row, b.piece.rot);
  const a = vbCellCenter(b, b.piece.col, b.piece.row);
  const c2 = vbCellCenter(b, sat.col, sat.row);
  const v1 = stageVisual(b.piece.s1), v2 = stageVisual(b.piece.s2);
  drawGummyShape(a.x, a.y, VS_CELL * 0.42, v1.color, v1.face, 0, 1, v1.legendary, v1.magic);
  drawGummyShape(c2.x, c2.y, VS_CELL * 0.42, v2.color, v2.face, 0, 1, v2.legendary, v2.magic);
}

// label is plain text (used for "YOU"); pass enemyType instead to draw a
// big portrait icon in that slot (used for the CPU side) — VS_GRID_Y0
// leaves enough headroom specifically for this large a portrait.
function vbDrawHud(b, label, enemyType) {
  ctx.save();
  ctx.textAlign = 'center';
  if (enemyType) {
    drawEnemyRat(b.x0 + VS_GRID_W / 2, VS_GRID_Y0 - 125, 26, enemyType);
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = '#FFE066';
    ctx.fillText(`${b.score}pt`, b.x0 + VS_GRID_W / 2, VS_GRID_Y0 - 72);
    ctx.restore();
    return;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 14px Arial';
  ctx.fillText(label, b.x0 + VS_GRID_W / 2, VS_GRID_Y0 - 90);
  // Score sits right under the name — small, same counting/scoring as
  // marathon mode (vbResolveStep uses the same STAGES pts/chain-mult
  // formula) — instead of only at the bottom, so it reads immediately
  // alongside "YOU" rather than needing a second look. Kept well above
  // the incoming-お邪魔 standby row (see vbDrawIncomingGarbage) — that
  // row's blocks are now scattered across every column instead of only
  // the leftmost few, so anything sitting at the board's horizontal
  // center needs real clearance from it, not just clearance from a
  // block that used to never reach the middle.
  ctx.font = 'bold 13px Arial';
  ctx.fillStyle = '#FFE066';
  ctx.fillText(`${b.score}pt`, b.x0 + VS_GRID_W / 2, VS_GRID_Y0 - 72);
  ctx.restore();
}

// "Next piece" preview, tucked inside each board's own top-right corner —
// mirrors marathon's drawNextPreview placement/style at VS board scale.
function vbDrawNextPreview(b) {
  if (!b.nextPair) return;
  const boxW = 60, boxH = 82;
  const bx = b.x0 + VS_GRID_W - boxW - 8;
  const by = VS_GRID_Y0 + 8;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.roundRect(bx, by, boxW, boxH, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('つぎ', bx + boxW / 2, by + 14);
  ctx.restore();
  const r = 14;
  const v1 = stageVisual(b.nextPair.s1), v2 = stageVisual(b.nextPair.s2);
  drawGummyShape(bx + boxW / 2, by + 34, r, v1.color, v1.face, 0, 1, false, v1.magic);
  drawGummyShape(bx + boxW / 2, by + 66, r, v2.color, v2.face, 0, 1, false, v2.magic);
}

// Incoming お邪魔, shown as a full-size standby row hovering directly
// above the board's own frame, one block per column at the same size as
// the board's own cells — lined up with the exact columns it'll land in
// (b.garbageCols, the same list vbDropGarbage consumes), so the preview
// never shows a different layout than what actually drops. Same idea as
// Puyo Puyo's VS-mode ojama tray. Only the next drop's worth
// (VS_GARBAGE_PER_DROP) shows as blocks; anything queued beyond that
// shows as a "+N" count.
function vbDrawIncomingGarbage(b) {
  if (b.pendingGarbage <= 0) return;
  const shown = b.garbageCols.length;
  const y = VS_GRID_Y0 - VS_CELL / 2 - 8;
  b.garbageCols.forEach(c => {
    drawGarbageBlock(b.x0 + c * VS_CELL + VS_CELL / 2, y, VS_CELL);
  });
  if (b.pendingGarbage > shown) {
    // Columns are scattered (not a left-packed run), so this can't just
    // sit after "the last block" — anchor it to the board's right edge
    // instead.
    ctx.save();
    ctx.textAlign = 'right';
    ctx.fillStyle = '#FF8888';
    ctx.font = 'bold 15px Arial';
    ctx.fillText(`+${b.pendingGarbage - shown}`, b.x0 + VS_GRID_W, y - VS_CELL / 2 - 4);
    ctx.restore();
  }
}

function drawVs() {
  const bg = ctx.createLinearGradient(0, 0, 0, VS_CANVAS_H);
  bg.addColorStop(0, '#2A1840'); bg.addColorStop(0.55, '#4A2560'); bg.addColorStop(1, '#331A48');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VS_CANVAS_W, VS_CANVAS_H);

  // モヨクエストのタイトル/Lv/説明は、盤面の真上を占める全幅バナーではなく
  // 左上に寄せた小さいブロックにして、その分プレイエリアを広く取れるように
  // している(左の操作ボタン — top:55%のさらに上 — と同じ左端に揃う位置)。
  ctx.save();
  ctx.textAlign = 'left';
  ctx.shadowColor = '#FF7FC0'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#FFE9F5';
  ctx.font = 'bold 22px "Hiragino Sans", "Yu Gothic", Meiryo, Arial, sans-serif';
  ctx.fillText('⚔️ モヨクエスト', VS_MARGIN_X, 28);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,224,102,0.85)';
  ctx.font = 'bold 13px Arial';
  ctx.fillText(`Lv.${cpuLevel}/${CPU_ENEMIES.length}`, VS_MARGIN_X, 48);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '11px Arial';
  ctx.fillText('デカモクを消して連鎖で攻撃！', VS_MARGIN_X, 65);
  ctx.restore();

  ctx.save();
  ctx.translate(shakeX, shakeY);
  shakeX *= 0.7; shakeY *= 0.7;
  if (Math.abs(shakeX) < 0.1) shakeX = 0;
  if (Math.abs(shakeY) < 0.1) shakeY = 0;

  vbDrawPanel(vsP); vbDrawPanel(vsC);
  vbDrawCells(vsP); vbDrawCells(vsC);
  if (vsP.phase === 'FALL') vbDrawPiece(vsP);
  if (vsC.phase === 'FALL') vbDrawPiece(vsC);
  drawParticles();
  vbDrawHud(vsP, 'YOU');
  vbDrawHud(vsC, null, currentCpuEnemy().type);
  vbDrawNextPreview(vsP); vbDrawNextPreview(vsC);
  vbDrawIncomingGarbage(vsP); vbDrawIncomingGarbage(vsC);

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = 'bold 20px Arial';
  ctx.fillText('VS', VS_CANVAS_W / 2, VS_GRID_Y0 + VS_GRID_H / 2);

  ctx.restore();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '18px Arial';
  ctx.fillText('◀▶で移動・🔄で回転・▼で下に落とす', VS_CANVAS_W / 2, VS_CANVAS_H - VS_BOTTOM_MARGIN);
  ctx.restore();

  if (flashAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = '#FFE9A0';
    ctx.fillRect(0, 0, VS_CANVAS_W, VS_CANVAS_H);
    ctx.restore();
    flashAlpha *= 0.82;
  } else flashAlpha = 0;

  if (state === 'PAUSED') drawPausedOverlay(VS_CANVAS_W, VS_CANVAS_H);
  if (state === 'VS_LEVEL_CLEAR') drawVsLevelClear();
  if (state === 'VS_COUNTDOWN') drawVsCountdown();
}

// Full-screen "5,4,3,2,1" before the match's first pieces spawn — see
// startVsGame/update, which hold off on vbTrySpawnPiece until this hits 0.
function drawVsCountdown() {
  ctx.save();
  ctx.fillStyle = 'rgba(10,2,20,0.6)';
  ctx.fillRect(0, 0, VS_CANVAS_W, VS_CANVAS_H);
  const secs = Math.ceil(vsCountdownTimer / 60);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const pulse = 1 + 0.08 * Math.sin(vsCountdownTimer * 0.25);
  ctx.translate(VS_CANVAS_W / 2, VS_CANVAS_H / 2);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = '#FF6FA8'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#FFE9F5';
  ctx.font = 'bold 150px Arial';
  ctx.fillText(String(Math.max(secs, 1)), 0, 0);
  ctx.shadowBlur = 0;
  ctx.scale(1 / pulse, 1 / pulse);
  ctx.font = 'bold 22px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(`Lv.${cpuLevel} ${currentCpuEnemy().name} とうじょう！`, 0, 100);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

// Position of the "つぎへ" button on the level-clear screen — shared
// between the draw call and onDown's hit-test.
const VS_LEVEL_CLEAR_BTN_Y = VS_CANVAS_H * 0.72;

function drawVsLevelClear() {
  const beaten = CPU_ENEMIES[cpuLevel - 1]; // the one just defeated
  const isFinal = cpuLevel >= CPU_ENEMIES.length;

  ctx.save();
  ctx.fillStyle = 'rgba(20,5,30,0.82)';
  ctx.fillRect(0, 0, VS_CANVAS_W, VS_CANVAS_H);
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#FFE9F5';
  ctx.font = 'bold 30px Arial';
  ctx.fillText(`🎉 ${beaten.name}を倒した！`, VS_CANVAS_W / 2, VS_CANVAS_H * 0.28);
  ctx.shadowBlur = 0;
  ctx.restore();

  drawEnemyRat(VS_CANVAS_W / 2, VS_CANVAS_H * 0.46, 44, beaten.type);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '18px Arial';
  ctx.fillText(
    isFinal ? '🏆 5体すべて撃破！チャンピオン確定間近…' : `つぎ: Lv.${cpuLevel + 1} ${CPU_ENEMIES[cpuLevel].name}`,
    VS_CANVAS_W / 2, VS_CANVAS_H * 0.60
  );
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#FF6FA8';
  ctx.beginPath(); ctx.roundRect(VS_CANVAS_W / 2 - 100, VS_LEVEL_CLEAR_BTN_Y - 29, 200, 58, 29); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 21px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▶ つぎへ', VS_CANVAS_W / 2, VS_LEVEL_CLEAR_BTN_Y);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function updateVs() {
  particles.forEach(p => p.update());
  particles = particles.filter(p => p.alive);
  vbUpdateBoard(vsP, vsC);
  vbUpdateBoard(vsC, vsP);
  if (!vsP.alive) {
    // Losing always ends the whole run, even mid-campaign.
    vsWinnerIsPlayer = false;
    endRunVs();
  } else if (!vsC.alive) {
    if (cpuLevel < CPU_ENEMIES.length) {
      state = 'VS_LEVEL_CLEAR';
      playSfx('levelup');
    } else {
      vsWinnerIsPlayer = true;
      endRunVs();
    }
  }
}

// Called from the "つぎへ" button on the level-clear screen — advances to
// the next boss with a fresh board for both sides. The player's score
// carries over as their running campaign total; only their board (not
// their score) resets, same as the CPU's.
function advanceVsCampaign() {
  cpuLevel++;
  vsC = newVsBoard(VS_C_X0, true);
  vsC.nextPair = vbRollPair();
  vsP.grid = newGrid();
  vsP.piece = null;
  vsP.phase = 'FALL';
  vsP.pauseTimer = 0;
  vsP.fallTimer = 0;
  vsP.chainCount = 0;
  vsP.pendingGarbage = 0;
  vsP.garbageCols = [];
  vsP.lockedCols = [];
  state = 'PLAYING';
  vbTrySpawnPiece(vsP);
  vbTrySpawnPiece(vsC);
}

function startVsGame() {
  mode = 'VS';
  // Boards/HUD are fully set up now, but nothing actually falls until
  // the countdown (see update()/drawVsCountdown) reaches zero and spawns
  // the first pieces — the match used to drop straight into falling
  // pieces the instant you picked Moyo Quest from the title, with no
  // beat to get oriented first.
  state = 'VS_COUNTDOWN';
  vsCountdownTimer = VS_COUNTDOWN_FRAMES;
  resizeCanvasTo(VS_CANVAS_W, VS_CANVAS_H);
  particles = [];
  flashAlpha = 0; shakeX = 0; shakeY = 0;
  cpuLevel = 1;
  vsP = newVsBoard(VS_P_X0, false);
  vsC = newVsBoard(VS_C_X0, true);
  vsP.nextPair = vbRollPair();
  vsC.nextPair = vbRollPair();
  vsWinnerIsPlayer = false;
  document.getElementById('pause-btn').textContent = '⏸';
  // Keep #hud itself visible (it's the pause button's own container) but
  // hide the marathon-only score/best/time readout inside it — VS mode
  // draws its own per-board score directly on the canvas instead.
  document.getElementById('hud').style.visibility = 'visible';
  document.getElementById('hud-marathon-info').style.visibility = 'hidden';
  document.getElementById('left-col').style.visibility = 'visible';
  document.getElementById('right-col').style.visibility = 'visible';
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('title-frame').style.display = 'none';
  document.getElementById('hub-link').style.display = 'none';
  document.getElementById('buildInfo').style.display = 'none';
  document.body.classList.add('vs-active');
}

function endRunVs() {
  state = 'GAMEOVER';
  playSfx(vsWinnerIsPlayer ? 'magic' : 'gameover');
  if (vsP.score > questBestScore) {
    questBestScore = vsP.score;
    localStorage.setItem('moyomoyo-quest-best', String(questBestScore));
  }
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('ov-title').textContent = vsWinnerIsPlayer ? '🏆 5体撃破！チャンピオン！' : '😵 まけ...';
  document.getElementById('ov-sub').textContent = vsWinnerIsPlayer
    ? `あなたのスコア: ${vsP.score}pt`
    : `あなたのスコア: ${vsP.score}pt　到達: Lv.${cpuLevel} ${currentCpuEnemy().name}`;
  document.getElementById('ov-name-row').classList.add('hidden');
  document.getElementById('ov-board-btn').textContent = '🏠 タイトルへ';
  document.getElementById('left-col').style.visibility = 'hidden';
  document.getElementById('right-col').style.visibility = 'hidden';
}

function playSfx(kind, arg) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  switch (kind) {
    case 'move':
      beep(520, 0.045, { type: 'square', gain: 0.1 });
      break;
    case 'rotate':
      beep(440, 0.055, { type: 'triangle', gain: 0.12, slideTo: 700 });
      break;
    case 'drop':
      beep(300, 0.03, { type: 'square', gain: 0.06, slideTo: 210 });
      break;
    case 'lock':
      beep(190, 0.08, { type: 'square', gain: 0.13, slideTo: 90 });
      break;
    case 'match': {
      const chain = arg || 1;
      const base = Math.min(440 * Math.pow(1.13, chain - 1), 1100);
      beep(base, 0.13, { type: 'square', gain: 0.17, slideTo: base * 1.6 });
      beep(base * 1.5, 0.1, { type: 'triangle', gain: 0.08, delay: 0.03, slideTo: base * 2 });
      break;
    }
    case 'chainBig':
      [0, 0.08, 0.16].forEach((d, i) => beep(523 * Math.pow(2, i / 12 * 4), 0.14, { type: 'triangle', gain: 0.14, delay: d }));
      break;
    case 'magic':
      [880, 1175, 1568].forEach((f, i) => beep(f, 0.09, { type: 'triangle', gain: 0.1, delay: i * 0.045 }));
      break;
    case 'levelup':
      [523, 659, 784].forEach((f, i) => beep(f, 0.12, { type: 'square', gain: 0.13, delay: i * 0.07 }));
      break;
    case 'gameover':
      beep(220, 0.45, { type: 'sine', gain: 0.16, slideTo: 70 });
      break;
  }
}

// ─── INPUT ────────────────────────────────────────────────────

// The canvas's internal drawing size varies by mode (see resizeCanvasTo),
// so touch/click coordinates are mapped using its current logical size —
// not the fixed marathon W x H — to stay correct in both modes.
function currentCanvasSize() {
  return mode === 'VS' ? [VS_CANVAS_W, VS_CANVAS_H] : [W, H];
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const [cw, ch] = currentCanvasSize();
  const scaleX = cw / rect.width;
  const scaleY = ch / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}

function pauseGame() {
  if (state !== 'PLAYING') return;
  state = 'PAUSED';
  document.getElementById('pause-btn').textContent = '▶';
}
function resumeGame() {
  if (state !== 'PAUSED') return;
  state = 'PLAYING';
  document.getElementById('pause-btn').textContent = '⏸';
}
function quitToTitle() {
  state = 'TITLE';
  mode = 'MARATHON';
  resizeCanvasTo(W, H);
  document.body.classList.remove('vs-active');
  titleFrame = 0;
  titleMenuSel = 0;
  document.getElementById('pause-btn').textContent = '⏸';
  document.getElementById('hud').style.visibility = 'hidden';
  // #hud-marathon-info carries its own explicit visibility (set by
  // startGame/startVsGame) that would otherwise keep overriding an
  // ancestor's 'hidden' — has to be reset here too, not just on #hud.
  document.getElementById('hud-marathon-info').style.visibility = 'hidden';
  document.getElementById('left-col').style.visibility = 'hidden';
  document.getElementById('right-col').style.visibility = 'hidden';
  document.getElementById('title-frame').style.display = 'block';
  document.getElementById('hub-link').style.display = 'block';
  document.getElementById('buildInfo').style.display = 'block';
}

function onDown(e) {
  e.preventDefault();
  const p = getPos(e);
  if (state === 'TITLE') {
    for (let i = 0; i < TITLE_MENU_ITEMS.length; i++) {
      const y = titleMenuItemY(i);
      if (p.x >= W/2 - 239 && p.x <= W/2 + 239 && p.y >= y - 22 && p.y <= y + 22) {
        titleMenuSel = i; activateTitleMenu(i); return;
      }
    }
    // (The hub link is now the #hub-link HTML anchor, not hit-tested
    // here — see their CSS for why.)
    return;
  }
  if (state === 'PAUSED') {
    const [cw, ch] = currentCanvasSize();
    const resumeY = ch * 0.48, quitY = resumeY + 79;
    if (p.x >= cw/2-108 && p.x <= cw/2+108 && p.y >= resumeY-29 && p.y <= resumeY+29) { resumeGame(); return; }
    if (p.x >= cw/2-108 && p.x <= cw/2+108 && p.y >= quitY-26 && p.y <= quitY+26) { quitToTitle(); return; }
    return;
  }
  if (state === 'VS_LEVEL_CLEAR') {
    if (p.x >= VS_CANVAS_W/2-100 && p.x <= VS_CANVAS_W/2+100
        && p.y >= VS_LEVEL_CLEAR_BTN_Y-29 && p.y <= VS_LEVEL_CLEAR_BTN_Y+29) {
      advanceVsCampaign();
    }
    return;
  }
}

function onUp(e) {
  e.preventDefault();
}

canvas.addEventListener('mousedown',  onDown, { passive: false });
canvas.addEventListener('mouseup',    onUp,   { passive: false });
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchend',   onUp,   { passive: false });

function ctrlAction(action) {
  if (state !== 'PLAYING') return;
  if (mode === 'VS') {
    if (!vsP || vsP.phase !== 'FALL') return;
    if (action === 'left') vbMoveLeft(vsP);
    else if (action === 'right') vbMoveRight(vsP);
    else if (action === 'rotate') vbRotate(vsP);
    else if (action === 'down') vbSoftDrop(vsP);
    return;
  }
  if (phase !== 'FALL') return;
  if (action === 'left') moveLeft();
  else if (action === 'right') moveRight();
  else if (action === 'rotate') rotatePiece();
  else if (action === 'down') softDrop();
}

let holdRepeatTimer = null;
let holdRepeatDelay = null;

function stopHoldRepeat() {
  clearTimeout(holdRepeatDelay); holdRepeatDelay = null;
  clearInterval(holdRepeatTimer); holdRepeatTimer = null;
}

document.querySelectorAll('.ctrl-btn').forEach(btn => {
  const action = btn.dataset.action;
  const press = (e) => {
    e.preventDefault();
    ctrlAction(action);
    if (action === 'down') {
      stopHoldRepeat();
      holdRepeatDelay = setTimeout(() => {
        holdRepeatTimer = setInterval(() => ctrlAction('down'), 45);
      }, 220);
    }
  };
  btn.addEventListener('mousedown', press, { passive: false });
  btn.addEventListener('touchstart', press, { passive: false });
  if (action === 'down') {
    btn.addEventListener('mouseup', stopHoldRepeat);
    btn.addEventListener('mouseleave', stopHoldRepeat);
    btn.addEventListener('touchend', stopHoldRepeat);
    btn.addEventListener('touchcancel', stopHoldRepeat);
  }
});

document.getElementById('ov-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  if (mode === 'VS') startVsGame(); else startGame();
});

document.getElementById('ov-register-btn').addEventListener('click', () => {
  const btn = document.getElementById('ov-register-btn');
  if (btn.disabled) return;
  const name = document.getElementById('ov-name-input').value.trim().slice(0, 8);
  registerScore(name, score, level);
  btn.disabled = true;
  btn.textContent = '登録済み';
});

document.getElementById('ov-board-btn').addEventListener('click', () => {
  if (mode === 'VS') { document.getElementById('overlay').classList.add('hidden'); quitToTitle(); }
  else openBoard();
});
document.getElementById('board-close-btn').addEventListener('click', closeBoard);

document.getElementById('pause-btn').addEventListener('click', () => {
  if (state === 'PLAYING') pauseGame();
  else if (state === 'PAUSED') resumeGame();
});

document.addEventListener('keydown', e => {
  // Space/arrows are exclusively game controls here — never anything the
  // page itself should do with them (scroll, or — the actual bug this
  // fixes — re-triggering whichever <button> (e.g. #pause-btn) happens to
  // still have focus, since Space's native default action is to click
  // the focused button).
  if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
  }
  if (state === 'TITLE') {
    if (e.key === 'ArrowUp') {
      titleMenuSel = (titleMenuSel + TITLE_MENU_ITEMS.length - 1) % TITLE_MENU_ITEMS.length;
    } else if (e.key === 'ArrowDown') {
      titleMenuSel = (titleMenuSel + 1) % TITLE_MENU_ITEMS.length;
    } else if (e.key === 'Enter' || e.key === ' ') {
      activateTitleMenu(titleMenuSel);
    }
    return;
  }
  if (e.key === 'Escape' && (state === 'PLAYING' || state === 'PAUSED')) {
    if (state === 'PLAYING') pauseGame(); else resumeGame();
    return;
  }
  if (state !== 'PLAYING') return;
  if (e.key === 'ArrowLeft') ctrlAction('left');
  else if (e.key === 'ArrowRight') ctrlAction('right');
  else if (e.key === 'ArrowUp' || e.key === ' ') ctrlAction('rotate');
  else if (e.key === 'ArrowDown') ctrlAction('down');
});

// ─── MAIN LOOP ────────────────────────────────────────────────

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function init() {
  state = 'TITLE';
  titleFrame = 0;
  grid = newGrid();
  loop();
}

init();
</script>
